const MS=86400000;
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function daysTo(iso){if(!iso)return null;const p=iso.split('-');return Math.round((new Date(+p[0],+p[1]-1,+p[2])-today())/MS);}
function bucket(n){if(n===null)return['No Date','nd'];if(n<0)return['EXPIRED','exp'];if(n<=30)return['Due ≤30d','d30'];if(n<=60)return['Due ≤60d','d60'];if(n<=90)return['Due ≤90d','d90'];return['OK','ok'];}
function leaseBucket(n){if(n===null)return['To Verify','nd'];if(n<0)return['PAST NOTICE','exp'];if(n<=90)return['Notice ≤90d','d30'];if(n<=180)return['Notice ≤180d','d60'];return['OK','ok'];}

[LIC,INS].forEach(set=>set.forEach(r=>{r.days=daysTo(r.exp);const b=bucket(r.days);r.status=b[0];r.cls=b[1];}));

function data(){return view==='lic'?LIC:view==='ins'?INS:LZ;}

        '<td>'+(r.exp||'—')+'</td><td class="c">'+dtxt+'</td>'+
        '<td class="c"><span class="pill '+r.cls+'">'+r.status+'</span></td>'+
        '<td>'+(r.broker||'')+(r.phone?'<br><span style="color:#8a929c;font-size:11px">'+r.phone+'</span>':'')+'</td></tr>';}).join('');
  } else {
    head='<th></th><th data-k="brand"></th><th data-k="loc">Location</th><th data-k="landlord">Landlord</th><th data-k="end">Lease End</th><th data-k="notice">Notice Date</th><th data-k="days" class="c">Days</th><th data-k="status" class="c">Status</th><th data-k="opts">Options</th><th data-k="notes">Notes</th>';
    body=rows.map(r=>{const dtxt=r.days===null?'—':(r.days<0?r.days:'+'+r.days);
      return '<tr><td><div class="bar" style="background:'+(COLORS[r.cls])+'"></div></td>'+
        '<td>'+brandTag(r.brand)+'</td>'+
        '<td><b>'+r.loc+'</b><br><span style="color:#8a929c;font-size:11px">'+r.entity+'</span></td>'+
        '<td>'+(r.landlord||'')+'</td><td>'+(r.end||'—')+'</td><td>'+(r.notice||'—')+'</td>'+
        '<td class="c">'+dtxt+'</td><td class="c"><span class="pill '+r.cls+'">'+r.status+'</span></td>'+
        '<td>'+(r.opts||'')+'</td><td style="color:#b23;font-size:11px">'+(r.notes||'')+'</td></tr>';}).join('');
  }
  w.innerHTML='<table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table>';
  w.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortAsc=!sortAsc;else{sortK=k;sortAsc=true;}render();});
  document.getElementById('count').textContent=rows.length+' of '+data().length+' shown';
}
['q','fBrand','fType'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('foot').innerHTML='Source of truth: the license &amp; policy PDFs in each entity\'s folder. Mirrors the master Excel tracker in Sonaya Group / Ai Files / Compliance Tracker, refreshed weekly by the automated scan. Countdown &amp; colors recompute live against the current date.';
setView('lic');
</script>
