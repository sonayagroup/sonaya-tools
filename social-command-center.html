<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Command Center | Sonaya Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Teal / Warm
   ══════════════════════════════════════════════ */
:root {
  /* Surfaces — warm palette */
  --bg: #f7f5f2;
  --surface-0: #eeebe6;
  --surface-1: #ffffff;
  --surface-2: #faf9f7;
  --surface-border: #e2ddd6;
  --surface-border-strong: #ccc5bb;
  --shadow-sm: 0 1px 3px rgba(60,40,10,0.05);
  --shadow-md: 0 4px 14px rgba(60,40,10,0.07), 0 1px 3px rgba(60,40,10,0.04);
  --shadow-lg: 0 12px 40px rgba(60,40,10,0.10), 0 2px 8px rgba(60,40,10,0.05);
  --shadow-xl: 0 24px 64px rgba(60,40,10,0.14), 0 4px 16px rgba(60,40,10,0.07);

  /* Sidebar — LIGHT */
  --sidebar-bg: #ffffff;
  --sidebar-border: #e8e3dc;
  --sidebar-text: #7c7268;
  --sidebar-text-bright: #2c2520;
  --sidebar-hover: rgba(13,148,136,0.04);
  --sidebar-active: rgba(13,148,136,0.08);

  /* Ink */
  --ink-0: #1a1512;
  --ink-1: #2c2520;
  --ink-2: #5c5349;
  --ink-3: #9a9088;
  --ink-4: #c4bdb5;

  /* Accent — teal */
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent-soft: #f0fdfa;
  --accent-ink: #115e59;
  --accent-rgb: 13,148,136;

  /* Brands */
  --brand-sg: #1e3a5f;
  --brand-sg-gold: #c5a55a;
  --brand-dt: #e11d48;
  --brand-dt-soft: #fff1f2;
  --brand-koala: #16a34a;
  --brand-koala-soft: #f0fdf4;

  /* Platforms */
  --plat-ig: #E1306C;
  --plat-tt: #00C9B1;
  --plat-fb: #1877F2;
  --plat-yt: #FF0000;

  /* Status */
  --st-idea: #9a9088;
  --st-draft: #e5a100;
  --st-review: #e97316;
  --st-approved: #16a34a;
  --st-scheduled: #0d9488;
  --st-posted: #059669;
  --st-rejected: #dc2626;

  /* Radii */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 9999px;

  /* Chart */
  --chart-bg: #ffffff;
  --chart-grid: #e8e3dc;
  --chart-text: #7c7268;

  /* Motion */
  --ease: cubic-bezier(0.4,0,0.2,1);
  --fast: 0.15s var(--ease);
  --normal: 0.25s var(--ease);
  --spring: 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

/* ── Dark Theme ── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e0c;
    --surface-0: #1a1815;
    --surface-1: #21201d;
    --surface-2: #2a2825;
    --surface-border: #37342f;
    --surface-border-strong: #4a463f;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.3);
    --shadow-lg: 0 14px 44px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.3);
    --shadow-xl: 0 28px 72px rgba(0,0,0,0.55), 0 4px 20px rgba(0,0,0,0.35);
    --sidebar-bg: #171613;
    --sidebar-border: #2a2825;
    --sidebar-text: #8a8078;
    --sidebar-text-bright: #e8e3dc;
    --sidebar-hover: rgba(13,148,136,0.06);
    --sidebar-active: rgba(13,148,136,0.12);
    --ink-0: #f5f0ea;
    --ink-1: #e8e3dc;
    --ink-2: #a09688;
    --ink-3: #6b6158;
    --ink-4: #3d3832;
    --accent: #2dd4bf;
    --accent-hover: #14b8a6;
    --accent-soft: rgba(13,148,136,0.12);
    --accent-ink: #5eead4;
    --accent-rgb: 45,212,191;
    --brand-dt-soft: rgba(225,29,72,0.12);
    --brand-koala-soft: rgba(22,163,74,0.12);
    --chart-bg: #21201d;
    --chart-grid: #37342f;
    --chart-text: #a09688;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e0c;
  --surface-0: #1a1815;
  --surface-1: #21201d;
  --surface-2: #2a2825;
  --surface-border: #37342f;
  --surface-border-strong: #4a463f;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.3);
  --shadow-lg: 0 14px 44px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.3);
  --shadow-xl: 0 28px 72px rgba(0,0,0,0.55), 0 4px 20px rgba(0,0,0,0.35);
  --sidebar-bg: #171613;
  --sidebar-border: #2a2825;
  --sidebar-text: #8a8078;
  --sidebar-text-bright: #e8e3dc;
  --sidebar-hover: rgba(13,148,136,0.06);
  --sidebar-active: rgba(13,148,136,0.12);
  --ink-0: #f5f0ea;
  --ink-1: #e8e3dc;
  --ink-2: #a09688;
  --ink-3: #6b6158;
  --ink-4: #3d3832;
  --accent: #2dd4bf;
  --accent-hover: #14b8a6;
  --accent-soft: rgba(13,148,136,0.12);
  --accent-ink: #5eead4;
  --accent-rgb: 45,212,191;
  --brand-dt-soft: rgba(225,29,72,0.12);
  --brand-koala-soft: rgba(22,163,74,0.12);
  --chart-bg: #21201d;
  --chart-grid: #37342f;
  --chart-text: #a09688;
}

/* ══════════════════════════════════════════════
   BASE RESET
   ══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink-1);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(var(--accent-rgb),0.22); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ══════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════ */
#app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}

/* ── Sidebar ── */
#sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  padding: 0 0 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}
#sidebar::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }

.sb-header {
  padding: 18px 16px 14px;
  background: linear-gradient(135deg, #1e3a5f 0%, #142a45 100%);
  margin-bottom: 6px;
}
.sb-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.sb-logo img { height: 48px; width: auto; flex-shrink: 0; filter: brightness(0) invert(1) drop-shadow(0 1px 3px rgba(255,255,255,0.3)); }
.sb-logo-text {
  font-family: Outfit, sans-serif; font-size: 11px; font-weight: 700;
  color: var(--brand-sg-gold); letter-spacing: 0.12em; line-height: 1.2;
}
.sb-title {
  font-family: Outfit, sans-serif; font-size: 14px; font-weight: 700;
  color: #ffffff; line-height: 1.3;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

.sb-pills { display: flex; gap: 4px; padding: 10px 12px 4px; }
.sb-pill {
  flex: 1; padding: 6px 4px; border: 1px solid var(--surface-border);
  background: var(--surface-1); color: var(--ink-2); font-size: 11px;
  font-weight: 600; border-radius: var(--r-full); cursor: pointer;
  transition: all var(--fast); text-align: center; white-space: nowrap;
}
.sb-pill:hover { border-color: var(--accent); color: var(--accent); }
.sb-pill.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 2px 6px rgba(var(--accent-rgb),0.25);
}

.sb-counters { display: flex; gap: 6px; padding: 6px 12px; margin: 0 0 4px; }
.sb-counter {
  flex: 1; background: var(--accent-soft); border: 1px solid rgba(var(--accent-rgb),0.12);
  border-radius: var(--r-md); padding: 10px 6px; text-align: center;
}
.sb-counter-val {
  font-family: Outfit, sans-serif; font-size: 20px; font-weight: 800;
  color: var(--accent); line-height: 1.1;
}
.sb-counter-lbl {
  font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-3); margin-top: 2px;
}

.sb-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-3);
  padding: 0 16px; margin: 18px 0 6px;
}
.sb-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.sb-nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--sidebar-text); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--fast);
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit; border-left: 3px solid transparent;
}
.sb-nav-link:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
.sb-nav-link.active {
  background: var(--accent-soft); color: var(--accent-ink);
  border-left-color: var(--accent); font-weight: 700;
}
.sb-nav-icon { width: 20px; text-align: center; font-size: 14px; }

.sb-spacer { flex: 1; }

.sb-new-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px; background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%);
  color: #fff; border: none; border-radius: var(--r-md); font-size: 13px;
  font-weight: 700; cursor: pointer; transition: all var(--fast); margin: 0 10px;
  box-shadow: 0 3px 12px rgba(var(--accent-rgb),0.3);
  letter-spacing: 0.02em;
}
.sb-new-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(var(--accent-rgb),0.4); }
.sb-new-btn:active { transform: translateY(0); }

/* ── Main ── */
#main { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 32px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 10;
}
.tb-dropdown { position: relative; }
.tb-dropdown-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--surface-2);
  border: 1px solid var(--surface-border); border-radius: var(--r-full);
  font-size: 13px; font-weight: 600; color: var(--ink-1);
  cursor: pointer; transition: all var(--fast); white-space: nowrap;
}
.tb-dropdown-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.tb-dropdown-menu {
  position: absolute; top: calc(100% + 5px); left: 0; min-width: 200px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  padding: 6px; z-index: 20; opacity: 0; transform: translateY(-3px);
  pointer-events: none; transition: all var(--fast);
}
.tb-dropdown-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.tb-dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; transition: background var(--fast);
}
.tb-dropdown-item:hover { background: var(--surface-0); color: var(--ink-1); }
.tb-dropdown-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tb-search {
  flex: 1; max-width: 360px; position: relative;
}
.tb-search input {
  width: 100%; padding: 8px 14px 8px 34px;
  border: 1px solid var(--surface-border); border-radius: var(--r-full);
  background: var(--surface-2); font-family: inherit; font-size: 13px;
  color: var(--ink-1); outline: none; transition: border-color var(--fast), box-shadow var(--fast);
}
.tb-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.1); background: var(--surface-1); }
.tb-search::before {
  content: '\2315'; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); color: var(--ink-3); font-size: 14px; pointer-events: none;
}
.tb-spacer { flex: 1; }
.tb-icon-btn {
  width: 36px; height: 36px; border: 1px solid var(--surface-border);
  background: var(--surface-2); border-radius: var(--r-full);
  cursor: pointer; font-size: 14px; color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--fast); flex-shrink: 0;
}
.tb-icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tb-cmd-hint {
  font-size: 10px; font-weight: 600; color: var(--ink-3);
  background: var(--surface-0); border: 1px solid var(--surface-border);
  padding: 2px 6px; border-radius: var(--r-xs); margin-left: -8px;
}

/* ── View Layout ── */
.v-header { padding: 32px 32px 0; }
.v-header h1 {
  font-family: Outfit, sans-serif; font-size: 28px; font-weight: 800;
  color: var(--ink-0); margin-bottom: 4px; letter-spacing: -0.03em;
}
.v-sub { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.v-body {
  padding: 24px 32px 48px; flex: 1;
  animation: fadeUp 0.4s var(--ease);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ══════════════════════════════════════════════
   SHARED COMPONENTS
   ══════════════════════════════════════════════ */

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--r-full);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all var(--fast);
  border: 1px solid var(--surface-border);
  background: var(--surface-1); color: var(--ink-1);
}
.btn:hover { border-color: var(--ink-4); box-shadow: var(--shadow-sm); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 2px 8px rgba(var(--accent-rgb),0.25);
}
.btn-primary:hover { box-shadow: 0 4px 14px rgba(var(--accent-rgb),0.35); transform: translateY(-1px); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-0); color: var(--ink-1); }
.btn-danger { background: var(--st-rejected); color: #fff; border-color: transparent; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Tab bar */
.tab-bar { display: flex; gap: 0; border-bottom: 2px solid var(--surface-border); margin-bottom: 24px; width: fit-content; background: none; border-radius: 0; padding: 0; }
.tab-btn {
  padding: 10px 20px; border: none; background: transparent;
  border-radius: 0; font-family: Outfit, sans-serif; font-size: 13px;
  font-weight: 600; color: var(--ink-3); cursor: pointer;
  transition: all var(--fast); border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.tab-btn:hover { color: var(--ink-1); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; background: none; box-shadow: none; }

/* Status badge */
.status-badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 600;
  color: #fff; letter-spacing: 0.01em;
}

/* Tags */
.tag {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 500;
  background: var(--surface-0); color: var(--ink-2);
  border: 1px solid var(--surface-border);
}
.tag-primary { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.tag-clickable { cursor: pointer; transition: all var(--fast); }
.tag-clickable:hover { transform: scale(1.04); }

/* Data table */
.data-table-wrap { background: var(--surface-1); border: 1px solid var(--surface-border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.data-table-title {
  padding: 14px 18px 0; font-family: Outfit, sans-serif;
  font-size: 15px; font-weight: 700; color: var(--ink-1);
}
.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.data-table th {
  text-align: left; padding: 10px 14px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--ink-3); border-bottom: 1px solid var(--surface-border);
}
.data-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--surface-border);
  color: var(--ink-2); vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--surface-2); }

.list-th { cursor: pointer; user-select: none; }
.list-th:hover { color: var(--ink-1); }
.sort-arrow { font-size: 9px; margin-left: 3px; }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 20px; transition: all var(--fast);
  border-top: 3px solid var(--accent); box-shadow: var(--shadow-sm);
}
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-value { font-family: Outfit, sans-serif; font-size: 26px; font-weight: 800; color: var(--ink-0); letter-spacing: -0.02em; }
.kpi-trend { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-full); }
.kpi-trend.up { background: rgba(22,163,74,0.12); color: #16a34a; }
.kpi-trend.down { background: rgba(220,38,38,0.1); color: #dc2626; }
.kpi-trend.flat { background: var(--surface-0); color: var(--ink-3); }
.kpi-spark { margin: 10px 0 4px; }
.kpi-sub { font-size: 11px; color: var(--ink-3); }

/* Charts row */
.charts-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
.chart-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 20px;
  border-left: 3px solid var(--accent);
}
.chart-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); margin-bottom: 16px; letter-spacing: -0.02em; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700;
  background: var(--surface-0); color: var(--ink-2);
}

/* Heatmap */
.heatmap-wrap { overflow-x: auto; }
.heatmap-grid { display: grid; grid-template-columns: 40px repeat(24, 1fr); gap: 2px; min-width: 600px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 3px; min-width: 14px; }
.heatmap-dow-label { font-size: 10px; font-weight: 600; color: var(--ink-3); display: flex; align-items: center; }
.heatmap-hour-label { font-size: 9px; color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; }

/* Stat tiles */
.stat-row { display: grid; gap: 16px; margin-bottom: 22px; }
.stat-tile {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px;
  border-top: 3px solid var(--accent);
  transition: all var(--fast);
}
.stat-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.stat-label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-value { font-family: Outfit, sans-serif; font-size: 26px; font-weight: 800; color: var(--ink-0); }
.stat-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* ── Briefing ── */
.briefing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.briefing-section {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden;
  border-left: 3px solid var(--accent);
  box-shadow: var(--shadow-sm);
}
.briefing-section.full-width { grid-column: 1 / -1; }
.briefing-section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-2);
}
.briefing-section-icon {
  width: 34px; height: 34px; border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.briefing-section-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); }
.briefing-section-count {
  margin-left: auto; font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: var(--r-full);
}
.briefing-section-body { padding: 14px 18px; }
.briefing-empty { padding: 20px 0; text-align: center; font-size: 13px; color: var(--ink-3); }

.briefing-post-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--surface-border);
  cursor: pointer; transition: background var(--fast);
}
.briefing-post-row:last-child { border-bottom: none; }
.briefing-post-row:hover { background: var(--surface-2); margin: 0 -16px; padding: 8px 16px; border-radius: var(--r-sm); }
.briefing-post-day {
  width: 42px; text-align: center; border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); padding: 4px; flex-shrink: 0;
}
.briefing-post-day .dow { display: block; font-size: 9px; font-weight: 600; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.04em; }
.briefing-post-day .dom { display: block; font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); line-height: 1.1; }
.briefing-post-info { flex: 1; min-width: 0; }
.briefing-post-title { font-size: 13px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.briefing-post-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 11px; color: var(--ink-3); margin-top: 2px;
}
.briefing-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.briefing-post-action {
  padding: 4px 10px; border-radius: var(--r-full); font-size: 11px; font-weight: 600;
  border: none; cursor: pointer; flex-shrink: 0; transition: all var(--fast);
}
.briefing-post-action.needs-work { background: rgba(245,158,11,0.1); color: #d97706; }
.briefing-post-action.needs-review { background: rgba(249,115,22,0.1); color: #ea580c; }
.briefing-post-action.ready { background: rgba(34,197,94,0.1); color: #16a34a; }

.briefing-gap-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 0;
  border-bottom: 1px solid var(--surface-border);
}
.briefing-gap-row:last-child { border-bottom: none; }
.briefing-gap-icon { font-size: 14px; }
.briefing-gap-text { flex: 1; font-size: 13px; color: var(--ink-2); }
.briefing-gap-add {
  padding: 3px 10px; background: transparent; border: 1px dashed var(--surface-border-strong);
  border-radius: var(--r-full); font-size: 11px; font-weight: 600; color: var(--accent);
  cursor: pointer; transition: all var(--fast);
}
.briefing-gap-add:hover { background: var(--accent-soft); border-style: solid; }

.briefing-perf-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--surface-border); }
.briefing-perf-row:last-child { border-bottom: none; }
.briefing-perf-thumb {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
}
.briefing-perf-info { flex: 1; min-width: 0; }
.briefing-perf-title { font-size: 13px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.briefing-perf-stats { display: flex; gap: 10px; font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.briefing-perf-stat .val { font-weight: 700; color: var(--ink-2); }

/* ── Calendar ── */
.cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.cal-nav-btn {
  width: 34px; height: 34px; border: 1px solid var(--surface-border);
  background: var(--surface-1); border-radius: var(--r-full); cursor: pointer;
  font-size: 16px; color: var(--ink-2); display: flex; align-items: center; justify-content: center;
  transition: all var(--fast);
}
.cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.cal-month-label { font-family: Outfit, sans-serif; font-size: 18px; font-weight: 700; color: var(--ink-0); letter-spacing: -0.02em; }
.cal-today-btn {
  margin-left: auto; padding: 6px 16px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-full); font-size: 12px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; transition: all var(--fast);
}
.cal-today-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
  background: var(--surface-border); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden;
}
.cal-dow {
  padding: 10px; text-align: center; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-3); background: var(--surface-2); font-family: Outfit, sans-serif;
}
.cal-day {
  background: var(--surface-1); padding: 8px; min-height: 110px;
  cursor: pointer; transition: background var(--fast);
}
.cal-day:hover { background: var(--surface-2); }
.cal-day.outside { background: var(--surface-0); opacity: 0.4; }
.cal-day.today { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.cal-day-num-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.cal-day-num { font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 800; }
.cal-day-count {
  font-size: 10px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 1px 7px; border-radius: var(--r-full);
}
.cal-post-row {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 6px; margin-bottom: 3px; border-radius: var(--r-sm);
  font-size: 10px; font-weight: 500; color: var(--ink-1);
  background: var(--surface-0); cursor: pointer; transition: all var(--fast);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-left: 2px solid transparent;
}
.cal-post-row:hover { background: var(--surface-border); border-left-color: var(--accent); }
.cal-plat-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.cal-overflow { font-size: 10px; color: var(--accent); font-weight: 700; padding: 2px 6px; }

/* Week view */
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.week-col {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 12px; min-height: 200px;
  transition: border-color var(--fast);
}
.week-col.today { border-color: var(--accent); border-top: 3px solid var(--accent); }
.week-col-head { text-align: center; padding-bottom: 10px; border-bottom: 1px solid var(--surface-border); margin-bottom: 10px; }
.week-col-dow { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.06em; font-family: Outfit, sans-serif; }
.week-col-num { font-family: Outfit, sans-serif; font-size: 20px; font-weight: 700; color: var(--ink-0); }
.week-col.today .week-col-num { color: var(--accent); }
.week-empty { text-align: center; padding: 20px 0; font-size: 11px; color: var(--ink-3); }
.week-card {
  background: var(--surface-2); border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); padding: 10px; margin-bottom: 8px;
  cursor: pointer; transition: all var(--fast);
  border-left: 3px solid transparent;
}
.week-card:hover { border-left-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.week-card-time { font-size: 10px; font-weight: 600; color: var(--ink-3); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.week-card-title { font-size: 12px; font-weight: 600; color: var(--ink-1); margin-bottom: 4px; }
.week-card-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.week-card-plat { width: 6px; height: 6px; border-radius: 50%; }
.week-card-status { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-full); }

/* ── Pipeline ── */
.pipeline-board {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
  overflow-x: auto; padding-bottom: 4px;
}
.pipeline-col {
  background: var(--surface-0); border-radius: var(--r-lg); padding: 12px;
  border-top: 3px solid var(--accent); min-height: 300px;
}
.pipeline-col:nth-child(2) { border-top-color: #f59e0b; }
.pipeline-col:nth-child(3) { border-top-color: #3b82f6; }
.pipeline-col:nth-child(4) { border-top-color: #8b5cf6; }
.pipeline-col:nth-child(5) { border-top-color: #ec4899; }
.pipeline-col:nth-child(6) { border-top-color: #22c55e; }
.pipeline-col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.pipeline-col-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-family: Outfit, sans-serif; }
.pipeline-col-count {
  font-size: 11px; font-weight: 700; background: var(--surface-1);
  padding: 2px 9px; border-radius: var(--r-full); color: var(--ink-2);
}
.pipeline-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); padding: 12px; margin-bottom: 8px;
  cursor: pointer; transition: all var(--fast);
  border-left: 3px solid transparent;
}
.pipeline-card:hover { border-left-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.pipeline-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.pipeline-card-brand {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: var(--r-full);
}
.pipeline-drag-handle { color: var(--ink-4); font-size: 12px; cursor: grab; }
.pipeline-card-title { font-size: 12px; font-weight: 600; color: var(--ink-1); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.pipeline-media-icon { font-size: 12px; }
.pipeline-pillar-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.pipeline-card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pipeline-plat-dot { width: 6px; height: 6px; border-radius: 50%; }
.pipeline-card-date { font-size: 11px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
.pipeline-quick-add {
  display: block; width: 100%; padding: 12px;
  border: 2px dashed var(--surface-border-strong); border-radius: var(--r-md);
  background: transparent; color: var(--accent); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all var(--fast); margin-top: 8px;
}
.pipeline-quick-add:hover { background: var(--accent-soft); border-color: var(--accent); border-style: solid; }
.metrics-btn {
  font-size: 11px; padding: 4px 10px; background: var(--surface-0);
  border: 1px solid var(--surface-border); border-radius: var(--r-full);
  color: var(--ink-2); cursor: pointer; transition: all var(--fast); font-weight: 600;
}
.metrics-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ── Strategy ── */
.strat-add-bar { display: flex; justify-content: flex-end; margin-bottom: 18px; }
.strategy-section {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); margin-bottom: 10px; overflow: hidden;
  border-left: 3px solid var(--accent);
  transition: box-shadow var(--fast);
}
.strategy-section:hover { box-shadow: var(--shadow-sm); }
.strategy-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; cursor: pointer; transition: background var(--fast);
}
.strategy-section-header:hover { background: var(--surface-2); }
.strategy-section-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); }
.strategy-section-actions { display: flex; align-items: center; gap: 8px; }
.btn-edit, .btn-del {
  padding: 4px 10px; border: none; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--ink-3); border-radius: var(--r-full); transition: all var(--fast);
}
.btn-edit:hover { background: var(--accent-soft); color: var(--accent); }
.btn-del:hover { background: rgba(239,68,68,0.08); color: var(--st-rejected); }
.strategy-section-toggle { transition: transform var(--normal); font-size: 10px; color: var(--ink-3); }
.strategy-section-body {
  padding: 14px 18px; border-top: 1px solid var(--surface-border);
  font-size: 13px; color: var(--ink-2); line-height: 1.7; white-space: pre-wrap;
}
.strat-linked-chip {
  padding: 4px 12px; border-radius: var(--r-full); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all var(--fast);
}
.strat-linked-chip.chip-shotlist { background: rgba(249,115,22,0.08); color: #ea580c; }
.strat-linked-chip.chip-brief { background: rgba(13,148,136,0.08); color: var(--accent-ink); }
.strat-linked-chip:hover { transform: scale(1.04); box-shadow: var(--shadow-sm); }

/* ── Content Grid (Shot Lists / Briefs) ── */
.content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.content-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden; transition: all var(--fast);
  border-top: 3px solid var(--accent);
}
.content-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.content-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 18px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-2);
}
.content-card-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); }
.content-card-badge {
  font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-full);
}
.content-card-body { padding: 16px 18px; font-size: 13px; color: var(--ink-2); line-height: 1.7; }
.content-card-body p { margin-bottom: 8px; }

.checklist-item { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }
.checklist-bullet {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0; margin-top: 7px;
}

/* ── Team ── */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.team-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px; transition: all var(--fast);
  border-left: 3px solid var(--accent);
}
.team-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.team-card-name { font-family: Outfit, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink-0); }
.team-card-role { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }
.team-card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ── Themes ── */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.theme-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 16px; transition: all var(--fast);
  border-top: 3px solid var(--surface-border);
}
.theme-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.theme-card.peak { border-top-color: var(--accent); }
.theme-card-month {
  font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase;
  letter-spacing: 0.08em; font-family: Outfit, sans-serif;
  background: var(--accent-soft); display: inline-block; padding: 2px 8px; border-radius: var(--r-full);
}
.theme-card-title { font-family: Outfit, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink-0); margin-top: 8px; }
.theme-card-desc { font-size: 12px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }

/* ── Empty State ── */
.empty-state { padding: 60px 20px; text-align: center; }
.empty-state svg { width: 72px; height: 72px; margin: 0 auto 16px; display: block; opacity: 0.6; }
.empty-state-text { font-size: 14px; color: var(--ink-3); max-width: 320px; margin: 0 auto; line-height: 1.6; }

/* ══════════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════════ */
#modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15,14,12,0.5); backdrop-filter: blur(8px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 5vh 16px; overflow-y: auto;
}
#modal-panel {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-xl);
  width: 540px; max-width: 100%; animation: modalIn 0.25s var(--ease);
}
#modal-panel.wide { width: 700px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-2);
}
.modal-title { font-family: Outfit, sans-serif; font-size: 17px; font-weight: 700; color: var(--ink-0); letter-spacing: -0.02em; }
.modal-close {
  width: 30px; height: 30px; border: none; background: var(--surface-0);
  border-radius: var(--r-full); cursor: pointer; font-size: 13px; color: var(--ink-3);
  display: flex; align-items: center; justify-content: center; transition: all var(--fast);
}
.modal-close:hover { background: rgba(239,68,68,0.08); color: var(--st-rejected); }
.modal-body { padding: 20px 24px; max-height: 60vh; overflow-y: auto; }
.modal-footer {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 24px; border-top: 1px solid var(--surface-border);
}

/* Form controls */
.form-row { display: grid; gap: 16px; margin-bottom: 16px; }
.form-row.two-col { grid-template-columns: 1fr 1fr; }
.form-row.full { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.form-input, .form-select {
  padding: 10px 14px; border: 1px solid var(--surface-border);
  border-radius: var(--r-md); background: var(--surface-0);
  font-family: inherit; font-size: 13px; color: var(--ink-1);
  outline: none; transition: border-color var(--fast), box-shadow var(--fast);
}
.form-input:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-textarea {
  padding: 10px 14px; border: 1px solid var(--surface-border);
  border-radius: var(--r-md); background: var(--surface-0);
  font-family: inherit; font-size: 13px; color: var(--ink-1);
  min-height: 80px; resize: vertical; outline: none;
  transition: border-color var(--fast), box-shadow var(--fast);
}
.form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.char-count { font-size: 10px; font-weight: 500; color: var(--ink-3); margin-left: auto; }
.char-count.over { color: var(--st-rejected); }
.caption-preview {
  margin-top: 6px; padding: 8px 10px; background: var(--surface-2);
  border-radius: var(--r-sm); font-size: 12px; color: var(--ink-2);
  white-space: pre-wrap; max-height: 80px; overflow-y: auto; line-height: 1.5;
}
.hashtag-suggestions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* ═══ Command Palette ═══ */
#cmd-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(15,14,12,0.55); backdrop-filter: blur(10px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 15vh 16px;
}
#cmd-panel {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-xl);
  width: 540px; max-width: 100%; overflow: hidden;
  animation: modalIn 0.15s var(--ease);
}
#cmd-input {
  width: 100%; padding: 16px 20px; border: none; background: transparent;
  font-family: Outfit, sans-serif; font-size: 16px; color: var(--ink-1); outline: none;
  border-bottom: 1px solid var(--surface-border); font-weight: 500;
}
#cmd-input::placeholder { color: var(--ink-3); }
#cmd-results { max-height: 340px; overflow-y: auto; padding: 8px; }
.cmd-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: var(--r-md); cursor: pointer;
  transition: all var(--fast);
}
.cmd-item:hover, .cmd-item.selected { background: var(--accent-soft); }
.cmd-item-icon { width: 22px; text-align: center; font-size: 15px; color: var(--accent); }
.cmd-item-text { font-size: 13px; font-weight: 600; color: var(--ink-1); }
.cmd-item-hint { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ═══ Toast ═══ */
#toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px; border-radius: var(--r-full);
  font-size: 13px; font-weight: 600; color: #fff;
  box-shadow: var(--shadow-lg); animation: toastIn 0.3s var(--ease);
  display: flex; align-items: center; gap: 10px;
}
.toast.success { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
.toast.error { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
.toast.info { background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.95); } to { opacity: 1; transform: none; } }

/* ── Loading ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 80px 20px; flex: 1;
}
.loading-spinner {
  width: 32px; height: 32px; border: 3px solid var(--surface-border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mobile ── */
#mobile-header {
  display: none; padding: 14px 18px;
  background: linear-gradient(135deg, #1e3a5f 0%, #142a45 100%);
  border-bottom: none;
  align-items: center; justify-content: space-between;
}
#mobile-header .sb-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.06em; }
#hamburger {
  width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); border-radius: var(--r-full);
  cursor: pointer; font-size: 16px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--fast);
}
#hamburger:hover { background: rgba(255,255,255,0.2); }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { position: fixed; left: -260px; top: 0; width: 260px; z-index: 50; transition: left 0.3s var(--ease); }
  #sidebar.open { left: 0; }
  #mobile-header { display: flex; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .pipeline-board { grid-template-columns: repeat(3, 1fr); }
  .charts-row { grid-template-columns: 1fr; }
  .briefing-grid { grid-template-columns: 1fr; }
  .v-header, .v-body, #topbar { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 600px) {
  .pipeline-board { grid-template-columns: 1fr 1fr; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .week-grid { grid-template-columns: repeat(3, 1fr); }
  .form-row.two-col { grid-template-columns: 1fr; }
}
</style>
</head>

async function loadAll() {
  const [b,p,pl,po,m,t,str,sl,br,th,ht,eq,st] = await Promise.all([
    sb.from('sm_brands').select('*'),
    sb.from('sm_platforms').select('*'),
    sb.from('sm_content_pillars').select('*').order('sort_order', {ascending:true, nullsFirst:false}),
    sb.from('sm_posts').select('*').order('scheduled_date', {ascending:true, nullsFirst:false}),
    sb.from('sm_post_metrics').select('*'),
    sb.from('sm_team_members').select('*'),
    sb.from('sm_strategies').select('*').order('sort_order', {ascending:true}),
    sb.from('sm_shot_lists').select('*').order('sort_order', {ascending:true}),
    sb.from('sm_content_briefs').select('*').order('sort_order', {ascending:true}),
    sb.from('sm_monthly_themes').select('*').order('year', {ascending:true}).order('month', {ascending:true}),
    sb.from('sm_hashtags').select('*').order('category', {ascending:true}),
    sb.from('sm_equipment').select('*').order('tier', {ascending:true}),
    sb.from('sm_store_locations').select('*').order('store_number', {ascending:true})
  ]);
  S.brands = b.data||[]; S.platforms = p.data||[]; S.pillars = pl.data||[];
  S.posts = po.data||[]; S.metrics = m.data||[]; S.members = t.data||[];
  S.strategies = str.data||[]; S.shotLists = sl.data||[]; S.briefs = br.data||[];
  S.themes = th.data||[]; S.hashtags = ht.data||[]; S.equipment = eq.data||[];
  S.stores = st.data||[];
}

function brandById(id) { return S.brands.find(b=>b.id===id); }
function platById(id) { return S.platforms.find(p=>p.id===id); }
function pillarById(id) { return S.pillars.find(p=>p.id===id); }
function metricsForPost(pid) { return S.metrics.find(m=>m.post_id===pid); }
function brandSlug(id) { const b = brandById(id); return b ? b.slug : ''; }
function brandBg(br) { return br ? (br.slug==='del-taco'?'var(--brand-dt-soft)':(br.slug==='koala-insulation'?'var(--brand-koala-soft)':'var(--accent-soft)')) : 'var(--accent-soft)'; }

function filteredPosts() {
  let arr = S.posts;
  if (S.brandFilter !== 'all') arr = arr.filter(p => { const b = brandById(p.brand_id); return b && b.slug === S.brandFilter; });
  if (S.searchQuery) { const q = S.searchQuery.toLowerCase(); arr = arr.filter(p => (p.title||'').toLowerCase().includes(q) || (p.caption||'').toLowerCase().includes(q)); }
  return arr;
}
function filterByBrand(arr) {
  if (S.brandFilter === 'all') return arr;
  return arr.filter(item => { const b = brandById(item.brand_id); return b && b.slug === S.brandFilter; });
}

function startOfWeek(d) {
  const dt = new Date(d); const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff); dt.setHours(0,0,0,0); return dt;
}
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtTime(t) { if (!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12===0?12:h%12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }
function fmtNum(n) { if (n == null) return '0'; if (n >= 1000000) return (n/1000000).toFixed(1)+'M'; if (n >= 1000) return (n/1000).toFixed(1)+'K'; return String(n); }

function showToast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 200); }, 3000);
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('scc-theme'); } catch(e) {}
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  else document.documentElement.removeAttribute('data-theme');
  updateThemeIcon();
}
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr === 'dark' || (!attr && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.innerHTML = isDark ? '&#9789;' : '&#9788;';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDarkNow = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDarkNow ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('scc-theme', next); } catch(e) {}
  updateThemeIcon();
}

    el.onclick = () => { S.brandFilter = el.dataset.brand; menu.classList.remove('open'); render(); };
  });

function renderSidebarCounters() {
  const posts = filteredPosts();
  const today = toDateStr(new Date());
  const weekStart = startOfWeek(new Date());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const todayCount = posts.filter(p => p.scheduled_date === today).length;
  const weekCount = posts.filter(p => p.scheduled_date && p.scheduled_date >= toDateStr(weekStart) && p.scheduled_date <= toDateStr(weekEnd)).length;
  document.getElementById('sidebar-counters').innerHTML = `
    <div class="sb-counter"><div class="sb-counter-val">${todayCount}</div><div class="sb-counter-lbl">Today</div></div>
    <div class="sb-counter"><div class="sb-counter-val">${weekCount}</div><div class="sb-counter-lbl">This Week</div></div>`;
}

function renderBriefing() {
  const today = new Date(); const todayStr = toDateStr(today);
  const weekStart = startOfWeek(today); const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const weekEndStr = toDateStr(weekEnd); const weekStartStr = toDateStr(weekStart);
  const weekDays = [];
  for (let i = 0; i < 7; i++) { const d = new Date(weekStart); d.setDate(d.getDate()+i); weekDays.push({ date: d, str: toDateStr(d), dow: DOW_SHORT[d.getDay()], dom: d.getDate() }); }
  const allPosts = filteredPosts();
  const duePosts = allPosts.filter(p => p.scheduled_date && p.scheduled_date >= weekStartStr && p.scheduled_date <= weekEndStr && ['idea','draft','pending_approval','approved','scheduled'].includes(p.status)).sort((a,b) => (a.scheduled_date||'').localeCompare(b.scheduled_date||'') || (a.scheduled_time||'').localeCompare(b.scheduled_time||''));
  const needsWork = duePosts.filter(p => ['idea','draft'].includes(p.status));
  const needsReview = duePosts.filter(p => p.status === 'pending_approval');
  const ready = duePosts.filter(p => ['approved','scheduled'].includes(p.status));
  const activeBrands = S.brandFilter === 'all' ? S.brands : S.brands.filter(b => b.slug === S.brandFilter);
  const gaps = [];
  activeBrands.forEach(brand => {
    const brandPosts = allPosts.filter(p => p.brand_id === brand.id);
    weekDays.forEach(day => { if (day.str < todayStr) return; if (brandPosts.filter(p => p.scheduled_date === day.str).length === 0) gaps.push({ brand, day }); });
  });
  const postedWithMetrics = allPosts.filter(p => p.status === 'posted').map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m).sort((a,b) => (b.scheduled_date||'').localeCompare(a.scheduled_date||'')).slice(0, 8);
  const totalReach = postedWithMetrics.reduce((s,x) => s + (x.m.reach||0), 0);
  const totalLikes = postedWithMetrics.reduce((s,x) => s + (x.m.likes||0), 0);
  const avgEng = postedWithMetrics.length > 0 ? (postedWithMetrics.reduce((s,x) => s + parseFloat(x.m.engagement_rate||0), 0) / postedWithMetrics.length).toFixed(1) : '0.0';

  let html = `<div class="v-header"><h1>&#9889; Briefing</h1><p class="v-sub">Week of ${MONTH_NAMES[weekStart.getMonth()]} ${weekStart.getDate()} – ${weekStart.getMonth()===weekEnd.getMonth()?'':MONTH_NAMES[weekEnd.getMonth()]+' '}${weekEnd.getDate()}</p></div><div class="v-body"><div class="briefing-grid">`;

  // Content Due
  html += `<div class="briefing-section full-width"><div class="briefing-section-header"><div class="briefing-section-icon" style="background:rgba(var(--accent-rgb),.1);color:var(--accent)">&#128203;</div><div class="briefing-section-title">Content Due This Week</div><span class="briefing-section-count" style="background:${needsWork.length>0?'rgba(245,158,11,.1)':'rgba(34,197,94,.1)'};color:${needsWork.length>0?'var(--st-draft)':'var(--st-approved)'}">${duePosts.length} post${duePosts.length!==1?'s':''}</span></div><div class="briefing-section-body">`;
  if (duePosts.length === 0) {
    html += `<div class="briefing-empty">No posts scheduled this week. <span style="cursor:pointer;color:var(--accent)" onclick="S.view='calendar';document.querySelectorAll('.sb-nav-link').forEach(n=>n.classList.toggle('active',n.dataset.view==='calendar'));render()">Open Calendar &#8594;</span></div>`;
  } else {
    html += `<div style="display:flex;gap:16px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--surface-border)"><div style="font-size:12px;color:var(--ink-3)">&#9888;&#65039; <strong style="color:var(--st-draft)">${needsWork.length}</strong> need${needsWork.length!==1?'':'s'} work</div><div style="font-size:12px;color:var(--ink-3)">&#128269; <strong style="color:var(--st-review)">${needsReview.length}</strong> in review</div><div style="font-size:12px;color:var(--ink-3)">&#9989; <strong style="color:var(--st-approved)">${ready.length}</strong> ready</div></div>`;
    duePosts.forEach(p => {
      const br = brandById(p.brand_id); const pil = pillarById(p.content_pillar_id);
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      const d = p.scheduled_date ? new Date(p.scheduled_date + 'T00:00:00') : null;
      const isToday = p.scheduled_date === todayStr; const isPast = p.scheduled_date < todayStr;
      let actionClass = 'needs-work', actionLabel = 'Needs Work';
      if (p.status === 'pending_approval') { actionClass = 'needs-review'; actionLabel = 'In Review'; }
      else if (['approved','scheduled'].includes(p.status)) { actionClass = 'ready'; actionLabel = 'Ready'; }
      html += `<div class="briefing-post-row" data-post-id="${p.id}"><div class="briefing-post-day" style="${isToday?'border-color:var(--accent);background:var(--accent-soft)':''}${isPast?';opacity:.6':''}"><span class="dow">${d?DOW_SHORT[d.getDay()]:'—'}</span><span class="dom">${d?d.getDate():'—'}</span></div><div class="briefing-post-info"><div class="briefing-post-title">${escHtml(p.title)}</div><div class="briefing-post-meta"><span class="briefing-status-dot" style="background:${meta.color}"></span><span>${meta.label}</span>${br?`<span style="color:${br.color||'var(--accent)'}">${br.logo_emoji||''} ${br.name.split(' ')[0]}</span>`:''} ${plats.length?'<span>'+plats.map(pl=>`<span style="color:${PLAT_HEX[pl.name]||'var(--ink-3)'}">${pl.name}</span>`).join(', ')+'</span>':''} ${p.scheduled_time?`<span>${fmtTime(p.scheduled_time)}</span>`:''}</div></div><button class="briefing-post-action ${actionClass}">${actionLabel}</button></div>`;
    });
  }
  html += `</div></div>`;

  // Gap Alerts
  html += `<div class="briefing-section"><div class="briefing-section-header"><div class="briefing-section-icon" style="background:rgba(245,158,11,.1);color:var(--st-draft)">&#128680;</div><div class="briefing-section-title">Gap Alerts</div><span class="briefing-section-count" style="background:${gaps.length>0?'rgba(245,158,11,.1)':'rgba(34,197,94,.1)'};color:${gaps.length>0?'var(--st-draft)':'var(--st-approved)'}">${gaps.length} gap${gaps.length!==1?'s':''}</span></div><div class="briefing-section-body">`;
  if (gaps.length === 0) {
    html += `<div class="briefing-empty" style="color:var(--st-approved)">&#9989; No content gaps — every day is covered!</div>`;
  } else {
    const gapsByDay = {};
    gaps.forEach(g => { if (!gapsByDay[g.day.str]) gapsByDay[g.day.str] = { day: g.day, brands: [] }; gapsByDay[g.day.str].brands.push(g.brand); });
    Object.values(gapsByDay).forEach(g => {
      const brandNames = g.brands.map(b => `<span style="color:${b.color||'var(--accent)'}">${b.logo_emoji||''} ${b.name.split(' ')[0]}</span>`).join(', ');

    });
  }

function renderCalendarView() {
  const wrap = document.getElementById('main-view');
  let html = `<div class="v-header"><h1>Content Calendar</h1><p class="v-sub">Plan and schedule content across brands and platforms</p></div><div class="v-body"><div class="tab-bar" id="cal-view-tabs"><button class="tab-btn ${S.calView==='month'?'active':''}" data-calview="month">Monthly</button><button class="tab-btn ${S.calView==='week'?'active':''}" data-calview="week">Weekly</button><button class="tab-btn ${S.calView==='list'?'active':''}" data-calview="list">List</button></div><div id="cal-body"></div></div>`;
  wrap.innerHTML = html;
  document.getElementById('cal-view-tabs').addEventListener('click', e => { const btn = e.target.closest('.tab-btn'); if (!btn) return; S.calView = btn.dataset.calview; renderCalendarView(); });
  if (S.calView === 'month') renderCalendarMonth(); else if (S.calView === 'week') renderCalendarWeek(); else renderCalendarList();
}

function renderCalendarMonth() {
  const posts = filteredPosts(); const y = S.calYear, m = S.calMonth;
  const first = new Date(y, m, 1); const last = new Date(y, m+1, 0);
  const startDow = first.getDay(); const daysInMonth = last.getDate();
  const today = new Date(); const todayStr = toDateStr(today);
  const byDate = {}; posts.forEach(p => { if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); } });
  let html = `<div class="cal-nav"><button class="cal-nav-btn" id="cal-prev">&#8249;</button><span class="cal-month-label">${MONTH_NAMES[m]} ${y}</span><button class="cal-nav-btn" id="cal-next">&#8250;</button><button class="cal-today-btn" id="cal-today">Today</button></div><div class="cal-grid">`;
  DOW_SHORT.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) html += `<div class="cal-day outside"><div class="cal-day-num">${prevLast - i}</div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr; const dayPosts = byDate[dateStr] || [];
    html += `<div class="cal-day${isToday?' today':''}" data-date="${dateStr}"><div class="cal-day-num-row"><div class="cal-day-num">${d}</div>${dayPosts.length?`<span class="cal-day-count">${dayPosts.length}</span>`:''}</div>`;
    dayPosts.slice(0, 4).forEach(p => {
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []); const plats = pids.map(id=>platById(id)).filter(Boolean);
      html += `<div class="cal-post-row" data-post-id="${p.id}" title="${escAttr(p.title)}">${plats.length?plats.map(pl=>`<span class="cal-plat-dot" style="background:${PLAT_HEX[pl.name]||'#6366f1'}"></span>`).join(''):`<span class="cal-plat-dot" style="background:#6366f1"></span>`} ${escHtml(p.title.substring(0,16))}</div>`;
    });
    if (dayPosts.length > 4) html += `<div class="cal-overflow">+${dayPosts.length-4} more</div>`;
    html += `</div>`;
  }
  const totalCells = startDow + daysInMonth; const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="cal-day outside"><div class="cal-day-num">${i}</div></div>`;
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.getElementById('cal-prev').onclick = () => { S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} renderCalendarMonth(); };
  document.getElementById('cal-next').onclick = () => { S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} renderCalendarMonth(); };
  document.getElementById('cal-today').onclick = () => { S.calMonth=today.getMonth(); S.calYear=today.getFullYear(); renderCalendarMonth(); };
  document.querySelectorAll('.cal-post-row').forEach(el => { el.onclick = (e) => { e.stopPropagation(); openPostModal(el.dataset.postId); }; });
  document.querySelectorAll('.cal-day:not(.outside)').forEach(el => { el.onclick = () => { openPostModal(null, el.dataset.date); }; });
}

function renderCalendarWeek() {
  const posts = filteredPosts(); const start = new Date(S.weekAnchor); const days = [];
  for (let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  const end = days[6]; const todayStr = toDateStr(new Date());
  const byDate = {}; posts.forEach(p => { if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); } });
  let html = `<div class="cal-nav"><button class="cal-nav-btn" id="week-prev">&#8249;</button><span class="cal-month-label">${MONTH_NAMES[start.getMonth()]} ${start.getDate()} – ${MONTH_NAMES[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}</span><button class="cal-nav-btn" id="week-next">&#8250;</button><button class="cal-today-btn" id="week-today">Today</button></div><div class="week-grid">`;
  days.forEach(d => {
    const dateStr = toDateStr(d); const dayPosts = (byDate[dateStr]||[]).sort((a,b)=>(a.scheduled_time||'').localeCompare(b.scheduled_time||''));
    html += `<div class="week-col${dateStr===todayStr?' today':''}"><div class="week-col-head"><div class="week-col-dow">${DOW_SHORT[d.getDay()]}</div><div class="week-col-num">${d.getDate()}</div></div>`;
    if (dayPosts.length === 0) { html += `<div class="week-empty">No posts</div>`; }
    else { dayPosts.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      html += `<div class="week-card" data-post-id="${p.id}">${p.scheduled_time?`<div class="week-card-time">${fmtTime(p.scheduled_time)}</div>`:''}<div class="week-card-title">${escHtml(p.title)}</div><div class="week-card-badges">${plats.length?plats.map(pl=>`<span class="week-card-plat" style="background:${PLAT_HEX[pl.name]||'#6366f1'}" title="${escAttr(pl.name)}"></span>`).join(''):''} ${br?`<span style="font-size:10px;color:var(--ink-3)">${escHtml(br.name.split(' ')[0])}</span>`:''}<span class="week-card-status" style="background:${meta.color};color:#fff;margin-left:auto">${meta.label}</span></div></div>`;
    }); }
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.getElementById('week-prev').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()-7); renderCalendarWeek(); };
  document.getElementById('week-next').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()+7); renderCalendarWeek(); };
  document.getElementById('week-today').onclick = () => { S.weekAnchor = startOfWeek(new Date()); renderCalendarWeek(); };
  document.querySelectorAll('.week-card').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

function renderCalendarList() {
  const posts = filteredPosts(); const today = toDateStr(new Date());
  const horizon = new Date(); horizon.setDate(horizon.getDate()+30); const horizonStr = toDateStr(horizon);
  let upcoming = posts.filter(p => p.scheduled_date && p.scheduled_date >= today && p.scheduled_date <= horizonStr);
  const { key, dir } = S.listSort;
  upcoming = [...upcoming].sort((a,b) => {
    let av, bv;
    if (key==='title') { av=a.title||''; bv=b.title||''; }
    else if (key==='brand') { av=(brandById(a.brand_id)||{}).name||''; bv=(brandById(b.brand_id)||{}).name||''; }
    else if (key==='platform') { av=(platById(a.platform_id)||{}).name||''; bv=(platById(b.platform_id)||{}).name||''; }
    else if (key==='status') { av=a.status||''; bv=b.status||''; }
    else { av=(a.scheduled_date||'')+(a.scheduled_time||''); bv=(b.scheduled_date||'')+(b.scheduled_time||''); }
    return dir==='asc' ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
  });
  const cols = [['scheduled_date','Date'],['scheduled_time','Time'],['title','Title'],['brand','Brand'],['platform','Platform'],['pillar','Pillar'],['status','Status'],['brief','Brief']];
  let html = `<div class="list-table-wrap">`;
  if (upcoming.length === 0) { html += emptyState('&#128197;', 'No posts scheduled in the next 30 days.'); }
  else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr>`;
    cols.forEach(([k,label]) => {
      const sortable = ['scheduled_date','title','brand','platform','status'].includes(k);
      const arrow = S.listSort.key===k ? (S.listSort.dir==='asc'?'&#9650;':'&#9660;') : '';
      html += `<th class="${sortable?'list-th':''}" ${sortable?`data-sortkey="${k}"`:''}>${label}${sortable?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
    });
    html += `</tr></thead><tbody>`;
    upcoming.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean); const pil = pillarById(p.content_pillar_id);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      html += `<tr class="list-row" data-post-id="${p.id}" style="cursor:pointer"><td>${fmtDate(p.scheduled_date)}</td><td>${p.scheduled_time?fmtTime(p.scheduled_time):'—'}</td><td style="font-weight:500;color:var(--ink-1)">${escHtml(p.title)}</td><td>${br?escHtml(br.name):'—'}</td><td>${plats.length?plats.map(pl=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PLAT_HEX[pl.name]||'#6366f1'};margin-right:4px;vertical-align:middle"></span>`).join('')+plats.map(pl=>escHtml(pl.name)).join(', '):'—'}</td><td>${pil?escHtml(pil.name):'—'}</td><td><span class="status-badge" style="background:${meta.color}">${meta.label}</span></td><td><button class="metrics-btn" onclick="event.stopPropagation();generateBrief('${p.id}')" title="Generate Brief">&#128203;</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.querySelectorAll('.list-th').forEach(el => { el.onclick = () => { const k = el.dataset.sortkey; if (S.listSort.key===k) S.listSort.dir = S.listSort.dir==='asc'?'desc':'asc'; else { S.listSort.key=k; S.listSort.dir='asc'; } renderCalendarList(); }; });
  document.querySelectorAll('.list-row').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

// ANALYTICS
// ══════════════════════════════════════════════
function renderAnalytics() {
  const posts = filteredPosts(); const posted = posts.filter(p => p.status === 'posted');
  const withMetrics = posted.map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m);
  const totalPosts = posted.length;
  const totalReach = withMetrics.reduce((s,x) => s + (x.m.reach||0), 0);
  const totalFollowers = withMetrics.reduce((s,x) => s + (x.m.followers_gained||0), 0);
  const avgEngagement = withMetrics.length > 0 ? (withMetrics.reduce((s,x) => s + parseFloat(x.m.engagement_rate||0), 0) / withMetrics.length).toFixed(1) : '0.0';
  const chrono = [...withMetrics].sort((a,b) => (a.scheduled_date||'').localeCompare(b.scheduled_date||''));
  const reachSeries = chrono.map(x => x.m.reach||0);
  const engSeries = chrono.map(x => parseFloat(x.m.engagement_rate||0));
  const followersSeries = chrono.map(x => x.m.followers_gained||0);
  const postsCountSeries = bucketCounts(posted.map(p=>p.scheduled_date).filter(Boolean));

  let html = `<div class="v-header"><h1>Analytics</h1><p class="v-sub">Track performance across platforms and brands</p></div><div class="v-body">`;
  html += `<div class="kpi-row">${kpiCard('Total Posts', totalPosts, `${posts.filter(p=>p.status==='scheduled').length} scheduled`, postsCountSeries, '#6366f1')}${kpiCard('Avg Engagement', avgEngagement+'%', `${withMetrics.length} posts with metrics`, engSeries, '#22c55e')}${kpiCard('Total Reach', fmtNum(totalReach), 'Across all platforms', reachSeries, '#0ea5e9')}${kpiCard('Followers Gained', '+'+fmtNum(totalFollowers), 'Net new followers', followersSeries, '#f59e0b')}</div>`;

  const platStats = {}; S.platforms.forEach(p => { platStats[p.id] = { name:p.name, posts:0, reach:0, engagement:0, count:0 }; });
  posted.forEach(p => { const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []); pids.forEach(pid => { if(platStats[pid]) platStats[pid].posts++; }); });
  withMetrics.forEach(x => { const xpids = x.platform_ids || (x.platform_id ? [x.platform_id] : []); xpids.forEach(pid => { if(platStats[pid]) { platStats[pid].reach += (x.m.reach||0); platStats[pid].engagement += parseFloat(x.m.engagement_rate||0); platStats[pid].count++; } }); });
  const platArr = Object.values(platStats);
  const mediaTypeCounts = {}; posts.forEach(p => { const t = p.media_type || 'unspecified'; mediaTypeCounts[t] = (mediaTypeCounts[t]||0)+1; });
  const donutData = Object.entries(mediaTypeCounts).map(([k,v],i) => ({ label:k, value:v, color: CHART_PALETTE[i%CHART_PALETTE.length] }));

  html += `<div class="charts-row"><div class="chart-card"><div class="chart-title">Platform Comparison (Reach)</div>${drawGroupedBarChart(platArr.map(p => ({ label:p.name, value:p.reach, color: PLAT_HEX[p.name]||'#6366f1' })))}</div><div class="chart-card"><div class="chart-title">Content Type Mix</div>${drawDonut(donutData)}</div></div>`;
  html += `<div class="charts-row"><div class="chart-card" style="grid-column:1/-1"><div class="chart-title">Best Times to Post</div>${drawHeatmap(posts)}</div></div>`;
  html += `<div class="chart-card" style="margin-bottom:20px"><div class="chart-title">Pipeline Fullness — Posts by Status</div>${drawStatusStackedBar(posts)}</div>`;

  const sorted = [...withMetrics].sort((a,b) => (b.m.reach||0) - (a.m.reach||0)).slice(0,10);
  html += `<div class="data-table-wrap"><div class="data-table-title">Top Performing Posts</div>`;
  if (sorted.length === 0) html += `<div style="padding:30px;text-align:center;color:var(--ink-3);font-size:13px">No posts with metrics yet.</div>`;
  else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>#</th><th>Post</th><th>Brand</th><th>Platform</th><th>Reach</th><th>Eng. Rate</th><th>Likes</th><th>Comments</th><th>Shares</th></tr></thead><tbody>`;
    sorted.forEach((x,i) => {
      const br = brandById(x.brand_id); const xpids = x.platform_ids || (x.platform_id ? [x.platform_id] : []);
      const xplats = xpids.map(id=>platById(id)).filter(Boolean);
      html += `<tr><td><span class="rank-badge">${i+1}</span></td><td style="font-weight:500;color:var(--ink-1)">${escHtml(x.title)}</td><td>${br?br.name:'—'}</td><td>${xplats.length?xplats.map(pl=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PLAT_HEX[pl.name]||'#6366f1'};margin-right:4px;vertical-align:middle"></span>`).join('')+xplats.map(pl=>pl.name).join(', '):'—'}</td><td>${fmtNum(x.m.reach)}</td><td>${x.m.engagement_rate}%</td><td>${fmtNum(x.m.likes)}</td><td>${fmtNum(x.m.comments)}</td><td>${fmtNum(x.m.shares)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div></div>`;
  document.getElementById('main-view').innerHTML = html;
}

// ── Chart Helpers ──
function bucketCounts(dates) { const sorted = [...dates].sort(); const counts = {}; sorted.forEach(d => { counts[d]=(counts[d]||0)+1; }); return Object.values(counts).slice(-12); }

function kpiCard(label, value, sub, series, color) {
  const trend = trendFromSeries(series);
  return `<div class="kpi-card"><div class="kpi-top"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div><div class="kpi-trend ${trend.dir}">${trend.arrow} ${trend.pct}</div></div><div class="kpi-spark">${drawSparkline(series, color)}</div><div class="kpi-sub">${sub}</div></div>`;
}

function trendFromSeries(series) {
  if (!series || series.length < 2) return { dir:'flat', arrow:'—', pct:'' };
  const half = Math.max(1, Math.floor(series.length/2));
  const first = series.slice(0, half).reduce((a,b)=>a+b,0) / half;
  const last = series.slice(-half).reduce((a,b)=>a+b,0) / half;
  if (first === 0 && last === 0) return { dir:'flat', arrow:'—', pct:'0%' };
  const pct = first === 0 ? 100 : ((last-first)/Math.abs(first))*100;
  if (Math.abs(pct) < 1) return { dir:'flat', arrow:'—', pct:'0%' };
  return pct > 0 ? { dir:'up', arrow:'&#9650;', pct: Math.abs(pct).toFixed(0)+'%' } : { dir:'down', arrow:'&#9660;', pct: Math.abs(pct).toFixed(0)+'%' };
}

function drawSparkline(values, color) {
  if (!values || values.length === 0) return `<svg viewBox="0 0 100 34" style="width:100%;height:34px;display:block"></svg>`;
  const W=100,H=34,pad=3; const max = Math.max(...values, 0.0001); const min = Math.min(...values, 0); const range = (max-min)||1;
  const stepX = values.length>1 ? (W-pad*2)/(values.length-1) : 0;
  const pts = values.map((v,i) => [pad+i*stepX, H-pad-((v-min)/range)*(H-pad*2)]);
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${H-pad} L${pts[0][0].toFixed(1)},${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:34px;display:block"><path d="${area}" fill="${color}" opacity="0.12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function drawGroupedBarChart(data) {
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const W = 480, H = 40, barH = 26;
  let svg = `<svg viewBox="0 0 ${W} ${data.length*H}" style="width:100%;display:block">`;
  data.forEach((d,i) => {
    const y = i*H + (H-barH)/2; const w = maxVal > 0 ? (d.value/maxVal) * (W-140) : 0;
    svg += `<text x="0" y="${y+barH/2+4}" font-size="12" font-weight="600" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${escHtml(d.label)}</text>`;
    svg += `<rect x="90" y="${y}" width="${W-140}" height="${barH}" rx="4" fill="var(--chart-grid)"/>`;
    svg += `<rect x="90" y="${y}" width="${w}" height="${barH}" rx="4" fill="${d.color}" opacity="0.88"/>`;
    svg += `<text x="${90+w+8}" y="${y+barH/2+4}" font-size="11" font-weight="700" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${fmtNum(d.value)}</text>`;
  });
  svg += `</svg>`; return svg;
}

function drawDonut(data) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total === 0) return `<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">No data yet</div>`;
  const cx=90, cy=90, r=70, ir=42; let angle = -Math.PI/2; let paths = '';
  data.forEach(d => {
    const frac = d.value/total; const sweep = frac*Math.PI*2;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle), x2 = cx+r*Math.cos(angle+sweep), y2 = cy+r*Math.sin(angle+sweep);
    const ix1 = cx+ir*Math.cos(angle), iy1 = cy+ir*Math.sin(angle), ix2 = cx+ir*Math.cos(angle+sweep), iy2 = cy+ir*Math.sin(angle+sweep);
    const large = sweep > Math.PI ? 1 : 0;
    paths += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ir},${ir} 0 ${large} 0 ${ix1.toFixed(2)},${iy1.toFixed(2)} Z" fill="${d.color}" opacity="0.9"/>`;
    angle += sweep;
  });
  let legend = `<div class="chart-legend">`; data.forEach(d => { legend += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${d.color}"></span>${escHtml(d.label)} (${d.value})</div>`; }); legend += `</div>`;
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0">${paths}<text x="90" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink-1)" font-family="Outfit,sans-serif">${total}</text><text x="90" y="104" text-anchor="middle" font-size="10" fill="var(--chart-text)" font-family="DM Sans,sans-serif">posts</text></svg><div style="flex:1;min-width:150px">${legend}</div></div>`;
}

function drawHeatmap(posts) {
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  posts.forEach(p => { if (!p.scheduled_date) return; const d = new Date(p.scheduled_date+'T00:00:00'); let dow = d.getDay(); dow = dow===0?6:dow-1; let hour = 12; if (p.scheduled_time) { const parts = p.scheduled_time.split(':'); hour = parseInt(parts[0])||0; } grid[dow][hour]++; });
  const max = Math.max(...grid.flat(), 1); const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = `<div class="heatmap-wrap"><div class="heatmap-grid"><div></div>`;
  for (let h=0; h<24; h++) html += `<div class="heatmap-hour-label">${h%3===0?h:''}</div>`;
  for (let d=0; d<7; d++) {
    html += `<div class="heatmap-dow-label">${dowLabels[d]}</div>`;
    for (let h=0; h<24; h++) { const v = grid[d][h]; const alpha = v===0?0.06:0.15+(v/max)*0.85; html += `<div class="heatmap-cell" style="background:rgba(var(--accent-rgb),${alpha.toFixed(2)})" title="${dowLabels[d]} ${h}:00 — ${v} post${v===1?'':'s'}"></div>`; }
  }
  html += `</div></div>`; return html;
}

function drawStatusStackedBar(posts) {
  const total = posts.length || 1;
  let html = `<div style="display:flex;height:28px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--surface-border)">`;
  STATUS_ORDER.forEach(status => { const meta = STATUS_META[status]; const count = posts.filter(p=>p.status===status).length; const pct = (count/total)*100; if (pct > 0) html += `<div style="width:${pct}%;background:${meta.color};display:flex;align-items:center;justify-content:center;transition:width var(--normal)" title="${meta.label}: ${count}">${pct>8?`<span style="font-size:10px;font-weight:700;color:#fff">${count}</span>`:''}</div>`; });
  html += `</div><div class="chart-legend">`; STATUS_ORDER.forEach(status => { const meta = STATUS_META[status]; const count = posts.filter(p=>p.status===status).length; html += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${meta.color}"></span>${meta.label} (${count})</div>`; }); html += `</div>`;
  return html;
}

  const tags = filterByBrand(S.hashtags);
  let html = `<div class="v-header"><h1>Hashtag Library</h1><p class="v-sub">Curated hashtags organized by category</p></div><div class="v-body">`;
  if (tags.length === 0) html += emptyState('#', 'No hashtags loaded.');
  else {
    const byCategory = {}; tags.forEach(t => { const cat = t.category||'Uncategorized'; if (!byCategory[cat]) byCategory[cat]=[]; byCategory[cat].push(t); });
    Object.entries(byCategory).forEach(([cat, items]) => {
      html += `<div style="margin-bottom:20px"><h3 style="font-family:Outfit;font-size:15px;font-weight:700;color:var(--ink-0);margin-bottom:10px;text-transform:capitalize">${escHtml(cat)}</h3><div style="display:flex;flex-wrap:wrap;gap:6px">`;
      items.forEach(t => { const br = brandById(t.brand_id); const isPrimary = t.is_primary; html += `<span class="tag tag-clickable${isPrimary?' tag-primary':''}" onclick="navigator.clipboard.writeText('${escAttr(t.tag)}').then(()=>showToast('Copied: ${escAttr(t.tag)}','success'))" title="Click to copy">${escHtml(t.tag)}</span>`; });

function renderStores() {

function openPostModal(postId, prefillDate, isQuickIdea) {
