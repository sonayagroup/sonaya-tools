// ══════════════════════════════════════════════
let AUTH_USER = null; // { id, email, display_name, role }
let LOGIN_EMAIL = ''; // track email between steps
const SESSION_KEY = 'scc_session_token';

function showEmailStep() {
  document.getElementById('login-step-email').hidden = false;
  document.getElementById('login-step-pin').hidden = true;
  document.getElementById('login-step-setup').hidden = true;
  document.getElementById('login-msg').className = 'login-msg';
  document.getElementById('login-msg').textContent = '';
  LOGIN_EMAIL = '';
}

async function handleLogin(e) {
  e.preventDefault();
  const pinStep = document.getElementById('login-step-pin');
  const setupStep = document.getElementById('login-step-setup');
  const msg = document.getElementById('login-msg');

  // Step 3: PIN setup for first-time users
  if (!setupStep.hidden) {
    const pin = document.getElementById('setup-pin').value;
    const confirm = document.getElementById('setup-pin-confirm').value;
    const btn = document.getElementById('setup-btn');
    if (!pin || pin.length < 4) {
      msg.className = 'login-msg error'; msg.textContent = 'PIN must be at least 4 digits.'; return;
    }
    if (pin !== confirm) {
      msg.className = 'login-msg error'; msg.textContent = 'PINs do not match.'; return;
    }
    btn.disabled = true; btn.textContent = 'Setting up...';
    msg.className = 'login-msg'; msg.textContent = '';

    const { data, error } = await sb.rpc('set_team_pin', { p_email: LOGIN_EMAIL, p_pin: pin });
    if (error || (data && data.error)) {
      msg.className = 'login-msg error';
      msg.textContent = (data && data.error) || error.message || 'Setup failed. Please try again.';
      btn.disabled = false; btn.textContent = 'Set PIN & Sign In';
      return;
    }
    // Success — save session
    try { localStorage.setItem(SESSION_KEY, data.token); } catch(e) {}
    AUTH_USER = { id: data.member_id, email: data.email, display_name: data.name, role: data.role };
    document.getElementById('login-overlay').hidden = true;
    document.getElementById('app').style.display = '';
    updateUserUI();
    logAudit('login', 'session', '', AUTH_USER.display_name, { method: 'pin_setup' });
    await bootApp();
    return;
  }

  // Step 2: Verify PIN
  if (!pinStep.hidden) {
    const pin = document.getElementById('login-pin').value;
    const btn = document.getElementById('pin-btn');
    if (!pin || pin.length < 4) {
      msg.className = 'login-msg error'; msg.textContent = 'Please enter your PIN.'; return;
    }
    btn.disabled = true; btn.textContent = 'Signing in...';
    msg.className = 'login-msg'; msg.textContent = '';

    const { data, error } = await sb.rpc('login_with_pin', { p_email: LOGIN_EMAIL, p_pin: pin });
    if (error || (data && data.error)) {
      msg.className = 'login-msg error';
      msg.textContent = (data && data.error) || error.message || 'Login failed.';
      btn.disabled = false; btn.textContent = 'Sign In';
      return;
    }
    // Success — save session
    try { localStorage.setItem(SESSION_KEY, data.token); } catch(e) {}
    AUTH_USER = { id: data.member_id, email: data.email, display_name: data.name, role: data.role };
    document.getElementById('login-overlay').hidden = true;
    document.getElementById('app').style.display = '';
    updateUserUI();
    logAudit('login', 'session', '', AUTH_USER.display_name);
    await bootApp();
    return;
  }

  // Step 1: Check email
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const btn = document.getElementById('login-btn');
  if (!email) return;
  btn.disabled = true; btn.textContent = 'Checking...';
  msg.className = 'login-msg'; msg.textContent = '';

  // Try login with a dummy PIN to see response type (email check + needs_setup detection)
  const { data, error } = await sb.rpc('login_with_pin', { p_email: email, p_pin: '____' });
  btn.disabled = false; btn.textContent = 'Continue';

  if (error) {
    msg.className = 'login-msg error'; msg.textContent = 'Something went wrong. Please try again.'; return;
  }
  if (data && data.error) {
    // "Email not authorized"
    msg.className = 'login-msg error'; msg.textContent = data.error + '. Contact the admin to get access.'; return;
  }
  if (data && data.needs_setup) {
    // First-time user — show PIN setup
    LOGIN_EMAIL = email;
    document.getElementById('login-step-email').hidden = true;
    document.getElementById('login-step-setup').hidden = false;
    document.getElementById('setup-greeting').textContent = 'Welcome, ' + data.name + '! Set up your PIN to get started.';
    document.getElementById('setup-pin').value = '';
    document.getElementById('setup-pin-confirm').value = '';
    document.getElementById('setup-pin').focus();
    return;
  }
  // Has a PIN — "Incorrect PIN" means they exist, show PIN entry
  LOGIN_EMAIL = email;
  document.getElementById('login-step-email').hidden = true;
  document.getElementById('login-step-pin').hidden = false;
  document.getElementById('login-greeting').textContent = 'Welcome back! Enter your PIN to sign in.';
  document.getElementById('login-pin').value = '';
  document.getElementById('login-pin').focus();
}

async function checkAuth() {
  const token = (() => { try { return localStorage.getItem(SESSION_KEY); } catch(e) { return null; } })();
  if (!token) return false;

  const { data, error } = await sb.rpc('validate_session', { p_token: token });
  if (error || !data || !data.valid) {
    try { localStorage.removeItem(SESSION_KEY); } catch(e) {}
    return false;
  }

  AUTH_USER = {
    id: data.member_id,
    email: data.email,
    display_name: data.name,
    role: data.role
  };
  document.getElementById('login-overlay').hidden = true;
  document.getElementById('app').style.display = '';
  updateUserUI();
  return true;
}

async function loadAuditEntries(filterAction) {
  const el = document.getElementById('audit-entries');
  if (!el) return;
  let q = sb.from('sm_audit_log').select('*').order('created_at', { ascending: false }).limit(200);
  if (filterAction && filterAction !== 'all') q = q.eq('action', filterAction);
  const { data, error } = await q;
  if (error || !data) { el.innerHTML = '<p style="color:var(--ink-3);text-align:center;padding:40px">No activity yet.</p>'; return; }
  if (data.length === 0) { el.innerHTML = '<p style="color:var(--ink-3);text-align:center;padding:40px">No activity yet.</p>'; return; }
  el.innerHTML = data.map(a => {
    const icon = AUDIT_ICONS[a.action] || '&#128196;';
    const when = timeAgo(new Date(a.created_at));
    const actionLabel = a.action.replace(/_/g, ' ');
    return `<div class="audit-entry">
      <div class="audit-icon">${icon}</div>
      <div class="audit-body">
        <div class="audit-who">${escHtml(a.user_name || a.user_email || 'Unknown')}</div>
        <div class="audit-what"><strong>${escHtml(actionLabel)}</strong> ${a.entity_type ? escHtml(a.entity_type) : ''}${a.entity_name ? ': <strong>' + escHtml(a.entity_name) + '</strong>' : ''}</div>
        ${a.details && Object.keys(a.details).length ? '<div class="audit-what" style="font-size:11px;color:var(--ink-3);margin-top:1px">' + escHtml(JSON.stringify(a.details).slice(0,120)) + '</div>' : ''}
        <div class="audit-when">${when}</div>
      </div>
    </div>`;
  }).join('');
}

function filterAudit(action) {
  document.querySelectorAll('.audit-filter-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(action === 'all' ? 'all' : action)));
  loadAuditEntries(action);
}

function timeAgo(date) {
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// type: 'food' (Del Taco relevant, red) | 'eco' (Koala / home relevant, green) | 'general' (gray)
const CALENDAR_EVENT_DEFS = [
  { name: "New Year's Day", month: 1, day: 1, type: 'general' },
  { name: "Valentine's Day", month: 2, day: 14, type: 'general' },
  { name: 'National Burrito Day', month: 4, day: 7, type: 'food' },
  { name: 'Earth Day', month: 4, day: 22, type: 'eco' },
  { name: 'Cinco de Mayo', month: 5, day: 5, type: 'food' },
  { name: "Mother's Day", nth: { month: 5, weekday: 0, n: 2 }, type: 'general' },
  { name: 'Memorial Day', last: { month: 5, weekday: 1 }, type: 'general' },
  { name: 'World Environment Day', month: 6, day: 5, type: 'eco' },
  { name: "Father's Day", nth: { month: 6, weekday: 0, n: 3 }, type: 'general' },
  { name: 'Fourth of July', month: 7, day: 4, type: 'general' },
  { name: 'Labor Day', nth: { month: 9, weekday: 1, n: 1 }, type: 'general' },
  { name: 'National Taco Day', month: 10, day: 4, type: 'food' },
  { name: 'National Insulation Day', month: 10, day: 13, type: 'eco' },
  { name: 'Halloween', month: 10, day: 31, type: 'general' },
  { name: 'Thanksgiving', nth: { month: 11, weekday: 4, n: 4 }, type: 'food' },
  { name: 'Christmas', month: 12, day: 25, type: 'general' },
];
function nthWeekdayOfMonth(year, month, weekday, n) {
  const first = new Date(year, month - 1, 1);
  const firstWeekday = first.getDay();
  return 1 + ((weekday - firstWeekday + 7) % 7) + (n - 1) * 7;
}
function lastWeekdayOfMonth(year, month, weekday) {
  const last = new Date(year, month, 0);
  return last.getDate() - ((last.getDay() - weekday + 7) % 7);
}
const _holidayCache = {};
function holidaysForYear(year) {
  if (_holidayCache[year]) return _holidayCache[year];
  const out = CALENDAR_EVENT_DEFS.map(ev => {
    let month, day;
    if (ev.day) { month = ev.month; day = ev.day; }
    else if (ev.nth) { month = ev.nth.month; day = nthWeekdayOfMonth(year, ev.nth.month, ev.nth.weekday, ev.nth.n); }
    else { month = ev.last.month; day = lastWeekdayOfMonth(year, ev.last.month, ev.last.weekday); }
    return { name: ev.name, type: ev.type, date: `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}` };
  });
  _holidayCache[year] = out;
  return out;
}
function holidaysByDate(year) {
  const map = {};
  holidaysForYear(year).forEach(h => { map[h.date] = h; });
  return map;
}
function engagementTier(post) {
  const m = metricsForPost(post.id);
  if (!m) return null;
  const rate = parseFloat(m.engagement_rate || 0);
  if (rate >= 5) return 'high';
  if (rate >= 2) return 'med';
  return 'low';
}

function filteredPosts() {

function startOfWeek(d) {
  const dt = new Date(d); const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff); dt.setHours(0,0,0,0); return dt;
}
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtTime(t) { if (!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12===0?12:h%12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }
function fmtNum(n) { if (n == null) return '0'; if (n >= 1000000) return (n/1000000).toFixed(1)+'M'; if (n >= 1000) return (n/1000).toFixed(1)+'K'; return String(n); }

function initTheme() {

  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  else document.documentElement.removeAttribute('data-theme');
  updateThemeIcon();
}
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr === 'dark' || (!attr && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.innerHTML = isDark ? '&#9789;' : '&#9788;';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDarkNow = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDarkNow ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('scc-theme', next); } catch(e) {}
  updateThemeIcon();
}

function renderSidebarCounters() {

}

function computeWeekGaps() {
  const today = new Date(); const todayStr = toDateStr(today);
  const weekStart = startOfWeek(today); const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const weekDays = [];
  for (let i = 0; i < 7; i++) { const d = new Date(weekStart); d.setDate(d.getDate()+i); weekDays.push({ date: d, str: toDateStr(d) }); }
  const allPosts = filteredPosts();
  const activeBrands = S.brandFilter === 'all' ? S.brands : S.brands.filter(b => b.slug === S.brandFilter);
  const gaps = [];
  activeBrands.forEach(brand => {
    const brandPosts = allPosts.filter(p => p.brand_id === brand.id);
    weekDays.forEach(day => { if (day.str < todayStr) return; if (brandPosts.filter(p => p.scheduled_date === day.str).length === 0) gaps.push({ brand, day }); });
  });
  return gaps;
}

function renderNavBadges() {
  const reviewCount = filteredPosts().filter(p => p.status === 'pending_approval').length;
  const gapCount = computeWeekGaps().length;
  const pb = document.getElementById('badge-pipeline');
  if (pb) { pb.textContent = reviewCount; pb.hidden = reviewCount === 0; }
  const bb = document.getElementById('badge-briefing');
  if (bb) { bb.textContent = gapCount; bb.hidden = gapCount === 0; }
}

function renderBriefing() {

  const totalReach = postedWithMetrics.reduce((s,x) => s + (x.m.reach||0), 0);

    Object.values(gapsByDay).forEach(g => {
      const brandNames = g.brands.map(b => `<span style="color:${b.color||'var(--accent)'}">${b.logo_emoji||''} ${b.name.split(' ')[0]}</span>`).join(', ');
      html += `<div class="briefing-gap-row"><div class="briefing-gap-icon">&#128197;</div><div class="briefing-gap-text"><strong>${g.day.dow} ${MONTH_NAMES[new Date(g.day.date).getMonth()].slice(0,3)} ${g.day.dom}</strong> — no posts for ${brandNames}</div><button class="briefing-gap-add" onclick="openPostModal(null,'${g.day.str}')">+ Add</button></div>`;
    });
  }
  html += `</div></div>`;

  // Recent Performance
  html += `<div class="briefing-section"><div class="briefing-section-header"><div class="briefing-section-icon" style="background:rgba(16,185,129,.1);color:var(--st-posted)">&#128200;</div><div class="briefing-section-title">Recent Performance</div></div><div class="briefing-section-body">`;
  if (postedWithMetrics.length === 0) {
    html += `<div class="briefing-empty">No performance data yet. Log metrics on posted content.</div>`;
  } else {
    html += `<div style="display:flex;gap:16px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--surface-border)"><div style="font-size:12px;color:var(--ink-3)">Reach <strong style="color:var(--ink-1)">${fmtNum(totalReach)}</strong></div><div style="font-size:12px;color:var(--ink-3)">Likes <strong style="color:var(--ink-1)">${fmtNum(totalLikes)}</strong></div><div style="font-size:12px;color:var(--ink-3)">Avg Eng <strong style="color:var(--ink-1)">${avgEng}%</strong></div></div>`;
    postedWithMetrics.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      html += `<div class="briefing-perf-row"><div class="briefing-perf-thumb" style="background:${brandBg(br)};color:${br?br.color:'var(--accent)'}">${br?br.logo_emoji||'&#128202;':'&#128202;'}</div><div class="briefing-perf-info"><div class="briefing-perf-title">${escHtml(p.title)}</div><div class="briefing-perf-stats">${plats.length?`<span style="color:${PLAT_HEX[plats[0].name]||'var(--ink-3)'}">${plats[0].name}</span>`:''}<span class="briefing-perf-stat">&#128065; <span class="val">${fmtNum(p.m.reach||0)}</span></span><span class="briefing-perf-stat">&#10084;&#65039; <span class="val">${fmtNum(p.m.likes||0)}</span></span><span class="briefing-perf-stat">&#128172; <span class="val">${fmtNum(p.m.comments||0)}</span></span>${p.m.engagement_rate?`<span class="briefing-perf-stat">&#128200; <span class="val">${parseFloat(p.m.engagement_rate).toFixed(1)}%</span></span>`:''}</div></div></div>`;
    });
  }
  html += `</div></div></div></div>`;
  document.getElementById('main-view').innerHTML = html;
  document.querySelectorAll('.briefing-post-row').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

function renderCalendarView() {
  const wrap = document.getElementById('main-view');
  let html = `<div class="v-header"><div class="v-header-row" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><div><h1>Content Calendar</h1><p class="v-sub">Plan and schedule content across brands and platforms</p></div><button class="btn btn-primary btn-sm" onclick="openPostModal()">&#43; New Post</button><button class="btn btn-ghost btn-sm" id="feed-preview-btn">&#128241; Feed Preview</button></div></div><div class="v-body"><div class="tab-bar" id="cal-view-tabs"><button class="tab-btn ${S.calView==='month'?'active':''}" data-calview="month">Monthly</button><button class="tab-btn ${S.calView==='week'?'active':''}" data-calview="week">Weekly</button><button class="tab-btn ${S.calView==='list'?'active':''}" data-calview="list">List</button></div><div class="cal-filter-row" id="cal-filter-row" style="display:flex;align-items:center;flex-wrap:wrap;gap:6px"></div><div id="cal-body"></div></div>`;
  wrap.innerHTML = html;
  document.getElementById('cal-view-tabs').addEventListener('click', e => { const btn = e.target.closest('.tab-btn'); if (!btn) return; S.calView = btn.dataset.calview; renderCalendarView(); });
  document.getElementById('feed-preview-btn').onclick = openFeedPreviewModal;
  renderCalFilterPills();
  if (S.calView === 'month') renderCalendarMonth(); else if (S.calView === 'week') renderCalendarWeek(); else renderCalendarList();
}

function renderCalFilterPills() {
  const c = document.getElementById('cal-filter-row'); if (!c) return;
  const isActive = (name) => S.calPlatformFilter === 'all' || S.calPlatformFilter.includes(name);
  let h = `<button class="cal-filter-pill ${S.calPlatformFilter==='all'?'active':''}" data-plat="all">&#127760; All</button>`;
  S.platforms.forEach(p => { h += `<button class="cal-filter-pill ${isActive(p.name)?'active':''}" data-plat="${escAttr(p.name)}"><span class="cal-filter-dot" style="background:${PLAT_HEX[p.name]||'#6366f1'}"></span>${escHtml(p.name)}</button>`; });
  h += `<button class="cal-events-toggle ${S.calShowEvents?'active':''}" id="cal-events-toggle"><span class="dot"></span>${S.calShowEvents?'Events shown':'Show events'}</button>`;
  c.innerHTML = h;
  c.querySelectorAll('.cal-filter-pill').forEach(btn => {
    btn.onclick = () => {
      const plat = btn.dataset.plat;
      if (plat === 'all') { S.calPlatformFilter = 'all'; }
      else {
        let current = S.calPlatformFilter === 'all' ? S.platforms.map(p=>p.name) : [...S.calPlatformFilter];
        if (current.includes(plat)) current = current.filter(n => n !== plat); else current.push(plat);
        S.calPlatformFilter = current.length === S.platforms.length ? 'all' : current;
      }
      renderCalFilterPills();
      if (S.calView === 'month') renderCalendarMonth(); else if (S.calView === 'week') renderCalendarWeek(); else renderCalendarList();
    };
  });
  const evtToggle = document.getElementById('cal-events-toggle');
  if (evtToggle) evtToggle.onclick = () => { S.calShowEvents = !S.calShowEvents; renderCalFilterPills(); if (S.calView === 'month') renderCalendarMonth(); else if (S.calView === 'week') renderCalendarWeek(); };
}

function applyCalPlatformFilter(posts) {
  if (S.calPlatformFilter === 'all') return posts;
  return posts.filter(p => {
    const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
    if (pids.length === 0) return true;
    return pids.some(id => { const pl = platById(id); return pl && S.calPlatformFilter.includes(pl.name); });
  });
}

function renderCalendarMonth() {
  const posts = applyCalPlatformFilter(filteredPosts()); const y = S.calYear, m = S.calMonth;
  const first = new Date(y, m, 1); const last = new Date(y, m+1, 0);
  const startDow = first.getDay(); const daysInMonth = last.getDate();
  const today = new Date(); const todayStr = toDateStr(today);
  const byDate = {}; posts.forEach(p => { if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); } });
  const holidayMap = S.calShowEvents ? holidaysByDate(y) : {};
  let html = `<div class="cal-nav"><button class="cal-nav-btn" id="cal-prev">&#8249;</button><span class="cal-month-label">${MONTH_NAMES[m]} ${y}</span><button class="cal-nav-btn" id="cal-next">&#8250;</button><button class="cal-today-btn" id="cal-today">Today</button></div><div class="cal-grid">`;
  DOW_SHORT.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) html += `<div class="cal-day outside"><div class="cal-day-num">${prevLast - i}</div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr; const dayPosts = byDate[dateStr] || [];
    const holiday = holidayMap[dateStr];
    html += `<div class="cal-day${isToday?' today':''}" data-date="${dateStr}"><div class="cal-day-num-row"><div class="cal-day-num">${d}</div>${dayPosts.length?`<span class="cal-day-count">${dayPosts.length}</span>`:''}</div>`;
    if (holiday) html += `<span class="cal-event-chip ${holiday.type}" title="${escAttr(holiday.name)}">${escHtml(holiday.name)}</span>`;
    dayPosts.slice(0, 4).forEach(p => {
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []); const plats = pids.map(id=>platById(id)).filter(Boolean);
      const tier = p.status === 'posted' ? engagementTier(p) : null;
      html += `<div class="cal-post-row" data-post-id="${p.id}" title="${escAttr(p.title)}">${plats.length?plats.map(pl=>`<span class="cal-plat-dot" style="background:${PLAT_HEX[pl.name]||'#6366f1'}"></span>`).join(''):`<span class="cal-plat-dot" style="background:#6366f1"></span>`} ${escHtml(p.title.substring(0,16))}${tier?`<span class="cal-eng-dot ${tier}" title="${tier} engagement"></span>`:''}</div>`;
    });
    if (dayPosts.length > 4) html += `<div class="cal-overflow">+${dayPosts.length-4} more</div>`;
    html += `</div>`;
  }
  const totalCells = startDow + daysInMonth; const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="cal-day outside"><div class="cal-day-num">${i}</div></div>`;
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.getElementById('cal-prev').onclick = () => { S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} renderCalendarMonth(); };
  document.getElementById('cal-next').onclick = () => { S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} renderCalendarMonth(); };
  document.getElementById('cal-today').onclick = () => { S.calMonth=today.getMonth(); S.calYear=today.getFullYear(); renderCalendarMonth(); };
  document.querySelectorAll('.cal-post-row').forEach(el => { el.onclick = (e) => { e.stopPropagation(); openPostModal(el.dataset.postId); }; });
  document.querySelectorAll('.cal-day:not(.outside)').forEach(el => { el.onclick = () => { openPostModal(null, el.dataset.date); }; });
  wireCalendarDragDrop('month');
}

function renderCalendarWeek() {
  const posts = applyCalPlatformFilter(filteredPosts()); const start = new Date(S.weekAnchor); const days = [];
  for (let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  const end = days[6]; const todayStr = toDateStr(new Date());
  const byDate = {}; posts.forEach(p => { if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); } });
  const holidayMap = S.calShowEvents ? holidaysByDate(start.getFullYear()) : {};
  let html = `<div class="cal-nav"><button class="cal-nav-btn" id="week-prev">&#8249;</button><span class="cal-month-label">${MONTH_NAMES[start.getMonth()]} ${start.getDate()} – ${MONTH_NAMES[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}</span><button class="cal-nav-btn" id="week-next">&#8250;</button><button class="cal-today-btn" id="week-today">Today</button></div><div class="week-grid">`;
  days.forEach(d => {
    const dateStr = toDateStr(d); const dayPosts = (byDate[dateStr]||[]).sort((a,b)=>(a.scheduled_time||'').localeCompare(b.scheduled_time||''));
    const holiday = holidayMap[dateStr];
    html += `<div class="week-col${dateStr===todayStr?' today':''}" data-date="${dateStr}" style="cursor:pointer"><div class="week-col-head"><div class="week-col-dow">${DOW_SHORT[d.getDay()]}</div><div class="week-col-num">${d.getDate()}</div></div>`;
    if (holiday) html += `<span class="cal-event-chip ${holiday.type}" style="margin-bottom:8px" title="${escAttr(holiday.name)}">${escHtml(holiday.name)}</span>`;
    if (dayPosts.length === 0) { html += `<div class="week-empty">No posts</div>`; }
    else { dayPosts.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      const tier = p.status === 'posted' ? engagementTier(p) : null;
      html += `<div class="week-card" data-post-id="${p.id}">${p.scheduled_time?`<div class="week-card-time">${fmtTime(p.scheduled_time)}</div>`:''}<div class="week-card-title">${escHtml(p.title)}</div><div class="week-card-badges">${plats.length?plats.map(pl=>`<span class="week-card-plat" style="background:${PLAT_HEX[pl.name]||'#6366f1'}" title="${escAttr(pl.name)}"></span>`).join(''):''} ${br?`<span style="font-size:10px;color:var(--ink-3)">${escHtml(br.name.split(' ')[0])}</span>`:''}<span class="week-card-status" style="background:${meta.color};color:#fff;margin-left:auto">${meta.label}</span>${tier?`<span class="cal-eng-dot ${tier}" title="${tier} engagement"></span>`:''}</div></div>`;
    }); }
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.getElementById('week-prev').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()-7); renderCalendarWeek(); };
  document.getElementById('week-next').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()+7); renderCalendarWeek(); };
  document.getElementById('week-today').onclick = () => { S.weekAnchor = startOfWeek(new Date()); renderCalendarWeek(); };
  document.querySelectorAll('.week-card').forEach(el => { el.onclick = (e) => { e.stopPropagation(); openPostModal(el.dataset.postId); }; });
  document.querySelectorAll('.week-col').forEach(el => {
    el.onclick = (e) => { if (!e.target.closest('.week-card')) openPostModal(null, el.dataset.date); };
  });
  wireCalendarDragDrop('week');
}

function renderCalendarList() {
  const posts = applyCalPlatformFilter(filteredPosts()); const today = toDateStr(new Date());
  const horizon = new Date(); horizon.setDate(horizon.getDate()+30); const horizonStr = toDateStr(horizon);
  let upcoming = posts.filter(p => p.scheduled_date && p.scheduled_date >= today && p.scheduled_date <= horizonStr);
  const { key, dir } = S.listSort;
  upcoming = [...upcoming].sort((a,b) => {
    let av, bv;
    if (key==='title') { av=a.title||''; bv=b.title||''; }
    else if (key==='brand') { av=(brandById(a.brand_id)||{}).name||''; bv=(brandById(b.brand_id)||{}).name||''; }
    else if (key==='platform') { av=(platById(a.platform_id)||{}).name||''; bv=(platById(b.platform_id)||{}).name||''; }
    else if (key==='status') { av=a.status||''; bv=b.status||''; }
    else { av=(a.scheduled_date||'')+(a.scheduled_time||''); bv=(b.scheduled_date||'')+(b.scheduled_time||''); }
    return dir==='asc' ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
  });
  const cols = [['scheduled_date','Date'],['scheduled_time','Time'],['title','Title'],['brand','Brand'],['platform','Platform'],['pillar','Pillar'],['status','Status'],['brief','Brief']];
  let html = `<div class="list-table-wrap">`;
  if (upcoming.length === 0) { html += emptyState('&#128197;', 'No posts scheduled in the next 30 days.'); }
  else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead>`;
    html += bulkActionsTableHeadHtml(cols);
    html += `</thead><tbody>`;
    upcoming.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean); const pil = pillarById(p.content_pillar_id);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      html += `<tr class="list-row" data-post-id="${p.id}" style="cursor:pointer">${bulkActionsRowCheckboxHtml(p)}<td>${fmtDate(p.scheduled_date)}</td><td>${p.scheduled_time?fmtTime(p.scheduled_time):(p.scheduled_date?fmtTime('09:00'):'—')}</td><td style="font-weight:500;color:var(--ink-1)">${escHtml(p.title)}</td><td>${br?escHtml(br.name):'—'}</td><td>${plats.length?plats.map(pl=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PLAT_HEX[pl.name]||'#6366f1'};margin-right:4px;vertical-align:middle"></span>`).join('')+plats.map(pl=>escHtml(pl.name)).join(', '):'—'}</td><td>${pil?escHtml(pil.name):'—'}</td><td><span class="list-status-badge" style="background:${meta.color}" data-post-id="${p.id}" onclick="event.stopPropagation();toggleStatusMenu(event,'${p.id}')">${meta.label}</span></td><td><button class="metrics-btn" onclick="event.stopPropagation();generateBrief('${p.id}')" title="Generate Brief">&#128203;</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.querySelectorAll('.list-th').forEach(el => { el.onclick = () => { const k = el.dataset.sortkey; if (S.listSort.key===k) S.listSort.dir = S.listSort.dir==='asc'?'desc':'asc'; else { S.listSort.key=k; S.listSort.dir='asc'; } renderCalendarList(); }; });
  document.querySelectorAll('.list-row').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
  wireBulkActions();
}

function renderPipeline() {
  const posts = filteredPosts();
  let html = `<div class="v-header"><div class="v-header-row" style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px"><div><h1>Content Pipeline</h1><p class="v-sub">Track posts through your workflow</p></div><button class="btn btn-primary btn-sm" onclick="openPostModal()">&#43; New Post</button></div></div><div class="v-body"><div class="pipeline-board">`;
  STATUS_ORDER.forEach(status => {
    const meta = STATUS_META[status]; const col = posts.filter(p => p.status === status);
    html += `<div class="pipeline-col" style="border-top-color:${meta.color}"><div class="pipeline-col-header"><span class="pipeline-col-title" style="color:${meta.color}">${meta.label}</span><span class="pipeline-col-count">${col.length}</span></div>`;
    if (col.length === 0) html += `<div style="text-align:center;padding:20px 0;color:var(--ink-3);font-size:12px">No posts</div>`;
    col.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean); const pil = pillarById(p.content_pillar_id);
      html += `<div class="pipeline-card" data-post-id="${p.id}"><div class="pipeline-card-top"><span class="pipeline-card-brand" style="background:${brandBg(br)};color:${br?br.color:'var(--accent)'}">${br?br.name:'—'}</span><span class="pipeline-status-badge" style="background:${meta.color}" data-post-id="${p.id}" onclick="event.stopPropagation();togglePipelineStatusMenu(event,'${p.id}')">${meta.label}</span><span class="pipeline-drag-handle">&#8942;&#8942;</span></div><div class="pipeline-card-title">${p.media_type?`<span class="pipeline-media-icon">${MEDIA_ICONS[p.media_type]||''}</span>`:''} ${pil?`<span class="pipeline-pillar-dot" style="background:${pil.color||'var(--accent)'}"></span>`:''} ${escHtml(p.title)}</div><div class="pipeline-card-meta">${plats.length?plats.map(pl=>`<span class="pipeline-plat-dot" style="background:${PLAT_HEX[pl.name]||'#6366f1'}" title="${escAttr(pl.name)}"></span>`).join('')+`<span style="font-size:11px;color:var(--ink-3)">${plats.map(pl=>pl.name).join(', ')}</span>`:''} ${p.scheduled_date?`<span class="pipeline-card-date">${fmtDate(p.scheduled_date)}</span>`:''}</div><div style="display:flex;gap:4px;margin-top:4px"><button class="metrics-btn" onclick="event.stopPropagation();generateBrief('${p.id}')" title="Generate Brief">&#128203; Brief</button>${status==='posted'&&!metricsForPost(p.id)?`<button class="metrics-btn" onclick="event.stopPropagation();openMetricsModal('${p.id}')">Log Metrics</button>`:''}</div></div>`;
    });
    if (status === 'idea') html += `<button class="pipeline-quick-add" id="pipeline-quick-add">+ Quick Add Idea</button>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('main-view').innerHTML = html;
  document.querySelectorAll('.pipeline-card').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
  const qa = document.getElementById('pipeline-quick-add'); if (qa) qa.onclick = () => openPostModal(null, null, true);
}

function closeAllPipelineMenus() { document.querySelectorAll('.pipeline-status-menu').forEach(m => m.remove()); }

// Generic inline status-change dropdown — used by Pipeline kanban cards AND
// List view rows. Attach to any clickable badge with data-post-id.
function toggleStatusMenu(e, postId) {
  e.stopPropagation();
  const badge = e.currentTarget;
  const existing = badge.querySelector('.pipeline-status-menu');
  closeAllPipelineMenus();
  if (existing) return; // was already open — this click just closes it
  const menu = document.createElement('div');
  menu.className = 'pipeline-status-menu';
  menu.innerHTML = STATUS_ORDER.map(s => `<div class="tb-dropdown-item" data-status="${s}">${STATUS_META[s].label}</div>`).join('');
  menu.querySelectorAll('.tb-dropdown-item').forEach(item => {
    item.onclick = (ev) => { ev.stopPropagation(); updatePostStatus(postId, item.dataset.status); };
  });
  badge.appendChild(menu);
}
const togglePipelineStatusMenu = toggleStatusMenu; // back-compat alias for existing pipeline card markup
document.addEventListener('click', closeAllPipelineMenus);

async function updatePostStatus(postId, status) {
  closeAllPipelineMenus();
  try {
    const data = { status };
    if (status === 'posted') data.posted_at = new Date().toISOString();
    await sb.from('sm_posts').update(data).eq('id', postId);
    await loadAll(); render();
    showToast('Status updated to ' + (STATUS_META[status] ? STATUS_META[status].label : status), 'success');
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

function renderAnalytics() {

  let html = `<div class="v-header"><div class="v-header-row"><div><h1>Analytics</h1><p class="v-sub">Track performance across platforms and brands</p></div><div style="display:flex;align-items:center;gap:8px"><button class="btn btn-primary btn-sm" id="report-gen-btn">&#128203; Generate Report</button><div class="tb-dropdown" id="date-range-dropdown"><button class="tb-dropdown-btn" id="date-range-btn">&#128197; ${DATE_RANGE_LABELS[S.dateRange]} &#9662;</button><div class="tb-dropdown-menu" id="date-range-menu">${Object.entries(DATE_RANGE_LABELS).map(([k,label])=>`<div class="tb-dropdown-item ${S.dateRange===k?'active':''}" data-range="${k}">${label}</div>`).join('')}</div></div></div></div></div><div class="v-body">`;

function renderAnalyticsContent() {
  const el = document.getElementById('analytics-content'); if (!el) return;

function analyticsOverviewHtml() {
  const posts = filteredPosts(); const posted = posts.filter(p => p.status === 'posted');
  const withMetrics = posted.map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m);
  const totalPosts = posted.length;
  const totalReach = withMetrics.reduce((s,x) => s + (x.m.reach||0), 0);
  const totalFollowers = withMetrics.reduce((s,x) => s + (x.m.followers_gained||0), 0);
  const avgEngagement = withMetrics.length > 0 ? (withMetrics.reduce((s,x) => s + parseFloat(x.m.engagement_rate||0), 0) / withMetrics.length).toFixed(1) : '0.0';
  const chrono = [...withMetrics].sort((a,b) => (a.scheduled_date||'').localeCompare(b.scheduled_date||''));
  const reachSeries = chrono.map(x => x.m.reach||0);
  const engSeries = chrono.map(x => parseFloat(x.m.engagement_rate||0));
  const followersSeries = chrono.map(x => x.m.followers_gained||0);
  const postsCountSeries = bucketCounts(posted.map(p=>p.scheduled_date).filter(Boolean));

  let html = `<div class="kpi-row">${kpiCard('Total Posts', totalPosts, `${posts.filter(p=>p.status==='scheduled').length} scheduled`, postsCountSeries, '#6366f1')}${kpiCard('Avg Engagement', avgEngagement+'%', `${withMetrics.length} posts with metrics`, engSeries, '#22c55e')}${kpiCard('Total Reach', fmtNum(totalReach), 'Across all platforms', reachSeries, '#0ea5e9')}${kpiCard('Followers Gained', '+'+fmtNum(totalFollowers), 'Net new followers', followersSeries, '#f59e0b')}</div>`;

  const platStats = {}; S.platforms.forEach(p => { platStats[p.id] = { name:p.name, posts:0, reach:0, engagement:0, count:0 }; });
  posted.forEach(p => { const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []); pids.forEach(pid => { if(platStats[pid]) platStats[pid].posts++; }); });
  withMetrics.forEach(x => { const xpids = x.platform_ids || (x.platform_id ? [x.platform_id] : []); xpids.forEach(pid => { if(platStats[pid]) { platStats[pid].reach += (x.m.reach||0); platStats[pid].engagement += parseFloat(x.m.engagement_rate||0); platStats[pid].count++; } }); });
  const platArr = Object.values(platStats);
  const mediaTypeCounts = {}; posts.forEach(p => { const t = p.media_type || 'unspecified'; mediaTypeCounts[t] = (mediaTypeCounts[t]||0)+1; });
  const donutData = Object.entries(mediaTypeCounts).map(([k,v],i) => ({ label:k, value:v, color: CHART_PALETTE[i%CHART_PALETTE.length] }));

  html += `<div class="charts-row"><div class="chart-card"><div class="chart-title">Platform Comparison (Reach)</div>${drawGroupedBarChart(platArr.map(p => ({ label:p.name, value:p.reach, color: PLAT_HEX[p.name]||'#6366f1' })))}</div><div class="chart-card"><div class="chart-title">Content Type Mix</div>${donutData.length <= 1 ? `<div style="padding:20px 0;text-align:center;font-size:13px;color:var(--ink-3)">All ${posts.length} posts are <strong style="color:var(--ink-1)">${donutData[0]?.label || 'unspecified'}</strong> content. Mix will show once you use multiple types.</div>` : drawDonut(donutData)}</div></div>`;
  html += `<div class="charts-row"><div class="chart-card" style="grid-column:1/-1"><div class="chart-title">Posting Schedule Distribution</div>${drawHeatmap(posts)}</div></div>`;
  html += `<div class="chart-card" style="margin-bottom:20px"><div class="chart-title">Pipeline Fullness — Posts by Status</div>${drawStatusStackedBar(posts)}</div>`;

  const sorted = [...withMetrics].sort((a,b) => (b.m.reach||0) - (a.m.reach||0)).slice(0,10);
  html += `<div class="data-table-wrap"><div class="data-table-title">Top Performing Posts</div>`;
  if (sorted.length === 0) html += `<div style="padding:30px;text-align:center;color:var(--ink-3);font-size:13px">No posts with metrics yet.</div>`;
  else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>#</th><th>Post</th><th>Brand</th><th>Platform</th><th>Reach</th><th>Eng. Rate</th><th>Likes</th><th>Comments</th><th>Shares</th></tr></thead><tbody>`;
    sorted.forEach((x,i) => {
      const br = brandById(x.brand_id); const xpids = x.platform_ids || (x.platform_id ? [x.platform_id] : []);

      html += `<tr><td><span class="rank-badge">${i+1}</span></td><td style="font-weight:500;color:var(--ink-1)">${escHtml(x.title)}</td><td>${br?br.name:'—'}</td><td>${xplats.length?xplats.map(pl=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PLAT_HEX[pl.name]||'#6366f1'};margin-right:4px;vertical-align:middle"></span>`).join('')+xplats.map(pl=>pl.name).join(', '):'—'}</td><td>${fmtNum(x.m.reach)}</td><td>${x.m.engagement_rate}%</td><td>${fmtNum(x.m.likes)}</td><td>${fmtNum(x.m.comments)}</td><td>${fmtNum(x.m.shares)}</td></tr>`;

function analyticsPlatformHtml(platformName) {
  const platColor = PLAT_COLORS[platformName] || 'var(--accent)';
  const plat = S.platforms.find(p => p.name === platformName);
  const posts = filteredPosts();
  const platPosts = posts.filter(p => (p.platform_ids || (p.platform_id?[p.platform_id]:[])).some(id => plat && id === plat.id));
  const platPosted = platPosts.filter(p => p.status === 'posted');
  const withMetrics = platPosted.map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m);
  const followersGained = withMetrics.reduce((s,x) => s + (x.m.followers_gained||0), 0);
  const avgEng = withMetrics.length ? (withMetrics.reduce((s,x)=>s+parseFloat(x.m.engagement_rate||0),0)/withMetrics.length).toFixed(1) : '0.0';
  const avgLikes = withMetrics.length ? Math.round(withMetrics.reduce((s,x)=>s+(x.m.likes||0),0)/withMetrics.length) : 0;
  const avgComments = withMetrics.length ? Math.round(withMetrics.reduce((s,x)=>s+(x.m.comments||0),0)/withMetrics.length) : 0;

  let html = `<div class="kpi-row" style="margin-top:4px">`;
  html += `<div class="kpi-card" style="border-top-color:${platColor}"><div class="kpi-label">Followers Gained</div><div class="kpi-value">+${fmtNum(followersGained)}</div><div class="kpi-sub">${platformName} · net new</div></div>`;
  html += `<div class="kpi-card" style="border-top-color:${platColor}"><div class="kpi-label">Engagement Rate</div><div class="kpi-value">${avgEng}%</div><div class="kpi-sub">avg across ${withMetrics.length} posts</div></div>`;
  html += `<div class="kpi-card" style="border-top-color:${platColor}"><div class="kpi-label">Avg Likes</div><div class="kpi-value">${fmtNum(avgLikes)}</div><div class="kpi-sub">per published post</div></div>`;
  html += `<div class="kpi-card" style="border-top-color:${platColor}"><div class="kpi-label">Avg Comments</div><div class="kpi-value">${fmtNum(avgComments)}</div><div class="kpi-sub">per published post</div></div>`;
  html += `</div>`;

  // Content type performance for this platform
  const typeStats = {};
  withMetrics.forEach(x => { const t = x.media_type || 'unspecified'; if (!typeStats[t]) typeStats[t] = { sum:0, count:0 }; typeStats[t].sum += parseFloat(x.m.engagement_rate||0); typeStats[t].count++; });
  const typeData = Object.entries(typeStats).map(([k,v]) => ({ label: k.charAt(0).toUpperCase()+k.slice(1), value: +(v.sum/v.count).toFixed(2), color: platColor.startsWith('var')?PLAT_HEX[platformName]:platColor }));

  html += `<div class="charts-row"><div class="chart-card" style="border-left-color:${platColor}"><div class="chart-title">Content Type Performance (avg engagement %)</div>${typeData.length?drawGroupedBarChart(typeData):`<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">No ${platformName} metrics logged yet.</div>`}</div><div class="chart-card" style="border-left-color:${platColor}"><div class="chart-title">${platformName} Posting Times</div>${drawHeatmap(platPosts)}</div></div>`;

  // Top posts for this platform
  const sorted = [...withMetrics].sort((a,b)=>(b.m.reach||0)-(a.m.reach||0)).slice(0,10);
  html += `<div class="data-table-wrap"><div class="data-table-title" style="color:${platColor}">Top ${platformName} Posts</div>`;
  if (sorted.length === 0) html += `<div style="padding:30px;text-align:center;color:var(--ink-3);font-size:13px">No ${platformName} posts with metrics yet.</div>`;
  else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>#</th><th>Post</th><th>Brand</th><th>Reach</th><th>Eng. Rate</th><th>Likes</th><th>Comments</th><th>Shares</th></tr></thead><tbody>`;
    sorted.forEach((x,i) => { const br = brandById(x.brand_id); html += `<tr><td><span class="rank-badge">${i+1}</span></td><td style="font-weight:500;color:var(--ink-1)">${escHtml(x.title)}</td><td>${br?br.name:'—'}</td><td>${fmtNum(x.m.reach)}</td><td>${x.m.engagement_rate}%</td><td>${fmtNum(x.m.likes)}</td><td>${fmtNum(x.m.comments)}</td><td>${fmtNum(x.m.shares)}</td></tr>`; });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  return html;
}

// ── Chart Helpers ──
function bucketCounts(dates) { const sorted = [...dates].sort(); const counts = {}; sorted.forEach(d => { counts[d]=(counts[d]||0)+1; }); return Object.values(counts).slice(-12); }

function kpiCard(label, value, sub, series, color) {
  const trend = trendFromSeries(series);
  return `<div class="kpi-card"><div class="kpi-top"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div><div class="kpi-trend ${trend.dir}">${trend.arrow} ${trend.pct}</div></div><div class="kpi-spark">${drawSparkline(series, color)}</div><div class="kpi-sub">${sub}</div></div>`;
}

function trendFromSeries(series) {
  if (!series || series.length < 3) return { dir:'flat', arrow:'—', pct:'—' };
  const half = Math.max(1, Math.floor(series.length/2));
  const first = series.slice(0, half).reduce((a,b)=>a+b,0) / half;
  const last = series.slice(-half).reduce((a,b)=>a+b,0) / half;
  if (first === 0 && last === 0) return { dir:'flat', arrow:'—', pct:'No data' };
  const pct = first === 0 ? 100 : ((last-first)/Math.abs(first))*100;
  if (Math.abs(pct) < 1) return { dir:'flat', arrow:'—', pct:'0%' };
  return pct > 0 ? { dir:'up', arrow:'&#9650;', pct: Math.abs(pct).toFixed(0)+'%' } : { dir:'down', arrow:'&#9660;', pct: Math.abs(pct).toFixed(0)+'%' };
}

function drawSparkline(values, color) {
  if (!values || values.length === 0) return `<svg viewBox="0 0 100 34" style="width:100%;height:34px;display:block"></svg>`;
  const W=100,H=34,pad=3; const max = Math.max(...values, 0.0001); const min = Math.min(...values, 0); const range = (max-min)||1;
  const stepX = values.length>1 ? (W-pad*2)/(values.length-1) : 0;
  const pts = values.map((v,i) => [pad+i*stepX, H-pad-((v-min)/range)*(H-pad*2)]);
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${H-pad} L${pts[0][0].toFixed(1)},${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:34px;display:block"><path class="spark-area" d="${area}" fill="${color}" opacity="0.12"/><path class="spark-line" pathLength="1" d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1"/></svg>`;
}

function drawGroupedBarChart(data) {
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const W = 520, H = 40, barH = 26, labelW = 160;
  let svg = `<svg viewBox="0 0 ${W} ${data.length*H}" style="width:100%;display:block">`;
  data.forEach((d,i) => {
    const y = i*H + (H-barH)/2; const barArea = W - labelW - 50; const w = maxVal > 0 ? (d.value/maxVal) * barArea : 0;
    svg += `<text x="0" y="${y+barH/2+4}" font-size="12" font-weight="600" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${escHtml(d.label)}</text>`;
    svg += `<rect x="${labelW}" y="${y}" width="${barArea}" height="${barH}" rx="4" fill="var(--chart-grid)"/>`;
    svg += `<rect class="chart-bar-fill" x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="4" fill="${d.color}" opacity="0.88" style="transform-origin:${labelW}px ${(y+barH/2).toFixed(1)}px;animation-delay:${(i*0.06).toFixed(2)}s"/>`;
    svg += `<text x="${labelW+w+8}" y="${y+barH/2+4}" font-size="11" font-weight="700" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${fmtNum(d.value)}</text>`;
  });
  svg += `</svg>`; return svg;
}

function drawDonut(data) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total === 0) return `<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">No data yet</div>`;
  const cx=90, cy=90, r=70, ir=42; let angle = -Math.PI/2; let paths = ''; let idx = 0;
  data.forEach(d => {
    const frac = d.value/total; const sweep = frac*Math.PI*2;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle), x2 = cx+r*Math.cos(angle+sweep), y2 = cy+r*Math.sin(angle+sweep);
    const ix1 = cx+ir*Math.cos(angle), iy1 = cy+ir*Math.sin(angle), ix2 = cx+ir*Math.cos(angle+sweep), iy2 = cy+ir*Math.sin(angle+sweep);
    const large = sweep > Math.PI ? 1 : 0;
    paths += `<path class="donut-seg" style="animation-delay:${(idx*0.08).toFixed(2)}s" d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ir},${ir} 0 ${large} 0 ${ix1.toFixed(2)},${iy1.toFixed(2)} Z" fill="${d.color}" opacity="0.9"/>`;
    angle += sweep; idx++;
  });
  let legend = `<div class="chart-legend">`; data.forEach(d => { legend += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${d.color}"></span>${escHtml(d.label)} (${d.value})</div>`; }); legend += `</div>`;
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0">${paths}<text x="90" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink-1)" font-family="Outfit,sans-serif">${total}</text><text x="90" y="104" text-anchor="middle" font-size="10" fill="var(--chart-text)" font-family="DM Sans,sans-serif">posts</text></svg><div style="flex:1;min-width:150px">${legend}</div></div>`;
}

function drawHeatmap(posts) {
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  posts.forEach(p => { if (!p.scheduled_date) return; const d = new Date(p.scheduled_date+'T00:00:00'); let dow = d.getDay(); dow = dow===0?6:dow-1; let hour = 12; if (p.scheduled_time) { const parts = p.scheduled_time.split(':'); hour = parseInt(parts[0])||0; } grid[dow][hour]++; });
  const max = Math.max(...grid.flat(), 1); const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = `<div class="heatmap-wrap"><div class="heatmap-grid"><div></div>`;
  for (let h=0; h<24; h++) html += `<div class="heatmap-hour-label">${h%3===0?h:''}</div>`;
  for (let d=0; d<7; d++) {
    html += `<div class="heatmap-dow-label">${dowLabels[d]}</div>`;
    for (let h=0; h<24; h++) { const v = grid[d][h]; const alpha = v===0?0.06:0.15+(v/max)*0.85; html += `<div class="heatmap-cell" data-dow="${dowLabels[d]}" data-hour="${h}" data-val="${v}" style="background:rgba(var(--accent-rgb),${alpha.toFixed(2)})"></div>`; }
  }
  html += `</div></div><div class="heatmap-legend"><span>Fewer posts</span><span class="heatmap-legend-bar"></span><span>More posts</span></div>`; return html;
}

function initHeatmapTooltips() {
  let tip = document.getElementById('heatmap-tooltip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'heatmap-tooltip'; document.body.appendChild(tip); }
  document.querySelectorAll('.heatmap-cell').forEach(cell => {
    cell.addEventListener('mouseenter', (e) => {
      const { dow, hour, val } = e.currentTarget.dataset;
      tip.textContent = `${dow} ${hour}:00 — ${val} post${val==='1'?'':'s'}`;
      tip.classList.add('show');
    });

function drawStatusStackedBar(posts) {

function ourBrandStats() {
  const allPosts = S.posts;
  const posted = allPosts.filter(p => p.status === 'posted');
  const withMetrics = posted.map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m);
  const avgEngagement = withMetrics.length ? +(withMetrics.reduce((s,x)=>s+parseFloat(x.m.engagement_rate||0),0)/withMetrics.length).toFixed(1) : 0;
  const ninetyAgo = new Date(); ninetyAgo.setDate(ninetyAgo.getDate()-90); const ninetyAgoStr = toDateStr(ninetyAgo);
  const recentAll = allPosts.filter(p => p.scheduled_date && p.scheduled_date >= ninetyAgoStr);
  const postsPerWeek = +((recentAll.length / 13) || 0).toFixed(1);
  return { name: 'Sonaya Group (Us)', postsPerWeek, avgEngagement };
}

  });

async function testAllConnections() {
  const state = loadApiConnections();
  const keys = Object.keys(state.platforms||{}).filter(k => state.platforms[k]?.connected);
  if (state.drive?.connected) keys.push('drive');
  if (keys.length === 0) { showToast('No connections to test', 'info'); return; }
  showToast(`Testing ${keys.length} connection${keys.length>1?'s':''}...`, 'info');

  const results = [];
  for (const key of keys) {
    if (key === 'drive') {
      // Drive: check if we have valid OAuth
      const driveOk = !!(state.drive?.access_token || state.drive?.connected);
      results.push({ name: 'Google Drive', ok: driveOk, msg: driveOk ? 'Connected' : 'Token missing' });
      continue;
    }
    const conn = state.platforms[key];
    try {
      if (key === 'youtube' && conn.api_key && conn.channel_id) {
        const resp = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id&id=${encodeURIComponent(conn.channel_id)}&key=${encodeURIComponent(conn.api_key)}`);
        results.push({ name: 'YouTube', ok: resp.ok, msg: resp.ok ? 'API responding' : `HTTP ${resp.status}` });
      } else if (key === 'instagram' && conn.user_access_token) {
        const resp = await fetch(`https://graph.facebook.com/v18.0/me?access_token=${encodeURIComponent(conn.user_access_token)}`);
        results.push({ name: 'Instagram', ok: resp.ok, msg: resp.ok ? 'Token valid' : 'Token expired or invalid' });
      } else if (key === 'facebook' && conn.user_access_token) {
        const resp = await fetch(`https://graph.facebook.com/v18.0/me?access_token=${encodeURIComponent(conn.user_access_token)}`);
        results.push({ name: 'Facebook', ok: resp.ok, msg: resp.ok ? 'Token valid' : 'Token expired or invalid' });
      } else if (key === 'tiktok') {
        results.push({ name: 'TikTok', ok: false, msg: 'Not connected' });
      } else {
        results.push({ name: key, ok: !!conn.connected, msg: conn.connected ? 'Credentials stored' : 'Not configured' });
      }
    } catch(e) {
      results.push({ name: key, ok: false, msg: e.message || 'Network error' });
    }
  }

  const passed = results.filter(r => r.ok);
  const failed = results.filter(r => !r.ok);
  if (failed.length === 0) {
    showToast(`All ${passed.length} connections OK`, 'success');
  } else if (passed.length === 0) {
    showToast(`All connections failed: ${failed.map(f=>f.name+' — '+f.msg).join('; ')}`, 'error');
  } else {
    showToast(`${passed.length} OK, ${failed.length} failed: ${failed.map(f=>f.name+' — '+f.msg).join('; ')}`, 'error');
  }
}

async function syncPlatform(key) {
  const state = loadApiConnections();
  if (!state.platforms[key]) return;
  // Real YouTube API sync
  if (key === 'youtube' && state.platforms.youtube.api_key && state.platforms.youtube.channel_id) {
    showToast('Syncing YouTube…', 'info');
    try {
      const apiKey = state.platforms.youtube.api_key;
      const channelId = state.platforms.youtube.channel_id;
      const url = `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${encodeURIComponent(channelId)}&key=${encodeURIComponent(apiKey)}`;
      const resp = await fetch(url);
      if (!resp.ok) { const err = await resp.json().catch(()=>({})); throw new Error(err.error?.message || resp.statusText); }
      const data = await resp.json();
      if (data.items && data.items.length > 0) {
        const ch = data.items[0];
        const stats = ch.statistics || {};
        const snippet = ch.snippet || {};
        state.platforms.youtube.channel_title = snippet.title || '';
        state.platforms.youtube.handle = snippet.customUrl ? snippet.customUrl.replace(/^@/,'') : (snippet.title||'').toLowerCase().replace(/\s+/g,'');
        state.platforms.youtube.subscribers = parseInt(stats.subscriberCount||'0').toLocaleString();
        state.platforms.youtube.followers = parseInt(stats.subscriberCount||'0').toLocaleString();
        state.platforms.youtube.video_count = parseInt(stats.videoCount||'0').toLocaleString();
        state.platforms.youtube.view_count = parseInt(stats.viewCount||'0').toLocaleString();
        state.platforms.youtube.thumbnail = snippet.thumbnails?.default?.url || '';
        state.platforms.youtube.last_sync = new Date().toISOString();
        saveApiConnections(state);
        showToast(`YouTube synced — ${snippet.title}`, 'success');
        renderConnections();
        return;
      } else {
        showToast('YouTube: Channel not found', 'error');
      }
    } catch(e) {
      showToast(`YouTube sync error: ${e.message}`, 'error');
    }
  }
  // Real Instagram API sync
  if (key === 'instagram' && state.platforms.instagram.user_access_token && state.platforms.instagram.ig_account_id) {
    showToast('Syncing Instagram…', 'info');
    try {
      const token = state.platforms.instagram.user_access_token;
      const igId = state.platforms.instagram.ig_account_id;
      // Get account info
      const acctResp = await fetch(`https://graph.facebook.com/v18.0/${igId}?fields=name,username,followers_count,media_count,profile_picture_url&access_token=${encodeURIComponent(token)}`);
      if (!acctResp.ok) { const err = await acctResp.json().catch(()=>({})); throw new Error(err.error?.message || acctResp.statusText); }
      const acct = await acctResp.json();
      // Get recent media
      const mediaResp = await fetch(`https://graph.facebook.com/v18.0/${igId}/media?fields=id,caption,timestamp,like_count,comments_count,media_type&limit=5&access_token=${encodeURIComponent(token)}`);
      const mediaData = await mediaResp.json();
      const recentPosts = mediaData.data || [];
      state.platforms.instagram.ig_name = acct.name || '';
      state.platforms.instagram.handle = acct.username || '';
      state.platforms.instagram.followers = (acct.followers_count||0).toLocaleString();
      state.platforms.instagram.media_count = (acct.media_count||0).toLocaleString();
      state.platforms.instagram.profile_pic = acct.profile_picture_url || '';
      state.platforms.instagram.recent_posts = recentPosts.length;
      state.platforms.instagram.last_post_date = recentPosts.length > 0 ? recentPosts[0].timestamp : null;
      state.platforms.instagram.last_sync = new Date().toISOString();
      saveApiConnections(state);
      showToast(`Instagram synced — @${acct.username} (${acct.followers_count} followers)`, 'success');
      renderConnections();
      return;
    } catch(e) {
      showToast(`Instagram sync error: ${e.message}`, 'error');
    }
  }
  // Real Facebook Page API sync (single page by ID/username)
  if (key === 'facebook' && state.platforms.facebook.user_access_token && state.platforms.facebook.page_id) {
    showToast('Syncing Facebook Page…', 'info');
    try {
      const token = state.platforms.facebook.user_access_token;
      const pageId = state.platforms.facebook.page_id;
      // Step 1: basic page info + page access token (user token)
      const pageResp = await fetch(`https://graph.facebook.com/v18.0/${encodeURIComponent(pageId)}?fields=name,id,fan_count,category,single_line_address,followers_count,picture.type(large),access_token&access_token=${encodeURIComponent(token)}`);
      if (!pageResp.ok) { const err = await pageResp.json().catch(()=>({})); throw new Error(err.error?.message || pageResp.statusText); }
      const page = await pageResp.json();
      const fans = page.fan_count || page.followers_count || 0;
      // Step 2: recent posts require page access token
      let recentPosts = [], lastPostDate = null;
      if (page.access_token) {
        try {
          const postsResp = await fetch(`https://graph.facebook.com/v18.0/${page.id}/posts?fields=message,created_time&limit=5&access_token=${encodeURIComponent(page.access_token)}`);
          if (postsResp.ok) { const pd = await postsResp.json(); recentPosts = pd.data || []; lastPostDate = recentPosts.length > 0 ? recentPosts[0].created_time : null; }
        } catch(e) { /* posts are optional */ }
      }
      state.platforms.facebook.page_name = page.name || '';
      state.platforms.facebook.handle = page.name || pageId;
      state.platforms.facebook.followers = fans.toLocaleString();
      state.platforms.facebook.fb_page_id = page.id;
      state.platforms.facebook.category = page.category || '';
      state.platforms.facebook.address = page.single_line_address || '';
      state.platforms.facebook.profile_pic = page.picture?.data?.url || '';
      state.platforms.facebook.recent_posts = recentPosts.length;
      state.platforms.facebook.last_post_date = lastPostDate;
      state.platforms.facebook.last_sync = new Date().toISOString();
      saveApiConnections(state);
      showToast(`Facebook synced — ${page.name} (${fans.toLocaleString()} fans)`, 'success');
      renderConnections();
      return;
    } catch(e) {
      showToast(`Facebook sync error: ${e.message}`, 'error');
    }
  }
  state.platforms[key].last_sync = new Date().toISOString();
  saveApiConnections(state);
  showToast(`${SOCIAL_PLATFORMS.find(p=>p.key===key)?.label||key} synced`, 'success');
  renderConnections();
}

function disconnectPlatform(key) {
  if (!confirm('Disconnect this integration?')) return;
  const state = loadApiConnections();
  if (key === 'drive') { state.drive = {}; _googleAccessToken = null; }
  else delete state.platforms[key];
  saveApiConnections(state);
  showToast('Disconnected', 'info');
  renderConnections();
}

function savePlatformCredentials(key) {
  const state = loadApiConnections();
  if (key === 'drive') {
    const clientId = document.getElementById('drive-client-id').value.trim();
    const apiKey = document.getElementById('drive-api-key').value.trim();
    const folderName = document.getElementById('drive-folder-name').value.trim();
    if (!clientId) { showToast('OAuth 2.0 Client ID is required', 'error'); return; }
    if (!apiKey) { showToast('API Key is required for the file picker', 'error'); return; }
    _googleAccessToken = null; // clear any previous token
    state.drive = { connected:true, client_id:clientId, api_key:apiKey, folder_name:folderName||'My Drive', connected_at:new Date().toISOString() };
    saveApiConnections(state);
    closeModal(); renderConnections();
    showToast('Google Drive connected — click "From Drive" in a post to browse files', 'success');
    return;
  }
  const p = SOCIAL_PLATFORMS.find(pl => pl.key === key); if (!p) return;
  const data = { connected:true, connected_at:new Date().toISOString(), last_sync:new Date().toISOString(), followers:'—' };
  let missingRequired = false;
  p.fields.forEach(f => {
    const el = document.getElementById(`conn-field-${f.key}`);
    const v = el ? el.value.trim() : '';
    if (!v) missingRequired = true;
    data[f.key] = v;
  });
  const handleEl = document.getElementById('conn-field-handle');
  data.handle = handleEl ? (handleEl.value.trim()||'') : '';
  if (missingRequired) { showToast('Please fill in all required fields', 'error'); return; }
  state.platforms[key] = data;
  saveApiConnections(state);
  closeModal(); renderConnections();
  showToast(`${p.label} connected`, 'success');
  // Auto-sync to pull real data on first connect
  if (key === 'youtube' && data.api_key && data.channel_id) {
    setTimeout(() => syncPlatform('youtube'), 400);
  }
  if (key === 'instagram' && data.user_access_token && data.ig_account_id) {
    setTimeout(() => syncPlatform('instagram'), 400);
  }
  if (key === 'facebook' && data.user_access_token && data.page_id) {
    setTimeout(() => syncPlatform('facebook'), 400);
  }
}

async function testDriveConnection() {
  const creds = _getDriveCredentials();
  if (!creds) { showToast('No Drive credentials saved', 'error'); return; }
  showToast('Testing Google Drive connection…', 'info');
  try {
    const ready = await _ensurePickerApi();
    if (!ready) return;
    const token = await _requestDriveToken(creds.client_id);
    // Quick API call to verify the token works
    const resp = await fetch('https://www.googleapis.com/drive/v3/about?fields=user', {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!resp.ok) throw new Error('API returned ' + resp.status);
    const data = await resp.json();
    const email = data.user?.emailAddress || 'unknown';
    showToast(`Drive connected as ${email}`, 'success');
  } catch(e) {
    _googleAccessToken = null;
    showToast('Drive test failed: ' + e.message, 'error');
  }
}

let _savedPostModalState = null;
function _restorePostModal() {
  if (!_savedPostModalState) { closeModal(); return; }
  const panel = document.getElementById('modal-panel');
  panel.innerHTML = _savedPostModalState.html;
  panel.classList.toggle('wide', _savedPostModalState.wide);
  // Re-attach caption listeners
  const captionEl = document.getElementById('post-caption');
  const countEl = document.getElementById('caption-count');
  const previewEl = document.getElementById('caption-preview');
  if (captionEl && countEl) {
    captionEl.addEventListener('input', () => { const len = captionEl.value.length; countEl.textContent = `${len}/2200`; countEl.classList.toggle('over', len > 2200); if (previewEl) previewEl.textContent = captionEl.value; });
  }
  // Restore form values
  if (_savedPostModalState.formData) {
    const form = document.getElementById('post-form');
    if (form) {
      _savedPostModalState.formData.forEach((val, key) => {
        if (key === 'platform_ids') return;

        if (el) el.value = val;

      form.querySelectorAll('input[name="platform_ids"]').forEach(cb => {
        cb.checked = _savedPostModalState.platformIds.includes(cb.value);
      });
    }
  }
  // Re-attach brand/pillar change handlers
  const brandSel = document.getElementById('post-brand');
  if (brandSel) {
    brandSel.onchange = function() { const sel = document.getElementById('post-pillar'); const pils = S.pillars.filter(p => p.brand_id === this.value); sel.innerHTML = `<option value="">— None —</option>` + pils.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); renderHashtagSuggestions(this.value); renderCrewForBrand(this.value, null); };
  }
  const pillarSel = document.getElementById('post-pillar');
  if (pillarSel) { pillarSel.onchange = function() { if (this.value) applyPillarPlatforms(this.value); }; }
  renderHashtagSuggestions(brandSel?.value);
  _savedPostModalState = null;
}

async function openDrivePickerModal() {
  const creds = _getDriveCredentials();

  // ── Real Google Picker (credentials configured) ──
  if (creds) {
    showToast('Opening Google Drive…', 'info');
    const docs = await launchDrivePicker();
    if (!docs || docs.length === 0) return; // user cancelled
    const doc = docs[0]; // take first selected file
    // Build a direct-viewable link
    const fileUrl = doc.url || `https://drive.google.com/file/d/${doc.id}/view`;
    // Try to get an embeddable thumbnail for images
    let thumbUrl = '';
    if (doc.iconUrl) thumbUrl = doc.iconUrl.replace(/\/16\//, '/128/');
    if (doc.thumbnails && doc.thumbnails.length > 0) thumbUrl = doc.thumbnails[doc.thumbnails.length-1].url;
    // Set values in the post form
    const mediaInput = document.getElementById('post-media-url');
    if (mediaInput) mediaInput.value = fileUrl;

        const name = card.dataset.name;
        const url = `https://drive.google.com/file/d/sample-${encodeURIComponent(name).replace(/[^a-zA-Z0-9]/g,'')}/view`;

          if (mediaInput) { mediaInput.value = url; }
          showToast(`Selected "${name}" from Drive`, 'success');
        }, 50);

  renderGrid('');
  const search = document.getElementById('drive-picker-search');
  if (search) search.addEventListener('input', () => renderGrid(search.value));
}

async function publishPostNow(existingId) {
  // First save the post
  const form = document.getElementById('post-form'); const fd = new FormData(form); const data = {};
  ['brand_id','content_pillar_id','created_by','title','caption','hashtags','media_url','media_type','scheduled_date','scheduled_time','notes'].forEach(k => { const v = fd.get(k); data[k] = v===''?null:v; });
  data.status = 'posted'; data.posted_at = new Date().toISOString();
  const platformIds = fd.getAll('platform_ids').filter(Boolean); data.platform_ids = platformIds.length?platformIds:null; data.platform_id = platformIds[0]||null;
  const crewIds = fd.getAll('crew_members').filter(Boolean); data.crew_members = crewIds.length?crewIds:null;
  if (!data.title) { showToast('Title is required','error'); return; }
  if (!data.caption) { showToast('Caption is required to publish','error'); return; }
  if (!platformIds.length) { showToast('Select at least one platform to publish to','error'); return; }

  // Save post first
  try {
    if (existingId) await sb.from('sm_posts').update(data).eq('id',existingId);
    else { const ins = await sb.from('sm_posts').insert(data).select('id').single(); existingId = ins.data?.id; }
  } catch(e) { showToast('Error saving post: '+e.message,'error'); return; }

  // Attempt to publish to each selected platform via API
  const state = loadApiConnections();
  const platNames = platformIds.map(id => { const p = platById(id); return p ? p.name : ''; }).filter(Boolean);
  const results = [];

  for (const platName of platNames) {
    const key = platName.toLowerCase();
    const conn = state.platforms[key];
    if (!conn || !conn.connected) { results.push({ platform: platName, ok: false, msg: 'Not connected' }); continue; }

    try {
      if (key === 'instagram' && conn.user_access_token && conn.ig_account_id) {
        // Instagram Content Publishing API — create media container then publish
        const token = conn.user_access_token;
        const igId = conn.ig_account_id;
        const caption = (data.caption || '') + (data.hashtags ? '\n\n' + data.hashtags : '');
        let containerParams = `caption=${encodeURIComponent(caption)}`;
        if (data.media_url) containerParams += `&image_url=${encodeURIComponent(data.media_url)}`;
        else { results.push({ platform: 'Instagram', ok: false, msg: 'Image URL required for Instagram posts' }); continue; }
        const createResp = await fetch(`https://graph.facebook.com/v18.0/${igId}/media?${containerParams}&access_token=${encodeURIComponent(token)}`, { method: 'POST' });
        const createData = await createResp.json();
        if (createData.error) { results.push({ platform: 'Instagram', ok: false, msg: createData.error.message }); continue; }
        const containerId = createData.id;
        // Publish the container
        const pubResp = await fetch(`https://graph.facebook.com/v18.0/${igId}/media_publish?creation_id=${containerId}&access_token=${encodeURIComponent(token)}`, { method: 'POST' });
        const pubData = await pubResp.json();
        if (pubData.error) { results.push({ platform: 'Instagram', ok: false, msg: pubData.error.message }); continue; }
        results.push({ platform: 'Instagram', ok: true, msg: 'Published successfully', postId: pubData.id });

      } else if (key === 'facebook' && conn.user_access_token && conn.page_id) {
        // Facebook Page Publishing — get page token, then post
        const token = conn.user_access_token;
        const pageId = conn.fb_page_id || conn.page_id;
        // Get page access token
        const pageResp = await fetch(`https://graph.facebook.com/v18.0/${encodeURIComponent(pageId)}?fields=access_token&access_token=${encodeURIComponent(token)}`);
        const pageInfo = await pageResp.json();
        if (!pageInfo.access_token) { results.push({ platform: 'Facebook', ok: false, msg: 'Could not get Page access token' }); continue; }
        const pageToken = pageInfo.access_token;
        const message = (data.caption || '') + (data.hashtags ? '\n\n' + data.hashtags : '');
        let postBody = `message=${encodeURIComponent(message)}`;
        if (data.media_url) postBody += `&link=${encodeURIComponent(data.media_url)}`;
        const fbResp = await fetch(`https://graph.facebook.com/v18.0/${pageInfo.id || pageId}/feed?${postBody}&access_token=${encodeURIComponent(pageToken)}`, { method: 'POST' });
        const fbData = await fbResp.json();
        if (fbData.error) { results.push({ platform: 'Facebook', ok: false, msg: fbData.error.message }); continue; }
        results.push({ platform: 'Facebook', ok: true, msg: 'Published successfully', postId: fbData.id });

      } else {
        results.push({ platform: platName, ok: false, msg: 'Publishing not yet supported or missing credentials' });
      }
    } catch(e) {
      results.push({ platform: platName, ok: false, msg: e.message });
    }
  }

  // Show results
  const successes = results.filter(r => r.ok);
  const failures = results.filter(r => !r.ok);
  if (successes.length > 0) { showToast(`Published to: ${successes.map(r=>r.platform).join(', ')}`, 'success'); logAudit('publish','post',postId,data.title,{platforms:successes.map(r=>r.platform)}); }
  if (failures.length > 0) showToast(`Failed: ${failures.map(r=>r.platform+' — '+r.msg).join('; ')}`, 'error');

  closeModal(); await loadAll(); render();
}

  const post = S.posts.find(p=>p.id===postId); if (!post) return;
  const br = brandById(post.brand_id); const pil = pillarById(post.content_pillar_id);
  const pids = post.platform_ids || (post.platform_id ? [post.platform_id] : []);
  const plats = pids.map(id=>platById(id)).filter(Boolean);
  const assignee = post.created_by ? S.members.find(m=>m.id===post.created_by) : null;
  const crewNames = Array.isArray(post.crew_members) ? post.crew_members.map(id=>{const m=S.members.find(x=>x.id===id);return m?m.name:'Unknown';}).join(', ') : '—';
  const meta = STATUS_META[post.status] || { label: post.status };
  const rows = [['Title',post.title||'Untitled'],['Brand',br?(br.logo_emoji+' '+br.name):'—'],['Platforms',plats.length?plats.map(pl=>pl.name).join(', '):'—'],['Content Pillar',pil?pil.name:'—'],['Status',meta.label],['Scheduled',(post.scheduled_date?fmtDate(post.scheduled_date):'TBD')+' at '+(post.scheduled_time?fmtTime(post.scheduled_time):'TBD')],['Caption',post.caption||'—'],['Hashtags',post.hashtags||'—'],['Media Type',post.media_type?post.media_type.charAt(0).toUpperCase()+post.media_type.slice(1):'—'],['Assigned To',assignee?assignee.name:'—'],['Crew / Talent',crewNames],['Notes',post.notes||'—']];
  let tableHtml = `<table style="width:100%;border-collapse:collapse;font-size:13px;line-height:1.6">`;
  rows.forEach(([k,v]) => { tableHtml += `<tr style="border-bottom:1px solid var(--surface-border)"><td style="padding:8px 10px;font-weight:600;color:var(--ink-3);width:140px;vertical-align:top">${k}</td><td style="padding:8px 10px;color:var(--ink-1);white-space:pre-wrap">${escHtml(v)}</td></tr>`; });
  tableHtml += `</table>`;
  const panel = document.getElementById('modal-panel'); panel.classList.add('wide');
  panel.innerHTML = `<div class="modal-header"><span class="modal-title">&#128203; Production Brief</span><button class="modal-close" onclick="closeModal()">&#10005;</button></div><div class="modal-body" style="padding:16px 20px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div><p style="color:var(--ink-3);font-size:12px">Generated ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</p></div><div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" onclick="copyBrief()">&#128203; Copy</button><button class="btn btn-ghost btn-sm" onclick="printBrief()">&#128424; Print</button></div></div><div id="brief-content" style="background:var(--surface-0);border:1px solid var(--surface-border);border-radius:var(--r-md);padding:16px">${tableHtml}</div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="openPostModal('${postId}')">&#8592; Back to Post</button><div style="flex:1"></div><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`;
  document.getElementById('modal-overlay').hidden = false;
}
function copyBrief() { const el = document.getElementById('brief-content'); if (!el) return; let text='=== PRODUCTION BRIEF ===\n\n'; el.querySelectorAll('tr').forEach(row => { const cells = row.querySelectorAll('td'); if (cells.length===2) text += cells[0].textContent.trim()+': '+cells[1].textContent.trim()+'\n'; }); text += '\n=== END BRIEF ==='; navigator.clipboard.writeText(text).then(() => showToast('Brief copied to clipboard','success')).catch(() => showToast('Select text and copy manually','info')); }
function printBrief() { const el = document.getElementById('brief-content'); if (!el) return; const win = window.open('','_blank','width=800,height=600'); win.document.write(`<!DOCTYPE html><html><head><title>Production Brief</title><style>body{font-family:'DM Sans',system-ui,sans-serif;margin:24px;color:#1a1a1a}table{width:100%;border-collapse:collapse}td{padding:8px 10px;border-bottom:1px solid #e5e7eb}td:first-child{font-weight:600;color:#555;width:140px}@media print{body{margin:12px}}</style></head><body><h2 style="font-family:Outfit,sans-serif;margin:0 0 16px">Production Brief</h2>${el.innerHTML}</body></html>`); win.document.close(); setTimeout(() => win.print(), 300); }

async function savePost(existingId) {
  const form = document.getElementById('post-form'); const fd = new FormData(form); const data = {};
  ['brand_id','content_pillar_id','created_by','title','caption','hashtags','media_url','media_type','status','scheduled_date','scheduled_time','notes'].forEach(k => { const v = fd.get(k); data[k] = v===''?null:v; });
  const platformIds = fd.getAll('platform_ids').filter(Boolean); data.platform_ids = platformIds.length?platformIds:null; data.platform_id = platformIds[0]||null;
  const crewIds = fd.getAll('crew_members').filter(Boolean); data.crew_members = crewIds.length?crewIds:null;
  if (!data.title) { showToast('Title is required','error'); return; }
  if (data.status==='posted'&&!data.posted_at) data.posted_at = new Date().toISOString();
  try {
    if (existingId) { await sb.from('sm_posts').update(data).eq('id',existingId); logAudit('edit','post',existingId,data.title,{status:data.status}); }
    else { const { data: inserted } = await sb.from('sm_posts').insert(data).select('id').single(); logAudit('create','post',inserted?.id||'',data.title,{status:data.status}); }
    closeModal(); await loadAll(); render(); showToast(existingId?'Post updated':'Post created','success');
  } catch(e) { showToast('Error: '+e.message,'error'); }
}

async function deletePost(id) { if (!confirm('Delete this post?')) return; const post = S.posts.find(p=>p.id===id); await sb.from('sm_post_metrics').delete().eq('post_id',id); await sb.from('sm_posts').delete().eq('id',id); logAudit('delete','post',id,post?.title||'Unknown'); closeModal(); await loadAll(); render(); showToast('Post deleted','info'); }

}

async function saveStrategy(existingId) {
