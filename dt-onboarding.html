<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Del Taco Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --dt-orange: #F8971D;
    --dt-yellow: #FFD200;
    --dt-green: #AAB038;
    --dt-black: #231F20;
    --dt-white: #FFFFFF;
    --dt-orange-dark: #e07d08;
    --dt-orange-light: #fbb04d;
    --dt-green-dark: #8a9020;
    --dt-green-light: #c4c85e;
    --dt-yellow-light: #ffe566;
    --bg: #f5f3ee;
    --card-bg: #ffffff;
    --text: var(--dt-black);
    --text-secondary: #4a4845;
    --text-muted: #8a8780;
    --border: rgba(35,31,32,0.06);
    --shadow: 0 8px 40px rgba(35,31,32,0.08), 0 2px 6px rgba(35,31,32,0.04);
    --char-bg-1: #fef9ec;
    --char-bg-2: #fdf0cc;
    --char-bg-3: #fce8a8;
    --floor-shadow: rgba(35,31,32,0.1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161412;
      --card-bg: #211e1b;
      --text: #ede9e4;
      --text-secondary: #b5b0a8;
      --text-muted: #706b62;
      --border: rgba(255,255,255,0.07);
      --shadow: 0 8px 40px rgba(0,0,0,0.4);
      --char-bg-1: #2a2418;
      --char-bg-2: #332c1c;
      --char-bg-3: #3d3420;
      --floor-shadow: rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #161412;
    --card-bg: #211e1b;
    --text: #ede9e4;
    --text-secondary: #b5b0a8;
    --text-muted: #706b62;
    --border: rgba(255,255,255,0.07);
    --shadow: 0 8px 40px rgba(0,0,0,0.4);
    --char-bg-1: #2a2418;
    --char-bg-2: #332c1c;
    --char-bg-3: #3d3420;
    --floor-shadow: rgba(0,0,0,0.35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 920px;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--dt-black);
    padding: 0;
    display: flex;
    align-items: stretch;
    color: var(--dt-white);
    position: relative;
    overflow: hidden;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    flex: 1;
  }
  .dt-logo { width: 44px; height: 44px; flex-shrink: 0; }
  .header-text { flex: 1; }
  .header-title {
    font-family: 'Nunito', 'Inter', sans-serif;
    font-size: 17px; font-weight: 800; letter-spacing: -0.2px;
  }
  .header-sub { font-size: 11px; opacity: 0.6; margin-top: 2px; font-weight: 400; }
  .header-right {
    display: flex; align-items: center; padding: 0 20px;
    background: rgba(255,255,255,0.05);
  }
  .scene-counter {
    font-size: 11px; font-weight: 700;
    color: var(--dt-yellow);
    white-space: nowrap; letter-spacing: 0.5px;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--dt-orange) 0%, var(--dt-yellow) 50%, var(--dt-green) 100%);
  }

  /* ===== MAIN LAYOUT ===== */
  .main { display: flex; min-height: 480px; }
  @media (max-width: 700px) {
    .main { flex-direction: column; }
    .char-side { min-height: 300px !important; flex: 0 0 300px !important; }
  }

  /* ===== CHARACTER PANEL ===== */
  .char-side {
    flex: 0 0 330px;
    background: linear-gradient(175deg, var(--char-bg-1) 0%, var(--char-bg-2) 50%, var(--char-bg-3) 100%);
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .char-side .deco-1 { position: absolute; top: 20px; right: 15px; opacity: 0.08; font-size: 42px; }
  .char-side .deco-2 { position: absolute; top: 80px; left: 10px; opacity: 0.06; font-size: 28px; }
  .char-side .deco-3 { position: absolute; bottom: 80px; right: 20px; opacity: 0.05; font-size: 24px; }
  .char-side::after {
    content: '';
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    width: 140px; height: 18px;
    background: radial-gradient(ellipse, var(--floor-shadow) 0%, transparent 70%);
    border-radius: 50%; z-index: 0;
  }
  .char-wrap {
    position: relative; z-index: 1;
    width: 230px; height: 370px;
    margin-bottom: 6px;
  }

  /* Speech bubble */
  .speech-bubble {
    position: absolute; top: 22px; left: 50%;
    transform: translateX(-50%);
    background: var(--dt-white); border-radius: 16px;
    padding: 10px 16px; font-size: 12.5px; font-weight: 600;
    color: var(--dt-black);
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    z-index: 10; opacity: 0;
    max-width: 210px; text-align: center; line-height: 1.4;
    pointer-events: none;
    border: 2px solid var(--dt-yellow);
  }
  .speech-bubble::after {
    content: '';
    position: absolute; bottom: -9px; left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 9px solid var(--dt-yellow);
  }
  @keyframes bubblePop {
    0% { opacity: 0; transform: translateX(-50%) scale(0.7) translateY(8px); }
    100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); }
  }
  .speech-bubble.show { animation: bubblePop 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .speech-bubble { background: #2e2a24; color: #ede9e4; border-color: var(--dt-orange); }
    :root:not([data-theme="light"]) .speech-bubble::after { border-top-color: var(--dt-orange); }
  }
  :root[data-theme="dark"] .speech-bubble { background: #2e2a24; color: #ede9e4; border-color: var(--dt-orange); }
  :root[data-theme="dark"] .speech-bubble::after { border-top-color: var(--dt-orange); }

  /* ===== CONTENT PANEL ===== */
  .content-side {
    flex: 1;
    padding: 28px 32px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .topic-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--dt-orange); color: var(--dt-black);
    font-size: 10px; font-weight: 800;
    padding: 5px 14px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 1px;
    width: fit-content;
  }
  .scene-title {
    font-family: 'Nunito', 'Inter', sans-serif;
    font-size: 26px; font-weight: 800; line-height: 1.15;
    letter-spacing: -0.5px; color: var(--text);
  }
  .bullets {
    display: flex; flex-direction: column; gap: 8px; flex: 1;
  }
  .bullet {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px; border-radius: 12px;
    background: transparent;
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1), background 0.3s, border-color 0.3s;
    border: 1.5px solid transparent;
  }
  .bullet.show { opacity: 1; transform: translateY(0); }
  .bullet.highlight {
    background: rgba(248,151,29,0.06);
    border-color: rgba(248,151,29,0.2);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .bullet.highlight {
      background: rgba(248,151,29,0.08);
      border-color: rgba(248,151,29,0.15);
    }
  }
  :root[data-theme="dark"] .bullet.highlight {
    background: rgba(248,151,29,0.08);
    border-color: rgba(248,151,29,0.15);
  }
  .bullet-icon {
    flex: 0 0 32px; height: 32px; border-radius: 10px;
    background: var(--dt-orange); color: var(--dt-black);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; margin-top: 1px;
    box-shadow: 0 2px 6px rgba(248,151,29,0.2);
  }
  .bullet-body h4 {
    font-size: 14px; font-weight: 700; margin-bottom: 3px; color: var(--text);
  }
  .bullet-body p {
    font-size: 13px; line-height: 1.55; color: var(--text-secondary);
  }

  /* ===== NARRATION BAR ===== */
  .narr-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--dt-black); border-radius: 14px;
    margin-top: auto;
  }
  .narr-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: none; background: var(--dt-orange); color: var(--dt-black);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 10px rgba(248,151,29,0.35);
  }
  .narr-btn:hover { transform: scale(1.06); box-shadow: 0 3px 14px rgba(248,151,29,0.45); }
  .narr-btn:active { transform: scale(0.94); }
  .narr-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .progress-wrap { flex: 1; display: flex; flex-direction: column; gap: 5px; }
  .progress-track {
    height: 4px; background: rgba(255,255,255,0.12);
    border-radius: 2px; overflow: hidden; cursor: pointer;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--dt-orange), var(--dt-yellow));
    border-radius: 2px; transition: width 0.25s linear;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 10px; color: rgba(255,255,255,0.45);
    font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .narr-status {
    font-size: 10px; color: var(--dt-yellow); font-weight: 600;
    white-space: nowrap; letter-spacing: 0.3px;
  }

  /* ===== NAV BUTTONS ===== */
  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: 12px;
    border: 2px solid var(--dt-orange); background: transparent;
    color: var(--dt-orange); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .nav-btn:hover { background: var(--dt-orange); color: var(--dt-black); }
  .nav-btn:active { transform: scale(0.96); }
  .nav-btn.primary {
    background: var(--dt-orange); color: var(--dt-black);
    border-color: var(--dt-orange);
  }
  .nav-btn.primary:hover { background: var(--dt-orange-dark); border-color: var(--dt-orange-dark); }
  .nav-btn:disabled {
    opacity: 0.3; pointer-events: none;
  }
  .nav-btn svg { width: 14px; height: 14px; fill: currentColor; }
  .scene-dots {
    display: flex; gap: 6px; align-items: center;
  }
  .scene-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-muted); opacity: 0.3;
    transition: all 0.3s;
  }
  .scene-dot.active { background: var(--dt-orange); opacity: 1; width: 24px; border-radius: 4px; }
  .scene-dot.completed { background: var(--dt-green); opacity: 0.7; }

  /* ===== QUIZ STYLES ===== */
  .quiz-wrap { display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .quiz-q {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin-bottom: 4px;
  }
  .quiz-num {
    font-size: 10px; font-weight: 700; color: var(--dt-orange);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 12px;
    border: 2px solid var(--border); background: transparent;
    cursor: pointer; transition: all 0.2s;
    font-size: 14px; color: var(--text); text-align: left;
    font-family: 'Inter', system-ui, sans-serif;
    width: 100%;
  }
  .quiz-opt:hover { border-color: var(--dt-orange); background: rgba(248,151,29,0.04); }
  .quiz-opt.selected { border-color: var(--dt-orange); background: rgba(248,151,29,0.08); }
  .quiz-opt.correct {
    border-color: var(--dt-green); background: rgba(170,176,56,0.1);
    color: var(--dt-green-dark);
  }
  .quiz-opt.wrong {
    border-color: #e05050; background: rgba(224,80,80,0.06);
    color: #c04040;
  }
  .quiz-opt .opt-letter {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--border); display: flex;
    align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    transition: all 0.2s;
  }
  .quiz-opt.selected .opt-letter { background: var(--dt-orange); color: var(--dt-black); }
  .quiz-opt.correct .opt-letter { background: var(--dt-green); color: #fff; }
  .quiz-opt.wrong .opt-letter { background: #e05050; color: #fff; }
  .quiz-feedback {
    padding: 12px 16px; border-radius: 12px;
    font-size: 13px; font-weight: 600; line-height: 1.5;
    display: none;
  }
  .quiz-feedback.correct-fb {
    display: block; background: rgba(170,176,56,0.1);
    border: 1.5px solid rgba(170,176,56,0.3); color: var(--dt-green-dark);
  }
  .quiz-feedback.wrong-fb {
    display: block; background: rgba(224,80,80,0.06);
    border: 1.5px solid rgba(224,80,80,0.2); color: #b04040;
  }
  .quiz-score {
    text-align: center; padding: 24px;
  }
  .quiz-score-num {
    font-family: 'Nunito', sans-serif;
    font-size: 48px; font-weight: 800; color: var(--dt-orange);
  }
  .quiz-score-label {
    font-size: 14px; color: var(--text-muted); margin-top: 4px;
  }
  .quiz-score-msg {
    font-size: 16px; font-weight: 700; color: var(--text);
    margin-top: 12px;
  }

  /* ===== FOOTER ===== */
  .footer-bar {
    text-align: center; padding: 10px 16px;
    background: var(--dt-black);
    font-size: 10px; color: var(--dt-orange);
    font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  /* ===== CHARACTER SVG ANIMATIONS ===== */
  .char-svg { width: 100%; height: 100%; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .body-group { animation: breathe 3.5s ease-in-out infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.05); }
  }
  .eye-l, .eye-r { transform-origin: center; animation: blink 3.8s ease-in-out infinite; }
  .eye-r { animation-delay: 0.15s; }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    33% { transform: rotate(0.4deg); }
    66% { transform: rotate(-0.4deg); }
  }
  .char-root { transform-origin: center bottom; animation: sway 6s ease-in-out infinite; }
  @keyframes talkMouth {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }
  #charSvg.talking .mouth-open { animation: talkMouth 0.3s ease-in-out infinite; }
  #charSvg.talking .mouth-smile { opacity: 0; }
  #charSvg:not(.talking) .mouth-open { display: none; }
  @keyframes gesture {
    0%, 65%, 100% { transform: rotate(0deg); }
    12% { transform: rotate(-18deg); }
    24% { transform: rotate(-6deg); }
    38% { transform: rotate(-22deg); }
    50% { transform: rotate(-10deg); }
  }
  #charSvg.talking .r-arm { transform-origin: 140px 178px; animation: gesture 4.5s ease-in-out infinite; }
  @keyframes headTilt {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    20% { transform: rotate(2deg) translateY(-1px); }
    50% { transform: rotate(-1.5deg) translateY(0); }
    80% { transform: rotate(1deg) translateY(-0.5px); }
  }
  #charSvg.talking .head-group { animation: headTilt 3.2s ease-in-out infinite; }
  .head-group { transform-origin: 110px 130px; }
  @keyframes eyeLook {
    0%, 100% { transform: translateX(0); }
    30% { transform: translateX(1.5px); }
    70% { transform: translateX(-1px); }
  }
  #charSvg.talking .eye-pupil { animation: eyeLook 4s ease-in-out infinite; }
  @keyframes talkLean {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-1px) rotate(0.3deg); }
  }
  #charSvg.talking .body-group { animation: talkLean 2s ease-in-out infinite; }

  /* Scene transition */
  .content-side { transition: opacity 0.3s ease; }
  .content-side.fade-out { opacity: 0; }
</style>
</head>
<body>
<div class="card">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <svg class="dt-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 8 C25 8 8 30 8 55 C8 72 18 85 32 90 L50 95 L68 90 C82 85 92 72 92 55 C92 30 75 8 50 8Z" fill="#F8971D"/>
        <path d="M50 14 C28 14 14 34 14 55 C14 70 22 81 34 86 L50 90 L66 86 C78 81 86 70 86 55 C86 34 72 14 50 14Z" fill="#FFD200"/>
        <ellipse cx="50" cy="54" rx="30" ry="28" fill="none" stroke="#AAB038" stroke-width="3"/>
        <text x="50" y="48" text-anchor="middle" font-family="'Nunito','Inter',sans-serif" font-size="12" font-weight="800" fill="#231F20" letter-spacing="1">DEL</text>
        <text x="50" y="64" text-anchor="middle" font-family="'Nunito','Inter',sans-serif" font-size="13" font-weight="800" fill="#231F20" letter-spacing="1.5">TACO</text>
      </svg>
      <div class="header-text">
        <div class="header-title">New Team Member Onboarding</div>
        <div class="header-sub">Welcome to the Del Taco family</div>
      </div>
    </div>
    <div class="header-right">
      <div class="scene-counter" id="sceneCounter">SCENE 1 / 6</div>
    </div>
  </div>

  <div class="main">
    <!-- Character Panel -->
    <div class="char-side">
      <span class="deco-1">&#127790;</span>
      <span class="deco-2">&#11088;</span>
      <span class="deco-3">&#127798;&#65039;</span>
      <div class="speech-bubble" id="speechBubble"></div>
      <div class="char-wrap">
        <svg class="char-svg" viewBox="0 0 230 380" id="charSvg">
          <g class="char-root">
            <g class="body-group">
              <!-- LEGS -->
              <rect x="85" y="278" width="24" height="72" rx="8" fill="#2a2a3a"/>
              <rect x="121" y="278" width="24" height="72" rx="8" fill="#2a2a3a"/>
              <!-- Belt -->
              <rect x="72" y="268" width="86" height="14" rx="4" fill="#1a1a28"/>
              <rect x="108" y="270" width="14" height="10" rx="2" fill="#888"/>
              <!-- Shoes -->
              <path d="M80 346 Q78 354 86 356 L102 356 Q108 354 107 346 Z" fill="#1a1a28"/>
              <path d="M123 346 Q121 354 129 356 L145 356 Q151 354 149 346 Z" fill="#1a1a28"/>
              <ellipse cx="93" cy="352" rx="6" ry="2" fill="#2d2d40" opacity="0.4"/>
              <ellipse cx="136" cy="352" rx="6" ry="2" fill="#2d2d40" opacity="0.4"/>

              <!-- TORSO — Del Taco Orange polo -->
              <path d="M72 168 Q72 152 86 148 L144 148 Q158 152 158 168 L158 272 Q158 280 148 280 L82 280 Q72 280 72 272 Z" fill="#F8971D"/>
              <!-- Polo collar -->
              <path d="M92 148 L115 148" stroke="#e07d08" stroke-width="1"/>
              <path d="M90 148 L110 168 L130 148" fill="none" stroke="#e07d08" stroke-width="2" stroke-linecap="round"/>
              <!-- Shirt highlights -->
              <path d="M72 168 Q72 152 86 148" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
              <path d="M158 168 Q158 152 144 148" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
              <!-- Shoulder seams -->
              <line x1="72" y1="162" x2="88" y2="155" stroke="#e07d08" stroke-width="0.8" opacity="0.5"/>
              <line x1="158" y1="162" x2="142" y2="155" stroke="#e07d08" stroke-width="0.8" opacity="0.5"/>
              <!-- Horizontal seam -->
              <line x1="72" y1="215" x2="158" y2="215" stroke="#e07d08" stroke-width="0.6" opacity="0.3"/>

              <!-- Del Taco logo on shirt -->
              <g transform="translate(96, 180)">
                <circle cx="19" cy="14" r="14" fill="rgba(255,210,0,0.3)"/>
                <text x="19" y="10" text-anchor="middle" font-size="5" fill="#231F20" font-family="'Nunito',sans-serif" font-weight="800" opacity="0.7">DEL</text>
                <text x="19" y="18" text-anchor="middle" font-size="5.5" fill="#231F20" font-family="'Nunito',sans-serif" font-weight="800" opacity="0.7">TACO</text>
              </g>

              <!-- Name tag -->
              <g transform="translate(78, 204)">

    pillIcon: '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
    title: "Quick Knowledge Check",
    type: "quiz",
    questions: [
      {
        q: "How long should you wash your hands before handling food?",
        opts: ["10 seconds", "At least 20 seconds", "5 seconds", "It doesn\u2019t matter"],
        correct: 1,
        explain: "You should always wash your hands for at least 20 seconds \u2014 about the time it takes to sing \u201cHappy Birthday\u201d twice."
      },
      {
        q: "What temperature must hot foods be kept above?",
        opts: ["100\u00b0F", "120\u00b0F", "135\u00b0F", "150\u00b0F"],
        correct: 2,
        explain: "Hot foods must be kept above 135\u00b0F to stay out of the Temperature Danger Zone (41\u00b0F\u2013135\u00b0F)."
      },
      {
        q: "How many hours of PTO can full-time team members earn per year?",
        opts: ["40 hours", "60 hours", "80 hours", "120 hours"],
        correct: 2,
        explain: "Full-time team members can earn up to 80 hours of Paid Time Off per year."
      },
      {
        q: "What should you do in drive-thru when a guest pulls up?",
        opts: ["Wait for them to speak first", "Answer within 5 seconds with a greeting", "Ask them to hold", "Turn on the mic and wait"],
        correct: 1,
        explain: "Answer within 5 seconds with a friendly greeting like \u201cHi! Welcome to Del Taco!\u201d"
      },
      {
        q: "A guest complains about their order. What\u2019s the right first step?",
        opts: ["Explain what happened", "Call the manager immediately", "Listen to the guest", "Offer a refund"],
        correct: 2,
        explain: "Always listen first, then apologize sincerely, then fix the problem. Listening shows the guest they\u2019re heard."
      }
    ],
    audioSrc: null
  }
];

/* =============== STATE =============== */
var currentScene = 0;
var sceneCompleted = [false, false, false, false, false, false];
var quizState = { qIndex: 0, score: 0, answered: false, finished: false };

var audio = new Audio();
audio.preload = 'auto';
var playing = false;
var charSvg = document.getElementById('charSvg');
var speechBubble = document.getElementById('speechBubble');
var contentSide = document.getElementById('contentSide');
var sceneCounter = document.getElementById('sceneCounter');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var shownBullets = new Set();
var shownBubbles = new Set();

/* =============== RENDER =============== */
function renderScene(idx) {
  var sc = SCENES[idx];
  sceneCounter.textContent = 'SCENE ' + sc.id + ' / 6';
  renderDots();

  // Stop any playing audio
  audio.pause();
  audio.currentTime = 0;
  stopVisuals();
  shownBullets = new Set();
  shownBubbles = new Set();
  speechBubble.className = 'speech-bubble';
  speechBubble.textContent = '';

  // Fade out
  contentSide.classList.add('fade-out');
  setTimeout(function() {
    var html = '';
    // Pill
    html += '<div class="topic-pill">' + sc.pillIcon + ' ' + sc.pill + '</div>';
    html += '<div class="scene-title">' + sc.title + '</div>';

    if (sc.type === 'bullets') {
      html += '<div class="bullets">';
      for (var i = 0; i < sc.bullets.length; i++) {
        var b = sc.bullets[i];
        html += '<div class="bullet" id="b' + i + '">';
        html += '<div class="bullet-icon">' + b.icon + '</div>';
        html += '<div class="bullet-body"><h4>' + b.h + '</h4><p>' + b.p + '</p></div>';
        html += '</div>';
      }
      html += '</div>';
      // Narration bar
      html += renderNarrBar(sc);
    } else if (sc.type === 'quiz') {
      if (quizState.finished) {
        html += renderQuizScore();
      } else {
        html += renderQuizQuestion(sc.questions[quizState.qIndex], quizState.qIndex, sc.questions.length);
      }
    }

    contentSide.innerHTML = html;
    contentSide.classList.remove('fade-out');

    // If bullets scene without audio, show all bullets immediately
    if (sc.type === 'bullets' && !sc.audioSrc) {
      setTimeout(function() {
        for (var i = 0; i < sc.bullets.length; i++) {
          (function(idx) {
            setTimeout(function() {
              var el = document.getElementById('b' + idx);
              if (el) el.classList.add('show');
            }, idx * 200);
          })(i);
        }
      }, 100);
      // Show a welcome bubble
      if (sc.bubbleTexts && sc.bubbleTexts.length > 0) {
        setTimeout(function() {
          showBubble(sc.bubbleTexts[0].text, sc.bubbleTexts[0].dur);
        }, 500);
      }
    }

    // If has audio, set it up
    if (sc.audioSrc) {
      audio.src = sc.audioSrc;
    }

    updateNavButtons();
  }, 200);
}

function renderNarrBar(sc) {
  if (!sc.audioSrc) {
    return '<div class="narr-bar" style="opacity:0.5">' +
      '<div style="color:var(--dt-yellow);font-size:11px;font-weight:600;padding:6px 0;text-align:center;width:100%;">' +
      '&#128266; Audio narration will be available soon</div></div>';
  }
  return '<div class="narr-bar">' +
    '<button class="narr-btn" id="playBtn" onclick="toggleNarration()" aria-label="Play narration">' +
    '<svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' +
    '<svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>' +
    '</button>' +
    '<div class="progress-wrap">' +
    '<div class="progress-track" id="progressTrack" onclick="seekAudio(event)">' +
    '<div class="progress-fill" id="progressFill"></div></div>' +
    '<div class="progress-info"><span id="timeElapsed">0:00</span><span id="timeDuration">0:00</span></div></div>' +
    '<span class="narr-status" id="narrStatus">&#9654; PLAY</span></div>';
}

function renderQuizQuestion(q, idx, total) {
  var letters = ['A', 'B', 'C', 'D'];
  var html = '<div class="quiz-wrap">';
  html += '<div class="quiz-num">Question ' + (idx + 1) + ' of ' + total + '</div>';
  html += '<div class="quiz-q">' + q.q + '</div>';
  html += '<div class="quiz-options" id="quizOpts">';
  for (var i = 0; i < q.opts.length; i++) {
    html += '<button class="quiz-opt" onclick="answerQuiz(' + i + ')" id="qopt' + i + '">';
    html += '<span class="opt-letter">' + letters[i] + '</span>';
    html += '<span>' + q.opts[i] + '</span>';
    html += '</button>';
  }
  html += '</div>';
  html += '<div class="quiz-feedback" id="quizFeedback"></div>';
  html += '</div>';
  return html;
}

function renderQuizScore() {
  var total = SCENES[5].questions.length;
  var pct = Math.round((quizState.score / total) * 100);
  var msg = pct >= 80 ? "Great job! You\u2019re ready to rock!" :
            pct >= 60 ? "Good effort! Review the scenes you missed." :
            "Let\u2019s review the material and try again.";
  var html = '<div class="quiz-score">';
  html += '<div class="quiz-score-num">' + quizState.score + '/' + total + '</div>';
  html += '<div class="quiz-score-label">' + pct + '% Correct</div>';
  html += '<div class="quiz-score-msg">' + msg + '</div>';
  if (pct < 100) {
    html += '<button class="nav-btn primary" style="margin:20px auto 0" onclick="retryQuiz()">Try Again</button>';
  }
  html += '</div>';
  return html;
}

/* =============== QUIZ LOGIC =============== */
function answerQuiz(chosen) {
  if (quizState.answered) return;
  quizState.answered = true;
  var q = SCENES[5].questions[quizState.qIndex];
  var correct = q.correct;
  var opts = document.querySelectorAll('.quiz-opt');
  opts.forEach(function(o, i) {
    o.style.pointerEvents = 'none';
    if (i === correct) o.className = 'quiz-opt correct';
    else if (i === chosen && i !== correct) o.className = 'quiz-opt wrong';
  });
  if (chosen === correct) quizState.score++;

  var fb = document.getElementById('quizFeedback');
  fb.textContent = (chosen === correct ? '\u2714 Correct! ' : '\u2718 Not quite. ') + q.explain;
  fb.className = 'quiz-feedback ' + (chosen === correct ? 'correct-fb' : 'wrong-fb');

  // Show speech bubble
  showBubble(chosen === correct ? 'That\u2019s right! \ud83c\udf89' : 'Good try! Remember this one.', 3000);

  // Auto-advance after 2.5s
  setTimeout(function() {
    quizState.qIndex++;
    quizState.answered = false;
    if (quizState.qIndex >= SCENES[5].questions.length) {
      quizState.finished = true;
      sceneCompleted[5] = true;
    }
    renderScene(currentScene);
  }, 2500);
}

function retryQuiz() {
  quizState = { qIndex: 0, score: 0, answered: false, finished: false };
  sceneCompleted[5] = false;
  renderScene(currentScene);
}

/* =============== NAVIGATION =============== */
function nextScene() {
  sceneCompleted[currentScene] = true;
  if (currentScene < SCENES.length - 1) {
    currentScene++;
    renderScene(currentScene);
  }
}

function prevScene() {
  if (currentScene > 0) {
    currentScene--;
    renderScene(currentScene);
  }
}

function goToScene(idx) {
  if (idx >= 0 && idx < SCENES.length) {
    currentScene = idx;
    renderScene(currentScene);
  }
}

function updateNavButtons() {
  prevBtn.disabled = currentScene === 0;
  if (currentScene === SCENES.length - 1) {
    nextBtn.style.display = 'none';
  } else {
    nextBtn.style.display = '';
  }
}

function renderDots() {
  var dots = document.getElementById('sceneDots');
  var html = '';
  for (var i = 0; i < SCENES.length; i++) {
    var cls = 'scene-dot';
    if (i === currentScene) cls += ' active';
    else if (sceneCompleted[i]) cls += ' completed';
    html += '<div class="' + cls + '" onclick="goToScene(' + i + ')" style="cursor:pointer" title="Scene ' + (i + 1) + '"></div>';
  }
  dots.innerHTML = html;
}

/* =============== AUDIO =============== */
function formatTime(s) {
  if (isNaN(s)) return '0:00';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

audio.addEventListener('loadedmetadata', function() {
  var dur = document.getElementById('timeDuration');
  if (dur) dur.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', function() {
  var fill = document.getElementById('progressFill');
  var elapsed = document.getElementById('timeElapsed');
  if (!fill || !elapsed) return;

  var pct = (audio.currentTime / audio.duration) * 100;
  fill.style.width = pct + '%';
  elapsed.textContent = formatTime(audio.currentTime);

  var sc = SCENES[currentScene];
  if (sc.type !== 'bullets' || !sc.audioSrc) return;

  for (var i = 0; i < sc.bulletTimings.length; i++) {
    if (audio.currentTime >= sc.bulletTimings[i] && !shownBullets.has(i)) {
      shownBullets.add(i);
      var el = document.getElementById('b' + i);
      if (el) el.classList.add('show');
      for (var j = 0; j < sc.bulletTimings.length; j++) {
        var bel = document.getElementById('b' + j);
        if (bel) bel.classList.toggle('highlight', j === i);
      }
    }
  }

  for (var k = 0; k < sc.bubbleTexts.length; k++) {
    if (audio.currentTime >= sc.bubbleTexts[k].at && !shownBubbles.has(k)) {
      shownBubbles.add(k);
      showBubble(sc.bubbleTexts[k].text, sc.bubbleTexts[k].dur);
    }
  }
});

audio.addEventListener('ended', function() {
  stopNarration();
  sceneCompleted[currentScene] = true;
  renderDots();
});

function toggleNarration() {
  if (playing) {
    audio.pause();
    stopVisuals();
  } else {
    audio.play();
    startVisuals();
  }
}

function startVisuals() {
  playing = true;
  charSvg.classList.add('talking');
  var pi = document.getElementById('playIcon');
  var pa = document.getElementById('pauseIcon');
  if (pi) pi.style.display = 'none';
  if (pa) pa.style.display = 'block';
  var ns = document.getElementById('narrStatus');
  if (ns) ns.textContent = 'PLAYING';
}

function stopVisuals() {
  playing = false;
  charSvg.classList.remove('talking');
  var pi = document.getElementById('playIcon');
  var pa = document.getElementById('pauseIcon');
  if (pi) pi.style.display = 'block';
  if (pa) pa.style.display = 'none';
  var ns = document.getElementById('narrStatus');
  if (ns) ns.textContent = '\u25b6 PLAY';
}

function stopNarration() {
  stopVisuals();
  var ns = document.getElementById('narrStatus');
  if (ns) ns.textContent = '\u2713 COMPLETE';
  var sc = SCENES[currentScene];
  if (sc.type === 'bullets') {
    for (var i = 0; i < sc.bullets.length; i++) {
      var el = document.getElementById('b' + i);
      if (el) { el.classList.add('show'); el.classList.remove('highlight'); }
    }
  }
}

function seekAudio(e) {
  var track = document.getElementById('progressTrack');
  if (!track) return;
  var rect = track.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  if (audio.duration) audio.currentTime = pct * audio.duration;
}

function showBubble(text, dur) {
  speechBubble.textContent = text;
  speechBubble.className = 'speech-bubble show';
  setTimeout(function() { speechBubble.className = 'speech-bubble'; }, dur);
}

/* =============== INIT =============== */
renderScene(0);
</script>
</body>
</html>
