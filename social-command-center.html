<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Command Center | Sonaya Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — Teal / Warm
   ══════════════════════════════════════════════ */
:root {
  /* Surfaces — warm palette */
  --bg: #f7f5f2;
  --surface-0: #eeebe6;
  --surface-1: #ffffff;
  --surface-2: #faf9f7;
  --surface-border: #e2ddd6;
  --surface-border-strong: #ccc5bb;
  --shadow-sm: 0 1px 3px rgba(60,40,10,0.05);
  --shadow-md: 0 4px 14px rgba(60,40,10,0.07), 0 1px 3px rgba(60,40,10,0.04);
  --shadow-lg: 0 12px 40px rgba(60,40,10,0.10), 0 2px 8px rgba(60,40,10,0.05);
  --shadow-xl: 0 24px 64px rgba(60,40,10,0.14), 0 4px 16px rgba(60,40,10,0.07);

  /* Sidebar — LIGHT */
  --sidebar-bg: #ffffff;
  --sidebar-border: #e8e3dc;
  --sidebar-text: #7c7268;
  --sidebar-text-bright: #2c2520;
  --sidebar-hover: rgba(13,148,136,0.04);
  --sidebar-active: rgba(13,148,136,0.08);

  /* Ink */
  --ink-0: #1a1512;
  --ink-1: #2c2520;
  --ink-2: #5c5349;
  --ink-3: #9a9088;
  --ink-4: #c4bdb5;

  /* Accent — teal */
  --accent: #0d9488;
  --accent-hover: #0f766e;
  --accent-soft: #f0fdfa;
  --accent-ink: #115e59;
  --accent-rgb: 13,148,136;

  /* Brands */
  --brand-sg: #1e3a5f;
  --brand-sg-gold: #c5a55a;
  --brand-dt: #e11d48;
  --brand-dt-soft: #fff1f2;
  --brand-koala: #16a34a;
  --brand-koala-soft: #f0fdf4;

  /* Platforms */
  --plat-ig: #E1306C;
  --plat-tt: #00C9B1;
  --plat-fb: #1877F2;
  --plat-yt: #FF0000;

  /* Status */
  --st-idea: #9a9088;
  --st-draft: #e5a100;
  --st-review: #e97316;
  --st-approved: #16a34a;
  --st-scheduled: #0d9488;
  --st-posted: #059669;
  --st-rejected: #dc2626;

  /* Auth */
  --login-bg: linear-gradient(135deg, #0d9488 0%, #115e59 100%);

  /* Radii */
  --r-xs: 4px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-full: 9999px;

  /* Chart */
  --chart-bg: #ffffff;
  --chart-grid: #e8e3dc;
  --chart-text: #7c7268;

  /* Motion */
  --ease: cubic-bezier(0.4,0,0.2,1);
  --fast: 0.15s var(--ease);
  --normal: 0.25s var(--ease);
  --spring: 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

/* ── Dark Theme ── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e0c;
    --surface-0: #1a1815;
    --surface-1: #21201d;
    --surface-2: #2a2825;
    --surface-border: #37342f;
    --surface-border-strong: #4a463f;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.3);
    --shadow-lg: 0 14px 44px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.3);
    --shadow-xl: 0 28px 72px rgba(0,0,0,0.55), 0 4px 20px rgba(0,0,0,0.35);
    --sidebar-bg: #171613;
    --sidebar-border: #2a2825;
    --sidebar-text: #8a8078;
    --sidebar-text-bright: #e8e3dc;
    --sidebar-hover: rgba(13,148,136,0.06);
    --sidebar-active: rgba(13,148,136,0.12);
    --ink-0: #f5f0ea;
    --ink-1: #e8e3dc;
    --ink-2: #a09688;
    --ink-3: #6b6158;
    --ink-4: #3d3832;
    --accent: #2dd4bf;
    --accent-hover: #14b8a6;
    --accent-soft: rgba(13,148,136,0.12);
    --accent-ink: #5eead4;
    --accent-rgb: 45,212,191;
    --brand-dt-soft: rgba(225,29,72,0.12);
    --brand-koala-soft: rgba(22,163,74,0.12);
    --chart-bg: #21201d;
    --chart-grid: #37342f;
    --chart-text: #a09688;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e0c;
  --surface-0: #1a1815;
  --surface-1: #21201d;
  --surface-2: #2a2825;
  --surface-border: #37342f;
  --surface-border-strong: #4a463f;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.4), 0 1px 4px rgba(0,0,0,0.3);
  --shadow-lg: 0 14px 44px rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.3);
  --shadow-xl: 0 28px 72px rgba(0,0,0,0.55), 0 4px 20px rgba(0,0,0,0.35);
  --sidebar-bg: #171613;
  --sidebar-border: #2a2825;
  --sidebar-text: #8a8078;
  --sidebar-text-bright: #e8e3dc;
  --sidebar-hover: rgba(13,148,136,0.06);
  --sidebar-active: rgba(13,148,136,0.12);
  --ink-0: #f5f0ea;
  --ink-1: #e8e3dc;
  --ink-2: #a09688;
  --ink-3: #6b6158;
  --ink-4: #3d3832;
  --accent: #2dd4bf;
  --accent-hover: #14b8a6;
  --accent-soft: rgba(13,148,136,0.12);
  --accent-ink: #5eead4;
  --accent-rgb: 45,212,191;
  --brand-dt-soft: rgba(225,29,72,0.12);
  --brand-koala-soft: rgba(22,163,74,0.12);
  --chart-bg: #21201d;
  --chart-grid: #37342f;
  --chart-text: #a09688;
}

/* ══════════════════════════════════════════════
   BASE RESET
   ══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink-1);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(var(--accent-rgb),0.22); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ══════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════ */
#app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}

/* ── Sidebar ── */
#sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  padding: 0 0 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}
#sidebar::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }

.sb-header {
  padding: 18px 16px 14px;
  background: linear-gradient(135deg, #1e3a5f 0%, #142a45 100%);
  margin-bottom: 6px;
}
.sb-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.sb-logo img { height: 72px; width: auto; flex-shrink: 0; filter: brightness(0) invert(1) drop-shadow(0 1px 3px rgba(255,255,255,0.3)); }
.sb-logo-text {
  font-family: Outfit, sans-serif; font-size: 11px; font-weight: 700;
  color: var(--brand-sg-gold); letter-spacing: 0.12em; line-height: 1.2;
}
.sb-title {
  font-family: Outfit, sans-serif; font-size: 14px; font-weight: 700;
  color: #ffffff; line-height: 1.3;
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
}

.sb-pills { display: flex; gap: 4px; padding: 10px 12px 4px; }
.sb-pill {
  flex: 1; padding: 6px 4px; border: 1px solid var(--surface-border);
  background: var(--surface-1); color: var(--ink-2); font-size: 11px;
  font-weight: 600; border-radius: var(--r-full); cursor: pointer;
  transition: all var(--fast); text-align: center; white-space: nowrap;
}
.sb-pill:hover { border-color: var(--accent); color: var(--accent); }
.sb-pill.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
  box-shadow: 0 2px 6px rgba(var(--accent-rgb),0.25);
}

.sb-counters { display: flex; gap: 6px; padding: 6px 12px; margin: 0 0 4px; }
.sb-counter {
  flex: 1; background: var(--accent-soft); border: 1px solid rgba(var(--accent-rgb),0.12);
  border-radius: var(--r-md); padding: 10px 6px; text-align: center;
}
.sb-counter-val {
  font-family: Outfit, sans-serif; font-size: 20px; font-weight: 800;
  color: var(--accent); line-height: 1.1;
}
.sb-counter-lbl {
  font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-3); margin-top: 2px;
}

.sb-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--ink-3);
  padding: 0 16px; margin: 18px 0 6px;
}
.sb-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.sb-nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: var(--r-sm);
  color: var(--sidebar-text); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--fast);
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit; border-left: 3px solid transparent;
}
.sb-nav-link:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
.sb-nav-link.active {
  background: var(--accent-soft); color: var(--accent-ink);
  border-left-color: var(--accent); font-weight: 700;
}
.sb-nav-icon { width: 20px; text-align: center; font-size: 14px; }

.sb-spacer { flex: 1; }

.sb-new-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 12px; background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%);
  color: #fff; border: none; border-radius: var(--r-md); font-size: 13px;
  font-weight: 700; cursor: pointer; transition: all var(--fast); margin: 0 10px;
  box-shadow: 0 3px 12px rgba(var(--accent-rgb),0.3);
  letter-spacing: 0.02em;
}
.sb-new-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(var(--accent-rgb),0.4); }
.sb-new-btn:active { transform: translateY(0); }

/* ── Main ── */
#main { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 32px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 10;
}
.tb-dropdown { position: relative; }
.tb-dropdown-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--surface-2);
  border: 1px solid var(--surface-border); border-radius: var(--r-full);
  font-size: 13px; font-weight: 600; color: var(--ink-1);
  cursor: pointer; transition: all var(--fast); white-space: nowrap;
}
.tb-dropdown-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.tb-dropdown-menu {
  position: absolute; top: calc(100% + 5px); left: 0; min-width: 200px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  padding: 6px; z-index: 20; opacity: 0; transform: translateY(-3px);
  pointer-events: none; transition: all var(--fast);
}
.tb-dropdown-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.tb-dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; transition: background var(--fast);
}
.tb-dropdown-item:hover { background: var(--surface-0); color: var(--ink-1); }
.tb-dropdown-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tb-search {
  flex: 1; max-width: 360px; position: relative;
}
.tb-search input {
  width: 100%; padding: 8px 14px 8px 34px;
  border: 1px solid var(--surface-border); border-radius: var(--r-full);
  background: var(--surface-2); font-family: inherit; font-size: 13px;
  color: var(--ink-1); outline: none; transition: border-color var(--fast), box-shadow var(--fast);
}
.tb-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.1); background: var(--surface-1); }
.tb-search::before {
  content: '\2315'; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); color: var(--ink-3); font-size: 14px; pointer-events: none;
}
.tb-spacer { flex: 1; }
.tb-icon-btn {
  width: 36px; height: 36px; border: 1px solid var(--surface-border);
  background: var(--surface-2); border-radius: var(--r-full);
  cursor: pointer; font-size: 14px; color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--fast); flex-shrink: 0;
}
.tb-icon-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tb-cmd-hint {
  font-size: 10px; font-weight: 600; color: var(--ink-3);
  background: var(--surface-0); border: 1px solid var(--surface-border);
  padding: 2px 6px; border-radius: var(--r-xs); margin-left: -8px;
}

/* ── View Layout ── */
.v-header { padding: 32px 32px 0; }
.v-header h1 {
  font-family: Outfit, sans-serif; font-size: 28px; font-weight: 800;
  color: var(--ink-0); margin-bottom: 4px; letter-spacing: -0.03em;
}
.v-sub { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.v-body {
  padding: 24px 32px 48px; flex: 1;
  animation: fadeUp 0.4s var(--ease);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ══════════════════════════════════════════════
   SHARED COMPONENTS
   ══════════════════════════════════════════════ */

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--r-full);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all var(--fast);
  border: 1px solid var(--surface-border);
  background: var(--surface-1); color: var(--ink-1);
}
.btn:hover { border-color: var(--ink-4); box-shadow: var(--shadow-sm); }
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 2px 8px rgba(var(--accent-rgb),0.25);
}
.btn-primary:hover { box-shadow: 0 4px 14px rgba(var(--accent-rgb),0.35); transform: translateY(-1px); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-0); color: var(--ink-1); }
.btn-danger { background: var(--st-rejected); color: #fff; border-color: transparent; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Tab bar */
.tab-bar { display: flex; gap: 0; border-bottom: 2px solid var(--surface-border); margin-bottom: 24px; width: fit-content; background: none; border-radius: 0; padding: 0; }
.tab-btn {
  padding: 10px 20px; border: none; background: transparent;
  border-radius: 0; font-family: Outfit, sans-serif; font-size: 13px;
  font-weight: 600; color: var(--ink-3); cursor: pointer;
  transition: all var(--fast); border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.tab-btn:hover { color: var(--ink-1); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; background: none; box-shadow: none; }

/* Status badge */
.status-badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 600;
  color: #fff; letter-spacing: 0.01em;
}

/* Tags */
.tag {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 500;
  background: var(--surface-0); color: var(--ink-2);
  border: 1px solid var(--surface-border);
}
.tag-primary { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.tag-clickable { cursor: pointer; transition: all var(--fast); }
.tag-clickable:hover { transform: scale(1.04); }

/* Data table */
.data-table-wrap { background: var(--surface-1); border: 1px solid var(--surface-border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.data-table-title {
  padding: 14px 18px 0; font-family: Outfit, sans-serif;
  font-size: 15px; font-weight: 700; color: var(--ink-1);
}
.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.data-table th {
  text-align: left; padding: 10px 14px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--ink-3); border-bottom: 1px solid var(--surface-border);
}
.data-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--surface-border);
  color: var(--ink-2); vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--surface-2); }

.list-th { cursor: pointer; user-select: none; }
.list-th:hover { color: var(--ink-1); }
.sort-arrow { font-size: 9px; margin-left: 3px; }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 20px; transition: all var(--fast);
  border-top: 3px solid var(--accent); box-shadow: var(--shadow-sm);
}
.kpi-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
.kpi-label { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-value { font-family: Outfit, sans-serif; font-size: 26px; font-weight: 800; color: var(--ink-0); letter-spacing: -0.02em; }
.kpi-trend { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: var(--r-full); }
.kpi-trend.up { background: rgba(22,163,74,0.12); color: #16a34a; }
.kpi-trend.down { background: rgba(220,38,38,0.1); color: #dc2626; }
.kpi-trend.flat { background: var(--surface-0); color: var(--ink-3); }
.kpi-spark { margin: 10px 0 4px; }
.kpi-sub { font-size: 11px; color: var(--ink-3); }

/* Charts row */
.charts-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
.chart-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 20px;
  border-left: 3px solid var(--accent);
}
.chart-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); margin-bottom: 16px; letter-spacing: -0.02em; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700;
  background: var(--surface-0); color: var(--ink-2);
}

/* Heatmap */
.heatmap-wrap { overflow-x: auto; }
.heatmap-grid { display: grid; grid-template-columns: 40px repeat(24, 1fr); gap: 2px; min-width: 600px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 3px; min-width: 14px; }
.heatmap-dow-label { font-size: 10px; font-weight: 600; color: var(--ink-3); display: flex; align-items: center; }
.heatmap-hour-label { font-size: 9px; color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; }

/* Stat tiles */
.stat-row { display: grid; gap: 16px; margin-bottom: 22px; }
.stat-tile {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px;
  border-top: 3px solid var(--accent);
  transition: all var(--fast);
}
.stat-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.stat-label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-value { font-family: Outfit, sans-serif; font-size: 26px; font-weight: 800; color: var(--ink-0); }
.stat-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

/* ── Briefing ── */
.briefing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.briefing-section {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden;
  border-left: 3px solid var(--accent);
  box-shadow: var(--shadow-sm);
}
.briefing-section.full-width { grid-column: 1 / -1; }
.briefing-section-header {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-2);
}
.briefing-section-icon {
  width: 34px; height: 34px; border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0;
}
.briefing-section-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); }
.briefing-section-count {
  margin-left: auto; font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: var(--r-full);
}
.briefing-section-body { padding: 14px 18px; }
.briefing-empty { padding: 20px 0; text-align: center; font-size: 13px; color: var(--ink-3); }

.briefing-post-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--surface-border);
  cursor: pointer; transition: background var(--fast);
}
.briefing-post-row:last-child { border-bottom: none; }
.briefing-post-row:hover { background: var(--surface-2); margin: 0 -16px; padding: 8px 16px; border-radius: var(--r-sm); }
.briefing-post-day {
  width: 42px; text-align: center; border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); padding: 4px; flex-shrink: 0;
}
.briefing-post-day .dow { display: block; font-size: 9px; font-weight: 600; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.04em; }
.briefing-post-day .dom { display: block; font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); line-height: 1.1; }
.briefing-post-info { flex: 1; min-width: 0; }
.briefing-post-title { font-size: 13px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.briefing-post-meta {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 11px; color: var(--ink-3); margin-top: 2px;
}
.briefing-status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.briefing-post-action {
  padding: 4px 10px; border-radius: var(--r-full); font-size: 11px; font-weight: 600;
  border: none; cursor: pointer; flex-shrink: 0; transition: all var(--fast);
}
.briefing-post-action.needs-work { background: rgba(245,158,11,0.1); color: #d97706; }
.briefing-post-action.needs-review { background: rgba(249,115,22,0.1); color: #ea580c; }
.briefing-post-action.ready { background: rgba(34,197,94,0.1); color: #16a34a; }

.briefing-gap-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 0;
  border-bottom: 1px solid var(--surface-border);
}
.briefing-gap-row:last-child { border-bottom: none; }
.briefing-gap-icon { font-size: 14px; }
.briefing-gap-text { flex: 1; font-size: 13px; color: var(--ink-2); }
.briefing-gap-add {
  padding: 3px 10px; background: transparent; border: 1px dashed var(--surface-border-strong);
  border-radius: var(--r-full); font-size: 11px; font-weight: 600; color: var(--accent);
  cursor: pointer; transition: all var(--fast);
}
.briefing-gap-add:hover { background: var(--accent-soft); border-style: solid; }

.briefing-perf-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--surface-border); }
.briefing-perf-row:last-child { border-bottom: none; }
.briefing-perf-thumb {
  width: 32px; height: 32px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
}
.briefing-perf-info { flex: 1; min-width: 0; }
.briefing-perf-title { font-size: 13px; font-weight: 600; color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.briefing-perf-stats { display: flex; gap: 10px; font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.briefing-perf-stat .val { font-weight: 700; color: var(--ink-2); }

/* ── Calendar ── */
.cal-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.cal-nav-btn {
  width: 34px; height: 34px; border: 1px solid var(--surface-border);
  background: var(--surface-1); border-radius: var(--r-full); cursor: pointer;
  font-size: 16px; color: var(--ink-2); display: flex; align-items: center; justify-content: center;
  transition: all var(--fast);
}
.cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.cal-month-label { font-family: Outfit, sans-serif; font-size: 18px; font-weight: 700; color: var(--ink-0); letter-spacing: -0.02em; }
.cal-today-btn {
  margin-left: auto; padding: 6px 16px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-full); font-size: 12px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; transition: all var(--fast);
}
.cal-today-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
  background: var(--surface-border); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden;
}
.cal-dow {
  padding: 10px; text-align: center; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-3); background: var(--surface-2); font-family: Outfit, sans-serif;
}
.cal-day {
  background: var(--surface-1); padding: 8px; min-height: 110px;
  cursor: pointer; transition: background var(--fast);
}
.cal-day:hover { background: var(--surface-2); }
.cal-day.outside { background: var(--surface-0); opacity: 0.4; }
.cal-day.today { background: var(--accent-soft); border-left: 3px solid var(--accent); }
.cal-day-num-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.cal-day-num { font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 800; }
.cal-day-count {
  font-size: 10px; font-weight: 700; color: var(--accent);
  background: var(--accent-soft); padding: 1px 7px; border-radius: var(--r-full);
}
.cal-post-row {
  display: flex; align-items: center; gap: 4px;
  padding: 3px 6px; margin-bottom: 3px; border-radius: var(--r-sm);
  font-size: 10px; font-weight: 500; color: var(--ink-1);
  background: var(--surface-0); cursor: pointer; transition: all var(--fast);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-left: 2px solid transparent;
}
.cal-post-row:hover { background: var(--surface-border); border-left-color: var(--accent); }
.cal-plat-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.cal-overflow { font-size: 10px; color: var(--accent); font-weight: 700; padding: 2px 6px; }

/* Week view */
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.week-col {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 12px; min-height: 200px;
  transition: border-color var(--fast);
}
.week-col.today { border-color: var(--accent); border-top: 3px solid var(--accent); }
.week-col-head { text-align: center; padding-bottom: 10px; border-bottom: 1px solid var(--surface-border); margin-bottom: 10px; }
.week-col-dow { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.06em; font-family: Outfit, sans-serif; }
.week-col-num { font-family: Outfit, sans-serif; font-size: 20px; font-weight: 700; color: var(--ink-0); }
.week-col.today .week-col-num { color: var(--accent); }
.week-empty { text-align: center; padding: 20px 0; font-size: 11px; color: var(--ink-3); }
.week-card {
  background: var(--surface-2); border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); padding: 10px; margin-bottom: 8px;
  cursor: pointer; transition: all var(--fast);
  border-left: 3px solid transparent;
}
.week-card:hover { border-left-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.week-card-time { font-size: 10px; font-weight: 600; color: var(--ink-3); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
.week-card-title { font-size: 12px; font-weight: 600; color: var(--ink-1); margin-bottom: 4px; }
.week-card-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.week-card-plat { width: 6px; height: 6px; border-radius: 50%; }
.week-card-status { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: var(--r-full); }

/* ── Pipeline ── */
.pipeline-board {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
  overflow-x: auto; padding-bottom: 4px;
}
.pipeline-col {
  background: var(--surface-0); border-radius: var(--r-lg); padding: 12px;
  border-top: 3px solid var(--accent); min-height: 300px;
}
.pipeline-col:nth-child(2) { border-top-color: #f59e0b; }
.pipeline-col:nth-child(3) { border-top-color: #3b82f6; }
.pipeline-col:nth-child(4) { border-top-color: #8b5cf6; }
.pipeline-col:nth-child(5) { border-top-color: #ec4899; }
.pipeline-col:nth-child(6) { border-top-color: #22c55e; }
.pipeline-col-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.pipeline-col-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-family: Outfit, sans-serif; }
.pipeline-col-count {
  font-size: 11px; font-weight: 700; background: var(--surface-1);
  padding: 2px 9px; border-radius: var(--r-full); color: var(--ink-2);
}
.pipeline-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); padding: 12px; margin-bottom: 8px;
  cursor: pointer; transition: all var(--fast);
  border-left: 3px solid transparent;
}
.pipeline-card:hover { border-left-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.pipeline-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.pipeline-card-brand {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: var(--r-full);
}
.pipeline-drag-handle { color: var(--ink-4); font-size: 12px; cursor: grab; }
.pipeline-card-title { font-size: 12px; font-weight: 600; color: var(--ink-1); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.pipeline-media-icon { font-size: 12px; }
.pipeline-pillar-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.pipeline-card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pipeline-plat-dot { width: 6px; height: 6px; border-radius: 50%; }
.pipeline-card-date { font-size: 11px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
.pipeline-quick-add {
  display: block; width: 100%; padding: 12px;
  border: 2px dashed var(--surface-border-strong); border-radius: var(--r-md);
  background: transparent; color: var(--accent); font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all var(--fast); margin-top: 8px;
}
.pipeline-quick-add:hover { background: var(--accent-soft); border-color: var(--accent); border-style: solid; }
.metrics-btn {
  font-size: 11px; padding: 4px 10px; background: var(--surface-0);
  border: 1px solid var(--surface-border); border-radius: var(--r-full);
  color: var(--ink-2); cursor: pointer; transition: all var(--fast); font-weight: 600;
}
.metrics-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ── Strategy ── */
.strat-add-bar { display: flex; justify-content: flex-end; margin-bottom: 18px; }
.strategy-section {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); margin-bottom: 10px; overflow: hidden;
  border-left: 3px solid var(--accent);
  transition: box-shadow var(--fast);
}
.strategy-section:hover { box-shadow: var(--shadow-sm); }
.strategy-section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; cursor: pointer; transition: background var(--fast);
}
.strategy-section-header:hover { background: var(--surface-2); }
.strategy-section-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); }
.strategy-section-actions { display: flex; align-items: center; gap: 8px; }
.btn-edit, .btn-del {
  padding: 4px 10px; border: none; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--ink-3); border-radius: var(--r-full); transition: all var(--fast);
}
.btn-edit:hover { background: var(--accent-soft); color: var(--accent); }
.btn-del:hover { background: rgba(239,68,68,0.08); color: var(--st-rejected); }
.strategy-section-toggle { transition: transform var(--normal); font-size: 10px; color: var(--ink-3); }
.strategy-section-body {
  padding: 14px 18px; border-top: 1px solid var(--surface-border);
  font-size: 13px; color: var(--ink-2); line-height: 1.7; white-space: pre-wrap;
}
.strat-linked-chip {
  padding: 4px 12px; border-radius: var(--r-full); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all var(--fast);
}
.strat-linked-chip.chip-shotlist { background: rgba(249,115,22,0.08); color: #ea580c; }
.strat-linked-chip.chip-brief { background: rgba(13,148,136,0.08); color: var(--accent-ink); }
.strat-linked-chip:hover { transform: scale(1.04); box-shadow: var(--shadow-sm); }

/* ── Content Grid (Shot Lists / Briefs) ── */
.content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.content-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden; transition: all var(--fast);
  border-top: 3px solid var(--accent);
}
.content-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.content-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 16px 18px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-2);
}
.content-card-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-1); }
.content-card-badge {
  font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-full);
}
.content-card-body { padding: 16px 18px; font-size: 13px; color: var(--ink-2); line-height: 1.7; }
.content-card-body p { margin-bottom: 8px; }

.checklist-item { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }
.checklist-bullet {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0; margin-top: 7px;
}

/* ── Team ── */
.team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.team-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px; transition: all var(--fast);
  border-left: 3px solid var(--accent);
}
.team-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.team-card-name { font-family: Outfit, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink-0); }
.team-card-role { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 2px; }
.team-card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ── Themes ── */
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.theme-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 16px; transition: all var(--fast);
  border-top: 3px solid var(--surface-border);
}
.theme-card:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.theme-card.peak { border-top-color: var(--accent); }
.theme-card-month {
  font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase;
  letter-spacing: 0.08em; font-family: Outfit, sans-serif;
  background: var(--accent-soft); display: inline-block; padding: 2px 8px; border-radius: var(--r-full);
}
.theme-card-title { font-family: Outfit, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink-0); margin-top: 8px; }
.theme-card-desc { font-size: 12px; color: var(--ink-2); margin-top: 6px; line-height: 1.6; }

/* ── Connections ── */
.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.conn-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px; transition: all var(--fast);
  border-left: 4px solid var(--surface-border-strong);
}
.conn-card:hover { box-shadow: var(--shadow-sm); }
.conn-card.is-connected { border-left-color: #16a34a; }
.conn-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.conn-card-id { display: flex; align-items: center; gap: 10px; }
.conn-icon {
  width: 38px; height: 38px; border-radius: var(--r-sm); display: flex; align-items: center;
  justify-content: center; font-size: 18px; color: #fff; flex-shrink: 0;
}
.conn-name { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-0); }
.conn-status-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.conn-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
.conn-card.is-connected .conn-status-dot { background: #16a34a; }
.conn-status-text { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.conn-card.is-connected .conn-status-text { color: #16a34a; }
.conn-card-body { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--surface-border); }
.conn-detail-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); padding: 3px 0; }
.conn-detail-row span:first-child { color: var(--ink-3); }
.conn-detail-row span:last-child { font-weight: 600; color: var(--ink-1); }
.conn-card-actions { display: flex; gap: 8px; margin-top: 14px; }
.conn-card-actions .btn { flex: 1; }
.conn-settings-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 20px; margin-top: 8px;
}
.conn-settings-title { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-0); margin-bottom: 14px; }
.oauth-url-box {
  background: var(--surface-0); border: 1px solid var(--surface-border); border-radius: var(--r-sm);
  padding: 10px 12px; font-family: 'SF Mono', Menlo, monospace; font-size: 11px; color: var(--ink-2);
  word-break: break-all; margin: 10px 0 16px; line-height: 1.6;
}
.conn-modal-steps { font-size: 13px; color: var(--ink-2); line-height: 1.7; margin-bottom: 4px; }
.conn-modal-steps ol { margin: 8px 0 0 18px; padding: 0; }
.drive-search-input { width: 100%; margin-bottom: 14px; }
.drive-file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.drive-file-card {
  background: var(--surface-0); border: 1px solid var(--surface-border); border-radius: var(--r-sm);
  padding: 10px; cursor: pointer; transition: all var(--fast); text-align: center;
}
.drive-file-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.drive-file-thumb { font-size: 30px; margin-bottom: 6px; }
.drive-file-name { font-size: 11px; color: var(--ink-1); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drive-file-meta { font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.drive-connect-note {
  font-size: 12px; color: var(--ink-3); background: var(--surface-0); border: 1px dashed var(--surface-border-strong);
  border-radius: var(--r-sm); padding: 10px 12px; margin-top: 14px;
}

/* ── Empty State ── */
.empty-state { padding: 60px 20px; text-align: center; }
.empty-state svg { width: 72px; height: 72px; margin: 0 auto 16px; display: block; opacity: 0.6; }
.empty-state-text { font-size: 14px; color: var(--ink-3); max-width: 320px; margin: 0 auto; line-height: 1.6; }

/* ══════════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════════ */
#modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15,14,12,0.5); backdrop-filter: blur(8px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 5vh 16px; overflow-y: auto;
}
#modal-panel {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-xl);
  width: 540px; max-width: 100%; animation: modalIn 0.25s var(--ease);
}
#modal-panel.wide { width: 700px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-2);
}
.modal-title { font-family: Outfit, sans-serif; font-size: 17px; font-weight: 700; color: var(--ink-0); letter-spacing: -0.02em; }
.modal-close {
  width: 30px; height: 30px; border: none; background: var(--surface-0);
  border-radius: var(--r-full); cursor: pointer; font-size: 13px; color: var(--ink-3);
  display: flex; align-items: center; justify-content: center; transition: all var(--fast);
}
.modal-close:hover { background: rgba(239,68,68,0.08); color: var(--st-rejected); }
.modal-body { padding: 20px 24px; max-height: 60vh; overflow-y: auto; }
.modal-footer {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 24px; border-top: 1px solid var(--surface-border);
}

/* Form controls */
.form-row { display: grid; gap: 16px; margin-bottom: 16px; }
.form-row.two-col { grid-template-columns: 1fr 1fr; }
.form-row.full { grid-template-columns: 1fr; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.form-input, .form-select {
  padding: 10px 14px; border: 1px solid var(--surface-border);
  border-radius: var(--r-md); background: var(--surface-0);
  font-family: inherit; font-size: 13px; color: var(--ink-1);
  outline: none; transition: border-color var(--fast), box-shadow var(--fast);
}
.form-input:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-textarea {
  padding: 10px 14px; border: 1px solid var(--surface-border);
  border-radius: var(--r-md); background: var(--surface-0);
  font-family: inherit; font-size: 13px; color: var(--ink-1);
  min-height: 80px; resize: vertical; outline: none;
  transition: border-color var(--fast), box-shadow var(--fast);
}
.form-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.char-count { font-size: 10px; font-weight: 500; color: var(--ink-3); margin-left: auto; }
.char-count.over { color: var(--st-rejected); }
.caption-preview {
  margin-top: 6px; padding: 8px 10px; background: var(--surface-2);
  border-radius: var(--r-sm); font-size: 12px; color: var(--ink-2);
  white-space: pre-wrap; max-height: 80px; overflow-y: auto; line-height: 1.5;
}
.hashtag-suggestions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

/* ═══ Command Palette ═══ */
#cmd-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(15,14,12,0.55); backdrop-filter: blur(10px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 15vh 16px;
}
#cmd-panel {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-xl); box-shadow: var(--shadow-xl);
  width: 540px; max-width: 100%; overflow: hidden;
  animation: modalIn 0.15s var(--ease);
}
#cmd-input {
  width: 100%; padding: 16px 20px; border: none; background: transparent;
  font-family: Outfit, sans-serif; font-size: 16px; color: var(--ink-1); outline: none;
  border-bottom: 1px solid var(--surface-border); font-weight: 500;
}
#cmd-input::placeholder { color: var(--ink-3); }
#cmd-results { max-height: 340px; overflow-y: auto; padding: 8px; }
.cmd-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: var(--r-md); cursor: pointer;
  transition: all var(--fast);
}
.cmd-item:hover, .cmd-item.selected { background: var(--accent-soft); }
.cmd-item-icon { width: 22px; text-align: center; font-size: 15px; color: var(--accent); }
.cmd-item-text { font-size: 13px; font-weight: 600; color: var(--ink-1); }
.cmd-item-hint { margin-left: auto; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ═══ Toast ═══ */
#toast-container {
  position: fixed; bottom: 24px; right: 24px; z-index: 300;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 12px 20px; border-radius: var(--r-full);
  font-size: 13px; font-weight: 600; color: #fff;
  box-shadow: var(--shadow-lg); animation: toastIn 0.3s var(--ease);
  display: flex; align-items: center; gap: 10px;
}
.toast.success { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); }
.toast.error { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%); }
.toast.info { background: linear-gradient(135deg, var(--accent) 0%, #0f766e 100%); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.95); } to { opacity: 1; transform: none; } }

/* ── Loading ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 80px 20px; flex: 1;
}
.loading-spinner {
  width: 32px; height: 32px; border: 3px solid var(--surface-border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Mobile ── */
#mobile-header {
  display: none; padding: 14px 18px;
  background: linear-gradient(135deg, #1e3a5f 0%, #142a45 100%);
  border-bottom: none;
  align-items: center; justify-content: space-between;
}
#mobile-header .sb-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.06em; }
#hamburger {
  width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1); border-radius: var(--r-full);
  cursor: pointer; font-size: 16px; color: #fff;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--fast);
}
#hamburger:hover { background: rgba(255,255,255,0.2); }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { position: fixed; left: -260px; top: 0; width: 260px; z-index: 50; transition: left 0.3s var(--ease); }
  #sidebar.open { left: 0; }
  #mobile-header { display: flex; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .pipeline-board { grid-template-columns: repeat(3, 1fr); }
  .charts-row { grid-template-columns: 1fr; }
  .briefing-grid { grid-template-columns: 1fr; }
  .v-header, .v-body, #topbar { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 600px) {
  .pipeline-board { grid-template-columns: 1fr 1fr; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .week-grid { grid-template-columns: repeat(3, 1fr); }
  .form-row.two-col { grid-template-columns: 1fr; }
}

/* ══════════════════════════════════════════════
   PHASE 1 ENHANCEMENTS
   ══════════════════════════════════════════════ */

/* ── Sidebar collapse ── */
#app { transition: grid-template-columns var(--normal); }
#app.sidebar-collapsed { grid-template-columns: 64px 1fr; }
#sidebar { transition: width var(--normal); }
.sb-nav-label, .sb-new-label { transition: opacity var(--fast); }
#sidebar.collapsed .sb-label,
#sidebar.collapsed .sb-nav-label,
#sidebar.collapsed .sb-new-label,
#sidebar.collapsed .sb-title,
#sidebar.collapsed .sb-pills,
#sidebar.collapsed .sb-counters,
#sidebar.collapsed .nav-badge,
#sidebar.collapsed .sb-collapse-label { display: none; }
#sidebar.collapsed .sb-header { padding: 14px 8px; display: flex; justify-content: center; }
#sidebar.collapsed .sb-logo img { height: 30px; }
#sidebar.collapsed .sb-nav-link { justify-content: center; padding: 10px 6px; border-left: none; }
#sidebar.collapsed .sb-nav-link.active { border-left: none; box-shadow: inset 3px 0 0 var(--accent); }
#sidebar.collapsed .sb-new-btn { margin: 0 8px; padding: 12px 0; }
#sidebar.collapsed .sb-nav { padding: 0 6px; }
.sb-bottom { padding: 10px 8px 0; border-top: 1px solid var(--sidebar-border); margin-top: 6px; }
.sb-collapse-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 8px; background: transparent; border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); color: var(--sidebar-text); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all var(--fast); font-family: inherit;
}
.sb-collapse-btn:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); border-color: var(--accent); }
.sb-collapse-icon { font-size: 12px; flex-shrink: 0; }

/* ── Notification badges ── */
.nav-badge {
  margin-left: auto; background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 700; line-height: 1; padding: 3px 6px;
  border-radius: var(--r-full); min-width: 16px; text-align: center; flex-shrink: 0;
}

/* ── Date range dropdown (Analytics) ── */
.v-header-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* ── Heatmap legend + tooltip ── */
.heatmap-cell { transition: transform var(--fast), filter var(--fast), box-shadow var(--fast); cursor: pointer; position: relative; }
.heatmap-cell:hover { transform: scale(1.35); filter: brightness(1.25); box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 2; }
.heatmap-legend { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 11px; color: var(--ink-3); }
.heatmap-legend-bar {
  flex: 1; max-width: 220px; height: 10px; border-radius: var(--r-full);
  background: linear-gradient(90deg, rgba(var(--accent-rgb),0.06), rgba(var(--accent-rgb),1));
  border: 1px solid var(--surface-border);
}
#heatmap-tooltip {
  position: fixed; z-index: 200; pointer-events: none;
  background: var(--ink-0); color: var(--bg); font-size: 11px; font-weight: 600;
  padding: 6px 10px; border-radius: var(--r-sm); box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(4px); transition: opacity var(--fast), transform var(--fast);
  white-space: nowrap;
}
#heatmap-tooltip.show { opacity: 1; transform: translateY(0); }

/* ── Chart entrance animations ── */
@keyframes barGrowX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes donutIn { from { opacity: 0; transform: scale(0.55); } to { opacity: 1; transform: scale(1); } }
@keyframes sparkDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes sparkFadeArea { from { opacity: 0; } to { opacity: 0.12; } }
.chart-bar-track { overflow: visible; }
.chart-bar-fill { animation: barGrowX 0.65s var(--ease) both; }
.donut-seg { animation: donutIn 0.5s var(--ease) both; transform-box: fill-box; transform-origin: center; }
.spark-line { animation: sparkDraw 0.9s var(--ease) both; }
.spark-area { animation: sparkFadeArea 0.9s var(--ease) both; }

/* ── Calendar platform filter pills ── */
.cal-filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.cal-filter-pill {
  display: flex; align-items: center; gap: 6px; padding: 6px 12px;
  border: 1px solid var(--surface-border); background: var(--surface-1);
  border-radius: var(--r-full); font-size: 12px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; transition: all var(--fast); opacity: 0.55;
}
.cal-filter-pill.active { opacity: 1; border-color: var(--surface-border-strong); box-shadow: var(--shadow-sm); }
.cal-filter-pill:hover { opacity: 1; }
.cal-filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Skeleton loading ── */
.skel {
  background: linear-gradient(90deg, var(--surface-0) 25%, var(--surface-border) 37%, var(--surface-0) 63%);
  background-size: 400% 100%; animation: skelPulse 1.4s ease-in-out infinite;
  border-radius: var(--r-sm);
}
@keyframes skelPulse { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
.skel-wrap { padding: 24px 32px; }
.skel-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.skel-kpi-card { background: var(--surface-1); border: 1px solid var(--surface-border); border-radius: var(--r-lg); padding: 20px; }
.skel-line { height: 10px; margin-bottom: 10px; width: 60%; }
.skel-line.wide { width: 90%; height: 22px; }
.skel-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 24px; }
.skel-cal-cell { height: 72px; border-radius: var(--r-sm); }
.skel-pipeline-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
.skel-pipeline-col { background: var(--surface-0); border-radius: var(--r-lg); padding: 12px; }
.skel-pipeline-card { height: 56px; border-radius: var(--r-md); margin-bottom: 8px; }
.skel-table { border: 1px solid var(--surface-border); border-radius: var(--r-lg); overflow: hidden; }
.skel-table-row { display: flex; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--surface-border); }
.skel-table-row .skel { height: 12px; flex: 1; }

/* ── Pipeline inline status change ── */
.pipeline-status-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
  border-radius: var(--r-full); font-size: 10px; font-weight: 700; color: #fff;
  cursor: pointer; position: relative; transition: filter var(--fast);
}
.pipeline-status-badge:hover { filter: brightness(1.1); }
.pipeline-status-badge::after { content: '\25BE'; font-size: 9px; opacity: 0.8; }
.pipeline-status-menu {
  position: absolute; top: calc(100% + 4px); left: 0; min-width: 140px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg); padding: 5px; z-index: 30;
  text-align: left;
}
.pipeline-status-menu .tb-dropdown-item { color: var(--ink-2); font-weight: 500; }

/* ── List view inline status change ── */
.list-status-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
  border-radius: var(--r-full); font-size: 10px; font-weight: 700; color: #fff;
  cursor: pointer; position: relative; transition: filter var(--fast);
}
.list-status-badge:hover { filter: brightness(1.1); }
.list-status-badge::after { content: '\25BE'; font-size: 9px; opacity: 0.8; }

/* ── Calendar event overlay ── */
.cal-event-chip {
  font-size: 8.5px; font-weight: 700; padding: 1px 5px; border-radius: var(--r-full);
  margin-bottom: 2px; display: block; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; max-width: 100%; line-height: 1.5;
}
.cal-event-chip.food { background: var(--brand-dt-soft); color: var(--brand-dt); }
.cal-event-chip.eco { background: var(--brand-koala-soft); color: var(--brand-koala); }
.cal-event-chip.general { background: var(--surface-0); color: var(--ink-3); border: 1px solid var(--surface-border); }
.cal-events-toggle {
  display: flex; align-items: center; gap: 6px; padding: 6px 14px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-full); font-size: 12px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; transition: all var(--fast); margin-left: 8px;
}
.cal-events-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.cal-events-toggle.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.cal-events-toggle .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); }
.cal-events-toggle.active .dot { background: var(--accent); }

/* ── Quick stats on calendar cards ── */
.cal-eng-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
.cal-eng-dot.high { background: #16a34a; box-shadow: 0 0 0 2px rgba(22,163,74,0.18); }
.cal-eng-dot.med { background: #e5a100; box-shadow: 0 0 0 2px rgba(229,161,0,0.18); }
.cal-eng-dot.low { background: #dc2626; box-shadow: 0 0 0 2px rgba(220,38,38,0.18); }

/* ── Competitors ── */
.competitor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 18px; }
.competitor-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px; transition: all var(--fast);
  border-top: 3px solid var(--ink-3);
}
.competitor-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.competitor-card-name { font-family: Outfit, sans-serif; font-size: 16px; font-weight: 700; color: var(--ink-0); }
.competitor-card-plats { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.competitor-plat-chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 600;
  background: var(--surface-0); color: var(--ink-2); border: 1px solid var(--surface-border);
}
.competitor-plat-chip .dot { width: 7px; height: 7px; border-radius: 50%; }
.competitor-card-notes { font-size: 12px; color: var(--ink-2); line-height: 1.6; margin: 8px 0; }
.competitor-card-stats { display: flex; gap: 10px; margin-top: 10px; }
.competitor-stat { flex: 1; background: var(--surface-2); border-radius: var(--r-sm); padding: 8px; text-align: center; }
.competitor-stat-val { font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700; color: var(--ink-0); }
.competitor-stat-lbl { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-3); margin-top: 2px; }
.competitor-card-actions { display: flex; gap: 6px; margin-top: 12px; }
.add-competitor-form {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px; border-left: 3px solid var(--accent);
}

/* ── Demographics panel ── */
.demo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.demo-city-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.demo-city-label { width: 110px; font-size: 12px; font-weight: 600; color: var(--ink-2); flex-shrink: 0; }
.demo-city-bar-track { flex: 1; height: 10px; background: var(--surface-0); border-radius: var(--r-full); overflow: hidden; }
.demo-city-bar-fill { height: 100%; border-radius: var(--r-full); background: var(--accent); }
.demo-city-pct { width: 38px; text-align: right; font-size: 11px; font-weight: 700; color: var(--ink-3); flex-shrink: 0; }
.demo-lang-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--surface-border); font-size: 13px; }
.demo-lang-row:last-child { border-bottom: none; }
.demo-note { font-size: 11px; color: var(--ink-3); margin-top: 12px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); display: flex; align-items: center; gap: 6px; }

/* ══════════════════════════════════════════════
   PHASE 3 FEATURES
   ══════════════════════════════════════════════ */
/* ── Drag & Drop: Calendar Rescheduling ── */
.cal-post-row[draggable="true"],
.week-card[draggable="true"] { cursor: grab; }
.cal-post-row.dragging,
.week-card.dragging {
  opacity: 0.4;
  cursor: grabbing;
}
.cal-day.drag-over,
.week-col.drag-over {
  background: var(--accent-soft) !important;
  outline: 2px dashed var(--accent);
  outline-offset: -2px;
  transition: background var(--fast), outline var(--fast);
}
.cal-day.drag-invalid,
.week-col.drag-invalid {
  outline: 2px dashed var(--st-rejected);
  outline-offset: -2px;
}

/* ── Inbox / Community Management ── */
.inbox-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.inbox-toolbar .form-select { min-width: 140px; }
.inbox-toolbar-spacer { flex: 1; }
.inbox-layout { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .inbox-layout { grid-template-columns: 1fr; } }

.inbox-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; border-bottom: 1px solid var(--surface-border);
  cursor: pointer; transition: background var(--fast);
}
.inbox-row:last-child { border-bottom: none; }
.inbox-row:hover { background: var(--surface-2); }
.inbox-plat-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff; font-weight: 700;
}
.inbox-row-body { flex: 1; min-width: 0; }
.inbox-row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.inbox-row-from { font-size: 13px; font-weight: 700; color: var(--ink-1); }
.inbox-row-type {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  padding: 2px 8px; border-radius: var(--r-full); background: var(--surface-0); color: var(--ink-3);
}
.inbox-row-date { font-size: 11px; color: var(--ink-3); margin-left: auto; flex-shrink: 0; }
.inbox-row-msg {
  font-size: 13px; color: var(--ink-2); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.inbox-row-brand { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.inbox-status-pill {
  font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: var(--r-full);
  color: #fff; flex-shrink: 0; text-transform: capitalize;
}
.inbox-status-pill.open { background: var(--st-review); }
.inbox-status-pill.responded { background: var(--st-scheduled); }
.inbox-status-pill.resolved { background: var(--st-posted); }

.inbox-detail-panel {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-sm);
}
.inbox-detail-empty { text-align: center; padding: 30px 10px; color: var(--ink-3); font-size: 13px; }
.inbox-reply-box textarea {
  width: 100%; min-height: 90px; padding: 10px 12px; border-radius: var(--r-md);
  border: 1px solid var(--surface-border); background: var(--surface-2);
  font-family: inherit; font-size: 13px; color: var(--ink-1); resize: vertical;
}
.inbox-reply-box textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.inbox-templates { margin-top: 18px; }
.inbox-template-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); padding: 10px 12px; margin-bottom: 8px;
  cursor: pointer; transition: all var(--fast);
}
.inbox-template-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.inbox-template-title { font-size: 12px; font-weight: 700; color: var(--ink-1); margin-bottom: 3px; }
.inbox-template-text { font-size: 11px; color: var(--ink-3); line-height: 1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* ── Report Generator ── */
.report-modal-body .form-row { margin-bottom: 14px; }
.report-metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.report-metric-check {
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2);
  padding: 8px 10px; border: 1px solid var(--surface-border); border-radius: var(--r-md);
  cursor: pointer; transition: all var(--fast); background: var(--surface-2);
}
.report-metric-check:hover { border-color: var(--accent); }
.report-metric-check input { accent-color: var(--accent); }

/* ── Instagram Feed Preview ── */
.feed-phone {
  width: 300px; margin: 0 auto; background: #111; border-radius: 36px;
  padding: 14px 10px; box-shadow: var(--shadow-xl);
}
.feed-phone-screen { background: #fff; border-radius: 24px; overflow: hidden; }
.feed-phone-notch { width: 60px; height: 6px; background: #333; border-radius: 4px; margin: 0 auto 8px; }
.feed-ig-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid #efefef; font-family: Outfit, sans-serif;
}
.feed-ig-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4); flex-shrink: 0; }
.feed-ig-username { font-size: 13px; font-weight: 700; color: #111; }
.feed-ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.feed-ig-cell {
  aspect-ratio: 1; position: relative; overflow: hidden; background: var(--surface-0);
  display: flex; align-items: center; justify-content: center;
}
.feed-ig-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.feed-ig-cell-placeholder {
  width: 100%; height: 100%; display: flex; align-items: flex-end;
  padding: 6px; font-size: 9px; line-height: 1.3; color: #fff; font-weight: 600;
}
.feed-ig-empty { grid-column: 1 / -1; padding: 30px 10px; text-align: center; font-size: 12px; color: var(--ink-3); background: #fafafa; }
.feed-preview-wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
.feed-preview-side { min-width: 220px; flex: 1; }

/* ── Bulk Actions (List View) ── */
.bulk-checkbox-cell { width: 34px; text-align: center !important; }
.bulk-checkbox { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.bulk-action-bar {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px;
  background: var(--surface-1); border: 1px solid var(--surface-border-strong);
  border-radius: var(--r-full); box-shadow: var(--shadow-xl);
  padding: 10px 16px; z-index: 60; animation: bulkBarIn var(--spring);
}
@keyframes bulkBarIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
.bulk-action-count { font-size: 13px; font-weight: 700; color: var(--ink-1); white-space: nowrap; }
.bulk-action-bar .form-select { padding: 6px 10px; font-size: 12px; }

/* ── AI Caption Assist ── */
.caption-assist-btn { margin-left: auto; }
.caption-assist-panel {
  margin-top: 10px; background: var(--surface-2); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); padding: 14px;
}
.caption-assist-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.caption-assist-controls .form-select { flex: 1; min-width: 130px; font-size: 12px; padding: 6px 10px; }
.caption-assist-variations { display: flex; flex-direction: column; gap: 8px; }
.caption-variation {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); padding: 10px 12px; font-size: 12px; color: var(--ink-2);
  line-height: 1.6; white-space: pre-wrap;
}
.caption-variation-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
.caption-assist-empty { font-size: 12px; color: var(--ink-3); text-align: center; padding: 10px 0; }

/* ═══ LOGIN OVERLAY ═══ */
#login-overlay { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center;
  background: var(--login-bg); font-family: 'Outfit', sans-serif; }
#login-overlay[hidden] { display: none; }
.login-card { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 400px; width: 90%;
  box-shadow: 0 24px 64px rgba(0,0,0,0.25); text-align: center; }
.login-card img { height: 64px; margin-bottom: 8px; filter: none; }
.login-card h1 { font-size: 22px; font-weight: 700; color: #1a1512; margin: 8px 0 4px; }
.login-card p.login-sub { font-size: 13px; color: #7c7268; margin: 0 0 28px; }
.login-card label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: #5c5349; margin-bottom: 6px; }
.login-card input[type="email"], .login-card input[type="text"] { width: 100%; padding: 12px 14px; border: 1.5px solid #e2ddd6; border-radius: 10px;
  font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; box-sizing: border-box; transition: border-color 0.2s; }
.login-card input[type="email"]:focus, .login-card input[type="text"]:focus { border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13,148,136,0.12); }
.login-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; background: #0d9488; color: #fff;
  font-size: 15px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; margin-top: 16px; transition: background 0.2s; }
.login-btn:hover { background: #0f766e; }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.login-msg { font-size: 13px; margin-top: 16px; color: #5c5349; min-height: 20px; }
.login-msg.error { color: #dc2626; }
.login-msg.success { color: #16a34a; }

/* ═══ USER MENU ═══ */
.user-menu-wrap { position: relative; }
.user-avatar-btn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--surface-border);
  border-radius: var(--r-full); background: var(--surface-2); cursor: pointer; font-size: 12px; font-weight: 500;
  color: var(--ink-1); font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.user-avatar-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.user-avatar-circle { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.user-dropdown { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-sm); box-shadow: var(--shadow-lg); min-width: 200px; z-index: 100; overflow: hidden; }
.user-dropdown[hidden] { display: none; }
.user-dropdown .ud-header { padding: 12px 14px; border-bottom: 1px solid var(--surface-border); }
.user-dropdown .ud-name { font-weight: 600; font-size: 13px; color: var(--ink-1); }
.user-dropdown .ud-email { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.user-dropdown .ud-role { display: inline-block; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  padding: 2px 6px; border-radius: var(--r-full); background: var(--accent-soft); color: var(--accent-ink); margin-top: 4px; }
.user-dropdown button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: none; background: none;
  font-size: 13px; color: var(--ink-2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.user-dropdown button:hover { background: var(--surface-0); color: var(--ink-1); }
.user-dropdown .ud-logout { color: #dc2626; border-top: 1px solid var(--surface-border); }
.user-dropdown .ud-logout:hover { background: #fff1f2; }

/* ═══ ACTIVITY LOG ═══ */
.audit-entry { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--surface-border); align-items: flex-start; }
.audit-entry:last-child { border-bottom: none; }
.audit-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; background: var(--accent-soft); }
.audit-body { flex: 1; min-width: 0; }
.audit-who { font-weight: 600; font-size: 13px; color: var(--ink-1); }
.audit-what { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.audit-what strong { font-weight: 600; color: var(--ink-1); }
.audit-when { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.audit-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.audit-filter-btn { padding: 5px 12px; border: 1px solid var(--surface-border); border-radius: var(--r-full);
  background: var(--surface-1); font-size: 12px; color: var(--ink-2); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.audit-filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>

// ══════════════════════════════════════════════
let _gapiLoaded = typeof _gapiReady !== 'undefined' ? _gapiReady : false;
let _gisLoaded = false;
let _googleAccessToken = null;
let _pickerApiLoaded = false;

function onGapiLoaded() {
  _gapiLoaded = true;
  _gapiReady = true;

function _getDriveCredentials() {
  const state = loadApiConnections();
  const drive = state.drive || {};
  if (drive.connected && drive.client_id && drive.api_key) return drive;
  return null;
}

async function _ensurePickerApi() {
  if (_pickerApiLoaded) return true;
  if (!_gapiLoaded && !_gapiReady) {
    showToast('Google API is still loading — please try again in a moment', 'info');
    return false;
  }
  _gapiLoaded = true;
  return new Promise((resolve) => {
    gapi.load('picker', () => { _pickerApiLoaded = true; resolve(true); });
  });
}

function _requestDriveToken(clientId) {
  return new Promise((resolve, reject) => {
    if (_googleAccessToken) { resolve(_googleAccessToken); return; }
    if (typeof google === 'undefined' || !google.accounts) {
      reject(new Error('Google Identity Services not loaded yet'));
      return;
    }
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.readonly',
      callback: (resp) => {
        if (resp.error) { reject(new Error(resp.error_description || resp.error)); return; }
        _googleAccessToken = resp.access_token;
        // Token expires — clear after 50 min
        setTimeout(() => { _googleAccessToken = null; }, 50 * 60 * 1000);
        resolve(resp.access_token);
      },
    });
    tokenClient.requestAccessToken({ prompt: '' });
  });
}

function _openGooglePicker(accessToken, apiKey, callback) {
  const docsView = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setIncludeFolders(true)
    .setSelectFolderEnabled(false)
    .setMimeTypes('image/png,image/jpeg,image/gif,image/webp,video/mp4,video/quicktime,video/x-msvideo,video/webm');

  const allDriveView = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setIncludeFolders(true)
    .setSelectFolderEnabled(false)
    .setEnableDrives(true)
    .setLabel('Shared Drives');

  const recentView = new google.picker.DocsView(google.picker.ViewId.RECENTLY_PICKED);

  const picker = new google.picker.PickerBuilder()
    .enableFeature(google.picker.Feature.NAV_HIDDEN)
    .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
    .addView(docsView)
    .addView(allDriveView)
    .addView(recentView)
    .setOAuthToken(accessToken)
    .setDeveloperKey(apiKey)
    .setCallback(callback)
    .setTitle('Select media from Google Drive')
    .setMaxItems(5)
    .build();
  picker.setVisible(true);
}

async function launchDrivePicker() {
  const creds = _getDriveCredentials();
  if (!creds) {
    showToast('Connect Google Drive in Settings → Connections first', 'info');
    return null;
  }
  try {
    const ready = await _ensurePickerApi();
    if (!ready) return null;
    const token = await _requestDriveToken(creds.client_id);
    return new Promise((resolve) => {
      _openGooglePicker(token, creds.api_key, (data) => {
        if (data.action === google.picker.Action.PICKED) {
          resolve(data.docs);
        } else if (data.action === google.picker.Action.CANCEL) {
          resolve(null);
        }
      });
    });
  } catch (e) {
    console.error('Drive picker error:', e);
    showToast('Drive authentication failed: ' + e.message, 'error');
    _googleAccessToken = null; // clear stale token
    return null;
  }
}
