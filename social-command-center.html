<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Command Center | Sonaya Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* ── Tokens ── */
:root {
  --sidebar-bg: #0f172a;
  --sidebar-border: #1e293b;
  --sidebar-text: #94a3b8;
  --sidebar-text-bright: #e2e8f0;
  --sidebar-hover: rgba(255,255,255,0.04);
  --sidebar-active: rgba(99,102,241,0.12);

  --surface-0: #eef1f5;
  --surface-1: #ffffff;
  --surface-1-hover: #f8fafc;
  --surface-border: #e2e8f0;
  --surface-shadow: 0 1px 3px rgba(15,23,42,0.04);
  --surface-shadow-hover: 0 6px 20px rgba(15,23,42,0.10);

  --ink-1: #0f172a;
  --ink-2: #475569;
  --ink-3: #94a3b8;

  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-subtle: #eef2ff;
  --accent-ink: #4338ca;
  --accent-rgb: 99,102,241;

  --brand-sg: #1e3a5f;
  --brand-sg-accent: #c5a55a;
  --brand-sg-light: #f5f0e6;

  --brand-dt: #e11d48;
  --brand-dt-subtle: #fff1f2;
  --brand-koala: #16a34a;
  --brand-koala-subtle: #f0fdf4;

  --plat-ig: #E1306C;
  --plat-tt: #00C9B1;
  --plat-fb: #1877F2;
  --plat-yt: #FF0000;

  --st-idea: #94a3b8;
  --st-draft: #f59e0b;
  --st-review: #f97316;
  --st-approved: #22c55e;
  --st-scheduled: #6366f1;
  --st-posted: #10b981;
  --st-rejected: #ef4444;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  --chart-surface: #ffffff;
  --chart-grid: #e2e8f0;
  --chart-text: #64748b;

  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #0c1121;
    --surface-1: #162032;
    --surface-1-hover: #1c2a40;
    --surface-border: #283548;
    --surface-shadow: 0 1px 3px rgba(0,0,0,0.3);
    --surface-shadow-hover: 0 8px 24px rgba(0,0,0,0.45);
    --ink-1: #f1f5f9;
    --ink-2: #94a3b8;
    --ink-3: #64748b;
    --accent: #818cf8;
    --accent-hover: #6366f1;
    --accent-subtle: #1e1b4b;
    --accent-ink: #a5b4fc;
    --accent-rgb: 129,140,248;
    --brand-dt-subtle: #350a18;
    --brand-koala-subtle: #052e16;
    --sidebar-bg: #070c17;
    --sidebar-border: #162032;
    --chart-surface: #162032;
    --chart-grid: #283548;
    --chart-text: #94a3b8;
  }
}
:root[data-theme="dark"] {
  --surface-0: #0c1121;
  --surface-1: #162032;
  --surface-1-hover: #1c2a40;
  --surface-border: #283548;
  --surface-shadow: 0 1px 3px rgba(0,0,0,0.3);
  --surface-shadow-hover: 0 8px 24px rgba(0,0,0,0.45);
  --ink-1: #f1f5f9;
  --ink-2: #94a3b8;
  --ink-3: #64748b;
  --accent: #818cf8;
  --accent-hover: #6366f1;
  --accent-subtle: #1e1b4b;
  --accent-ink: #a5b4fc;
  --accent-rgb: 129,140,248;
  --brand-dt-subtle: #350a18;
  --brand-koala-subtle: #052e16;
  --sidebar-bg: #070c17;
  --sidebar-border: #162032;
  --chart-surface: #162032;
  --chart-grid: #283548;
  --chart-text: #94a3b8;
}

/* ── Base ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--surface-0);
  color: var(--ink-1);
  line-height: 1.5;
  min-height: 100vh;
}
::selection { background: rgba(var(--accent-rgb),0.25); }

/* ── Layout ── */
#app {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

/* ── Sidebar ── */
#sidebar {
  background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg));
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  padding: 24px 14px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 2px; }

.sidebar-header { padding: 0 8px; margin-bottom: 24px; }
.sidebar-logo-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}
.sidebar-logo-mark {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}
.sidebar-brand-text {
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-sg-accent);
  letter-spacing: 0.04em;
  line-height: 1.2;
}
.sidebar-eyebrow {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.sidebar-title {
  font-family: 'Outfit', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--sidebar-text-bright);
  line-height: 1.25;
}
.sidebar-divider {
  height: 1px;
  background: var(--sidebar-border);
  margin: 12px 0 4px;
}

.sidebar-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--sidebar-text);
  padding: 0 10px;
  margin: 20px 0 6px;
}

.brand-pills {
  display: flex;
  gap: 4px;
  padding: 0 4px;
}
.brand-pill {
  flex: 1;
  padding: 6px 4px;
  border: none;
  background: transparent;
  color: var(--sidebar-text);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
  text-align: center;
  white-space: nowrap;
}
.brand-pill:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
.brand-pill.active { background: var(--sidebar-active); color: var(--accent); }

/* sidebar quick counters */
.sidebar-counters {
  display: flex;
  gap: 8px;
  padding: 0 4px;
  margin-top: 10px;
}
.sidebar-counter {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--sidebar-border);
  border-radius: var(--radius-sm);
  padding: 8px 6px;
  text-align: center;
  transition: background var(--transition-fast);
}
.sidebar-counter:hover { background: rgba(255,255,255,0.06); }
.sidebar-counter-val {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--sidebar-text-bright);
  line-height: 1.1;
}
.sidebar-counter-lbl {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--sidebar-text);
  margin-top: 2px;
}

.nav-links { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: all var(--transition-fast);
  border: none;
  border-left: 2px solid transparent;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.nav-link:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
.nav-link.active { background: var(--sidebar-active); color: var(--accent); border-left-color: var(--accent); }
.nav-icon { width: 18px; text-align: center; font-size: 14px; }

.sidebar-spacer { flex: 1; }

.new-post-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-md);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition-fast), transform var(--transition-fast);
  margin: 0 4px;
}
.new-post-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
.new-post-btn:active { transform: translateY(0); }

/* ── Main ── */
#main {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── Top Bar ── */
#topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 32px;
  border-bottom: 1px solid var(--surface-border);
  background: var(--surface-1);
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-dropdown { position: relative; }
.topbar-dropdown-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--surface-0);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-1);
  cursor: pointer;
  transition: all var(--transition-fast);
  white-space: nowrap;
}
.topbar-dropdown-btn:hover { border-color: var(--accent); }
.topbar-dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 200px;
  background: var(--surface-1);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  box-shadow: var(--surface-shadow-hover);
  padding: 6px;
  z-index: 20;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: all var(--transition-fast);
}
.topbar-dropdown-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.topbar-dropdown-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  transition: background var(--transition-fast);
}
.topbar-dropdown-item:hover { background: var(--surface-0); color: var(--ink-1); }
.topbar-dropdown-item.active { background: var(--accent-subtle); color: var(--accent-ink); font-weight: 600; }
.topbar-search {
  flex: 1;
  max-width: 340px;
  position: relative;
}
.topbar-search input {
  width: 100%;
  padding: 8px 12px 8px 32px;
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  background: var(--surface-0);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--ink-1);
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
.topbar-search::before {
  content: '⌕';
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-3);
  font-size: 14px;
  pointer-events: none;
}
.topbar-spacer { flex: 1; }
.topbar-icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--surface-border);
  background: var(--surface-0);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 15px;
  color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}
.topbar-icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

.view-header {
  padding: 28px 32px 0;
}
.view-header h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--ink-1);
  margin-bottom: 4px;
}
.view-subtitle { font-size: 14px; color: var(--ink-3); }

.view-body { padding: 20px 32px 40px; flex: 1; animation: fadeIn var(--transition-normal); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ── Stat Tiles ── */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.stat-tile {
  background: linear-gradient(160deg, var(--surface-1) 0%, var(--surface-1) 60%, rgba(var(--accent-rgb),0.06) 100%);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 20px;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
}
.stat-tile:hover { transform: translateY(-1px); box-shadow: var(--surface-shadow-hover); border-color: rgba(var(--accent-rgb),0.35); }
.stat-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.stat-value {
  font-family: 'Outfit', sans-serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--ink-1);
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.stat-sub {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 4px;
}

/* ── KPI Cards ── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.kpi-card {
  background: linear-gradient(160deg, var(--surface-1) 0%, var(--surface-1) 55%, rgba(var(--accent-rgb),0.07) 100%);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}
.kpi-card:hover { transform: translateY(-1px); box-shadow: var(--surface-shadow-hover); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
.kpi-label { font-size: 12px; font-weight: 500; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
.kpi-value { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 700; color: var(--ink-1); margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-trend { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.kpi-trend.up { color: #16a34a; }
.kpi-trend.down { color: #dc2626; }
.kpi-trend.flat { color: var(--ink-3); }
.kpi-sub { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.kpi-spark { margin-top: 10px; height: 34px; }

/* ── Calendar ── */
.cal-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.cal-nav-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--surface-border);
  background: var(--surface-1);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 16px;
  color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition-fast);
}
.cal-nav-btn:hover { background: var(--surface-1-hover); border-color: var(--ink-3); }
.cal-month-label {
  font-family: 'Outfit', sans-serif;
  font-size: 20px;
  font-weight: 600;
  min-width: 200px;
}
.cal-today-btn {
  padding: 6px 14px;
  background: var(--accent-subtle);
  color: var(--accent-ink);
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.cal-today-btn:hover { background: var(--accent); color: #fff; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--surface-border);
  gap: 1px;
}
.cal-dow {
  background: var(--surface-1);
  padding: 10px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.cal-day {
  background: var(--surface-1);
  min-height: 110px;
  padding: 8px;
  cursor: pointer;
  transition: background var(--transition-fast);
  position: relative;
}
.cal-day:hover { background: var(--surface-1-hover); }
.cal-day.outside { opacity: 0.35; }
.cal-day.today { box-shadow: inset 0 2px 0 var(--accent); }
.cal-day-num-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.cal-day-num {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
.cal-day-count {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent-ink);
  background: var(--accent-subtle);
  border-radius: 8px;
  padding: 1px 6px;
}

.cal-post-row {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 4px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  margin-bottom: 2px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: filter var(--transition-fast);
  color: var(--ink-1);
}
.cal-post-row:hover { filter: brightness(0.94); }
.cal-plat-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}
.cal-overflow {
  font-size: 11px;
  color: var(--ink-3);
  padding: 2px 6px;
  font-weight: 500;
}

/* Weekly view */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}
.week-col {
  background: var(--surface-1);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-md);
  min-height: 420px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color var(--transition-fast);
}
.week-col.today { border-color: var(--accent); }
.week-col-head { text-align: center; padding-bottom: 8px; border-bottom: 1px solid var(--surface-border); }
.week-col-dow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.week-col-num { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: var(--ink-1); }
.week-col.today .week-col-num { color: var(--accent); }
.week-card {
  background: var(--surface-0);
  border: 1px solid var(--surface-border);
  border-radius: var(--radius-sm);
  padding: 9px 10px;
  cursor: pointer;
  transition: all var(--transition-fast);
}
.week-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--surface-shadow); }
.week-card-time { font-size: 10px; color: var(--ink-3); font-weight: 600; font-variant-numeric: tabular-nums; }
.week-card-title { font-size: 12px; font-weight: 600; color: var(--ink-1); margin: 3px 0 6px; line-height: 1.3; }
.week-card-badges { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.week-card-plat { width: 8px; height: 8px; border-radius: 50%; }
.week-card-status { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.02em; }
.week-empty { font-size: 11px; color: var(--ink-3); text-align: center; padding: 10px 0; }

/* List view */
.list-table-wrap { background: var(--surface-1); border: 1px solid var(--surface-border); border-radius: var(--radius-md); overflow: hidden; }
.list-th { cursor: pointer; user-select: none; }
.list-th:hover { color: var(--ink-1); }
.list-th .sort-arrow { font-size: 9px; margin-left: 3px; opacity: 0.6; }

/* ── Pipeline ── */
.pipeline-board {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  overflow-x: auto;
}
.pipeline-col {
  min-width: 170px;
  background: var(--surface-0);
  border-radius: var(--radius-md);
  padding: 12px;
  border: 1px solid var(--surface-border);
  border-top: 3px solid var(--surface-border);
  display: flex;
  flex-direction: column;
}
.pipeline-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--surface-border);
}
.pipeline-col-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);

async function loadAll() {

    sb.from('sm_posts').select('*').order('scheduled_date', {ascending:true, nullsFirst:false}),
    sb.from('sm_post_metrics').select('*'),

    sb.from('sm_hashtags').select('*').order('category', {ascending:true}),

function brandById(id) { return S.brands.find(b=>b.id===id); }
function platById(id) { return S.platforms.find(p=>p.id===id); }
function pillarById(id) { return S.pillars.find(p=>p.id===id); }
function metricsForPost(pid) { return S.metrics.find(m=>m.post_id===pid); }
function brandSlug(id) { const b = brandById(id); return b ? b.slug : ''; }
function brandBg(br) { return br ? (br.slug==='del-taco'?'var(--brand-dt-subtle)':(br.slug==='koala-insulation'?'var(--brand-koala-subtle)':'var(--accent-subtle)')) : 'var(--accent-subtle)'; }

function filteredPosts() {
  let arr = S.posts;
  if (S.brandFilter !== 'all') {
    arr = arr.filter(p => { const b = brandById(p.brand_id); return b && b.slug === S.brandFilter; });
  }
  if (S.searchQuery) {
    const q = S.searchQuery.toLowerCase();
    arr = arr.filter(p => (p.title||'').toLowerCase().includes(q));
  }
  return arr;
}
function filterByBrand(arr) {
  if (S.brandFilter === 'all') return arr;
  return arr.filter(item => {
    const b = brandById(item.brand_id);
    return b && b.slug === S.brandFilter;
  });
}

function startOfWeek(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day; // Monday start
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function renderSidebarCounters() {
  const posts = filteredPosts();
  const today = toDateStr(new Date());
  const weekStart = startOfWeek(new Date());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const todayCount = posts.filter(p => p.scheduled_date === today).length;
  const weekCount = posts.filter(p => p.scheduled_date && p.scheduled_date >= toDateStr(weekStart) && p.scheduled_date <= toDateStr(weekEnd)).length;
  document.getElementById('sidebar-counters').innerHTML = `
    <div class="sidebar-counter"><div class="sidebar-counter-val">${todayCount}</div><div class="sidebar-counter-lbl">Today</div></div>
    <div class="sidebar-counter"><div class="sidebar-counter-val">${weekCount}</div><div class="sidebar-counter-lbl">This Week</div></div>`;
}

function renderCalendarView() {
  const wrap = document.getElementById('main-view');
  let html = `<div class="view-header"><h1>Content Calendar</h1>
    <p class="view-subtitle">Plan and schedule content across brands and platforms</p></div>
    <div class="view-body">
    <div class="tab-bar" id="cal-view-tabs">
      <button class="tab-btn ${S.calView==='month'?'active':''}" data-calview="month">Monthly</button>
      <button class="tab-btn ${S.calView==='week'?'active':''}" data-calview="week">Weekly</button>
      <button class="tab-btn ${S.calView==='list'?'active':''}" data-calview="list">List</button>
    </div>
    <div id="cal-body"></div></div>`;
  wrap.innerHTML = html;

  document.getElementById('cal-view-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn'); if (!btn) return;
    S.calView = btn.dataset.calview;
    renderCalendarView();
  });

  if (S.calView === 'month') renderCalendarMonth();
  else if (S.calView === 'week') renderCalendarWeek();
  else renderCalendarList();

function renderCalendarMonth() {
  const posts = filteredPosts();
  const y = S.calYear, m = S.calMonth;
  const first = new Date(y, m, 1);
  const last = new Date(y, m+1, 0);
  const startDow = first.getDay();
  const daysInMonth = last.getDate();
  const today = new Date();
  const todayStr = toDateStr(today);

  const byDate = {};
  posts.forEach(p => {
    if (p.scheduled_date) {
      if (!byDate[p.scheduled_date]) byDate[p.scheduled_date] = [];
      byDate[p.scheduled_date].push(p);
    }
  });

  let html = `<div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
      <span class="cal-month-label">${MONTH_NAMES[m]} ${y}</span>
      <button class="cal-nav-btn" id="cal-next">&#8250;</button>
      <button class="cal-today-btn" id="cal-today">Today</button>
    </div>
    <div class="cal-grid">`;

  DOW_SHORT.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });

  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    html += `<div class="cal-day outside"><div class="cal-day-num">${prevLast - i}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const dayPosts = byDate[dateStr] || [];
    html += `<div class="cal-day${isToday?' today':''}" data-date="${dateStr}">`;
    html += `<div class="cal-day-num-row"><div class="cal-day-num">${d}</div>${dayPosts.length ? `<span class="cal-day-count">${dayPosts.length}</span>` : ''}</div>`;
    const show = dayPosts.slice(0, 4);
    show.forEach(p => {
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      html += `<div class="cal-post-row" data-post-id="${p.id}" title="${escAttr(p.title)}">
        ${plats.length ? plats.map(pl=>`<span class="cal-plat-dot" style="background:${PLAT_HEX[pl.name]||'#6366f1'}"></span>`).join('') : `<span class="cal-plat-dot" style="background:#6366f1"></span>`}
        ${escHtml(p.title.substring(0,16))}
      </div>`;
    });
    if (dayPosts.length > 4) html += `<div class="cal-overflow">+${dayPosts.length-4} more</div>`;
    html += `</div>`;
  }

  const totalCells = startDow + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    html += `<div class="cal-day outside"><div class="cal-day-num">${i}</div></div>`;
  }

  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;

  document.getElementById('cal-prev').onclick = () => { S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} renderCalendarMonth(); };
  document.getElementById('cal-next').onclick = () => { S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} renderCalendarMonth(); };
  document.getElementById('cal-today').onclick = () => { S.calMonth=today.getMonth(); S.calYear=today.getFullYear(); renderCalendarMonth(); };

  document.querySelectorAll('.cal-post-row').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); openPostModal(el.dataset.postId); };
  });
  document.querySelectorAll('.cal-day:not(.outside)').forEach(el => {
    el.onclick = () => { openPostModal(null, el.dataset.date); };
  });
}

function renderCalendarWeek() {
  const posts = filteredPosts();
  const start = new Date(S.weekAnchor);
  const days = [];
  for (let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  const end = days[6];
  const todayStr = toDateStr(new Date());

  const byDate = {};
  posts.forEach(p => {
    if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); }
  });

  let html = `<div class="cal-nav">
      <button class="cal-nav-btn" id="week-prev">&#8249;</button>
      <span class="cal-month-label">${MONTH_NAMES[start.getMonth()]} ${start.getDate()} – ${MONTH_NAMES[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}</span>
      <button class="cal-nav-btn" id="week-next">&#8250;</button>
      <button class="cal-today-btn" id="week-today">Today</button>
    </div>
    <div class="week-grid">`;

  days.forEach(d => {
    const dateStr = toDateStr(d);
    const dayPosts = (byDate[dateStr]||[]).sort((a,b)=>(a.scheduled_time||'').localeCompare(b.scheduled_time||''));
    html += `<div class="week-col${dateStr===todayStr?' today':''}">
      <div class="week-col-head"><div class="week-col-dow">${DOW_SHORT[d.getDay()]}</div><div class="week-col-num">${d.getDate()}</div></div>`;
    if (dayPosts.length === 0) {
      html += `<div class="week-empty">No posts</div>`;
    } else {
      dayPosts.forEach(p => {
        const br = brandById(p.brand_id);
        const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
        const plats = pids.map(id=>platById(id)).filter(Boolean);
        const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
        html += `<div class="week-card" data-post-id="${p.id}">
          ${p.scheduled_time ? `<div class="week-card-time">${fmtTime(p.scheduled_time)}</div>` : ''}
          <div class="week-card-title">${escHtml(p.title)}</div>
          <div class="week-card-badges">
            ${plats.length ? plats.map(pl=>`<span class="week-card-plat" style="background:${PLAT_HEX[pl.name]||'#6366f1'}" title="${escAttr(pl.name)}"></span>`).join('') : ''}
            ${br ? `<span style="font-size:10px;color:var(--ink-3)">${escHtml(br.name.split(' ')[0])}</span>` : ''}
            <span class="week-card-status" style="background:${meta.color};color:#fff;margin-left:auto">${meta.label}</span>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;

  document.getElementById('week-prev').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()-7); renderCalendarWeek(); };
  document.getElementById('week-next').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()+7); renderCalendarWeek(); };
  document.getElementById('week-today').onclick = () => { S.weekAnchor = startOfWeek(new Date()); renderCalendarWeek(); };
  document.querySelectorAll('.week-card').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

function renderCalendarList() {
  const posts = filteredPosts();
  const today = toDateStr(new Date());
  const horizon = new Date(); horizon.setDate(horizon.getDate()+30);
  const horizonStr = toDateStr(horizon);
  let upcoming = posts.filter(p => p.scheduled_date && p.scheduled_date >= today && p.scheduled_date <= horizonStr);

  const { key, dir } = S.listSort;
  upcoming = [...upcoming].sort((a,b) => {
    let av, bv;
    if (key === 'title') { av=a.title||''; bv=b.title||''; }
    else if (key === 'brand') { av=(brandById(a.brand_id)||{}).name||''; bv=(brandById(b.brand_id)||{}).name||''; }
    else if (key === 'platform') { av=(platById(a.platform_id)||{}).name||''; bv=(platById(b.platform_id)||{}).name||''; }
    else if (key === 'status') { av=a.status||''; bv=b.status||''; }
    else { av = (a.scheduled_date||'')+(a.scheduled_time||''); bv = (b.scheduled_date||'')+(b.scheduled_time||''); }
    return dir === 'asc' ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
  });

  const cols = [['scheduled_date','Date'],['scheduled_time','Time'],['title','Title'],['brand','Brand'],['platform','Platform'],['pillar','Pillar'],['status','Status'],['brief','Brief']];

  let html = `<div class="list-table-wrap">`;
  if (upcoming.length === 0) {
    html += emptyState('&#128197;', 'No posts scheduled in the next 30 days.');
  } else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr>`;
    cols.forEach(([k,label]) => {
      const sortable = ['scheduled_date','title','brand','platform','status'].includes(k);
      const arrow = S.listSort.key===k ? (S.listSort.dir==='asc'?'&#9650;':'&#9660;') : '';
      html += `<th class="${sortable?'list-th':''}" ${sortable?`data-sortkey="${k}"`:''}>${label}${sortable?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
    });
    html += `</tr></thead><tbody>`;
    upcoming.forEach(p => {
      const br = brandById(p.brand_id);
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      const pil = pillarById(p.content_pillar_id);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      html += `<tr class="list-row" data-post-id="${p.id}" style="cursor:pointer">
        <td>${fmtDate(p.scheduled_date)}</td>
        <td>${p.scheduled_time?fmtTime(p.scheduled_time):'—'}</td>
        <td style="font-weight:500;color:var(--ink-1)">${escHtml(p.title)}</td>
        <td>${br?escHtml(br.name):'—'}</td>
        <td>${plats.length ? plats.map(pl=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PLAT_HEX[pl.name]||'#6366f1'};margin-right:4px;vertical-align:middle"></span>`).join('')+plats.map(pl=>escHtml(pl.name)).join(', ') : '—'}</td>
        <td>${pil?escHtml(pil.name):'—'}</td>
        <td><span class="status-badge" style="background:${meta.color};color:#fff">${meta.label}</span></td>
        <td><button class="metrics-btn" onclick="event.stopPropagation();generateBrief('${p.id}')" style="font-size:11px;padding:2px 8px" title="Generate Brief">&#128203;</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;

  document.querySelectorAll('.list-th').forEach(el => {
    el.onclick = () => {
      const k = el.dataset.sortkey;
      if (S.listSort.key === k) S.listSort.dir = S.listSort.dir === 'asc' ? 'desc' : 'asc';
      else { S.listSort.key = k; S.listSort.dir = 'asc'; }
      renderCalendarList();
    };
  });
  document.querySelectorAll('.list-row').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

  )}</div>`;

  html += `</div>`;

  // Best times heatmap + posts by status stacked bar

  html += `</div>`;

  html += `<div class="chart-card" style="margin-bottom:24px"><div class="chart-title">Pipeline Fullness — Posts by Status</div>${drawStatusStackedBar(posts)}</div>`;

  const sorted = [...withMetrics].sort((a,b) => (b.m.reach||0) - (a.m.reach||0)).slice(0,10);
  html += `<div class="data-table-wrap"><div class="data-table-title">Top Performing Posts</div>`;
  if (sorted.length === 0) {

  } else {

      <th>#</th><th>Post</th><th>Brand</th><th>Platform</th><th>Reach</th><th>Eng. Rate</th><th>Likes</th><th>Comments</th><th>Shares</th></tr></thead><tbody>`;
    sorted.forEach((x,i) => {

        <td>${fmtNum(x.m.reach)}</td><td>${x.m.engagement_rate}%</td>

function bucketCounts(dates) {
  // last 8 buckets by simple chronological grouping (one point per unique date, capped to last 12)
  const sorted = [...dates].sort();
  const counts = {};
  sorted.forEach(d => { counts[d] = (counts[d]||0)+1; });
  const vals = Object.values(counts);
  return vals.slice(-12);
}

function kpiCard(label, value, sub, series, color) {
  const trend = trendFromSeries(series);
  return `<div class="kpi-card">
    <div class="kpi-top">
      <div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div>
      <div class="kpi-trend ${trend.dir}">${trend.arrow} ${trend.pct}</div>
    </div>
    <div class="kpi-spark">${drawSparkline(series, color)}</div>
    <div class="kpi-sub">${sub}</div>
  </div>`;
}

function trendFromSeries(series) {
  if (!series || series.length < 2) return { dir:'flat', arrow:'—', pct:'' };
  const half = Math.max(1, Math.floor(series.length/2));
  const first = series.slice(0, half).reduce((a,b)=>a+b,0) / half;
  const last = series.slice(-half).reduce((a,b)=>a+b,0) / half;
  if (first === 0 && last === 0) return { dir:'flat', arrow:'—', pct:'0%' };
  const pct = first === 0 ? 100 : ((last-first)/Math.abs(first))*100;
  if (Math.abs(pct) < 1) return { dir:'flat', arrow:'—', pct: '0%' };
  return pct > 0 ? { dir:'up', arrow:'▲', pct: Math.abs(pct).toFixed(0)+'%' } : { dir:'down', arrow:'▼', pct: Math.abs(pct).toFixed(0)+'%' };
}

// ── SVG Chart Helpers ──
function drawSparkline(values, color) {
  if (!values || values.length === 0) return `<svg viewBox="0 0 100 34" style="width:100%;height:34px"></svg>`;
  const W=100,H=34,pad=3;
  const max = Math.max(...values, 0.0001);
  const min = Math.min(...values, 0);
  const range = (max-min) || 1;
  const stepX = values.length>1 ? (W-pad*2)/(values.length-1) : 0;
  const pts = values.map((v,i) => {
    const x = pad + i*stepX;
    const y = H-pad - ((v-min)/range)*(H-pad*2);
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${H-pad} L${pts[0][0].toFixed(1)},${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:34px;display:block">
    <path d="${area}" fill="${color}" opacity="0.12"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function drawBarChart(data, maxVal, suffix='') {
  const W = 500, H = 200, pad = {t:10, r:20, b:40, l:10};
  const cw = W-pad.l-pad.r, ch = H-pad.t-pad.b;
  const barW = Math.min(60, (cw / data.length) * 0.6);
  const gap = (cw - barW * data.length) / (data.length + 1);

  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block">`;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ch - (ch * i / 4);
    svg += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>`;
  }
  data.forEach((d, i) => {
    const x = pad.l + gap + i * (barW + gap);
    const barH = maxVal > 0 ? (d.value / maxVal) * ch : 0;
    const y = pad.t + ch - barH;
    svg += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${d.color}" opacity="0.85"/>`;
    svg += `<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" fill="var(--chart-text)" font-size="11" font-weight="600" font-family="DM Sans,sans-serif">${d.value}${suffix}</text>`;
    svg += `<text x="${x+barW/2}" y="${H-pad.b+18}" text-anchor="middle" fill="var(--chart-text)" font-size="11" font-family="DM Sans,sans-serif">${d.label}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function drawGroupedBarChart(data) {
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const W = 480, H = 40, barH = 26;
  let svg = `<svg viewBox="0 0 ${W} ${data.length*H}" style="width:100%;display:block">`;
  data.forEach((d,i) => {
    const y = i*H + (H-barH)/2;
    const w = maxVal > 0 ? (d.value/maxVal) * (W-140) : 0;
    svg += `<text x="0" y="${y+barH/2+4}" font-size="12" font-weight="600" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${escHtml(d.label)}</text>`;
    svg += `<rect x="90" y="${y}" width="${W-140}" height="${barH}" rx="4" fill="var(--chart-grid)"/>`;
    svg += `<rect x="90" y="${y}" width="${w}" height="${barH}" rx="4" fill="${d.color}" opacity="0.88"/>`;
    svg += `<text x="${90+w+8}" y="${y+barH/2+4}" font-size="11" font-weight="700" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${fmtNum(d.value)}</text>`;
  });
  svg += `</svg>`;
  return svg;
}

function drawDonut(data) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total === 0) return `<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">No content type data yet</div>`;
  const cx=90, cy=90, r=70, ir=42;
  let angle = -Math.PI/2;
  let paths = '';
  data.forEach(d => {
    const frac = d.value/total;
    const sweep = frac*Math.PI*2;
    const x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
    const x2 = cx + r*Math.cos(angle+sweep), y2 = cy + r*Math.sin(angle+sweep);
    const ix1 = cx + ir*Math.cos(angle), iy1 = cy + ir*Math.sin(angle);
    const ix2 = cx + ir*Math.cos(angle+sweep), iy2 = cy + ir*Math.sin(angle+sweep);
    const large = sweep > Math.PI ? 1 : 0;
    paths += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ir},${ir} 0 ${large} 0 ${ix1.toFixed(2)},${iy1.toFixed(2)} Z" fill="${d.color}" opacity="0.9"/>`;
    angle += sweep;
  });
  let legend = `<div class="chart-legend">`;
  data.forEach(d => {
    legend += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${d.color}"></span>${escHtml(d.label)} (${d.value})</div>`;
  });
  legend += `</div>`;
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0">${paths}
      <text x="90" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink-1)" font-family="Outfit,sans-serif">${total}</text>
      <text x="90" y="104" text-anchor="middle" font-size="10" fill="var(--chart-text)" font-family="DM Sans,sans-serif">posts</text>
    </svg>
    <div style="flex:1;min-width:150px">${legend}</div>
  </div>`;
}

function drawHeatmap(posts) {
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  posts.forEach(p => {
    if (!p.scheduled_date) return;
    const d = new Date(p.scheduled_date + 'T00:00:00');
    let dow = d.getDay(); // 0=Sun
    dow = dow === 0 ? 6 : dow-1; // convert to Mon=0..Sun=6
    let hour = 12;
    if (p.scheduled_time) { const parts = p.scheduled_time.split(':'); hour = parseInt(parts[0])||0; }
    grid[dow][hour]++;
  });
  const max = Math.max(...grid.flat(), 1);
  const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = `<div class="heatmap-wrap"><div class="heatmap-grid">`;
  html += `<div></div>`;
  for (let h=0; h<24; h++) { html += `<div class="heatmap-hour-label">${h%3===0?h:''}</div>`; }
  for (let d=0; d<7; d++) {
    html += `<div class="heatmap-dow-label">${dowLabels[d]}</div>`;
    for (let h=0; h<24; h++) {
      const v = grid[d][h];
      const alpha = v===0 ? 0.06 : 0.15 + (v/max)*0.85;
      html += `<div class="heatmap-cell" style="background:rgba(var(--accent-rgb),${alpha.toFixed(2)})" title="${dowLabels[d]} ${h}:00 — ${v} post${v===1?'':'s'}"></div>`;
    }
  }
  html += `</div></div>`;
  return html;
}

function drawStatusStackedBar(posts) {
  const total = posts.length || 1;
  let html = `<div style="display:flex;height:32px;border-radius:6px;overflow:hidden;border:1px solid var(--surface-border)">`;
  STATUS_ORDER.forEach(status => {
    const meta = STATUS_META[status];
    const count = posts.filter(p=>p.status===status).length;
    const pct = (count/total)*100;
    if (pct > 0) html += `<div style="width:${pct}%;background:${meta.color};display:flex;align-items:center;justify-content:center;transition:width var(--transition-normal)" title="${meta.label}: ${count}">
      ${pct > 8 ? `<span style="font-size:11px;font-weight:700;color:#fff">${count}</span>` : ''}
    </div>`;
  });
  html += `</div><div class="chart-legend">`;
  STATUS_ORDER.forEach(status => {
    const meta = STATUS_META[status];
    const count = posts.filter(p=>p.status===status).length;
    html += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${meta.color}"></span>${meta.label} (${count})</div>`;
  });
  html += `</div>`;
  return html;
}

function toggleStrategy(el) {

async function saveStrategy(existingId) {
  const form = document.getElementById('strategy-form');
  const fd = new FormData(form);
  const data = {};
  ['brand_id','title','section_key','content'].forEach(k => {
    data[k] = fd.get(k) || '';
  });
  data.sort_order = parseInt(fd.get('sort_order')) || 1;
  data.updated_at = new Date().toISOString();

  if (!data.title || !data.content) { alert('Title and content are required'); return; }
  if (!data.section_key) { data.section_key = data.title.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/(^_|_$)/g,''); }

  try {
    if (existingId) {
      await sb.from('sm_strategies').update(data).eq('id', existingId);
    } else {
      await sb.from('sm_strategies').insert(data);
    }
    closeModal();
    await loadAll();
    render();
  } catch(e) { alert('Error saving strategy: ' + e.message); }
}

function renderProduction() {
  let html = `<div class="view-header"><h1>Shot Lists & Content Briefs</h1>
    <p class="view-subtitle">Shoot guides, talking points, and content templates</p></div>
    <div class="view-body">`;

  html += `<div class="tab-bar" id="prod-tabs">
    <button class="tab-btn active" data-ptab="shotlists">Shot Lists</button>
    <button class="tab-btn" data-ptab="briefs">Content Briefs</button>
  </div>`;

  html += `<div id="prod-content"></div></div>`;
  document.getElementById('main-view').innerHTML = html;

  document.getElementById('prod-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    document.querySelectorAll('#prod-tabs .tab-btn').forEach(b=>b.classList.remove('active'));

function openThemeModal(themeId) {

  const panel = document.getElementById('modal-panel');
  panel.classList.remove('wide');

  let html = `<div class="modal-header">
    <span class="modal-title">${isEdit?'Edit':'New'} Monthly Theme</span>
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
  </div><div class="modal-body"><form id="theme-form">`;

  html += `<div class="form-row two-col">
    <div class="form-group"><label class="form-label">Brand</label>
      <select class="form-select" name="brand_id" required>
        ${S.brands.map(b=>`<option value="${b.id}" ${theme&&theme.brand_id===b.id?'selected':''}>${b.logo_emoji} ${b.name}</option>`).join('')}
      </select></div>
    <div class="form-group"><label class="form-label">Month</label>

      <input class="form-input" type="number" name="year" value="${curYear}" min="2024" max="2030" required></div>
    <div class="form-group"><label class="form-label">Posts Per Week</label>
      <input class="form-input" type="number" name="posts_per_week" value="${theme?.posts_per_week||''}" min="1" max="30" placeholder="e.g. 5"></div></div>`;

  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Theme Name</label>
    <input class="form-input" name="theme" required value="${escAttr(theme?.theme||'')}" placeholder="e.g. Summer Kickoff"></div></div>`;

  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Description</label>
    <textarea class="form-textarea" name="description" placeholder="Theme description and goals...">${escHtml(theme?.description||'')}</textarea></div></div>`;

  html += `<div class="form-row full"><div class="form-group">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
      <input type="checkbox" name="is_peak" ${theme&&theme.is_peak?'checked':''} style="accent-color:var(--accent)"> Mark as Peak Season
    </label></div></div>`;

  html += `</form></div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveTheme('${theme?.id||''}')">${isEdit?'Update':'Create'} Theme</button>
  </div>`;

  panel.innerHTML = html;
  document.getElementById('modal-overlay').hidden = false;
}

async function saveTheme(existingId) {
  const form = document.getElementById('theme-form');
  const fd = new FormData(form);
  const data = {
    brand_id: fd.get('brand_id'),
    month: parseInt(fd.get('month')),
    year: parseInt(fd.get('year')),
    theme: fd.get('theme'),
    description: fd.get('description') || null,
    posts_per_week: fd.get('posts_per_week') ? parseInt(fd.get('posts_per_week')) : null,
    is_peak: form.querySelector('[name=is_peak]').checked
  };
  if (!data.theme) { alert('Theme name is required'); return; }
  try {
    if (existingId) {
      await sb.from('sm_monthly_themes').update(data).eq('id', existingId);
    } else {
      await sb.from('sm_monthly_themes').insert(data);
    }
    closeModal();
    await loadAll();
    render();
  } catch(e) { alert('Error saving theme: ' + e.message); }
}

async function deleteTheme(themeId) {
  if (!confirm('Delete this monthly theme?')) return;
  try {
    await sb.from('sm_monthly_themes').delete().eq('id', themeId);
    await loadAll();
    render();
  } catch(e) { alert('Error deleting theme: ' + e.message); }
}

  // Auto-select platforms when pillar changes
  document.getElementById('post-pillar').onchange = function() {
    if (this.value) applyPillarPlatforms(this.value);
  };

  // For new posts, auto-select platforms from the first pillar if pre-selected
  if (!isEdit) {
    const pillarSel = document.getElementById('post-pillar');
    if (pillarSel.value) applyPillarPlatforms(pillarSel.value);
  }

  const captionEl = document.getElementById('post-caption');
  const countEl = document.getElementById('caption-count');
  const previewEl = document.getElementById('caption-preview');
  captionEl.addEventListener('input', () => {
    const len = captionEl.value.length;
    countEl.textContent = `${len}/2200`;
    countEl.classList.toggle('over', len > 2200);
    previewEl.textContent = captionEl.value;
  });

  renderHashtagSuggestions(brandId);
}

function renderHashtagSuggestions(brandId) {
  const el = document.getElementById('hashtag-suggestions');
  if (!el) return;
  const suggestions = S.hashtags.filter(h => h.brand_id === brandId).slice(0, 12);
  if (suggestions.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = suggestions.map(h => `<span class="tag tag-clickable" data-tag="${escAttr(h.tag)}">${escHtml(h.tag)}</span>`).join('');
  el.querySelectorAll('.tag').forEach(t => {
    t.onclick = () => {
      const input = document.getElementById('post-hashtags');
      const tag = t.dataset.tag;
      if (!input.value.includes(tag)) {
        input.value = (input.value.trim() + ' ' + tag).trim();
      }
    };
  });
}

  </div><div class="modal-body" style="padding:20px">${briefHtml}</div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="openPostModal('${postId}')">&#8592; Back to Post</button>
    <div style="flex:1"></div>

function copyBrief() {
  const el = document.getElementById('brief-content');
  if (!el) return;
  // Build plain text from the table rows
  const rows = el.querySelectorAll('tr');
  let text = '=== PRODUCTION BRIEF ===\n\n';
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    if (cells.length === 2) {
      text += cells[0].textContent.trim() + ': ' + cells[1].textContent.trim() + '\n';
    }
  });
  text += '\n=== END BRIEF ===';
  navigator.clipboard.writeText(text).then(() => {
    showToast('Brief copied to clipboard', 'success');
  }).catch(() => {
    // Fallback: select the content
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    showToast('Brief selected — press Ctrl+C to copy', 'info');
  });
}

function printBrief() {
  const el = document.getElementById('brief-content');
  if (!el) return;
  const win = window.open('', '_blank', 'width=800,height=600');
  win.document.write(`<!DOCTYPE html><html><head><title>Production Brief</title>
    <style>body{font-family:'DM Sans',system-ui,sans-serif;margin:24px;color:#1a1a1a}
    table{width:100%;border-collapse:collapse}td{padding:10px 12px;border-bottom:1px solid #e5e7eb}
    td:first-child{font-weight:600;color:#555;width:160px}
    h2{font-family:Outfit,system-ui,sans-serif;margin:0 0 16px}
    @media print{body{margin:12px}}</style></head><body>
    <h2>Production Brief</h2>${el.innerHTML}</body></html>`);
  win.document.close();
  setTimeout(() => win.print(), 300);
}

function openMetricsModal(postId) {
  const post = S.posts.find(p=>p.id===postId);
  if(!post) return;
  const existing = metricsForPost(postId);
  const br = brandById(post.brand_id);
  const pids = post.platform_ids || (post.platform_id ? [post.platform_id] : []);
  const plats = pids.map(id=>platById(id)).filter(Boolean);
  const platNames = plats.length ? plats.map(p=>p.name).join(', ') : '—';
  const panel = document.getElementById('modal-panel');
  panel.classList.remove('wide');

  const fields = [
    ['reach','Reach'],['impressions','Impressions'],['likes','Likes'],['comments','Comments'],
    ['shares','Shares'],['saves','Saves'],['clicks','Link Clicks'],['video_views','Video Views'],['followers_gained','Followers Gained']
  ];

  let html = `<div class="modal-header">
    <span class="modal-title">Log Metrics</span>
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
  </div><div class="modal-body">
  <div style="margin-bottom:16px;padding:12px;background:var(--surface-0);border-radius:var(--radius-sm)">
    <div style="font-weight:600;color:var(--ink-1);margin-bottom:2px">${escHtml(post.title)}</div>
    <div style="font-size:13px;color:var(--ink-3)">${br?br.name:'—'} · ${platNames}${post.scheduled_date ? ' · '+fmtDate(post.scheduled_date) : ''}</div>
  </div>
  <form id="metrics-form">`;

  for (let i = 0; i < fields.length; i += 2) {
    html += `<div class="form-row">`;
    for (let j = i; j < Math.min(i+2, fields.length); j++) {
      const [key, label] = fields[j];
      const val = existing ? (existing[key]||0) : '';
      html += `<div class="form-group"><label class="form-label">${label}</label>
        <input class="form-input" type="number" name="${key}" value="${val}" min="0" placeholder="0"></div>`;
    }
    html += `</div>`;
  }

  html += `</form></div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveMetrics('${postId}', ${existing?'true':'false'})">${existing?'Update':'Save'} Metrics</button>
  </div>`;

  panel.innerHTML = html;
  document.getElementById('modal-overlay').hidden = false;
}

function closeModal() {
  document.getElementById('modal-overlay').hidden = true;
}

// ── CRUD ──
async function savePost(existingId) {
  const form = document.getElementById('post-form');
  const fd = new FormData(form);
  const data = {};
  ['brand_id','content_pillar_id','created_by','title','caption','hashtags','media_type','status','scheduled_date','scheduled_time','notes'].forEach(k => {
    const v = fd.get(k);
    data[k] = v === '' ? null : v;
  });
  // Multi-platform: collect checked platforms
  const platformIds = fd.getAll('platform_ids').filter(Boolean);
  data.platform_ids = platformIds.length ? platformIds : null;
  data.platform_id = platformIds[0] || null; // keep legacy field in sync
  // Crew members: collect checked members
  const crewIds = fd.getAll('crew_members').filter(Boolean);
  data.crew_members = crewIds.length ? crewIds : null;

  if (!data.title) { alert('Title is required'); return; }

  if (data.status === 'posted' && !data.posted_at) {
    data.posted_at = new Date().toISOString();
  }

  try {
    if (existingId) {
      await sb.from('sm_posts').update(data).eq('id', existingId);
    } else {
      await sb.from('sm_posts').insert(data);
    }
    closeModal();
    await loadAll();
    render();
  } catch(e) { alert('Error saving: ' + e.message); }
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  await sb.from('sm_post_metrics').delete().eq('post_id', id);
  await sb.from('sm_posts').delete().eq('id', id);
  closeModal();
  await loadAll();
  render();
}

async function saveMetrics(postId, isUpdate) {
  const form = document.getElementById('metrics-form');
  const fd = new FormData(form);
  const data = { post_id: postId };
  ['reach','impressions','likes','comments','shares','saves','clicks','video_views','followers_gained'].forEach(k => {
    data[k] = parseInt(fd.get(k)) || 0;
  });

  try {
    if (isUpdate) {
      await sb.from('sm_post_metrics').update(data).eq('post_id', postId);
    } else {
      await sb.from('sm_post_metrics').insert(data);
    }
    closeModal();
    await loadAll();
    render();
  } catch(e) { alert('Error saving metrics: ' + e.message); }
}

// ── Render ──
function ensureMainView() {
  const main = document.getElementById('main');
  if (!document.getElementById('main-view')) {
    const div = document.createElement('div');
    div.id = 'main-view';
    main.appendChild(div);
  }
}

function render() {
  ensureMainView();
  renderBrandPills();
  switch(S.view) {
    case 'calendar': renderCalendarView(); break;
    case 'pipeline': renderPipeline(); break;
    case 'analytics': renderAnalytics(); break;
    case 'strategy': renderStrategy(); break;
    case 'production': renderProduction(); break;
    case 'team': renderTeam(); break;
    case 'themes': renderThemes(); break;
    case 'hashtags': renderHashtags(); break;
    case 'stores': renderStores(); break;
  }
}

// ── Utils ──
function escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function fmtTime(t) {
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function fmtNum(n) {
  if (n == null) return '0';
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return String(n);
}

// ── Theme ──
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('scc-theme'); } catch(e) {}
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  updateThemeIcon();
}
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr === 'dark' || (!attr && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-toggle-btn').innerHTML = isDark ? '&#9789;' : '&#9788;';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDarkNow = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDarkNow ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('scc-theme', next); } catch(e) {}
  updateThemeIcon();
}

// ── Events ──
document.querySelectorAll('.nav-links').forEach(container => {
  container.addEventListener('click', e => {
    const btn = e.target.closest('.nav-link');
    if (!btn) return;
    document.querySelectorAll('.nav-link').forEach(n=>n.classList.remove('active'));
    btn.classList.add('active');
    S.view = btn.dataset.view;
    render();
  });
});

document.getElementById('brand-pills').addEventListener('click', e => {
  const btn = e.target.closest('.brand-pill');
  if (!btn) return;
  S.brandFilter = btn.dataset.brand;
  render();
});

document.getElementById('new-post-btn').addEventListener('click', () => openPostModal(null));

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.getElementById('brand-dropdown-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('brand-dropdown-menu').classList.toggle('open');
});
document.addEventListener('click', () => {
  document.getElementById('brand-dropdown-menu').classList.remove('open');
});

let searchDebounce;
document.getElementById('topbar-search-input').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    S.searchQuery = e.target.value.trim();
    render();
  }, 200);
});

document.getElementById('topbar-today-btn').addEventListener('click', () => {
  const today = new Date();
  S.view = 'calendar';
  S.calView = 'month';
  S.calMonth = today.getMonth();
  S.calYear = today.getFullYear();
  S.weekAnchor = startOfWeek(today);
  document.querySelectorAll('.nav-link').forEach(n=>n.classList.toggle('active', n.dataset.view==='calendar'));
  render();
});

document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (!document.getElementById('modal-overlay').hidden) closeModal();
    return;
  }
  if (e.key === 'n' && !typing) {
    e.preventDefault();
    openPostModal(null);
  }
});

// ── Init ──
(async () => {
  initTheme();
  try {
    await loadAll();
    const loadingEl = document.querySelector('#main > .loading');
    if (loadingEl) loadingEl.remove();
    ensureMainView();
    render();
  } catch(e) {
    console.error('Failed to load data:', e);
    const loadingEl = document.querySelector('#main > .loading');
    if (loadingEl) loadingEl.innerHTML = '<span style="color:var(--st-rejected)">&#9888; Failed to load data. Please refresh the page.</span>';
  }
})();
</script>
