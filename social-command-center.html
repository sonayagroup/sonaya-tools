<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Command Center | Sonaya Group</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS
   ══════════════════════════════════════════════ */
:root {
  /* Surfaces */
  --bg: #f4f5f9;
  --surface-0: #eceef4;
  --surface-1: #ffffff;
  --surface-2: #f8f9fc;
  --surface-border: #e0e3ec;
  --surface-border-strong: #c8cdd9;
  --shadow-sm: 0 1px 2px rgba(15,23,42,0.04);
  --shadow-md: 0 4px 12px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
  --shadow-lg: 0 12px 40px rgba(15,23,42,0.1), 0 2px 8px rgba(15,23,42,0.04);
  --shadow-xl: 0 24px 64px rgba(15,23,42,0.14), 0 4px 16px rgba(15,23,42,0.06);

  /* Sidebar */
  --sidebar-bg: #0c1222;
  --sidebar-border: #192035;
  --sidebar-text: #7889a5;
  --sidebar-text-bright: #e4e9f1;
  --sidebar-hover: rgba(255,255,255,0.04);
  --sidebar-active: rgba(99,102,241,0.12);

  /* Ink */
  --ink-0: #020617;
  --ink-1: #0f172a;
  --ink-2: #475569;
  --ink-3: #94a3b8;
  --ink-4: #cbd5e1;

  /* Accent — indigo core */
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-soft: #eef2ff;
  --accent-ink: #4338ca;
  --accent-rgb: 99,102,241;

  /* Brands */
  --brand-sg: #1e3a5f;
  --brand-sg-gold: #c5a55a;
  --brand-dt: #e11d48;
  --brand-dt-soft: #fff1f2;
  --brand-koala: #16a34a;
  --brand-koala-soft: #f0fdf4;

  /* Platforms */
  --plat-ig: #E1306C;
  --plat-tt: #00C9B1;
  --plat-fb: #1877F2;
  --plat-yt: #FF0000;

  /* Status */
  --st-idea: #94a3b8;
  --st-draft: #f59e0b;
  --st-review: #f97316;
  --st-approved: #22c55e;
  --st-scheduled: #6366f1;
  --st-posted: #10b981;
  --st-rejected: #ef4444;

  /* Radii */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 18px;
  --r-full: 9999px;

  /* Chart */
  --chart-bg: #ffffff;
  --chart-grid: #e2e8f0;
  --chart-text: #64748b;

  /* Motion */
  --ease: cubic-bezier(0.4,0,0.2,1);
  --fast: 0.15s var(--ease);
  --normal: 0.25s var(--ease);
  --spring: 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

/* ── Dark Theme ── */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080c16;
    --surface-0: #0e1424;
    --surface-1: #131b2e;
    --surface-2: #182038;
    --surface-border: #1e2a42;
    --surface-border-strong: #2a3a58;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
    --shadow-lg: 0 14px 44px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.3);
    --shadow-xl: 0 28px 72px rgba(0,0,0,0.5), 0 4px 20px rgba(0,0,0,0.35);
    --sidebar-bg: #060a14;
    --sidebar-border: #111827;
    --sidebar-hover: rgba(255,255,255,0.03);
    --ink-0: #f8fafc;
    --ink-1: #f1f5f9;
    --ink-2: #94a3b8;
    --ink-3: #64748b;
    --ink-4: #334155;
    --accent: #818cf8;
    --accent-hover: #6366f1;
    --accent-soft: rgba(99,102,241,0.10);
    --accent-ink: #a5b4fc;
    --accent-rgb: 129,140,248;
    --brand-dt-soft: rgba(225,29,72,0.10);
    --brand-koala-soft: rgba(22,163,74,0.10);
    --chart-bg: #131b2e;
    --chart-grid: #1e2a42;
    --chart-text: #94a3b8;
  }
}
:root[data-theme="dark"] {
  --bg: #080c16;
  --surface-0: #0e1424;
  --surface-1: #131b2e;
  --surface-2: #182038;
  --surface-border: #1e2a42;
  --surface-border-strong: #2a3a58;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2);
  --shadow-lg: 0 14px 44px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.3);
  --shadow-xl: 0 28px 72px rgba(0,0,0,0.5), 0 4px 20px rgba(0,0,0,0.35);
  --sidebar-bg: #060a14;
  --sidebar-border: #111827;
  --sidebar-hover: rgba(255,255,255,0.03);
  --ink-0: #f8fafc;
  --ink-1: #f1f5f9;
  --ink-2: #94a3b8;
  --ink-3: #64748b;
  --ink-4: #334155;
  --accent: #818cf8;
  --accent-hover: #6366f1;
  --accent-soft: rgba(99,102,241,0.10);
  --accent-ink: #a5b4fc;
  --accent-rgb: 129,140,248;
  --brand-dt-soft: rgba(225,29,72,0.10);
  --brand-koala-soft: rgba(22,163,74,0.10);
  --chart-bg: #131b2e;
  --chart-grid: #1e2a42;
  --chart-text: #94a3b8;
}

/* ══════════════════════════════════════════════
   BASE RESET
   ══════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink-1);
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(var(--accent-rgb),0.22); }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ══════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════ */
#app {
  display: grid;
  grid-template-columns: 250px 1fr;
  min-height: 100vh;
}

/* ── Sidebar ── */
#sidebar {
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  padding: 20px 10px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
}
#sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }

.sb-header { padding: 0 10px 20px; border-bottom: 1px solid var(--sidebar-border); margin-bottom: 8px; }
.sb-logo {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.sb-logo svg { width: 32px; height: 32px; flex-shrink: 0; }
.sb-logo-text {
  font-family: Outfit, sans-serif; font-size: 13px; font-weight: 700;
  color: var(--brand-sg-gold); letter-spacing: 0.03em; line-height: 1.2;
}
.sb-title {
  font-family: Outfit, sans-serif; font-size: 15px; font-weight: 700;
  color: var(--sidebar-text-bright); line-height: 1.3;
}

.sb-pills { display: flex; gap: 3px; padding: 8px 6px; }
.sb-pill {
  flex: 1; padding: 5px 2px; border: none; background: transparent;
  color: var(--sidebar-text); font-size: 11px; font-weight: 600;
  border-radius: var(--r-sm); cursor: pointer; transition: all var(--fast);
  text-align: center; white-space: nowrap;
}
.sb-pill:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
.sb-pill.active { background: var(--sidebar-active); color: var(--accent); }

.sb-counters { display: flex; gap: 6px; padding: 0 6px; margin: 8px 0 4px; }
.sb-counter {
  flex: 1; background: rgba(255,255,255,0.025); border: 1px solid var(--sidebar-border);
  border-radius: var(--r-sm); padding: 8px 6px; text-align: center;
}
.sb-counter-val {
  font-family: Outfit, sans-serif; font-size: 17px; font-weight: 700;
  color: var(--sidebar-text-bright); line-height: 1.1;
}
.sb-counter-lbl {
  font-size: 9px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--sidebar-text); margin-top: 1px;
}

.sb-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--sidebar-text);
  padding: 0 12px; margin: 16px 0 4px;
}
.sb-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 4px; }
.sb-nav-link {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 12px; border-radius: var(--r-sm);
  color: var(--sidebar-text); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--fast);
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit; border-left: 2px solid transparent;
}
.sb-nav-link:hover { background: var(--sidebar-hover); color: var(--sidebar-text-bright); }
.sb-nav-link.active {
  background: var(--sidebar-active); color: var(--accent);
  border-left-color: var(--accent); font-weight: 600;
}
.sb-nav-icon { width: 18px; text-align: center; font-size: 13px; opacity: 0.85; }

.sb-spacer { flex: 1; }

.sb-new-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px; background: var(--accent); color: #fff;
  border: none; border-radius: var(--r-md); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all var(--fast); margin: 0 6px;
  box-shadow: 0 2px 8px rgba(var(--accent-rgb),0.25);
}
.sb-new-btn:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(var(--accent-rgb),0.35); }
.sb-new-btn:active { transform: translateY(0); }

/* ── Main ── */
#main { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Top Bar ── */
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 28px; border-bottom: 1px solid var(--surface-border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 10;
}
.tb-dropdown { position: relative; }
.tb-dropdown-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 12px; background: var(--surface-0);
  border: 1px solid var(--surface-border); border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600; color: var(--ink-1);
  cursor: pointer; transition: all var(--fast); white-space: nowrap;
}
.tb-dropdown-btn:hover { border-color: var(--accent); }
.tb-dropdown-menu {
  position: absolute; top: calc(100% + 5px); left: 0; min-width: 190px;
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  padding: 5px; z-index: 20; opacity: 0; transform: translateY(-3px);
  pointer-events: none; transition: all var(--fast);
}
.tb-dropdown-menu.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
.tb-dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; transition: background var(--fast);
}
.tb-dropdown-item:hover { background: var(--surface-0); color: var(--ink-1); }
.tb-dropdown-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tb-search {
  flex: 1; max-width: 320px; position: relative;
}
.tb-search input {
  width: 100%; padding: 7px 12px 7px 30px;
  border: 1px solid var(--surface-border); border-radius: var(--r-sm);
  background: var(--surface-0); font-family: inherit; font-size: 13px;
  color: var(--ink-1); outline: none; transition: border-color var(--fast), box-shadow var(--fast);
}
.tb-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tb-search::before {
  content: '\2315'; position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%); color: var(--ink-3); font-size: 13px; pointer-events: none;
}
.tb-spacer { flex: 1; }
.tb-icon-btn {
  width: 34px; height: 34px; border: 1px solid var(--surface-border);
  background: var(--surface-0); border-radius: var(--r-sm);
  cursor: pointer; font-size: 14px; color: var(--ink-2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--fast); flex-shrink: 0;
}
.tb-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.tb-cmd-hint {
  font-size: 10px; font-weight: 600; color: var(--ink-3);
  background: var(--surface-0); border: 1px solid var(--surface-border);
  padding: 2px 6px; border-radius: var(--r-xs); margin-left: -8px;
}

/* ── View Layout ── */
.v-header { padding: 28px 28px 0; }
.v-header h1 {
  font-family: Outfit, sans-serif; font-size: 24px; font-weight: 800;
  color: var(--ink-0); margin-bottom: 3px; letter-spacing: -0.02em;
}
.v-sub { font-size: 13px; color: var(--ink-3); }
.v-body {
  padding: 20px 28px 48px; flex: 1;
  animation: fadeUp 0.35s var(--ease);
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ══════════════════════════════════════════════
   SHARED COMPONENTS
   ══════════════════════════════════════════════ */

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: var(--r-sm);
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all var(--fast);
  border: 1px solid var(--surface-border);
  background: var(--surface-1); color: var(--ink-1);
}
.btn:hover { border-color: var(--ink-4); }
.btn-primary {
  background: var(--accent); color: #fff; border-color: transparent;
  box-shadow: 0 1px 4px rgba(var(--accent-rgb),0.2);
}
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 2px 8px rgba(var(--accent-rgb),0.3); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-0); color: var(--ink-1); }
.btn-danger { background: var(--st-rejected); color: #fff; border-color: transparent; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* Tab bar */
.tab-bar { display: flex; gap: 2px; background: var(--surface-0); border-radius: var(--r-md); padding: 3px; margin-bottom: 20px; width: fit-content; }
.tab-btn {
  padding: 7px 16px; border: none; background: transparent;
  border-radius: var(--r-sm); font-family: inherit; font-size: 13px;
  font-weight: 500; color: var(--ink-3); cursor: pointer;
  transition: all var(--fast);
}
.tab-btn:hover { color: var(--ink-1); }
.tab-btn.active { background: var(--surface-1); color: var(--ink-1); font-weight: 600; box-shadow: var(--shadow-sm); }

/* Status badge */
.status-badge {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 600;
  color: #fff; letter-spacing: 0.01em;
}

/* Tags */
.tag {
  display: inline-flex; align-items: center; padding: 2px 8px;
  border-radius: var(--r-full); font-size: 11px; font-weight: 500;
  background: var(--surface-0); color: var(--ink-2);
  border: 1px solid var(--surface-border);
}
.tag-primary { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }
.tag-clickable { cursor: pointer; transition: all var(--fast); }
.tag-clickable:hover { transform: scale(1.04); }

/* Data table */
.data-table-wrap { background: var(--surface-1); border: 1px solid var(--surface-border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.data-table-title {
  padding: 14px 18px 0; font-family: Outfit, sans-serif;
  font-size: 15px; font-weight: 700; color: var(--ink-1);
}
.data-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
.data-table th {
  text-align: left; padding: 10px 14px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--ink-3); border-bottom: 1px solid var(--surface-border);
}
.data-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--surface-border);
  color: var(--ink-2); vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--surface-2); }

.list-th { cursor: pointer; user-select: none; }
.list-th:hover { color: var(--ink-1); }
.sort-arrow { font-size: 9px; margin-left: 3px; }

/* KPI cards */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.kpi-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 16px 18px; transition: border-color var(--fast);
}
.kpi-card:hover { border-color: var(--surface-border-strong); }
.kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
.kpi-label { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-bottom: 4px; }
.kpi-value { font-family: Outfit, sans-serif; font-size: 22px; font-weight: 800; color: var(--ink-0); letter-spacing: -0.02em; }
.kpi-trend { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: var(--r-full); }
.kpi-trend.up { background: rgba(34,197,94,0.1); color: #16a34a; }
.kpi-trend.down { background: rgba(239,68,68,0.1); color: #dc2626; }
.kpi-trend.flat { background: var(--surface-0); color: var(--ink-3); }
.kpi-spark { margin: 8px 0 4px; }
.kpi-sub { font-size: 11px; color: var(--ink-3); }

/* Charts row */
.charts-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
.chart-card {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 18px;
}
.chart-title { font-family: Outfit, sans-serif; font-size: 14px; font-weight: 700; color: var(--ink-1); margin-bottom: 14px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.rank-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700;
  background: var(--surface-0); color: var(--ink-2);
}

/* Heatmap */
.heatmap-wrap { overflow-x: auto; }
.heatmap-grid { display: grid; grid-template-columns: 40px repeat(24, 1fr); gap: 2px; min-width: 600px; }
.heatmap-cell { aspect-ratio: 1; border-radius: 3px; min-width: 14px; }
.heatmap-dow-label { font-size: 10px; font-weight: 600; color: var(--ink-3); display: flex; align-items: center; }
.heatmap-hour-label { font-size: 9px; color: var(--ink-3); text-align: center; font-variant-numeric: tabular-nums; }

/* Stat tiles */
.stat-row { display: grid; gap: 14px; margin-bottom: 20px; }
.stat-tile {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); padding: 16px;
}
.stat-label { font-size: 12px; font-weight: 500; color: var(--ink-3); }
.stat-value { font-family: Outfit, sans-serif; font-size: 22px; font-weight: 800; color: var(--ink-0); }
.stat-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* ── Briefing ── */
.briefing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.briefing-section {
  background: var(--surface-1); border: 1px solid var(--surface-border);
  border-radius: var(--r-lg); overflow: hidden;
}
.briefing-section.full-width { grid-column: 1 / -1; }
.briefing-section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--surface-border);
}
.briefing-section-icon {
  width: 30px; height: 30px; border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex-shrink: 0;
}
.briefing-section-title { font-family: Outfit, sans-serif; font-size: 14px; font-weight: 700; color: var(--ink-1); }
.briefing-section-count {
  margin-left: auto; font-size: 11px; font-weight: 700;
  padding: 2px 9px; border-radius: var(--r-full);
}
.briefing-section-body { padding: 12px 16px; }
.briefing-empty { padding: 16px 0; text-align: center; font-size: 13px; color: var(--ink-3); }

.briefing-post-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid var(--surface-border);

function brandById(id) { return S.brands.find(b=>b.id===id); }
function platById(id) { return S.platforms.find(p=>p.id===id); }
function pillarById(id) { return S.pillars.find(p=>p.id===id); }
function metricsForPost(pid) { return S.metrics.find(m=>m.post_id===pid); }
function brandSlug(id) { const b = brandById(id); return b ? b.slug : ''; }
function brandBg(br) { return br ? (br.slug==='del-taco'?'var(--brand-dt-soft)':(br.slug==='koala-insulation'?'var(--brand-koala-soft)':'var(--accent-soft)')) : 'var(--accent-soft)'; }

function filteredPosts() {
  let arr = S.posts;
  if (S.brandFilter !== 'all') arr = arr.filter(p => { const b = brandById(p.brand_id); return b && b.slug === S.brandFilter; });
  if (S.searchQuery) { const q = S.searchQuery.toLowerCase(); arr = arr.filter(p => (p.title||'').toLowerCase().includes(q) || (p.caption||'').toLowerCase().includes(q)); }
  return arr;
}
function filterByBrand(arr) {
  if (S.brandFilter === 'all') return arr;
  return arr.filter(item => { const b = brandById(item.brand_id); return b && b.slug === S.brandFilter; });
}

function startOfWeek(d) {
  const dt = new Date(d); const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff); dt.setHours(0,0,0,0); return dt;
}
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
function escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function escAttr(s) { return (s||'').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' }); }
function fmtTime(t) { if (!t) return ''; const [h,m] = t.split(':').map(Number); return `${h%12===0?12:h%12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`; }
function fmtNum(n) { if (n == null) return '0'; if (n >= 1000000) return (n/1000000).toFixed(1)+'M'; if (n >= 1000) return (n/1000).toFixed(1)+'K'; return String(n); }

function showToast(msg, type='info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; setTimeout(() => el.remove(), 200); }, 3000);
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('scc-theme'); } catch(e) {}
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  else document.documentElement.removeAttribute('data-theme');
  updateThemeIcon();
}
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr === 'dark' || (!attr && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const btn = document.getElementById('theme-toggle-btn');
  if (btn) btn.innerHTML = isDark ? '&#9789;' : '&#9788;';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDarkNow = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDarkNow ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('scc-theme', next); } catch(e) {}
  updateThemeIcon();
}

function renderSidebarCounters() {
  const posts = filteredPosts();
  const today = toDateStr(new Date());
  const weekStart = startOfWeek(new Date());
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const todayCount = posts.filter(p => p.scheduled_date === today).length;
  const weekCount = posts.filter(p => p.scheduled_date && p.scheduled_date >= toDateStr(weekStart) && p.scheduled_date <= toDateStr(weekEnd)).length;
  document.getElementById('sidebar-counters').innerHTML = `
    <div class="sb-counter"><div class="sb-counter-val">${todayCount}</div><div class="sb-counter-lbl">Today</div></div>
    <div class="sb-counter"><div class="sb-counter-val">${weekCount}</div><div class="sb-counter-lbl">This Week</div></div>`;
}

// ══════════════════════════════════════════════
// BRIEFING DASHBOARD
// ══════════════════════════════════════════════
function renderBriefing() {
  const today = new Date(); const todayStr = toDateStr(today);
  const weekStart = startOfWeek(today); const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);
  const weekEndStr = toDateStr(weekEnd); const weekStartStr = toDateStr(weekStart);
  const weekDays = [];
  for (let i = 0; i < 7; i++) { const d = new Date(weekStart); d.setDate(d.getDate()+i); weekDays.push({ date: d, str: toDateStr(d), dow: DOW_SHORT[d.getDay()], dom: d.getDate() }); }
  const allPosts = filteredPosts();
  const duePosts = allPosts.filter(p => p.scheduled_date && p.scheduled_date >= weekStartStr && p.scheduled_date <= weekEndStr && ['idea','draft','pending_approval','approved','scheduled'].includes(p.status)).sort((a,b) => (a.scheduled_date||'').localeCompare(b.scheduled_date||'') || (a.scheduled_time||'').localeCompare(b.scheduled_time||''));
  const needsWork = duePosts.filter(p => ['idea','draft'].includes(p.status));
  const needsReview = duePosts.filter(p => p.status === 'pending_approval');
  const ready = duePosts.filter(p => ['approved','scheduled'].includes(p.status));
  const activeBrands = S.brandFilter === 'all' ? S.brands : S.brands.filter(b => b.slug === S.brandFilter);
  const gaps = [];
  activeBrands.forEach(brand => {
    const brandPosts = allPosts.filter(p => p.brand_id === brand.id);
    weekDays.forEach(day => { if (day.str < todayStr) return; if (brandPosts.filter(p => p.scheduled_date === day.str).length === 0) gaps.push({ brand, day }); });
  });
  const postedWithMetrics = allPosts.filter(p => p.status === 'posted').map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m).sort((a,b) => (b.scheduled_date||'').localeCompare(a.scheduled_date||'')).slice(0, 8);
  const totalReach = postedWithMetrics.reduce((s,x) => s + (x.m.reach||0), 0);
  const totalLikes = postedWithMetrics.reduce((s,x) => s + (x.m.likes||0), 0);
  const avgEng = postedWithMetrics.length > 0 ? (postedWithMetrics.reduce((s,x) => s + parseFloat(x.m.engagement_rate||0), 0) / postedWithMetrics.length).toFixed(1) : '0.0';

  let html = `<div class="v-header"><h1>&#9889; Briefing</h1><p class="v-sub">Week of ${MONTH_NAMES[weekStart.getMonth()]} ${weekStart.getDate()} – ${weekStart.getMonth()===weekEnd.getMonth()?'':MONTH_NAMES[weekEnd.getMonth()]+' '}${weekEnd.getDate()}</p></div><div class="v-body"><div class="briefing-grid">`;

  // Content Due
  html += `<div class="briefing-section full-width"><div class="briefing-section-header"><div class="briefing-section-icon" style="background:rgba(var(--accent-rgb),.1);color:var(--accent)">&#128203;</div><div class="briefing-section-title">Content Due This Week</div><span class="briefing-section-count" style="background:${needsWork.length>0?'rgba(245,158,11,.1)':'rgba(34,197,94,.1)'};color:${needsWork.length>0?'var(--st-draft)':'var(--st-approved)'}">${duePosts.length} post${duePosts.length!==1?'s':''}</span></div><div class="briefing-section-body">`;
  if (duePosts.length === 0) {
    html += `<div class="briefing-empty">No posts scheduled this week. <span style="cursor:pointer;color:var(--accent)" onclick="S.view='calendar';document.querySelectorAll('.sb-nav-link').forEach(n=>n.classList.toggle('active',n.dataset.view==='calendar'));render()">Open Calendar &#8594;</span></div>`;
  } else {
    html += `<div style="display:flex;gap:16px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--surface-border)"><div style="font-size:12px;color:var(--ink-3)">&#9888;&#65039; <strong style="color:var(--st-draft)">${needsWork.length}</strong> need${needsWork.length!==1?'':'s'} work</div><div style="font-size:12px;color:var(--ink-3)">&#128269; <strong style="color:var(--st-review)">${needsReview.length}</strong> in review</div><div style="font-size:12px;color:var(--ink-3)">&#9989; <strong style="color:var(--st-approved)">${ready.length}</strong> ready</div></div>`;
    duePosts.forEach(p => {
      const br = brandById(p.brand_id); const pil = pillarById(p.content_pillar_id);
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      const d = p.scheduled_date ? new Date(p.scheduled_date + 'T00:00:00') : null;
      const isToday = p.scheduled_date === todayStr; const isPast = p.scheduled_date < todayStr;
      let actionClass = 'needs-work', actionLabel = 'Needs Work';
      if (p.status === 'pending_approval') { actionClass = 'needs-review'; actionLabel = 'In Review'; }
      else if (['approved','scheduled'].includes(p.status)) { actionClass = 'ready'; actionLabel = 'Ready'; }
      html += `<div class="briefing-post-row" data-post-id="${p.id}"><div class="briefing-post-day" style="${isToday?'border-color:var(--accent);background:var(--accent-soft)':''}${isPast?';opacity:.6':''}"><span class="dow">${d?DOW_SHORT[d.getDay()]:'—'}</span><span class="dom">${d?d.getDate():'—'}</span></div><div class="briefing-post-info"><div class="briefing-post-title">${escHtml(p.title)}</div><div class="briefing-post-meta"><span class="briefing-status-dot" style="background:${meta.color}"></span><span>${meta.label}</span>${br?`<span style="color:${br.color||'var(--accent)'}">${br.logo_emoji||''} ${br.name.split(' ')[0]}</span>`:''} ${plats.length?'<span>'+plats.map(pl=>`<span style="color:${PLAT_HEX[pl.name]||'var(--ink-3)'}">${pl.name}</span>`).join(', ')+'</span>':''} ${p.scheduled_time?`<span>${fmtTime(p.scheduled_time)}</span>`:''}</div></div><button class="briefing-post-action ${actionClass}">${actionLabel}</button></div>`;
    });
  }
  html += `</div></div>`;

  // Gap Alerts
  html += `<div class="briefing-section"><div class="briefing-section-header"><div class="briefing-section-icon" style="background:rgba(245,158,11,.1);color:var(--st-draft)">&#128680;</div><div class="briefing-section-title">Gap Alerts</div><span class="briefing-section-count" style="background:${gaps.length>0?'rgba(245,158,11,.1)':'rgba(34,197,94,.1)'};color:${gaps.length>0?'var(--st-draft)':'var(--st-approved)'}">${gaps.length} gap${gaps.length!==1?'s':''}</span></div><div class="briefing-section-body">`;
  if (gaps.length === 0) {
    html += `<div class="briefing-empty" style="color:var(--st-approved)">&#9989; No content gaps — every day is covered!</div>`;
  } else {
    const gapsByDay = {};
    gaps.forEach(g => { if (!gapsByDay[g.day.str]) gapsByDay[g.day.str] = { day: g.day, brands: [] }; gapsByDay[g.day.str].brands.push(g.brand); });
    Object.values(gapsByDay).forEach(g => {
      const brandNames = g.brands.map(b => `<span style="color:${b.color||'var(--accent)'}">${b.logo_emoji||''} ${b.name.split(' ')[0]}</span>`).join(', ');
      html += `<div class="briefing-gap-row"><div class="briefing-gap-icon">&#128197;</div><div class="briefing-gap-text"><strong>${g.day.dow} ${MONTH_NAMES[new Date(g.day.date).getMonth()].slice(0,3)} ${g.day.dom}</strong> — no posts for ${brandNames}</div><button class="briefing-gap-add" onclick="S.view='calendar';S.calView='week';S.weekAnchor=startOfWeek(new Date('${g.day.str}T00:00:00'));document.querySelectorAll('.sb-nav-link').forEach(n=>n.classList.toggle('active',n.dataset.view==='calendar'));render()">+ Add</button></div>`;
    });
  }
  html += `</div></div>`;

  // Recent Performance
  html += `<div class="briefing-section"><div class="briefing-section-header"><div class="briefing-section-icon" style="background:rgba(16,185,129,.1);color:var(--st-posted)">&#128200;</div><div class="briefing-section-title">Recent Performance</div></div><div class="briefing-section-body">`;
  if (postedWithMetrics.length === 0) {
    html += `<div class="briefing-empty">No performance data yet. Log metrics on posted content.</div>`;
  } else {
    html += `<div style="display:flex;gap:16px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--surface-border)"><div style="font-size:12px;color:var(--ink-3)">Reach <strong style="color:var(--ink-1)">${fmtNum(totalReach)}</strong></div><div style="font-size:12px;color:var(--ink-3)">Likes <strong style="color:var(--ink-1)">${fmtNum(totalLikes)}</strong></div><div style="font-size:12px;color:var(--ink-3)">Avg Eng <strong style="color:var(--ink-1)">${avgEng}%</strong></div></div>`;
    postedWithMetrics.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      html += `<div class="briefing-perf-row"><div class="briefing-perf-thumb" style="background:${brandBg(br)};color:${br?br.color:'var(--accent)'}">${br?br.logo_emoji||'&#128202;':'&#128202;'}</div><div class="briefing-perf-info"><div class="briefing-perf-title">${escHtml(p.title)}</div><div class="briefing-perf-stats">${plats.length?`<span style="color:${PLAT_HEX[plats[0].name]||'var(--ink-3)'}">${plats[0].name}</span>`:''}<span class="briefing-perf-stat">&#128065; <span class="val">${fmtNum(p.m.reach||0)}</span></span><span class="briefing-perf-stat">&#10084;&#65039; <span class="val">${fmtNum(p.m.likes||0)}</span></span><span class="briefing-perf-stat">&#128172; <span class="val">${fmtNum(p.m.comments||0)}</span></span>${p.m.engagement_rate?`<span class="briefing-perf-stat">&#128200; <span class="val">${parseFloat(p.m.engagement_rate).toFixed(1)}%</span></span>`:''}</div></div></div>`;
    });
  }
  html += `</div></div></div></div>`;
  document.getElementById('main-view').innerHTML = html;
  document.querySelectorAll('.briefing-post-row').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

// ══════════════════════════════════════════════
// CALENDAR
// ══════════════════════════════════════════════
function renderCalendarView() {
  const wrap = document.getElementById('main-view');
  let html = `<div class="v-header"><h1>Content Calendar</h1><p class="v-sub">Plan and schedule content across brands and platforms</p></div><div class="v-body"><div class="tab-bar" id="cal-view-tabs"><button class="tab-btn ${S.calView==='month'?'active':''}" data-calview="month">Monthly</button><button class="tab-btn ${S.calView==='week'?'active':''}" data-calview="week">Weekly</button><button class="tab-btn ${S.calView==='list'?'active':''}" data-calview="list">List</button></div><div id="cal-body"></div></div>`;
  wrap.innerHTML = html;
  document.getElementById('cal-view-tabs').addEventListener('click', e => { const btn = e.target.closest('.tab-btn'); if (!btn) return; S.calView = btn.dataset.calview; renderCalendarView(); });
  if (S.calView === 'month') renderCalendarMonth(); else if (S.calView === 'week') renderCalendarWeek(); else renderCalendarList();
}

function renderCalendarMonth() {
  const posts = filteredPosts(); const y = S.calYear, m = S.calMonth;
  const first = new Date(y, m, 1); const last = new Date(y, m+1, 0);
  const startDow = first.getDay(); const daysInMonth = last.getDate();
  const today = new Date(); const todayStr = toDateStr(today);
  const byDate = {}; posts.forEach(p => { if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); } });
  let html = `<div class="cal-nav"><button class="cal-nav-btn" id="cal-prev">&#8249;</button><span class="cal-month-label">${MONTH_NAMES[m]} ${y}</span><button class="cal-nav-btn" id="cal-next">&#8250;</button><button class="cal-today-btn" id="cal-today">Today</button></div><div class="cal-grid">`;
  DOW_SHORT.forEach(d => { html += `<div class="cal-dow">${d}</div>`; });
  const prevLast = new Date(y, m, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) html += `<div class="cal-day outside"><div class="cal-day-num">${prevLast - i}</div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr; const dayPosts = byDate[dateStr] || [];
    html += `<div class="cal-day${isToday?' today':''}" data-date="${dateStr}"><div class="cal-day-num-row"><div class="cal-day-num">${d}</div>${dayPosts.length?`<span class="cal-day-count">${dayPosts.length}</span>`:''}</div>`;
    dayPosts.slice(0, 4).forEach(p => {
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []); const plats = pids.map(id=>platById(id)).filter(Boolean);
      html += `<div class="cal-post-row" data-post-id="${p.id}" title="${escAttr(p.title)}">${plats.length?plats.map(pl=>`<span class="cal-plat-dot" style="background:${PLAT_HEX[pl.name]||'#6366f1'}"></span>`).join(''):`<span class="cal-plat-dot" style="background:#6366f1"></span>`} ${escHtml(p.title.substring(0,16))}</div>`;
    });
    if (dayPosts.length > 4) html += `<div class="cal-overflow">+${dayPosts.length-4} more</div>`;
    html += `</div>`;
  }
  const totalCells = startDow + daysInMonth; const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) html += `<div class="cal-day outside"><div class="cal-day-num">${i}</div></div>`;
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.getElementById('cal-prev').onclick = () => { S.calMonth--; if(S.calMonth<0){S.calMonth=11;S.calYear--;} renderCalendarMonth(); };
  document.getElementById('cal-next').onclick = () => { S.calMonth++; if(S.calMonth>11){S.calMonth=0;S.calYear++;} renderCalendarMonth(); };
  document.getElementById('cal-today').onclick = () => { S.calMonth=today.getMonth(); S.calYear=today.getFullYear(); renderCalendarMonth(); };
  document.querySelectorAll('.cal-post-row').forEach(el => { el.onclick = (e) => { e.stopPropagation(); openPostModal(el.dataset.postId); }; });
  document.querySelectorAll('.cal-day:not(.outside)').forEach(el => { el.onclick = () => { openPostModal(null, el.dataset.date); }; });
}

function renderCalendarWeek() {
  const posts = filteredPosts(); const start = new Date(S.weekAnchor); const days = [];
  for (let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  const end = days[6]; const todayStr = toDateStr(new Date());
  const byDate = {}; posts.forEach(p => { if (p.scheduled_date) { if (!byDate[p.scheduled_date]) byDate[p.scheduled_date]=[]; byDate[p.scheduled_date].push(p); } });
  let html = `<div class="cal-nav"><button class="cal-nav-btn" id="week-prev">&#8249;</button><span class="cal-month-label">${MONTH_NAMES[start.getMonth()]} ${start.getDate()} – ${MONTH_NAMES[end.getMonth()]} ${end.getDate()}, ${end.getFullYear()}</span><button class="cal-nav-btn" id="week-next">&#8250;</button><button class="cal-today-btn" id="week-today">Today</button></div><div class="week-grid">`;
  days.forEach(d => {
    const dateStr = toDateStr(d); const dayPosts = (byDate[dateStr]||[]).sort((a,b)=>(a.scheduled_time||'').localeCompare(b.scheduled_time||''));
    html += `<div class="week-col${dateStr===todayStr?' today':''}"><div class="week-col-head"><div class="week-col-dow">${DOW_SHORT[d.getDay()]}</div><div class="week-col-num">${d.getDate()}</div></div>`;
    if (dayPosts.length === 0) { html += `<div class="week-empty">No posts</div>`; }
    else { dayPosts.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      html += `<div class="week-card" data-post-id="${p.id}">${p.scheduled_time?`<div class="week-card-time">${fmtTime(p.scheduled_time)}</div>`:''}<div class="week-card-title">${escHtml(p.title)}</div><div class="week-card-badges">${plats.length?plats.map(pl=>`<span class="week-card-plat" style="background:${PLAT_HEX[pl.name]||'#6366f1'}" title="${escAttr(pl.name)}"></span>`).join(''):''} ${br?`<span style="font-size:10px;color:var(--ink-3)">${escHtml(br.name.split(' ')[0])}</span>`:''}<span class="week-card-status" style="background:${meta.color};color:#fff;margin-left:auto">${meta.label}</span></div></div>`;
    }); }
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.getElementById('week-prev').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()-7); renderCalendarWeek(); };
  document.getElementById('week-next').onclick = () => { S.weekAnchor.setDate(S.weekAnchor.getDate()+7); renderCalendarWeek(); };
  document.getElementById('week-today').onclick = () => { S.weekAnchor = startOfWeek(new Date()); renderCalendarWeek(); };
  document.querySelectorAll('.week-card').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

function renderCalendarList() {
  const posts = filteredPosts(); const today = toDateStr(new Date());
  const horizon = new Date(); horizon.setDate(horizon.getDate()+30); const horizonStr = toDateStr(horizon);
  let upcoming = posts.filter(p => p.scheduled_date && p.scheduled_date >= today && p.scheduled_date <= horizonStr);
  const { key, dir } = S.listSort;
  upcoming = [...upcoming].sort((a,b) => {
    let av, bv;
    if (key==='title') { av=a.title||''; bv=b.title||''; }
    else if (key==='brand') { av=(brandById(a.brand_id)||{}).name||''; bv=(brandById(b.brand_id)||{}).name||''; }
    else if (key==='platform') { av=(platById(a.platform_id)||{}).name||''; bv=(platById(b.platform_id)||{}).name||''; }
    else if (key==='status') { av=a.status||''; bv=b.status||''; }
    else { av=(a.scheduled_date||'')+(a.scheduled_time||''); bv=(b.scheduled_date||'')+(b.scheduled_time||''); }
    return dir==='asc' ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
  });
  const cols = [['scheduled_date','Date'],['scheduled_time','Time'],['title','Title'],['brand','Brand'],['platform','Platform'],['pillar','Pillar'],['status','Status'],['brief','Brief']];
  let html = `<div class="list-table-wrap">`;
  if (upcoming.length === 0) { html += emptyState('&#128197;', 'No posts scheduled in the next 30 days.'); }
  else {
    html += `<div style="overflow-x:auto"><table class="data-table"><thead><tr>`;
    cols.forEach(([k,label]) => {
      const sortable = ['scheduled_date','title','brand','platform','status'].includes(k);
      const arrow = S.listSort.key===k ? (S.listSort.dir==='asc'?'&#9650;':'&#9660;') : '';
      html += `<th class="${sortable?'list-th':''}" ${sortable?`data-sortkey="${k}"`:''}>${label}${sortable?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
    });
    html += `</tr></thead><tbody>`;
    upcoming.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean); const pil = pillarById(p.content_pillar_id);
      const meta = STATUS_META[p.status] || { label: p.status, color: 'var(--ink-3)' };
      html += `<tr class="list-row" data-post-id="${p.id}" style="cursor:pointer"><td>${fmtDate(p.scheduled_date)}</td><td>${p.scheduled_time?fmtTime(p.scheduled_time):'—'}</td><td style="font-weight:500;color:var(--ink-1)">${escHtml(p.title)}</td><td>${br?escHtml(br.name):'—'}</td><td>${plats.length?plats.map(pl=>`<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${PLAT_HEX[pl.name]||'#6366f1'};margin-right:4px;vertical-align:middle"></span>`).join('')+plats.map(pl=>escHtml(pl.name)).join(', '):'—'}</td><td>${pil?escHtml(pil.name):'—'}</td><td><span class="status-badge" style="background:${meta.color}">${meta.label}</span></td><td><button class="metrics-btn" onclick="event.stopPropagation();generateBrief('${p.id}')" title="Generate Brief">&#128203;</button></td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  document.getElementById('cal-body').innerHTML = html;
  document.querySelectorAll('.list-th').forEach(el => { el.onclick = () => { const k = el.dataset.sortkey; if (S.listSort.key===k) S.listSort.dir = S.listSort.dir==='asc'?'desc':'asc'; else { S.listSort.key=k; S.listSort.dir='asc'; } renderCalendarList(); }; });
  document.querySelectorAll('.list-row').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
}

// PIPELINE
// ══════════════════════════════════════════════
function renderPipeline() {
  const posts = filteredPosts();
  let html = `<div class="v-header"><h1>Content Pipeline</h1><p class="v-sub">Track posts through your workflow</p></div><div class="v-body"><div class="pipeline-board">`;
  STATUS_ORDER.forEach(status => {
    const meta = STATUS_META[status]; const col = posts.filter(p => p.status === status);
    html += `<div class="pipeline-col" style="border-top-color:${meta.color}"><div class="pipeline-col-header"><span class="pipeline-col-title" style="color:${meta.color}">${meta.label}</span><span class="pipeline-col-count">${col.length}</span></div>`;
    if (col.length === 0) html += `<div style="text-align:center;padding:20px 0;color:var(--ink-3);font-size:12px">No posts</div>`;
    col.forEach(p => {
      const br = brandById(p.brand_id); const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      const plats = pids.map(id=>platById(id)).filter(Boolean); const pil = pillarById(p.content_pillar_id);
      html += `<div class="pipeline-card" data-post-id="${p.id}"><div class="pipeline-card-top"><span class="pipeline-card-brand" style="background:${brandBg(br)};color:${br?br.color:'var(--accent)'}">${br?br.name:'—'}</span><span class="pipeline-drag-handle">&#8942;&#8942;</span></div><div class="pipeline-card-title">${p.media_type?`<span class="pipeline-media-icon">${MEDIA_ICONS[p.media_type]||''}</span>`:''} ${pil?`<span class="pipeline-pillar-dot" style="background:${pil.color||'var(--accent)'}"></span>`:''} ${escHtml(p.title)}</div><div class="pipeline-card-meta">${plats.length?plats.map(pl=>`<span class="pipeline-plat-dot" style="background:${PLAT_HEX[pl.name]||'#6366f1'}" title="${escAttr(pl.name)}"></span>`).join('')+`<span style="font-size:11px;color:var(--ink-3)">${plats.map(pl=>pl.name).join(', ')}</span>`:''} ${p.scheduled_date?`<span class="pipeline-card-date">${fmtDate(p.scheduled_date)}</span>`:''}</div><div style="display:flex;gap:4px;margin-top:4px"><button class="metrics-btn" onclick="event.stopPropagation();generateBrief('${p.id}')" title="Generate Brief">&#128203; Brief</button>${status==='posted'&&!metricsForPost(p.id)?`<button class="metrics-btn" onclick="event.stopPropagation();openMetricsModal('${p.id}')">Log Metrics</button>`:''}</div></div>`;
    });
    if (status === 'idea') html += `<button class="pipeline-quick-add" id="pipeline-quick-add">+ Quick Add Idea</button>`;
    html += `</div>`;
  });
  html += `</div></div>`;
  document.getElementById('main-view').innerHTML = html;
  document.querySelectorAll('.pipeline-card').forEach(el => { el.onclick = () => openPostModal(el.dataset.postId); });
  const qa = document.getElementById('pipeline-quick-add'); if (qa) qa.onclick = () => openPostModal(null, null, true);
}

// ══════════════════════════════════════════════
// ANALYTICS
// ══════════════════════════════════════════════
function renderAnalytics() {
  const posts = filteredPosts(); const posted = posts.filter(p => p.status === 'posted');
  const withMetrics = posted.map(p => ({ ...p, m: metricsForPost(p.id) })).filter(x => x.m);
  const totalPosts = posted.length;
  const totalReach = withMetrics.reduce((s,x) => s + (x.m.reach||0), 0);
  const totalFollowers = withMetrics.reduce((s,x) => s + (x.m.followers_gained||0), 0);
  const avgEngagement = withMetrics.length > 0 ? (withMetrics.reduce((s,x) => s + parseFloat(x.m.engagement_rate||0), 0) / withMetrics.length).toFixed(1) : '0.0';
  const chrono = [...withMetrics].sort((a,b) => (a.scheduled_date||'').localeCompare(b.scheduled_date||''));
  const reachSeries = chrono.map(x => x.m.reach||0);
  const engSeries = chrono.map(x => parseFloat(x.m.engagement_rate||0));
  const followersSeries = chrono.map(x => x.m.followers_gained||0);
  const postsCountSeries = bucketCounts(posted.map(p=>p.scheduled_date).filter(Boolean));

  let html = `<div class="v-header"><h1>Analytics</h1><p class="v-sub">Track performance across platforms and brands</p></div><div class="v-body">`;
  html += `<div class="kpi-row">${kpiCard('Total Posts', totalPosts, `${posts.filter(p=>p.status==='scheduled').length} scheduled`, postsCountSeries, '#6366f1')}${kpiCard('Avg Engagement', avgEngagement+'%', `${withMetrics.length} posts with metrics`, engSeries, '#22c55e')}${kpiCard('Total Reach', fmtNum(totalReach), 'Across all platforms', reachSeries, '#0ea5e9')}${kpiCard('Followers Gained', '+'+fmtNum(totalFollowers), 'Net new followers', followersSeries, '#f59e0b')}</div>`;

  const platStats = {}; S.platforms.forEach(p => { platStats[p.id] = { name:p.name, posts:0, reach:0, engagement:0, count:0 }; });
  posted.forEach(p => { const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []); pids.forEach(pid => { if(platStats[pid]) platStats[pid].posts++; }); });

// ── Chart Helpers ──
function bucketCounts(dates) { const sorted = [...dates].sort(); const counts = {}; sorted.forEach(d => { counts[d]=(counts[d]||0)+1; }); return Object.values(counts).slice(-12); }

function kpiCard(label, value, sub, series, color) {
  const trend = trendFromSeries(series);
  return `<div class="kpi-card"><div class="kpi-top"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div><div class="kpi-trend ${trend.dir}">${trend.arrow} ${trend.pct}</div></div><div class="kpi-spark">${drawSparkline(series, color)}</div><div class="kpi-sub">${sub}</div></div>`;
}

function trendFromSeries(series) {
  if (!series || series.length < 2) return { dir:'flat', arrow:'—', pct:'' };
  const half = Math.max(1, Math.floor(series.length/2));
  const first = series.slice(0, half).reduce((a,b)=>a+b,0) / half;
  const last = series.slice(-half).reduce((a,b)=>a+b,0) / half;
  if (first === 0 && last === 0) return { dir:'flat', arrow:'—', pct:'0%' };
  const pct = first === 0 ? 100 : ((last-first)/Math.abs(first))*100;
  if (Math.abs(pct) < 1) return { dir:'flat', arrow:'—', pct:'0%' };
  return pct > 0 ? { dir:'up', arrow:'&#9650;', pct: Math.abs(pct).toFixed(0)+'%' } : { dir:'down', arrow:'&#9660;', pct: Math.abs(pct).toFixed(0)+'%' };
}

function drawSparkline(values, color) {
  if (!values || values.length === 0) return `<svg viewBox="0 0 100 34" style="width:100%;height:34px;display:block"></svg>`;
  const W=100,H=34,pad=3; const max = Math.max(...values, 0.0001); const min = Math.min(...values, 0); const range = (max-min)||1;
  const stepX = values.length>1 ? (W-pad*2)/(values.length-1) : 0;
  const pts = values.map((v,i) => [pad+i*stepX, H-pad-((v-min)/range)*(H-pad*2)]);
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)},${H-pad} L${pts[0][0].toFixed(1)},${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:34px;display:block"><path d="${area}" fill="${color}" opacity="0.12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function drawGroupedBarChart(data) {
  const maxVal = Math.max(...data.map(d=>d.value), 1);
  const W = 480, H = 40, barH = 26;
  let svg = `<svg viewBox="0 0 ${W} ${data.length*H}" style="width:100%;display:block">`;
  data.forEach((d,i) => {
    const y = i*H + (H-barH)/2; const w = maxVal > 0 ? (d.value/maxVal) * (W-140) : 0;
    svg += `<text x="0" y="${y+barH/2+4}" font-size="12" font-weight="600" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${escHtml(d.label)}</text>`;
    svg += `<rect x="90" y="${y}" width="${W-140}" height="${barH}" rx="4" fill="var(--chart-grid)"/>`;
    svg += `<rect x="90" y="${y}" width="${w}" height="${barH}" rx="4" fill="${d.color}" opacity="0.88"/>`;
    svg += `<text x="${90+w+8}" y="${y+barH/2+4}" font-size="11" font-weight="700" fill="var(--chart-text)" font-family="DM Sans,sans-serif">${fmtNum(d.value)}</text>`;
  });
  svg += `</svg>`; return svg;
}

function drawDonut(data) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (total === 0) return `<div style="text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0">No data yet</div>`;
  const cx=90, cy=90, r=70, ir=42; let angle = -Math.PI/2; let paths = '';
  data.forEach(d => {
    const frac = d.value/total; const sweep = frac*Math.PI*2;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle), x2 = cx+r*Math.cos(angle+sweep), y2 = cy+r*Math.sin(angle+sweep);
    const ix1 = cx+ir*Math.cos(angle), iy1 = cy+ir*Math.sin(angle), ix2 = cx+ir*Math.cos(angle+sweep), iy2 = cy+ir*Math.sin(angle+sweep);
    const large = sweep > Math.PI ? 1 : 0;
    paths += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ir},${ir} 0 ${large} 0 ${ix1.toFixed(2)},${iy1.toFixed(2)} Z" fill="${d.color}" opacity="0.9"/>`;
    angle += sweep;
  });
  let legend = `<div class="chart-legend">`; data.forEach(d => { legend += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${d.color}"></span>${escHtml(d.label)} (${d.value})</div>`; }); legend += `</div>`;
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:180px;height:180px;flex-shrink:0">${paths}<text x="90" y="86" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink-1)" font-family="Outfit,sans-serif">${total}</text><text x="90" y="104" text-anchor="middle" font-size="10" fill="var(--chart-text)" font-family="DM Sans,sans-serif">posts</text></svg><div style="flex:1;min-width:150px">${legend}</div></div>`;
}

function drawHeatmap(posts) {
  const grid = Array.from({length:7}, () => Array(24).fill(0));
  posts.forEach(p => { if (!p.scheduled_date) return; const d = new Date(p.scheduled_date+'T00:00:00'); let dow = d.getDay(); dow = dow===0?6:dow-1; let hour = 12; if (p.scheduled_time) { const parts = p.scheduled_time.split(':'); hour = parseInt(parts[0])||0; } grid[dow][hour]++; });
  const max = Math.max(...grid.flat(), 1); const dowLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let html = `<div class="heatmap-wrap"><div class="heatmap-grid"><div></div>`;
  for (let h=0; h<24; h++) html += `<div class="heatmap-hour-label">${h%3===0?h:''}</div>`;
  for (let d=0; d<7; d++) {
    html += `<div class="heatmap-dow-label">${dowLabels[d]}</div>`;
    for (let h=0; h<24; h++) { const v = grid[d][h]; const alpha = v===0?0.06:0.15+(v/max)*0.85; html += `<div class="heatmap-cell" style="background:rgba(var(--accent-rgb),${alpha.toFixed(2)})" title="${dowLabels[d]} ${h}:00 — ${v} post${v===1?'':'s'}"></div>`; }
  }
  html += `</div></div>`; return html;
}

function drawStatusStackedBar(posts) {
  const total = posts.length || 1;
  let html = `<div style="display:flex;height:28px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--surface-border)">`;
  STATUS_ORDER.forEach(status => { const meta = STATUS_META[status]; const count = posts.filter(p=>p.status===status).length; const pct = (count/total)*100; if (pct > 0) html += `<div style="width:${pct}%;background:${meta.color};display:flex;align-items:center;justify-content:center;transition:width var(--normal)" title="${meta.label}: ${count}">${pct>8?`<span style="font-size:10px;font-weight:700;color:#fff">${count}</span>`:''}</div>`; });
  html += `</div><div class="chart-legend">`; STATUS_ORDER.forEach(status => { const meta = STATUS_META[status]; const count = posts.filter(p=>p.status===status).length; html += `<div class="chart-legend-item"><span class="chart-legend-dot" style="background:${meta.color}"></span>${meta.label} (${count})</div>`; }); html += `</div>`;
  return html;
}

function openPostModal(postId, prefillDate, isQuickIdea) {
  const post = postId ? S.posts.find(p=>p.id===postId) : null; const isEdit = !!post;
  const panel = document.getElementById('modal-panel'); panel.classList.add('wide');

  html += `<div class="form-row two-col"><div class="form-group"><label class="form-label">Brand</label><select class="form-select" name="brand_id" required id="post-brand">${S.brands.map(b=>`<option value="${b.id}" ${post&&post.brand_id===b.id?'selected':''}>${b.logo_emoji} ${b.name}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Platforms</label><div style="display:flex;flex-wrap:wrap;gap:6px;padding:6px 0">${S.platforms.map(p=>{ const checked = post?(post.platform_ids||[]).includes(p.id)||post.platform_id===p.id:false; return `<label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--surface-border);background:var(--surface-0);transition:all .15s"><input type="checkbox" name="platform_ids" value="${p.id}" ${checked?'checked':''} style="accent-color:var(--accent)"><span style="width:7px;height:7px;border-radius:50%;background:${PLAT_HEX[p.name]||'#6366f1'}"></span>${escHtml(p.name)}</label>`; }).join('')}</div></div></div>`;

  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Title</label><input class="form-input" name="title" required value="${escAttr(post?.title||'')}" placeholder="Post title" autofocus></div></div>`;
  const captionVal = post?.caption||'';
  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Caption <span class="char-count" id="caption-count">${captionVal.length}/2200</span></label><textarea class="form-textarea" name="caption" id="post-caption" placeholder="Write your caption...">${escHtml(captionVal)}</textarea><div class="caption-preview" id="caption-preview">${escHtml(captionVal)}</div></div></div>`;
  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Hashtags</label><input class="form-input" name="hashtags" id="post-hashtags" value="${escAttr(post?.hashtags||'')}" placeholder="#hashtag1 #hashtag2"><div class="hashtag-suggestions" id="hashtag-suggestions"></div></div></div>`;
  if (!isQuickIdea) {
    html += `<div class="form-row two-col"><div class="form-group"><label class="form-label">Scheduled Date</label><input class="form-input" type="date" name="scheduled_date" value="${post?.scheduled_date||prefillDate||''}"></div><div class="form-group"><label class="form-label">Scheduled Time</label><input class="form-input" type="time" name="scheduled_time" value="${post?.scheduled_time||'09:00'}"></div></div>`;
  } else { html += `<input type="hidden" name="scheduled_date" value=""><input type="hidden" name="scheduled_time" value="">`; }
  html += `<div class="form-row two-col"><div class="form-group"><label class="form-label">Status</label><select class="form-select" name="status">${STATUS_ORDER.map(s=>`<option value="${s}" ${post&&post.status===s?'selected':(!post&&s==='idea'?'selected':'')}>${STATUS_META[s].label}</option>`).join('')}<option value="rejected" ${post&&post.status==='rejected'?'selected':''}>Rejected</option></select></div><div class="form-group"><label class="form-label">Assigned To</label><select class="form-select" name="created_by"><option value="">— None —</option>${S.members.map(m=>`<option value="${m.id}" ${post&&post.created_by===m.id?'selected':''}>${m.name}</option>`).join('')}</select></div></div>`;
  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Crew / Team Members</label><div style="display:flex;flex-wrap:wrap;gap:6px;padding:4px 0">${S.members.map(m=>{ const checked = post && Array.isArray(post.crew_members) && post.crew_members.includes(m.id); return `<label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--surface-border);background:var(--surface-0)"><input type="checkbox" name="crew_members" value="${m.id}" ${checked?'checked':''} style="accent-color:var(--accent)">${escHtml(m.name)}</label>`; }).join('')}</div></div></div>`;
  html += `<div class="form-row full"><div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" name="notes" placeholder="Internal notes...">${escHtml(post?.notes||'')}</textarea></div></div>`;
  html += `</form></div><div class="modal-footer">${isEdit?`<button class="btn btn-danger btn-sm" onclick="deletePost('${post.id}')">Delete</button>`:''} ${isEdit?`<button class="btn btn-sm" onclick="generateBrief('${post.id}')" style="background:var(--accent);color:#fff;border:none">&#128203; Brief</button>`:''}<div style="flex:1"></div><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePost('${post?.id||''}')">${isEdit?'Update':'Create'} Post</button></div>`;
  panel.innerHTML = html; document.getElementById('modal-overlay').hidden = false;
  document.getElementById('post-brand').onchange = function() { const sel = document.getElementById('post-pillar'); const pils = S.pillars.filter(p => p.brand_id === this.value); sel.innerHTML = `<option value="">— None —</option>` + pils.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''); renderHashtagSuggestions(this.value); };
  document.getElementById('post-pillar').onchange = function() { if (this.value) applyPillarPlatforms(this.value); };
  if (!isEdit) { const pillarSel = document.getElementById('post-pillar'); if (pillarSel.value) applyPillarPlatforms(pillarSel.value); }
  const captionEl = document.getElementById('post-caption'); const countEl = document.getElementById('caption-count'); const previewEl = document.getElementById('caption-preview');
  captionEl.addEventListener('input', () => { const len = captionEl.value.length; countEl.textContent = `${len}/2200`; countEl.classList.toggle('over', len > 2200); previewEl.textContent = captionEl.value; });
  renderHashtagSuggestions(brandId);
}

function renderHashtagSuggestions(brandId) {
  const el = document.getElementById('hashtag-suggestions'); if (!el) return;
  const suggestions = S.hashtags.filter(h => h.brand_id === brandId).slice(0, 12);
  if (suggestions.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = suggestions.map(h => `<span class="tag tag-clickable" data-tag="${escAttr(h.tag)}">${escHtml(h.tag)}</span>`).join('');
  el.querySelectorAll('.tag').forEach(t => { t.onclick = () => { const input = document.getElementById('post-hashtags'); const tag = t.dataset.tag; if (!input.value.includes(tag)) input.value = (input.value.trim()+' '+tag).trim(); }; });
}

// ═══ Production Brief Generator ═══
function generateBrief(postId) {
  const post = S.posts.find(p=>p.id===postId); if (!post) return;
  const br = brandById(post.brand_id); const pil = pillarById(post.content_pillar_id);
  const pids = post.platform_ids || (post.platform_id ? [post.platform_id] : []);
  const plats = pids.map(id=>platById(id)).filter(Boolean);
  const assignee = post.created_by ? S.members.find(m=>m.id===post.created_by) : null;
  const crewNames = Array.isArray(post.crew_members) ? post.crew_members.map(id=>{const m=S.members.find(x=>x.id===id);return m?m.name:'Unknown';}).join(', ') : '—';
  const meta = STATUS_META[post.status] || { label: post.status };
  const rows = [['Title',post.title||'Untitled'],['Brand',br?(br.logo_emoji+' '+br.name):'—'],['Platforms',plats.length?plats.map(pl=>pl.name).join(', '):'—'],['Content Pillar',pil?pil.name:'—'],['Status',meta.label],['Scheduled',(post.scheduled_date?fmtDate(post.scheduled_date):'TBD')+' at '+(post.scheduled_time?fmtTime(post.scheduled_time):'TBD')],['Caption',post.caption||'—'],['Hashtags',post.hashtags||'—'],['Media Type',post.media_type?post.media_type.charAt(0).toUpperCase()+post.media_type.slice(1):'—'],['Assigned To',assignee?assignee.name:'—'],['Crew / Talent',crewNames],['Notes',post.notes||'—']];
  let tableHtml = `<table style="width:100%;border-collapse:collapse;font-size:13px;line-height:1.6">`;
  rows.forEach(([k,v]) => { tableHtml += `<tr style="border-bottom:1px solid var(--surface-border)"><td style="padding:8px 10px;font-weight:600;color:var(--ink-3);width:140px;vertical-align:top">${k}</td><td style="padding:8px 10px;color:var(--ink-1);white-space:pre-wrap">${escHtml(v)}</td></tr>`; });
  tableHtml += `</table>`;
  const panel = document.getElementById('modal-panel'); panel.classList.add('wide');
  panel.innerHTML = `<div class="modal-header"><span class="modal-title">&#128203; Production Brief</span><button class="modal-close" onclick="closeModal()">&#10005;</button></div><div class="modal-body" style="padding:16px 20px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><div><p style="color:var(--ink-3);font-size:12px">Generated ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</p></div><div style="display:flex;gap:6px"><button class="btn btn-ghost btn-sm" onclick="copyBrief()">&#128203; Copy</button><button class="btn btn-ghost btn-sm" onclick="printBrief()">&#128424; Print</button></div></div><div id="brief-content" style="background:var(--surface-0);border:1px solid var(--surface-border);border-radius:var(--r-md);padding:16px">${tableHtml}</div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="openPostModal('${postId}')">&#8592; Back to Post</button><div style="flex:1"></div><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`;
  document.getElementById('modal-overlay').hidden = false;
}
function copyBrief() { const el = document.getElementById('brief-content'); if (!el) return; let text='=== PRODUCTION BRIEF ===\n\n'; el.querySelectorAll('tr').forEach(row => { const cells = row.querySelectorAll('td'); if (cells.length===2) text += cells[0].textContent.trim()+': '+cells[1].textContent.trim()+'\n'; }); text += '\n=== END BRIEF ==='; navigator.clipboard.writeText(text).then(() => showToast('Brief copied to clipboard','success')).catch(() => showToast('Select text and copy manually','info')); }
function printBrief() { const el = document.getElementById('brief-content'); if (!el) return; const win = window.open('','_blank','width=800,height=600'); win.document.write(`<!DOCTYPE html><html><head><title>Production Brief</title><style>body{font-family:'DM Sans',system-ui,sans-serif;margin:24px;color:#1a1a1a}table{width:100%;border-collapse:collapse}td{padding:8px 10px;border-bottom:1px solid #e5e7eb}td:first-child{font-weight:600;color:#555;width:140px}@media print{body{margin:12px}}</style></head><body><h2 style="font-family:Outfit,sans-serif;margin:0 0 16px">Production Brief</h2>${el.innerHTML}</body></html>`); win.document.close(); setTimeout(() => win.print(), 300); }

async function savePost(existingId) {
  const form = document.getElementById('post-form'); const fd = new FormData(form); const data = {};
  ['brand_id','content_pillar_id','created_by','title','caption','hashtags','media_type','status','scheduled_date','scheduled_time','notes'].forEach(k => { const v = fd.get(k); data[k] = v===''?null:v; });
  const platformIds = fd.getAll('platform_ids').filter(Boolean); data.platform_ids = platformIds.length?platformIds:null; data.platform_id = platformIds[0]||null;
  const crewIds = fd.getAll('crew_members').filter(Boolean); data.crew_members = crewIds.length?crewIds:null;
  if (!data.title) { showToast('Title is required','error'); return; }
  if (data.status==='posted'&&!data.posted_at) data.posted_at = new Date().toISOString();
  try { if (existingId) await sb.from('sm_posts').update(data).eq('id',existingId); else await sb.from('sm_posts').insert(data); closeModal(); await loadAll(); render(); showToast(existingId?'Post updated':'Post created','success'); } catch(e) { showToast('Error: '+e.message,'error'); }
}

async function deletePost(id) { if (!confirm('Delete this post?')) return; await sb.from('sm_post_metrics').delete().eq('post_id',id); await sb.from('sm_posts').delete().eq('id',id); closeModal(); await loadAll(); render(); showToast('Post deleted','info'); }

async function saveMetrics(postId, isUpdate) {
  const form = document.getElementById('metrics-form'); const fd = new FormData(form); const data = { post_id: postId };
  ['reach','impressions','likes','comments','shares','saves','clicks','video_views','followers_gained'].forEach(k => { data[k] = parseInt(fd.get(k))||0; });
  try { if (isUpdate) await sb.from('sm_post_metrics').update(data).eq('post_id',postId); else await sb.from('sm_post_metrics').insert(data); closeModal(); await loadAll(); render(); showToast('Metrics saved','success'); } catch(e) { showToast('Error: '+e.message,'error'); }
}

async function saveStrategy(existingId) {
  const form = document.getElementById('strategy-form'); const fd = new FormData(form); const data = {};
  ['brand_id','title','section_key','content'].forEach(k => { data[k] = fd.get(k)||''; });

  if (!data.title||!data.content) { showToast('Title and content are required','error'); return; }

  try { if (existingId) await sb.from('sm_strategies').update(data).eq('id',existingId); else await sb.from('sm_strategies').insert(data); closeModal(); await loadAll(); render(); } catch(e) { showToast('Error: '+e.message,'error'); }
}

function openCmdPalette() {

  const input = document.getElementById('cmd-input');
  input.value = ''; input.focus();
  renderCmdResults('');
}

function renderCmdResults(query) {
  const q = query.toLowerCase();
  let items = CMD_ACTIONS.filter(a => a.label.toLowerCase().includes(q));
  // Also search posts
  if (q.length > 1) {
    const postResults = S.posts.filter(p => (p.title||'').toLowerCase().includes(q)).slice(0, 5);
    postResults.forEach(p => { items.push({ icon: '&#128221;', label: escHtml(p.title), hint: STATUS_META[p.status]?.label||p.status, action: () => openPostModal(p.id) }); });
  }
  const el = document.getElementById('cmd-results');
  if (items.length === 0) { el.innerHTML = `<div style="padding:16px;text-align:center;color:var(--ink-3);font-size:13px">No results</div>`; return; }
  el.innerHTML = items.map((item, i) => `<div class="cmd-item${i===0?' selected':''}" data-idx="${i}"><span class="cmd-item-icon">${item.icon}</span><span class="cmd-item-text">${item.label}</span>${item.hint?`<span class="cmd-item-hint">${item.hint}</span>`:''}</div>`).join('');
  el.querySelectorAll('.cmd-item').forEach((el, i) => {
    el.onclick = () => { closeCmdPalette(); items[i].action(); document.querySelectorAll('.sb-nav-link').forEach(n => n.classList.toggle('active', n.dataset.view === S.view)); };
  });
}

document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('cmd-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeCmdPalette(); });

document.getElementById('brand-dropdown-btn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('brand-dropdown-menu').classList.toggle('open'); });
document.addEventListener('click', () => { document.getElementById('brand-dropdown-menu').classList.remove('open'); });

let searchDebounce;
document.getElementById('topbar-search-input').addEventListener('input', (e) => { clearTimeout(searchDebounce); searchDebounce = setTimeout(() => { S.searchQuery = e.target.value.trim(); render(); }, 200); });

document.getElementById('topbar-today-btn').addEventListener('click', () => {
  const today = new Date(); S.view = 'briefing'; S.calMonth = today.getMonth(); S.calYear = today.getFullYear();
  S.weekAnchor = startOfWeek(today);
  document.querySelectorAll('.sb-nav-link').forEach(n=>n.classList.toggle('active', n.dataset.view==='briefing'));
  render();
});

document.getElementById('topbar-cmd-btn').addEventListener('click', openCmdPalette);
document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

document.getElementById('cmd-input').addEventListener('input', (e) => renderCmdResults(e.target.value));
document.getElementById('cmd-input').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCmdPalette();
  if (e.key === 'Enter') { const selected = document.querySelector('.cmd-item.selected'); if (selected) selected.click(); }
});

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (!document.getElementById('cmd-overlay').hidden) { closeCmdPalette(); return; }
    if (!document.getElementById('modal-overlay').hidden) { closeModal(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCmdPalette(); return; }
  if (typing) return;
  if (e.key === 'n') { e.preventDefault(); openPostModal(null); }
});

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
(async () => {
  initTheme();
  try {
    await loadAll();
    const loadingEl = document.querySelector('#main > .loading');
    if (loadingEl) loadingEl.remove();
    ensureMainView();
    render();
  } catch(e) {
    console.error('Failed to load data:', e);
    const loadingEl = document.querySelector('#main > .loading');
    if (loadingEl) loadingEl.innerHTML = '<span style="color:var(--st-rejected)">&#9888; Failed to load data. Please refresh.</span>';
  }
})();
</script>
</body>
</html>
