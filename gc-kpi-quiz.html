<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Great Clips Manager KPI Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#048667;--blue-dk:#073b3a;--red:#e4002b;--red-dk:#b30020;--green:#089f45;--amber:#e9a049;
--bg:#f4f7f5;--card:#fff;--line:#e1ece8;--ink:#12302c;--muted:#5f716d;--shadow:0 1px 3px rgba(7,59,58,.08),0 1px 2px rgba(7,59,58,.06);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 60px}
header{background:linear-gradient(135deg,var(--blue),var(--blue-dk));color:#fff;padding:20px 0 18px;box-shadow:var(--shadow)}
.hdr-inner{max-width:720px;margin:0 auto;padding:0 18px}
.hdr-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hdr-top img{height:26px;filter:brightness(0) invert(1)}
.hdr-top .title{font-size:15.5px;font-weight:600;opacity:.95}
header h1{font-size:1.4rem;margin:2px 0 6px;font-weight:700}
header p{margin:0;opacity:.92;font-size:.92rem}
.badge{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);border-radius:20px;padding:3px 11px;font-size:.72rem;font-weight:600;margin-top:12px;letter-spacing:.02em}
.back-link{display:inline-block;color:#fff;opacity:.85;font-size:12.5px;font-weight:600;margin-bottom:10px}
.back-link:hover{opacity:1;text-decoration:none}
.content{padding-top:22px}
.banner{padding:10px 14px;border-radius:8px;font-size:12.7px;border:1px solid;margin-bottom:16px;font-weight:600}
.banner.preview{background:#fbfaf3;border-color:#ece7cf;color:#7a6a2f}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.status-open{border-left:4px solid var(--green)}
.status-closed{border-left:4px solid var(--red)}
.status-title{font-weight:700;font-size:1.02rem;margin:0 0 6px;color:var(--blue-dk)}
.status-closed .status-title{color:var(--red-dk)}
.muted{color:var(--muted);font-size:.88rem}
form > label{display:block;font-weight:600;font-size:.78rem;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:.95rem;margin-bottom:16px;background:#fcfdfe;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--blue);background:#fff}
.q{margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:.75rem;font-weight:700;margin-right:8px;flex:none}
.q-text{font-weight:600;font-size:.96rem;display:flex;align-items:flex-start;color:var(--ink)}
.opts{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;font-size:.9rem;text-transform:none;font-weight:500;color:var(--ink);letter-spacing:normal}
.opt:hover{border-color:#b9d3cc}
.opt input{margin-top:3px}
.opt.selected{border-color:var(--blue);background:#eefaf6}
.opt.correct{border-color:var(--green);background:#f0faf4}
.opt.incorrect{border-color:var(--red);background:#fdeeee}
button.submit{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:8px;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px}
button.submit:hover{background:var(--blue-dk)}
button.submit:disabled{background:#aebdb9;cursor:not-allowed}
.result{text-align:center;padding:8px 0}
.result .pct{font-size:2.8rem;font-weight:800;margin:6px 0}
.win .pct{color:var(--green)}
.lose .pct{color:var(--red-dk)}
.trophy{font-size:2.1rem}
.footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:26px;line-height:1.8}
a.admin-link{color:var(--muted);font-size:.75rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line)}
thead th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px;background:#f0f5f3}
</style>
</head>
<body>
<header>
  <div class="hdr-inner">
    <a href="https://tools.sonayagroup.com/greatclips.html" class="back-link">&larr; Back to Dashboard</a>
    <div class="hdr-top">
      <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQwAAAAwCAQAAABOSox6AAAC+klEQVR42u2c627sIAyEmYj3f+Xpr93T0wSwzT3YUqVqt2xg+DDjhC2CJJh8B8GjrFJaJ66qJcxDdUD0Kt112g4MdgHtbCieVNoKDHZBzaF4UonZ1yZqeTXG4hwoOAC3iXMRRVCgy6p5X67Ae1SKhe6XkhkOBESv04YqxcxwNTscjsGjRieJSljDY6AJFrtOMaqxQEPMllL8Ora2YIM2L1Ypnjbgii3vBJX4GVc8MFu0cUJ4LRQMIQA3odD4Qn93com10q5NjUNi1vZhcL54vsGF70+NH9L1n1/bi8B/hLQHg8JyDeLVDPX6hzpXSMHopxKN1R6MOfKOYwgIvLrlC2n3+Os3KtvrWry7mGZCDb1GyFUl43d2qj9D16IlFlgYjzo/9c1QcToWKLgEVt574MN2OcuwDq0rVGqH/x1GQByKBRJS57Yz3P4WBi+xwYNuc7ai2hch8T6/cBgzBpVdf3oVidWMDM3Sq6GI0psCDwsN4paJhXJN4/z5VQja/y54/WhhrrqDeWYGmk9NWVtvAXE8Gvr6ZAIYeL3ou/RbDEd89PCrFFurVhA7uJZPH/FYwqIMBgxCYvhUyCbGjyUGoXUvwvGOM59M3vfra+522fCgP/QdC8Xg+js5BeXbKdtJ6ZmIYlO5Nk/IvK0MLIXtahlFfHvsWsIzWK/LYrpc3yrP31aYyxjmsmbiOhx/c7uVSn3UbfqF0muxFcHFVyoqJ7mfSWbb5RiL5sRyfqqmnMoXUm0fo1sMpKn4644zMwbclE1jcdCpw3jsPMw630MTGjIh56pE1bPk1KioA6NUuvaCIbUKNXkGhZYf2NDgXFf+hEf/QtmyTbAmY5QHHQai0U4uNr5W/aesVFRDBkYNHKgcEFVXQcV/8WCzKeBCUNwPOZmPP8dGw0azYWlOfSNz7pxGydARj3FIyBRFm66OO0+eNnO5v4XqHZ3hnKtS7qsYlhnEXIY9esA2aMYuV93DwfBwMDwcDA8Hw8PB8HAwPBwMDwfDw8HweF38ANCiCWc/qeQQAAAAAElFTkSuQmCC" alt="Great Clips">
      <span class="title">Salon Performance Dashboard</span>
    </div>
    <h1 id="pageTitle">✂️ Manager KPI Quiz</h1>
    <p id="pageSub">Test your knowledge of our salon efficiency KPIs and improvement techniques. Score 100% to win the weekly reward.</p>
    <span class="badge" id="quizIdBadge">Loading…</span>
  </div>
</header>

<div class="wrap content">

  <div id="previewBanner"></div>

  <div class="card" id="statusCard">
    <p class="status-title" id="statusTitle">Checking availability…</p>
    <p class="muted" id="statusDetail"></p>
  </div>

  <form class="card" id="quizForm" style="display:none;">
    <label for="managerName">Your name</label>
    <input type="text" id="managerName" placeholder="e.g. Samantha Martin" required>
    <label for="salonName">Your salon / location</label>
    <input type="text" id="salonName" placeholder="e.g. Coors & Montano" required>
    <div id="questions"></div>
    <button type="submit" class="submit" id="submitBtn">Submit Quiz</button>
  </form>

  <div class="card" id="resultCard" style="display:none;"></div>

  <p class="footer">
    A new quiz posts here regularly — check back next Sunday.<br>
    <a class="admin-link" href="?admin=1">Manager results view</a>
  </p>
</div>

<script>
/* ---------- CONFIG ---------- */
const QUIZ_ID = "gc-kpi-quiz-2026-09-06";
const SUPABASE_URL = "https://vcukhvjwsuaqxgqzotwb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjdWtodmp3c3VhcXhncXpvdHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODM0MzcsImV4cCI6MjEwMTc1OTQzN30.Ae-OUd1ZF9kxficp2U17flloRZ43xkcrbP_QqufhVXE";
const TIMEZONE = "America/Denver";
const OPEN_HOUR = 8;   // 8:00 AM
const CLOSE_HOUR = 12; // 12:00 PM (noon)
const OPEN_DAY = 0;    // Sunday

/* ---------- QUESTION BANK (from Salon Summary Report Efficiency Guide) ---------- */
const QUESTIONS = [
  {
    q: "What's the maximum weekly admin hours a salon should use to keep payroll on target?",
    opts: ["4 hours", "6 hours", "8 hours", "10 hours"],
    correct: 1
  },
  {
    q: "On which days should admin hours be avoided unless the wait time is at zero minutes?",
    opts: ["Monday & Tuesday", "Wednesday only", "Friday, Saturday, and Sunday", "Any day with a floor stylist scheduled"],
    correct: 2
  },
  {
    q: "What's the target average haircut time per day for optimal efficiency?",
    opts: ["10 minutes", "12 minutes", "15 minutes", "20 minutes"],
    correct: 2
  },
  {
    q: "CPH (customers per hour) should not be allowed to drop below what number on any given day?",
    opts: ["1.8", "2.0", "2.2", "2.6"],
    correct: 2
  },
  {
    q: "On a slower day, if stylists are idle for 20+ minutes and have already worked 3+ hours, what's the recommended move?",
    opts: [
      "Have them do deep cleaning instead of breaks",
      "Extend breaks, or send a stylist home / push the next one to come in a little later",
      "Add more admin hours to keep them busy",
      "Nothing — wait for it to pick back up"
    ],
    correct: 1
  },
  {
    q: "What is described as a 'CPH killer' on a busy day?",
    opts: ["Taking breaks during a lull", "Using admin time", "Prepay checkout", "Multiple stylists overlapping shifts"],
    correct: 1
  },
  {
    q: "Wait times over 15 minutes should not happen more than what percentage of the time?",
    opts: ["5%", "10%", "15%", "25%"],
    correct: 2
  },
  {
    q: "What's the target payroll percentage for a well-run salon?",
    opts: ["Around 25%", "Around 30%", "Around 35%", "Around 42%"],
    correct: 2
  },
  {
    q: "'Minutes Between Customers Waiting' should be kept at what range?",
    opts: ["0 to 1 minute", "1 to 2 minutes", "2.5 to 3.5 minutes", "5 to 6 minutes"],
    correct: 2
  },
  {
    q: "Service Discount % should run around what range — anything meaningfully higher may signal coupon fraud?",
    opts: ["1% to 2%", "3% to 4%", "6% to 8%", "10% to 12%"],
    correct: 1
  },
  {
    q: "If you ask a customer 'are you military?' at checkout to apply the discount, what must you also do?",
    opts: [
      "Nothing further — take their word for it",
      "Check their ID",
      "Have them fill out a form",
      "Only apply it on weekends"
    ],
    correct: 1
  },
  {
    q: "If one stylist's discount % is consistently higher than the salon average, what should you audit?",
    opts: [
      "Their haircut time log only",
      "Their receipts and the Coupon Pick List By Employee report",
      "Nothing — discount % isn't tied to individual stylists",
      "Their customer wait time report"
    ],
    correct: 1
  }
];

/* ---------- TIME GATE ---------- */
function getDenverParts(){
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: TIMEZONE, weekday: "short", hour: "numeric", hour12: false
  });
  const parts = fmt.formatToParts(new Date());
  const weekdayStr = parts.find(p => p.type === "weekday").value;
  let hour = parseInt(parts.find(p => p.type === "hour").value, 10);
  if (hour === 24) hour = 0;
  const map = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  return { day: map[weekdayStr], hour };
}

function isOpen(){
  const { day, hour } = getDenverParts();
  return day === OPEN_DAY && hour >= OPEN_HOUR && hour < CLOSE_HOUR;
}

/* ---------- STATE ---------- */
let answers = new Array(QUESTIONS.length).fill(null);
const storageKey = "gc_quiz_submitted_" + QUIZ_ID;
const params = new URLSearchParams(window.location.search);
const PREVIEW = params.get("preview") === "1";

function renderQuestions(){
  const container = document.getElementById("questions");
  container.innerHTML = "";
  QUESTIONS.forEach((item, qi) => {
    const div = document.createElement("div");
    div.className = "q";
    div.innerHTML = `<div class="q-text"><span class="q-num">${qi+1}</span>${item.q}</div>
      <div class="opts" id="opts-${qi}"></div>`;
    container.appendChild(div);
    const optsWrap = div.querySelector(`#opts-${qi}`);
    item.opts.forEach((optText, oi) => {
      const label = document.createElement("label");
      label.className = "opt";
      label.id = `opt-${qi}-${oi}`;
      label.innerHTML = `<input type="radio" name="q${qi}" value="${oi}"> <span>${optText}</span>`;
      label.addEventListener("click", () => {
        answers[qi] = oi;
        optsWrap.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
        label.classList.add("selected");
      });
      optsWrap.appendChild(label);
    });
  });
}

function showStatus(){
  const badge = document.getElementById("quizIdBadge");
  badge.textContent = "Quiz opens Sundays 8:00–11:59 AM (Mountain Time)";

  const previewBanner = document.getElementById("previewBanner");
  if (PREVIEW) {
    previewBanner.innerHTML = `<div class="banner preview">👀 Preview mode — showing the full quiz regardless of the Sunday time gate. Nothing submitted here is saved to results. Remove <code>?preview=1</code> from the URL to see what managers actually see.</div>`;
  } else {
    previewBanner.innerHTML = "";
  }

  const statusCard = document.getElementById("statusCard");
  const statusTitle = document.getElementById("statusTitle");
  const statusDetail = document.getElementById("statusDetail");
  const form = document.getElementById("quizForm");
  const resultCard = document.getElementById("resultCard");

  const alreadyDone = !PREVIEW && localStorage.getItem(storageKey);

  if (alreadyDone) {
    statusCard.className = "card status-closed";
    statusTitle.textContent = "You've already submitted this quiz on this device.";
    statusDetail.textContent = "Only one attempt counts per manager. Check the results view to see how you did, or ask Pranav.";
    form.style.display = "none";
    resultCard.style.display = "none";
    return;
  }

  if (isOpen() || PREVIEW) {
    statusCard.className = "card status-open";
    statusTitle.textContent = PREVIEW ? "✅ Preview — this is the full quiz." : "✅ Quiz is open right now — good luck!";
    statusDetail.textContent = PREVIEW
      ? "This is exactly what a manager sees once the Sunday window opens."
      : "Closes at 12:00 PM Mountain Time today. Answer every question — 100% is what wins the reward.";
    form.style.display = "block";
    renderQuestions();
  } else {
    statusCard.className = "card status-closed";
    statusTitle.textContent = "⏳ Quiz is currently closed.";
    statusDetail.innerHTML = "It's only open <strong>Sundays, 8:00 AM – 12:00 PM (Mountain Time)</strong>. Come back then!";
    form.style.display = "none";
  }
}

/* ---------- SUBMIT ---------- */
document.getElementById("quizForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  if (answers.includes(null)) {
    alert("Please answer every question before submitting.");
    return;
  }

  const managerName = document.getElementById("managerName").value.trim();
  const salonName = document.getElementById("salonName").value.trim();
  if (!managerName || !salonName) {
    alert("Please enter your name and salon.");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting…";

  let score = 0;
  QUESTIONS.forEach((item, qi) => {
    const optsWrap = document.getElementById(`opts-${qi}`);
    const correctEl = document.getElementById(`opt-${qi}-${item.correct}`);
    const chosenEl = document.getElementById(`opt-${qi}-${answers[qi]}`);
    if (answers[qi] === item.correct) {
      score++;
      chosenEl.classList.add("correct");
    } else {
      chosenEl.classList.add("incorrect");
      correctEl.classList.add("correct");
    }
    optsWrap.querySelectorAll("input").forEach(i => i.disabled = true);
  });

  const total = QUESTIONS.length;
  const percent = Math.round((score / total) * 1000) / 10;
  const passed100 = score === total;

  if (!PREVIEW) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/quiz_attempts`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          quiz_id: QUIZ_ID,
          manager_name: managerName,
          salon: salonName,
          score: score,
          total_questions: total,
          percent: percent,
          passed_100: passed100,
          answers: answers
        })
      });
    } catch (err) {
      console.error("Failed to save quiz attempt", err);
    }
    localStorage.setItem(storageKey, "1");
  }

  const resultCard = document.getElementById("resultCard");
  resultCard.style.display = "block";
  resultCard.className = "card result " + (passed100 ? "win" : "lose");
  resultCard.innerHTML = passed100
    ? `<div class="trophy">🏆</div><p class="status-title">Perfect score, ${managerName}!</p>
       <div class="pct">${percent}%</div>
       <p class="muted">${score} / ${total} correct${PREVIEW ? " (preview — not saved)" : " — you're a winner this week. Pranav will follow up about your reward."}</p>`
    : `<p class="status-title">Nice try, ${managerName}.</p>
       <div class="pct">${percent}%</div>
       <p class="muted">${score} / ${total} correct${PREVIEW ? " (preview — not saved)." : ". Scroll up to see which ones you missed — review the KPI guide and get 100% next Sunday."}</p>`;

  document.getElementById("quizForm").scrollIntoView({behavior:"smooth"});
});

/* ---------- ADMIN RESULTS VIEW ---------- */
async function renderAdminView(){
  document.getElementById("pageTitle").textContent = "📊 Manager Results";
  document.getElementById("pageSub").textContent = `Live quiz attempts from Supabase — ${QUIZ_ID}`;
  document.getElementById("quizIdBadge").style.display = "none";
  document.getElementById("statusCard").style.display = "none";
  document.getElementById("quizForm").style.display = "none";

  const resultCard = document.getElementById("resultCard");
  resultCard.style.display = "block";
  resultCard.innerHTML = "<p class='muted'>Loading…</p>";

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/quiz_attempts?quiz_id=eq.${QUIZ_ID}&order=submitted_at.desc`,
      { headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) {
      resultCard.innerHTML = "<p class='muted'>No attempts yet.</p>";
      return;
    }
    let html = "<table>";
    html += `<thead><tr><th>Manager</th><th>Salon</th><th>Score</th><th>Time</th></tr></thead><tbody>`;
    rows.forEach(r => {
      const win = r.passed_100 ? "🏆 " : "";
      const t = new Date(r.submitted_at).toLocaleString("en-US", {timeZone: TIMEZONE, month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
      html += `<tr>
        <td>${win}${r.manager_name}</td>
        <td>${r.salon || ""}</td>
        <td>${r.score}/${r.total_questions} (${r.percent}%)</td>
        <td class="muted">${t}</td></tr>`;
    });
    html += "</tbody></table>";
    resultCard.innerHTML = html;
  } catch (err) {
    resultCard.innerHTML = "<p class='muted'>Couldn't load results.</p>";
  }
}

/* ---------- INIT ---------- */
if (params.get("admin") === "1") {
  renderAdminView();
} else {
  showStatus();
}
</script>
</body>
</html>
