<style>
:root {
  --navy: #043968; --navy-dark: #022a4e; --navy-light: #e8eef5;
  --green: #95C93D; --green-dark: #6a9a1e; --green-light: #f0f7e1;
  --bg: #f4f6f9; --card: #ffffff; --border: #dde3ea; --text: #1d2733; --muted: #5d6b7a;
  --red: #c62828; --red-light: #fdecea; --amber: #b26a00; --amber-light: #fff4e0; --blue-light: #e8f1fb;
  --radius: 10px; --shadow: 0 1px 3px rgba(4,57,104,.08), 0 1px 2px rgba(4,57,104,.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Alegreya Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.4; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: .92rem; color: var(--text); }
header { background: var(--navy); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.15); flex-wrap: wrap; }
header .logo { height: 40px; }
header h1 { font-size: 1.2rem; font-weight: 800; color: var(--green); letter-spacing: -.01em; }
header h1 small { display: block; font-size: .72rem; color: #c9d6e4; font-weight: 500; letter-spacing: .02em; }
.beta { background: var(--green); color: var(--navy); font-size: .65rem; font-weight: 800; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
nav { display: flex; gap: 4px; margin-left: 12px; }
nav button { background: transparent; border: 1px solid transparent; color: #dce6f0; padding: 6px 12px; border-radius: 6px; font-size: .9rem; font-weight: 600; }
nav .nav-link { color: #dce6f0; padding: 6px 12px; border-radius: 6px; font-size: .9rem; font-weight: 600; text-decoration: none; }
nav .nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
nav button.active, nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: .82rem; color: #c9d6e4; }
.save-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #8aa0b8; margin-right: 5px; }
.save-dot.saved { background: var(--green); } .save-dot.saving { background: #f5b942; } .save-dot.error { background: #ff6b6b; } .save-dot.dirty { background: #f5b942; }
main { max-width: 1440px; margin: 0 auto; padding: 18px 20px 80px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.card h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--navy); margin-bottom: 12px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; font-size: .82rem; }
.grid { display: grid; gap: 10px 14px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.field input, .field select, .field textarea { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: #fff; width: 100%; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--green); outline-offset: -1px; border-color: var(--green); }
.field .hint { font-size: .72rem; color: var(--muted); }
.field.span2 { grid-column: span 2; } .field.full { grid-column: 1 / -1; }
.chk { display: flex; align-items: center; gap: 7px; font-size: .88rem; cursor: pointer; padding: 3px 0; }
.chk input { width: 16px; height: 16px; accent-color: var(--navy); }
.btn { border: 1px solid var(--border); background: #fff; color: var(--navy); padding: 7px 14px; border-radius: 6px; font-weight: 700; font-size: .86rem; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--navy-light); }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); } .btn.primary:hover { background: var(--navy-dark); }

.btn.danger { color: var(--red); } .btn.danger:hover { background: var(--red-light); }
.btn.sm { padding: 4px 9px; font-size: .78rem; } .btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); } .small { font-size: .8rem; }
/* Home */
.types { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 24px; }
.type-card { background: #fff; border: 2px solid var(--border); border-radius: 14px; padding: 22px; text-align: left; transition: all .15s; display: flex; flex-direction: column; gap: 8px; }
.type-card:hover { border-color: var(--green); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(4,57,104,.1); }
.type-card .ic { font-size: 2rem; } .type-card h3 { color: var(--navy); font-size: 1.2rem; } .type-card p { color: var(--muted); font-size: .9rem; }
.type-card .go { margin-top: auto; color: var(--green-dark); font-weight: 800; font-size: .88rem; }
table.list { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.list th { text-align: left; font-size: .72rem; text-transform: uppercase; color: var(--muted); padding: 8px; border-bottom: 2px solid var(--border); letter-spacing: .03em; }
table.list td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.list tr.click:hover td { background: var(--navy-light); cursor: pointer; }

.pill.Won { background: var(--green-light); color: var(--green-dark); } .pill.Lost { background: var(--red-light); color: var(--red); } .pill.Sent { background: var(--blue-light); color: #1d5fa8; }
/* Estimate layout */
.est-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.sidebar { position: sticky; top: 76px; max-height: calc(100vh - 90px); overflow-y: auto; }

.opt-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--border); margin-bottom: 14px; }
.opt-tab { padding: 8px 14px; border: 1px solid var(--border); border-bottom: none; border-radius: 8px 8px 0 0; background: #eef2f6; color: var(--muted); font-weight: 700; font-size: .88rem; margin-bottom: -2px; }
.opt-tab.active { background: #fff; color: var(--navy); border-color: var(--border); border-bottom: 2px solid #fff; }
.scope { border: 1px solid var(--border); border-left: 4px solid var(--green); border-radius: 8px; margin-bottom: 12px; background: #fff; }
.scope-hd { display: flex; gap: 8px; align-items: center; padding: 10px 12px; background: #fafbfc; border-bottom: 1px solid var(--border); border-radius: 8px 8px 0 0; flex-wrap: wrap; }

.scope-hd select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-weight: 700; color: var(--navy); background: #fff; }

.scope-res { background: #f7f9fb; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: .85rem; }
.labor-big { display: flex; align-items: baseline; gap: 6px; }
.labor-big b { font-size: 1.35rem; color: var(--navy); } .labor-big span { color: var(--muted); font-size: .8rem; }
.calc-note { font-size: .75rem; color: var(--muted); margin: 2px 0 8px; }
table.mats { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 6px; }
table.mats td { padding: 3px 4px; border-top: 1px solid #e7ebef; }
table.mats input { width: 60px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px; text-align: right; font-size: .8rem; }
table.mats input.ovr { background: var(--amber-light); border-color: #f0c070; }
.w { display: flex; gap: 6px; font-size: .78rem; padding: 5px 8px; border-radius: 6px; margin-top: 5px; line-height: 1.3; }
.w.error { background: var(--red-light); color: var(--red); } .w.warn { background: var(--amber-light); color: var(--amber); } .w.info { background: var(--blue-light); color: #1d5fa8; }
.w .ic { flex-shrink: 0; font-weight: 800; }
.comment { grid-column: 1 / -1; }
.comment textarea { width: 100%; min-height: 38px; padding: 7px 9px; border: 1px dashed #b8c4d0; border-radius: 6px; resize: vertical; background: #fffef8; }
.quick-add { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.quick-add button { border: 1px dashed var(--navy); background: #fff; color: var(--navy); padding: 5px 10px; border-radius: 16px; font-size: .8rem; font-weight: 600; }
.quick-add button:hover { background: var(--navy); color: #fff; }
.adj { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; }
.adj-item { display: flex; align-items: center; gap: 8px; font-size: .86rem; }
.adj-item input[type=number] { width: 56px; padding: 4px; border: 1px solid var(--border); border-radius: 5px; text-align: right; }
.adj-item .rng { font-size: .72rem; color: var(--muted); }
/* Sidebar summary */
.sum-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: .88rem; border-bottom: 1px dotted #e3e8ee; }
.sum-row.sub { padding-left: 12px; font-size: .8rem; color: var(--muted); border: none; }
.sum-row.tot { font-weight: 800; color: var(--navy); border-top: 2px solid var(--navy); border-bottom: none; margin-top: 4px; padding-top: 6px; }
.price-box { background: var(--navy); color: #fff; border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.price-box .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: #b9cadb; }
.price-box .big { font-size: 2rem; font-weight: 800; color: var(--green); line-height: 1.1; }
.price-box .gp { display: flex; justify-content: space-between; font-size: .82rem; margin-top: 6px; color: #dbe6f1; }
.price-box .ao { border-top: 1px solid rgba(255,255,255,.2); margin-top: 8px; padding-top: 6px; font-size: .82rem; color: #dbe6f1; }
.price-box .ao-hd { display: flex; justify-content: space-between; font-weight: 700; color: #fff; margin-bottom: 2px; }
.price-box .ao-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0 3px 8px; }
.price-box .ao-row small { display: block; font-size: .72rem; color: #9fb4c9; }
.price-box .ao-row b { font-weight: 600; white-space: nowrap; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.stat { background: #f4f7fa; border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: .68rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: .03em; }
.stat .v { font-size: 1.05rem; font-weight: 800; color: var(--navy); }
.stat .s { font-size: .72rem; color: var(--muted); }
.mini-in { display: flex; gap: 8px; margin: 8px 0; }
.mini-in .field input { padding: 5px 7px; }
.sb-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.sb-actions .btn { justify-content: center; }
.warn-count { display: flex; gap: 6px; margin-bottom: 6px; }
/* Builder panel */
.builder-panel { background: var(--green-light); border: 1px solid #cfe5a8; border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: .86rem; }
.builder-panel .stats { display: flex; gap: 16px; flex-wrap: wrap; margin: 6px 0; }
.builder-panel .stats b { color: var(--navy); }
/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(2,20,40,.55); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal.wide { max-width: 900px; }
.modal-hd { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.modal-hd h3 { color: var(--navy); font-size: 1.1rem; flex: 1; }
.modal-bd { padding: 16px 18px; }
.modal-ft { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 600; z-index: 200; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: .9rem; }
.toast.error { background: var(--red); } .toast.ok { background: var(--green-dark); }
.deal-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; margin-top: 6px; }
.deal-item { padding: 7px 10px; border-bottom: 1px solid #eef1f4; cursor: pointer; font-size: .86rem; display: flex; justify-content: space-between; gap: 8px; }
.deal-item:hover { background: var(--navy-light); } .deal-item.sel { background: var(--green-light); font-weight: 700; }
.settings-sec { margin-bottom: 18px; overflow-x: auto; }
.settings-sec h4 { color: var(--navy); margin-bottom: 8px; font-size: .95rem; }
.tbl-edit td { padding: 3px 6px; } .settings-sec input[type=number] { width: 72px !important; } .tbl-edit input { width: 72px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 5px; }
.sc-sum { font-size: .76rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
.sc-sum .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 4px; vertical-align: middle; }
.sc-sum .dot.error { background: var(--red); } .sc-sum .dot.warn { background: #f0a020; }
.toast.undo { display: flex; align-items: center; }
.mob-bar { display: none; }
body.est-view .mob-bar:not(:empty) { }
@media (max-width: 1100px) {
  body.est-view .mob-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: var(--navy); color: #fff; padding: 8px 14px; gap: 14px; align-items: center; box-shadow: 0 -3px 10px rgba(0,0,0,.2); }

}
.est-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.est-tabs button { border: 1px solid var(--border); background: #fff; color: var(--muted); padding: 8px 16px; border-radius: 8px; font-weight: 800; font-size: .9rem; }
.est-tabs button.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.act-tbl input { width: 100%; min-width: 70px; padding: 5px 6px; border: 1px solid var(--border); border-radius: 5px; font-size: .86rem; }
.empty { text-align: center; color: var(--muted); padding: 28px; }
/* Proposal */
#proposal { font-family: 'Alegreya Sans', sans-serif; color: #1d2733; }
#proposal .p-hd { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--green); padding-bottom: 10px; margin-bottom: 14px; }
#proposal h1 { color: var(--navy); font-size: 1.5rem; } #proposal h2 { color: var(--navy); font-size: 1.05rem; margin: 16px 0 6px; }
#proposal table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-bottom: 6px; }
#proposal th { background: var(--navy); color: #fff; text-align: left; padding: 6px 8px; font-size: .78rem; }
#proposal td { padding: 6px 8px; border-bottom: 1px solid #e3e8ee; vertical-align: top; }
#proposal tr.p-sub td { font-weight: 700; color: var(--navy); border-bottom: 2px solid #c9d3dd; }
#proposal .opt-price { text-align: right; font-size: 1.15rem; font-weight: 800; color: var(--navy); margin: 4px 0 12px; }
#proposal .terms { font-size: .8rem; color: #4a5866; } #proposal .terms li { margin: 3px 0 3px 18px; }
@media print {
  header, #app, #mobBar, .toast, .modal-hd { display: none !important; }
  body { background: #fff; }
  #proposal { position: static; width: 100%; padding: 0 10px; }
  .modal-bg { position: static; background: none; padding: 0; display: block; overflow: visible; }
  .modal, .modal.wide { box-shadow: none; max-width: none; width: 100%; max-height: none; overflow: visible; margin: 0; }
  .modal-bd { max-height: none; overflow: visible; padding: 0; }
}
@media (max-width: 1100px) { .est-layout { grid-template-columns: minmax(0, 1fr); } .sidebar { position: static; max-height: none; } }
@media (max-width: 760px) {
  main { padding: 12px 12px 80px; } header { padding: 8px 12px; } nav { margin-left: 0; order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; } nav button, nav .nav-link { white-space: nowrap; flex-shrink: 0; } .hdr-right { font-size: .75rem; }
  .scope-bd { grid-template-columns: 1fr; } .field.span2 { grid-column: auto; } .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjdWtodmp3c3VhcXhncXpvdHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODM0MzcsImV4cCI6MjEwMTc1OTQzN30.Ae-OUd1ZF9kxficp2U17flloRZ43xkcrbP_QqufhVXE';

const DEFAULT_RULES = {

  // Rate-based methods: sq ft per installer per 8-hr day [slow, fast]

  battCeiling: { heightBreak: 10, low: [1500, 2000], high: [1000, 1500] },

  // Spray foam: hours per installer per set

const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const r1 = n => Math.round(n * 10) / 10;
const blank = v => v === '' || v == null || (typeof v === 'number' && isNaN(v));
// Margin / royalty with sane fallbacks: a cleared field means "use the default", never 0%
const defMargin = (est, rules) => num((rules.marginByType || {})[est && est.projectType] ?? rules.margin);
const estMargin = (est, rules) => blank(est.margin) ? defMargin(est, rules) : num(est.margin);
const estRoyalty = (est, rules) => blank(est.royalty) ? num(rules.royalty) : num(est.royalty);

function pickRate(pair, mode) {            // pair = [slow, fast] sq ft per installer-day
  if (mode === 'slow') return pair[0];
  if (mode === 'mid') return (pair[0] + pair[1]) / 2;
  return pair[1];
}

// Table of [maxSqft, hoursPerInstaller]; beyond last row → extrapolate on last slope
function tableLookup(table, sf) {
  for (const [max, hrs] of table) if (sf <= max) return { hrs, beyond: false };
  const last = table[table.length - 1], prev = table[table.length - 2] || [0, 0];
  const slope = (last[1] - prev[1]) / Math.max(1, last[0] - prev[0]);
  return { hrs: last[1] + (sf - last[0]) * slope, beyond: true };
}

function crewOf(est) { return Math.max(1, parseInt(est && est.crew) || 2); }

function crewEfficiency(crew, rules) {
  if (crew <= 2) return 1;
  return rules.crewEfficiency[crew] || rules.crewEfficiency[Math.max(...Object.keys(rules.crewEfficiency).map(Number))] || 0.8;
}

function nearestHigherR(chart, r) {
  if (chart[r]) return { cov: chart[r], rUsed: r };
  const keys = Object.keys(chart).map(Number).sort((a, b) => a - b);
  const hi = keys.find(k => k > r);
  const use = hi || keys[keys.length - 1];
  return { cov: chart[use], rUsed: use };
}

function supplyPrice(name) {
  const s = SUPPLIES.find(x => x.name.toLowerCase() === name.toLowerCase());
  return s ? s.price : 0;
}
function supplyLine(name, qty, note, perJob) {
  const s = SUPPLIES.find(x => x.name.toLowerCase() === name.toLowerCase()) || { price: 0, unit: 'each' };
  return { name, qty, unit: s.unit, price: s.price, note: note || '', perJob: !!perJob, kind: 'supply' };
}

// ─── Price book: residential prices carry a built-in markup; commercial = true cost ───
const priceBook = est => (est && est.projectType === 'commercial') ? 'commercial' : 'res';
function blowPrice(key, est, rules) {
  const t = rules.materialPricing && rules.materialPricing.blow[priceBook(est)];
  if (t && t[key] != null) return num(t[key]);
  return (BLOW_IN.find(b => b.key === key) || {}).price || 0;
}
function spfPrice(type, est, rules) {
  const t = rules.materialPricing && rules.materialPricing.spf[priceBook(est)];
  return t && t[type] != null ? num(t[type]) : SPF_PRICE[type];
}
function battPrice(b, est, rules) {
  const k = num(rules.materialPricing && rules.materialPricing.battMarkup) || 1;
  return priceBook(est) === 'commercial' ? Math.round(b.price / k * 100) / 100 : b.price;
}
const GAS_EQUIPMENT = ['open_attic', 'tight_attic', 'net_blow', 'dense_pack', 'spf', 'crawl_found_spf', 'crawl_joist_spf', 'attic_removal', 'crawl_removal'];

function battWidths(spacing) { return spacing === '24' ? ['23', '24'] : ['15', '15.25', '16']; }

function battMatches(scope) {
  const R = num(scope.rValue);
  return BATTS.filter(b => b.rNum === R && battWidths(scope.spacing || '16').includes(b.width) &&
    (!scope.facing || scope.facing === 'any' || b.facing === scope.facing));
}

function pickBatt(scope) {
  if (scope.product) {
    const b = BATTS.find(x => x.name === scope.product);
    if (b) return b;
  }
  const m = battMatches(scope);
  if (!m.length) return null;
  return m.slice().sort((a, b) => a.price / a.coverage - b.price / b.coverage)[0];
}

function spfThickness(scope, rules) {
  if (num(scope.thickness) > 0) return num(scope.thickness);
  const t = scope.spfType === 'oc' ? rules.spf.rPerInch.oc : rules.spf.rPerInch.cc;
  return num(scope.rValue) > 0 ? num(scope.rValue) / t : 0;
}

// Core: compute one scope → labor, materials, warnings
function computeScope(scope, est, rules) {
  const S = rules.stdCrew, mode = rules.production;
  const sf = num(scope.sqft);
  const h = num(scope.height) || 8;
  const out = { sqft: sf, base: 0, lo: 0, hi: 0, note: '', materials: [], warnings: [], bonusFlags: {} };
  const W = (level, msg) => out.warnings.push({ level, msg });
  const tableRange = v => [v, v * (1 + rules.tableRangePct / 100)];
  let lo = 0, hi = 0, base = 0;
  const m = scope.method;

  const tbl = (table, label) => {
    const t = tableLookup(table, sf);
    if (t.beyond) W('warn', `${label}: ${sf.toLocaleString()} sf is beyond the guideline table — hours extrapolated; review.`);
    base = t.hrs * S; [lo, hi] = tableRange(base);
    out.note = `${r1(t.hrs)} hrs/installer × ${S} installers (table)`;
  };

  if (m === 'batt_wall' || m === 'batt_ceiling') {
    const cfg = m === 'batt_wall' ? rules.battWall : rules.battCeiling;
    const pair = h > cfg.heightBreak ? cfg.high : cfg.low;
    const rate = pickRate(pair, mode);
    base = sf / rate * rules.hoursPerDay;
    lo = sf / pair[1] * rules.hoursPerDay; hi = sf / pair[0] * rules.hoursPerDay;
    out.note = `${sf.toLocaleString()} sf ÷ ${rate.toLocaleString()} sf/installer-day × 8`;
    if (m === 'batt_wall' && h > cfg.heightBreak && scope.scaffold) {
      const f = 1 + cfg.scaffoldPct / 100; base *= f; lo *= f; hi *= f;
      out.note += ` + ${cfg.scaffoldPct}% scaffold/stilts`;
    }
  } else if (m === 'net_blow') {
    const net = scope.nettingSqft === '' || scope.nettingSqft == null ? sf : num(scope.nettingSqft);
    const area = sf + net;
    const pair = h > rules.netBlow.heightBreak ? rules.netBlow.high : rules.netBlow.low;
    const rate = pickRate(pair, mode);
    base = area / rate * rules.hoursPerDay;
    lo = area / pair[1] * rules.hoursPerDay; hi = area / pair[0] * rules.hoursPerDay;
    out.note = `(${net.toLocaleString()} netting + ${sf.toLocaleString()} blown) ÷ ${rate.toLocaleString()} sf/installer-day × 8`;
  } else if (m === 'open_attic') {
    tbl(rules.openAttic, 'Open attic');
  } else if (m === 'tight_attic') {
    const t = rules.tightAttic;
    const per = t.base + Math.ceil(Math.max(0, sf - t.baseMaxSqft) / 500) * t.addHrsPer500;
    base = per * S; [lo, hi] = tableRange(base);
    out.note = `${per} hrs/installer × ${S} (${t.base} hrs to ${t.baseMaxSqft.toLocaleString()} sf + ${t.addHrsPer500 * 60} min per extra 500 sf)`;
    out.bonusFlags.tightAttic = Math.max(0, parseInt(scope.enteringInstallers ?? 1) || 0);
  } else if (m === 'dense_pack') {
    const days = Math.max(0.5, num(scope.days) || 1);

  } else if (m === 'spf' || m === 'crawl_found_spf' || m === 'crawl_joist_spf') {

    const th = spfThickness({ ...scope, spfType: type }, rules);
    const bdft = Math.ceil(sf * th);
    const sets = bdft / rules.spf.setYield[type];
    out.bdft = bdft; out.sets = sets;
    if (m === 'spf') {
      const H = rules.spf.hrs, high = h > rules.spf.heightBreak, metal = scope.frame === 'metal';
      let per, why;
      const shaving = scope.shaving ?? (type === 'oc' && scope.surface === 'walls');
      if (type === 'cc' && shaving) { per = H.ccShaved; why = 'CC shaved'; }
      else if (type === 'oc' && scope.surface === 'walls' && shaving) { per = H.ocWallsShaved; why = 'OC walls incl. shaving'; }
      else { per = H[(metal ? 'metal' : 'wood') + (high ? '_high' : '_low')]; why = `${metal ? 'metal' : 'wood'}-framed, ${high ? 'over' : 'up to'} 12′, no shaving`; }
      base = sets * per * 2; [lo, hi] = tableRange(base);
      out.note = `${bdft.toLocaleString()} bd ft ÷ ${rules.spf.setYield[type].toLocaleString()} = ${r2(sets)} sets × ${per} hrs × 2 installers (${why})`;
      if (shaving) out.materials.push(supplyLine('Removal Bags', Math.ceil(sf / rules.spf.shaveBagSqft), '1 per 500 sf shaved'), supplyLine('Dumpster', 1, '', true));
      if (type === 'cc' && shaving) W('warn', 'Closed-cell shaving: avoid unless the design requires it — it is slow and removes the dense outer skin.');
      if (metal && shaving) W('info', 'Metal buildings are normally NOT shaved. Confirm the customer requires it.');
      if (scope.exposed) W('info', 'Foam left exposed: recommend DC-315 intumescent coating (or 100% acrylic latex paint where code allows). Verify ignition/thermal barrier code.');
      if (type === 'cc' && th > 3.5) W('info', `CC at ${r2(th)}″ needs ${Math.ceil(th / 3.5)} lifts (max 3.5″ per pass).`);
    } else {
      tbl(m === 'crawl_found_spf' ? rules.crawlFoundationSpf : rules.crawlJoistSpf, 'Crawlspace SPF');
      out.note = `${bdft.toLocaleString()} bd ft (${r2(sets)} sets); ` + out.note;
      out.bonusFlags.crawl = true;
    }
    out.materials.unshift({ name: `${type === 'oc' ? 'Open' : 'Closed'} Cell SPF — ${r2(th)}″`, qty: bdft, unit: 'bd ft', price: spfPrice(type, est, rules), kind: 'spf', note: `${r2(sets)} sets` });
    out.spfBd = { [type]: bdft };
    out.spf = true;
  } else if (m === 'foam_pack') {
    const per = Math.max(rules.foamPack.minHours, sf / rules.foamPack.sqftPerInstallerHour);
    base = per * S; [lo, hi] = tableRange(base);
    out.note = `${sf.toLocaleString()} sf floor area ÷ ${rules.foamPack.sqftPerInstallerHour.toLocaleString()} sf/hr = ${r2(per)} hrs/installer × ${S} (${rules.foamPack.minHours} hr min)`;
    if (est.projectType === 'retrofit') W('info', 'Foam-pack labor applies to new construction/remodel. Retrofit attic air sealing is already inside attic labor.');
    // Air-sealing supplies (GM rules): foam cans by sq ft, caulk & sill gasket by linear ft
    const A = rules.airSeal, retro = est.projectType === 'commercial' && est.construction === 'retrofit';
    const perCan = retro ? (est.bareRetrofit ? A.foamSfPerCan.retrofitBare : A.foamSfPerCan.retrofit) : A.foamSfPerCan.nc;
    if (sf) out.materials.push(supplyLine('Foam Sealant', Math.ceil(sf / perCan), `1 can per ${perCan.toLocaleString()} sf (fire block + window/door)`));
    if (!retro) {                                   // new construction / remodel: caulk + sill gasket always included, sized from one linear-feet number
      const lf = scope.plateLf !== '' && scope.plateLf != null ? num(scope.plateLf) : Math.max(num(scope.sillLf), num(scope.caulkLf));
      const rolls = Math.ceil(lf / A.sillLfPerRoll);

    if (scope.clearance !== '' && scope.clearance != null && num(scope.clearance) < 36) W('error', 'Attic removal requires 36″ clearance throughout — needs management approval.');
    if (scope.contamination) { out.bonusFlags.contamination = true; W('warn', 'Rodent/animal contamination: Koala does not remediate. Customer must remediate first; $250/crew bonus applies. Heavier material → more bags / disposal.'); }
  } else if (m === 'crawl_batt' || m === 'crawl_removal' || m === 'encapsulation') {
    tbl(m === 'crawl_batt' ? rules.crawlBatt : m === 'crawl_removal' ? rules.crawlRemoval : rules.encapsulation, 'Crawlspace');
    out.bonusFlags.crawl = true;
    if (m === 'crawl_removal') out.materials.push(supplyLine('Removal Bags', Math.ceil(sf / rules.removalBagSqft), `1 per ${rules.removalBagSqft} sf`), supplyLine('Dumpster', 1, '', true));
    if (m === 'encapsulation') out.materials.push(supplyLine('Vapor Barrier 14 Mil', Math.ceil(sf * 1.15), '+15% overlap & walls — adjust'), supplyLine('Seam Tape', Math.max(1, Math.ceil(sf / 1000)), 'default — adjust'));
    if (scope.contamination) { out.bonusFlags.contamination = true; W('warn', 'Contamination present: remediation by others before work. $250/crew bonus applies.'); }
  } else if (m === 'coating' || m === 'custom') {
    base = lo = hi = num(scope.manualHours);
    out.note = base ? `${base} labor hrs (entered)` : 'Enter labor hours';
    if (!base && sf) W('warn', 'No guideline exists for this scope — enter labor hours manually.');
    if (m === 'coating' && sf) out.materials.push(supplyLine('DC-315 Intumescent Coating', sf, 'priced per sq ft'));
  }

  // Clearance rules (crawlspaces)
  if (['crawl_batt', 'crawl_removal'].includes(m) && scope.clearance !== '' && scope.clearance != null && num(scope.clearance) < 24)
    W('error', 'Crawlspace batt work needs ≥ 24″ clearance — requires management approval & willing crew.');
  if (['crawl_found_spf', 'encapsulation', 'crawl_joist_spf'].includes(m) && scope.clearance !== '' && scope.clearance != null && num(scope.clearance) < 36)
    W('error', 'Crawlspace spray foam / encapsulation needs ≥ 36″ clearance.');
  if (m.startsWith('crawl') || m === 'encapsulation') if (scope.clearance === '' || scope.clearance == null) W('info', 'Enter crawlspace clearance (inches) to confirm serviceability.');
  if (m === 'crawl_joist_spf') W('info', 'If the crawlspace allows standing height, use standard spray-foam wall/ceiling rates instead.');

  // Location-specific scope rules
  const loc = (scope.location || '').toLowerCase();
  if (loc.includes('knee')) {
    if (m.startsWith('batt') && scope.facing && scope.facing !== 'K' && scope.facing !== 'any') W('error', 'Knee walls with batts must be treated as exterior walls and use KRAFT-faced batts.');
    if (m === 'net_blow') W('warn', 'Knee walls: batts recommended over Net & Blow — netting may fail over time.');
    if (m === 'spf') W('info', 'Knee wall spray foam: one side must be drywalled to spray against.');
  }
  if ((loc.includes('band') || loc.includes('belly') || loc.includes('rim')) && m.startsWith('batt') && scope.facing && scope.facing !== 'UF' && scope.facing !== 'any')
    W('error', 'Belly bands / band joists with batts must be UNFACED (treated as exterior wall for R-value).');

  if (m === 'batt_wall' || m === 'batt_ceiling' || m === 'crawl_batt') {
    const b = pickBatt(scope);

      out.materials.unshift({ name: b.name, qty, unit: 'bag', price: battPrice(b, est, rules), kind: 'batt', note: `${b.coverage} sf/bag${priceBook(est) === 'commercial' ? ' · true cost' : ''}` });
    } else if (sf) W('warn', `No batt product found for R-${scope.rValue} at ${scope.spacing || 16}″ o.c.${scope.facing && scope.facing !== 'any' ? ' (' + scope.facing + ')' : ''} — pick another R-value/facing or add material manually.`);
  }

  if (['open_attic', 'tight_attic', 'net_blow', 'dense_pack'].includes(m) && sf) {
    const pk = m === 'dense_pack' ? 'cellulose' : (scope.blowProduct || 'cellulose');
    const prod = BLOW_IN.find(b => b.key === pk) || BLOW_IN[0];
    let cov = null, note = '';
    if (m === 'open_attic' || m === 'tight_attic') {
      const R = num(scope.rValue);
      if (R) {
        const n = nearestHigherR(COVERAGE[pk].attic, R); cov = n.cov;
        if (n.rUsed < R) { cov = cov * n.rUsed / R; W('warn', `R-${R} is above the ${prod.name} coverage chart (max R-${n.rUsed}) — bags scaled from R-${n.rUsed}; verify with the manufacturer chart.`); }
        note = `R-${n.rUsed}: ${r1(cov)} sf/bag${n.rUsed !== R ? (n.rUsed > R ? ' (nearest ≥ R-' + R + ')' : ' scaled to R-' + R) : ''}`;
      }
      else W('info', 'Enter target R-value to calculate bags.');
    } else {
      const d = scope.depth || '2x4', sp = scope.spacing || '16';
      if (pk === 'cellulose') { cov = (COVERAGE.cellulose.wall[d] || {})[sp]; note = cov ? `${d} @ ${sp}″ dense pack R-${COVERAGE.cellulose.wallR[d]}: ${cov} sf/bag` : ''; }
      else { const key = Object.keys(COVERAGE[pk].wall).find(k => k.startsWith(d + '-')); cov = key ? COVERAGE[pk].wall[key] : null; note = key ? `${key.replace('-', ' R-')}: ${cov} sf/bag` : ''; }

    if (m === 'net_blow' || (m === 'dense_pack' && est.projectType !== 'retrofit')) {
      const net = m === 'net_blow' ? (scope.nettingSqft === '' || scope.nettingSqft == null ? sf : num(scope.nettingSqft)) : sf;
      out.materials.push(supplyLine(pk === 'cellulose' ? 'Insulation Netting (cellulose)' : 'Insulation Netting (fiberglass)', Math.ceil(net), 'priced per sq ft (3,500 sf rolls)'));
    }

    if (m === 'tight_attic') W('info', 'Proposal will flag this as a "Tight Attic" — discuss possible scope limitations (air sealing/baffles) with the customer.');
    if (est.projectType === 'retrofit' && m === 'open_attic') {

  out.materials.forEach(mt => {

    const po = scope.matPrice && scope.matPrice[mt.name];
    if (po !== undefined && po !== '' && po !== null) { mt.price = num(po); mt.priceOverridden = true; }
    mt.cost = mt.qty * mt.price;
  });

  // Adjustments
  const adjPct = Object.entries(est.adjust || {}).reduce((s, [k, v]) => s + (v ? num(v) : 0), 0) + num(scope.extraPct);
  out.adjPct = adjPct;
  const f = 1 + adjPct / 100;
  out.base = base; out.lo = lo * f; out.hi = hi * f; out.hrs = base * f;
  if (scope.laborOverride !== '' && scope.laborOverride != null && !isNaN(parseFloat(scope.laborOverride))) {
    out.guideHrs = out.hrs; out.hrs = out.lo = out.hi = num(scope.laborOverride); out.overridden = true;
    if (out.guideHrs && Math.abs(out.hrs - out.guideHrs) / out.guideHrs > 0.25) W('warn', `Labor override (${r1(out.hrs)} h) differs from guideline (${r1(out.guideHrs)} h) by more than 25%.`);
  }
  if (!sf && !['custom', 'coating'].includes(m)) W('info', 'Enter square footage.');
  return out;
}

// Merge materials across scopes (per-job items counted once)
function mergeMaterials(list) {
  const map = new Map();
  list.forEach(mt => {
    const k = mt.name + '|' + mt.price;
    if (!map.has(k)) map.set(k, { ...mt });
    else { const e = map.get(k); e.qty = mt.perJob ? Math.max(e.qty, mt.qty) : e.qty + mt.qty; e.cost = e.qty * e.price; }
  });
  return [...map.values()];

// ─── Trip charge + Total Cost Floor (Trip Charge Data tab) ───
function fleetCostPerMile(rules) {
  const f = rules.fleet, miles = Math.max(1, num(f.trucks) * num(f.milesPerTruck)), mo = Math.max(1, num(f.monthsYtd));
  const fuel = num(f.ytdFuel) / mo * 12 / miles, ins = num(f.ytdInsurance) / mo * 12 / miles;
  const maint = num(f.maintenance) / miles, dep = num(f.vehicleValue) / Math.max(1, num(f.vehicleLifeMiles));
  return { fuel, ins, maint, dep, total: fuel + ins + maint + dep };
}
// bracket: 't50' | 't75' | 't100' | 'custom' (per mile). Returns the direct cost to dispatch the crew + trucks.
function tripFloor(bracket, est, rules, crewOverride) {
  const f = rules.fleet, crew = crewOverride || crewOf(est), vehicles = Math.max(1, parseInt(est.vehicles) || 1);
  const cpm = fleetCostPerMile(rules).total, rate = rules.rates.installer;
  const miles = bracket === 'custom' ? num(est.tripMiles) : num((rules.trip.basis || {})[bracket] || 50);
  const travelHrs = miles / Math.max(1, num(f.avgSpeed)) * (f.milesAreRoundTrip ? 1 : 2);
  const travelLabor = travelHrs * crew * rate, vehicleCost = miles * cpm * vehicles;
  return { bracket, miles, travelHrs, travelLabor, vehicleCost, floor: travelLabor + vehicleCost, cpm, crew, vehicles };
}
function tripBracket(est) { const t = est.tripTier || 't50'; return t === 'manual' ? (est.tripBracket || 't50') : t; }
// Trip charge per visit: standard bracket rate (× trucks) or the estimator's adjusted amount — never below the cost floor.
function tripPerVisit(est, rules) {
  const t = est.tripTier || 't50';
  if (t === 'none') return { amount: 0, floor: 0, standard: 0, info: null };
  const br = tripBracket(est), vehicles = Math.max(1, parseInt(est.vehicles) || 1);
  const fl = tripFloor(br, est, rules);
  const standard = (br === 'custom' ? num(est.tripMiles) * rules.trip.perMile : num(rules.trip[br])) * vehicles;
  const adj = t === 'manual' ? num(est.tripManual) : (est.tripAdjust !== '' && est.tripAdjust != null ? num(est.tripAdjust) : null);
  const chosen = adj != null ? adj : standard;
  const amount = Math.max(chosen, fl.floor);
  return { amount, floor: fl.floor, standard, chosen, adjusted: adj != null, raised: chosen < fl.floor - 0.005, fl, custom: br === 'custom' };
}

function computeOption(opt, est, rules) {
  const scopes = opt.scopes.map(s => ({ scope: s, r: computeScope(s, est, rules) }));
  const L = scopes.reduce((a, x) => a + x.r.hrs, 0);
  const Llo = scopes.reduce((a, x) => a + x.r.lo, 0);
  const Lhi = scopes.reduce((a, x) => a + x.r.hi, 0);
  const sqft = scopes.reduce((a, x) => a + (x.scope.method === 'foam_pack' ? 0 : x.r.sqft), 0);
  const warnings = [];
  scopes.forEach(x => x.r.warnings.forEach(w => warnings.push({ ...w, scope: (x.scope.location === 'Other' ? x.scope.locLabel : x.scope.location) || METHODS[x.scope.method]?.label })));

  // Crew & schedule
  const C = crewOf(est);
  const eff = crewEfficiency(C, rules);
  const H = L / (C * eff);                          // on-site hours per installer (total job time)
  let days, ot;
  const manualDays = parseInt(est.planDays) || 0;
  if (manualDays > 0) { days = manualDays; ot = Math.max(0, H - 8 * days); }
  else if (H <= 8) { days = 1; ot = 0; }
  else {
    const full = Math.floor(H / 8), rem = H - 8 * full;
    if (rem < 0.01) { days = full; ot = 0; }
    else if (rem <= rules.ot.maxOtPerDay && full >= 1) { days = full; ot = rem; }
    else { days = full + 1; ot = 0; }
  }
  const reg = Math.max(0, H - ot);
  const installerDays = L > 0 ? C * Math.ceil(H / 8 - 1e-9) : 0;   // spreadsheet: CEILING((hrs+OT)/8) per installer
  const D = num(est.driveHrs);
  const perDayOnsite = days ? H / days : H;
  const setup = num(est.setupHrs ?? rules.travel.setupHrs);
  const overnight = est.overnight === 'yes' || (est.overnight !== 'no' && D > rules.travel.overnightDriveHrs && H > rules.travel.overnightLaborHrs);

  S.view = view;
  if (view !== 'estimate') { history.replaceState(null, '', location.pathname); }
  render();
  window.scrollTo(0, 0);
}

function fld(label, path, value, opts = {}) {
  const t = opts.type || 'text';
  const attrs = `data-b="${path}" data-t="${opts.t || (t === 'number' ? 'num' : 'str')}" ${opts.r ? `data-r="${opts.r}"` : ''}`;

  if (opts.options) input = `<select ${attrs}>${opts.options.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(value) === String(v) ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select>`;
  else if (t === 'textarea') input = `<textarea ${attrs} rows="${opts.rows || 2}" placeholder="${esc(opts.ph || '')}">${esc(value)}</textarea>`;
  else input = `<input type="${t}" ${attrs} value="${esc(value)}" placeholder="${esc(opts.ph || '')}" ${opts.step ? `step="${opts.step}"` : ''} ${opts.list ? `list="${opts.list}"` : ''} inputmode="${t === 'number' ? 'decimal' : 'text'}">`;
  return `<div class="field ${opts.cls || ''}"><label>${label}</label>${input}${opts.hint ? `<span class="hint" ${opts.hintId ? `id="${opts.hintId}"` : ''}>${opts.hint}</span>` : ''}</div>`;
}

function scopeFields(s) {
  const f = METHODS[s.method].fields, out = [];
  const add = h => out.push(h);
  const P = 'scope.' + s.id + '.';
  f.forEach(k => {
    if (k === 'sqft') add(fld(s.method === 'foam_pack' ? 'Home / floor sq ft' : s.method === 'spf' && s.surface === 'ceiling' ? 'Sq ft (roof/ceiling)' : 'Sq ft', P + 'sqftRaw', s.sqftRaw ?? s.sqft, { hint: 'Math OK: 1200+340+12x14', hintId: 'sqh-' + s.id }));
    if (k === 'height') add(fld('Height (ft)', P + 'height', s.height, { type: 'number', ph: '8', r: 'scope' }));
    if (k === 'rValue') add(fld('R-value', P + 'rValue', s.rValue, { type: 'number', r: 'scope' }));
    if (k === 'spacing') add(fld('Framing o.c.', P + 'spacing', s.spacing, { r: 'scope', options: [['16', '16″'], ['24', '24″']] }));
    if (k === 'depth') add(fld('Framing', P + 'depth', s.depth, { r: 'scope', options: ['2x4', '2x6', '2x8', '2x10', '2x12'] }));
    if (k === 'facing') {
      add(fld('Facing', P + 'facing', s.facing, { r: 'scope', options: [['any', 'Any (cheapest)'], ['K', 'Kraft'], ['UF', 'Unfaced'], ['RW', 'Rockwool']] }));
      const m = battMatches({ ...s, facing: s.facing });
      add(fld('Batt product', P + 'product', s.product, { r: 'scope', cls: 'span2', options: [['', m.length ? 'Auto — best $/sf' : 'No match for R/spacing'], ...m.map(b => [b.name, `${b.name} — $${b.price} (${b.coverage} sf)`])] }));
    }
    if (k === 'blowProduct') add(fld('Material', P + 'blowProduct', s.blowProduct, { r: 'scope', options: BLOW_IN.map(b => [b.key, b.name]) }));
    if (k === 'nettingSqft') add(fld('Netting sq ft', P + 'nettingSqft', s.nettingSqft, { type: 'number', ph: '= sq ft (gross)', hint: 'Before window/door deductions' }));
    if (k === 'days') add(fld('Days (full-day default)', P + 'days', s.days, { type: 'number', step: '0.5' }));
    if (k === 'spfType') add(fld('Foam', P + 'spfType', s.spfType, { r: 'scope', options: [['oc', 'Open cell'], ['cc', 'Closed cell']] }));
    if (k === 'surface') add(fld('Surface', P + 'surface', s.surface, { r: 'scope', options: [['walls', 'Walls'], ['ceiling', 'Ceiling / roof deck']] }));
    if (k === 'frame') add(fld('Building frame', P + 'frame', s.frame, { r: 'scope', options: [['wood', 'Wood'], ['metal', 'Metal']] }));
    if (k === 'rValue' && ['spf', 'crawl_joist_spf', 'crawl_found_spf'].includes(s.method)) add(fld('or thickness (in)', P + 'thickness', s.thickness, { type: 'number', step: '0.25', ph: 'from R' }));
    if (k === 'clearance') add(fld('Clearance (in)', P + 'clearance', s.clearance, { type: 'number' }));
    if (k === 'enteringInstallers') add(fld('Installers entering attic', P + 'enteringInstallers', s.enteringInstallers, { type: 'number', hint: '$' + RULES.bonuses.tightAttic + ' bonus each' }));
    if (k === 'manualHours') add(fld('Labor hours (total)', P + 'manualHours', s.manualHours, { type: 'number' }));
    if (k === 'plateLf' && !(S.est.projectType === 'commercial' && S.est.construction === 'retrofit')) add(fld('Linear ft', P + 'plateLf', s.plateLf ?? (Math.max(num(s.sillLf), num(s.caulkLf)) || ''), { type: 'number', hint: 'Caulk & sill gasket: 1 per 50 LF' }));
  });
  const checks = [];
  if (f.includes('shaving')) { const def = s.shaving ?? (s.spfType === 'oc' && s.surface === 'walls'); checks.push(chk('Shave flush', P + 'shaving', def)); }
  if (f.includes('exposed')) checks.push(chk('Foam left exposed', P + 'exposed', s.exposed));
  if (f.includes('scaffold') && num(s.height) > RULES.battWall.heightBreak) checks.push(chk(`Scaffold / stilts (+${RULES.battWall.scaffoldPct}%)`, P + 'scaffold', s.scaffold));
  if (f.includes('contamination')) checks.push(chk('Rodent / animal contamination', P + 'contamination', s.contamination));
  if (checks.length) out.push(`<div class="field full"><div class="row" style="gap:14px">${checks.join('')}</div></div>`);
  out.push(fld('Extra labor %', P + 'extraPct', s.extraPct, { type: 'number', ph: '0', hint: 'This scope only' }));
  out.push(fld('Override labor hrs', P + 'laborOverride', s.laborOverride, { type: 'number', ph: 'guideline' }));
  return out.join('');
}

function setHTML(id, html) { const el = $(id); if (el && el._h !== html) { el.innerHTML = html; el._h = html; } }

function customerRange(c) {
  const lo = c.Hlo, hi = Math.max(c.Hhi, c.H);
  if (hi <= 8) return `${fmtN(Math.max(1, Math.floor(lo * 2) / 2), 1)}–${fmtN(Math.ceil(hi * 2) / 2, 1)} hours on site`;
  const dlo = Math.max(1, Math.ceil(lo / 8 - 0.25)), dhi = Math.max(dlo, Math.ceil(hi / 8 - 0.25));
  return dlo === dhi ? `${dlo} day${dlo > 1 ? 's' : ''} on site` : `${dlo}–${dhi} days on site`;
}

// ─── BINDING ─────────────────────────────────────────────────────────────────
function setPath(path, val) {
  const parts = path.split('.');
  let obj;
  if (parts[0] === 'est') obj = S.est, parts.shift();
  else if (parts[0] === 'opt') obj = curOpt(), parts.shift();
  else if (parts[0] === 'scope') { obj = findScope(parts[1]); parts.splice(0, 2); }
  else if (parts[0] === 'misc') { obj = curOpt().misc; parts.shift(); }
  if (!obj) return;
  for (let i = 0; i < parts.length - 1; i++) { if (obj[parts[i]] == null) obj[parts[i]] = {}; obj = obj[parts[i]]; }
  obj[parts[parts.length - 1]] = val;
}
function readInput(el) {
  const t = el.dataset.t;
  if (t === 'bool') return el.checked;
  if (t === 'num') return el.value === '' ? '' : parseFloat(el.value);
  return el.value;
}
function onBind(ev) {
  const el = ev.target;
  if (el.dataset.autoq !== undefined && S.est) { const o = curOpt(); o.autoQty = o.autoQty || {}; if (el.value === '') delete o.autoQty[el.dataset.autoq]; else o.autoQty[el.dataset.autoq] = el.value; el.classList.toggle('ovr', el.value !== ''); markDirty(); return refreshCalc(); }
  if (el.dataset.mat) return onMatEdit(el, ev);
  if (!el.dataset.b || !S.est) return;
  const path = el.dataset.b;
  const prevBuilder = path === 'est.builderId' ? S.est.builderId : null;
  setPath(path, readInput(el));
  if (path.startsWith('est.actuals.')) { markDirty(); if (ev.type === 'change' && onActualsBind(el, path)) return; if (/\.rate$/.test(path) && ev.type === 'input') { const i = +path.split('.')[3]; if (S.est.actuals.labor[i]) S.est.actuals.labor[i].rateAuto = false; } return refreshActuals(); }
  if (el.dataset.r === 'tabs' && ev.type === 'input') { const t = document.querySelector('.opt-tab.active'); if (t) { const dot = t.querySelector('span'); t.textContent = el.value; if (dot) t.prepend(dot, ' '); } }
  if (path.endsWith('.sqftRaw')) { const sc = findScope(path.split('.')[1]); sc.sqft = evalArea(sc.sqftRaw); }
  markDirty();
  const r = el.dataset.r;
  // Text/number inputs already recalculated on 'input'; re-rendering on 'change' (blur)
  // would destroy whatever element the user just clicked into.
  if (ev.type === 'change' && !r && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio' && el.type !== 'date'))) return;
  const structural = ev.type === 'change' || el.type === 'checkbox' || el.tagName === 'SELECT';
  if (r && structural) {
    // Re-render AFTER the browser has moved focus (click / Tab), then put focus back on the same field
    if (r === 'all') { if (path === 'est.builderId') onBuilderSelected(prevBuilder); keepFocus(renderEstimate); return; }
    if (r === 'tabs') { refreshCalc(); return; }                // tab label already updated live while typing
    if (r === 'misc') { const i = parseInt(path.split('.')[1]); const it = SUPPLIES.find(x => x.name === el.value); if (it && !num(curOpt().misc[i].price)) { curOpt().misc[i].price = it.price; keepFocus(renderEstimate); return; } }
    if (r === 'loc') { const sc = findScope(path.split('.')[1]); const d = LOCATION_DEFAULTS[sc.location]; if (d && !sc.sqft) Object.assign(sc, d); keepFocus(() => rerenderScope(sc)); return; }
    if (r === 'scope') { const sc = findScope(path.split('.')[1]); if (path.endsWith('.method')) { sc.laborOverride = ''; sc.matQty = {}; sc.matPrice = {}; } if (path.endsWith('.spfType') || path.endsWith('.surface')) delete sc.shaving; keepFocus(() => rerenderScope(sc)); return; }
  }
  if (path === 'est.status') onStatusChange();
  refreshCalc();
}
function focusSel(a) {
  if (!a || a === document.body || !a.dataset) return null;
  const q = v => (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/"/g, '\\"');
  if (a.dataset.b) return `[data-b="${q(a.dataset.b)}"]`;
  if (a.dataset.mat) return `[data-mat="${q(a.dataset.mat)}"][data-matname="${q(a.dataset.matname)}"][data-field="${q(a.dataset.field)}"]`;
  if (a.dataset.autoq !== undefined) return `[data-autoq="${q(a.dataset.autoq)}"]`;
  if (a.id) return '#' + q(a.id);
  return null;
}
function keepFocus(fn) {
  const est = S.est, view = S.view, tab = S.estTab;

    if (s.margin_default) RULES.margin = num(s.margin_default); if (s.royalty_default) RULES.royalty = num(s.royalty_default);
  } catch (e) { console.warn('[settings] app_settings', e.message); }
  try {
    const [row] = await api('GET', `koala_v2_settings?franchise_id=eq.${FRANCHISE_ID}&select=*`);
    _storedSettings = (row && row.settings) || {};
    if (row && row.settings && Object.keys(row.settings).length) RULES = deepMerge(RULES, row.settings);
    if (row && row.franchise_name && !(row.settings || {}).franchiseName) RULES.franchiseName = row.franchise_name;
  } catch (e) { console.warn('[settings] v2', e.message); }

}

const normKey = s => String(s).toLowerCase().replace(/\(.*?\)/g, '').replace(/["'″]/g, '').replace(/\bkraft\b/g, 'k').replace(/\bunfaced\b/g, 'uf').replace(/\s+/g, '').replace(/[^a-z0-9.&]/g, '');
async function loadPricing() {
  try {
    const items = await api('GET', 'common_items?select=category,product_type,product_name,unit_price,coverage_sqft,price_per_sqft,unit_of_measure&order=sort_order');
    items.forEach(ci => {
      const p = num(ci.unit_price), c = num(ci.coverage_sqft), t = ci.product_type || '';
      if (t.startsWith('Blow-In')) { const b = BLOW_IN.find(x => (t.includes('Cellulose') && x.key === 'cellulose') || (t.includes('Fiberglass') && x.key === 'l77')); if (b && p) b.price = p; return; }
      if (t.startsWith('SPF')) { const pp = num(ci.price_per_sqft); if (pp) SPF_PRICE[t.includes('Closed') ? 'cc' : 'oc'] = pp; return; }
      if (ci.category === 'Insulation' && !/\(special order\)|\(hd\)/i.test(t)) {
        const k = normKey(t);
        const b = BATTS.find(x => normKey((x.r === 'S&S' ? 'Safe & Sound Rockwool ' + x.width : x.r.replace('-', '') + 'X' + x.width + ' ' + ({ K: 'K', UF: 'UF', RW: 'Rockwool' })[x.facing])) === k);
        if (b) { if (p) b.price = p; if (c) b.coverage = c; }
      }
    });
    const MAP = { 'Baffles': 'Baffles', 'Removal Bags': 'Removal Bags', 'Foam Sealant': 'Foam Sealant', 'Poly Sheeting': 'Poly', 'Vapor Barrier 14 Mil': 'Vapor Barrier 14 Mil', 'Seam Tape': 'Seam Tape', 'N95 Mask': 'N95 Mask', 'Insulation Netting (cellulose)': 'Insulation Netting 10\' (For cellulose)', 'Insulation Netting (fiberglass)': 'Insulation Netting 10\' (For fiberglass)', 'Caulking': 'Caulking', 'Staples': 'Staples (For Blue Pneumatic Guns)', 'Sill Plate Gasket': 'Sill Plate Gasket' };
    SUPPLIES.forEach(s => {
      const ci = items.find(i => i.product_type === MAP[s.name]);
      if (!ci) return;
      const cov = num(ci.coverage_sqft);
      if (s.perSf) { s.price = num(ci.price_per_sqft) || (cov ? num(ci.unit_price) / cov : s.price); return; }
      s.price = s.name === 'N95 Mask' && cov > 1 && num(ci.price_per_sqft) > 0 ? num(ci.price_per_sqft) : num(ci.unit_price) || s.price;   // N95 is sold in boxes of 10; everything else is priced per unit (e.g. a 50 LF gasket roll)
    });
    const have = new Set(SUPPLIES.map(s => s.name.toLowerCase()));
    items.filter(i => ['Material', 'SPF Supplies', 'Tools/PPE'].includes(i.category)).forEach(ci => {
      const cov = num(ci.coverage_sqft);
      const name = ci.product_type + (items.filter(x => x.product_type === ci.product_type).length > 1 ? ' — ' + ci.product_name : '');
      if (have.has(name.toLowerCase())) return; have.add(name.toLowerCase());
      SUPPLIES.push({ name, price: ci.unit_of_measure === 'each' && cov > 1 && num(ci.price_per_sqft) > 0 ? num(ci.price_per_sqft) : num(ci.unit_price), unit: ci.unit_of_measure || 'each' });
    });
    SUPPLIES.sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { console.warn('[pricing] using built-in prices', e.message); }
}

async function saveBuilder(id, fromEstimate) {
  const g = k => $('bf_' + k).value.trim();
  if (!g('name')) return toast('Name is required', 'error');
  const nOrNull = v => v === '' ? null : num(v);
  const row = { franchise_id: FRANCHISE_ID, name: g('name'), client_type: g('client_type'), contact_name: g('contact_name') || null, phone: g('phone') || null,
    email: g('email') || null, address: g('address') || null, default_margin: nOrNull(g('default_margin')), volume_discount_pct: nOrNull(g('volume_discount_pct')) ?? 0,
    payment_terms: g('payment_terms') || null, scheduling_notes: g('scheduling_notes') || null, notes: g('notes') || null, is_active: $('bf_is_active').checked, updated_at: new Date().toISOString() };
  try {
    let saved;
    if (id) [saved] = await api('PATCH', 'koala_v2_builders?id=eq.' + id, row);
    else [saved] = await api('POST', 'koala_v2_builders', row);
    const i = S.builders.findIndex(b => b.id === saved.id);
    if (i >= 0) S.builders[i] = saved; else S.builders.push(saved);
    S.builders.sort((a, b) => a.name.localeCompare(b.name));
    closeModal(); toast('Profile saved', 'ok');
    if (fromEstimate && S.est) { S.est.builderId = saved.id; markDirty(); await onBuilderSelected(); renderEstimate(); }
    else if (S.view === 'estimate') { renderBuilderPanel(); } else render();
  } catch (e) { toast('Save failed: ' + e.message, 'error'); }
}

function setDeep(obj, path, val) { const p = path.split('.'); let o = obj; for (let i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }

async function saveSettings() {
  document.querySelectorAll('[data-set]').forEach(el => {
    if (!el.dataset.emp && !el.dataset.list && !el.dataset.str && String(el.value).trim() === '') return;   // cleared number = keep the current value (never save 0)
    let v = el.dataset.emp ? el.value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0]).map(p => ({ name: p[0], role: p[1] || 'Installer', rate: num(p[2]) })) : el.dataset.list ? el.value.split(',').map(x => x.trim()).filter(Boolean) : el.dataset.str ? el.value : num(el.value);
    setDeep(RULES, el.dataset.set, v);
  });
  const over = diffObj(DEFAULT_RULES, RULES) || {};
  // Pay rates / trip / margin normally come from the GM settings (app_settings);
  // only pin them here if they were edited on this screen.
  // Pin only the individual fields that changed (e.g. editing fuel $/hr must not freeze every pay rate).
  ['rates', 'trip', 'margin', 'royalty'].forEach(k => {
    const loaded = JSON.parse(_loadedRates[k] ?? 'null'), cur = RULES[k], stored = _storedSettings[k];
    if (cur && typeof cur === 'object') {
      const pin = { ...(stored && typeof stored === 'object' ? stored : {}) };
      Object.keys(cur).forEach(f => { if (JSON.stringify(cur[f]) !== JSON.stringify((loaded || {})[f])) pin[f] = cur[f]; });
      if (Object.keys(pin).length) over[k] = pin; else delete over[k];
    } else if (JSON.stringify(cur) !== _loadedRates[k]) over[k] = cur;
    else if (stored !== undefined) over[k] = stored; else delete over[k];
  });
  const R = RULES;
  try {
    await api('POST', 'koala_v2_settings?on_conflict=franchise_id', { franchise_id: FRANCHISE_ID, franchise_name: R.franchiseName, settings: over, updated_at: new Date().toISOString() }, { Prefer: 'resolution=merge-duplicates,return=representation' });
    _storedSettings = over; snapshotRates();
    toast('Settings saved', 'ok'); render();
  } catch (e) { toast('Could not save: ' + e.message, 'error'); }
}

  const summary = estimateSummaryText(e, res);

// ════════════════════════════════════════════════════════════════════════════
// SALES COMMISSIONS (GM only) — mirrors the monthly "Job Margin Performance Tracking" workbook
//   • Every job: actual margin = (Revenue Before Fees − actual labor − actual material) ÷ RBF
//   • Commission: group jobs by estimator(s) × project type for the pay month; the tier is set by the
//     AVERAGE actual margin of the group; commission = tier % × total RBF of the group.
//     Shared jobs ("Mark & Frank") form their own group and the commission is split evenly.
//   • Crew lead efficiency bonus: 5% of total over/short when actual beats quoted by ≥ 5 pts and no call back.
// Data lives in koala_commission_jobs — only reachable through password-checked RPCs (koala_comm_*).
// ════════════════════════════════════════════════════════════════════════════

const COMM_TYPES = ['Residential (Retrofit)', 'Residential (New Construction/Remodel)', 'Commercial (Retrofit)', 'Commercial (New Construction/Remodel)'];
const COMM_DEFAULT_PLAN = {
  // min = average actual margin % at which the rate starts (tiers checked highest first)
  tiers: {
    'Residential (Retrofit)': [{ min: 40, rate: 1 }, { min: 50, rate: 2 }],
    'Residential (New Construction/Remodel)': [{ min: 20, rate: 1 }, { min: 30, rate: 2 }, { min: 40, rate: 3 }],
    'Commercial (Retrofit)': [{ min: 20, rate: 1 }, { min: 30, rate: 2 }, { min: 40, rate: 3 }],
    'Commercial (New Construction/Remodel)': [{ min: 20, rate: 1 }, { min: 30, rate: 2 }, { min: 40, rate: 3 }],
  },
  overrides: { Brian: { 'Residential (Retrofit)': [{ min: 50, rate: 3 }] } },   // Brian's separate plan (3% at 50%+ in April & June; 0% at 8% in July)
  crewLead: { minBeatPts: 5, sharePct: 5, pairEachFull: true },
  people: [],                       // extra estimator names for the picker
};
const C = { pw: null, plan: null, jobs: [], month: null, busy: false, v2: null };
const rpc = async (fn, args) => {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_fr: FRANCHISE_ID, p_pw: C.pw, ...args }) });
  const t = await res.text();
  if (!res.ok) { let m = t; try { m = JSON.parse(t).message || t; } catch { } if (/Wrong password/i.test(m)) commLock(true); throw new Error(m); }
  return t ? JSON.parse(t) : null;
};
const ymNow = () => new Date().toISOString().slice(0, 7);
const ymLabel = ym => { const [y, m] = ym.split('-'); return new Date(+y, +m - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' }); };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch { return null; } };
const ssSet = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { } };
const pct1 = v => (v == null || !isFinite(v)) ? '—' : fmtN(v, 1) + '%';

// ─── MATH ────────────────────────────────────────────────────────────────────
function commJobCalc(j, plan) {
  const rbf = num(j.rbf), aL = num(j.actual_labor), aM = num(j.actual_material), eL = num(j.est_labor), eM = num(j.est_material);
  const complete = rbf > 0 && j.actual_labor != null && j.actual_labor !== '' && j.actual_material != null && j.actual_material !== '';
  const actual = complete ? (rbf - aL - aM) / rbf * 100 : null;
  const quoted = j.quoted_margin == null || j.quoted_margin === '' ? null : num(j.quoted_margin);
  const beat = actual != null && quoted != null ? Math.round((actual - quoted) * 100) / 100 : null;
  const laborDiff = eL - aL, matDiff = eM - aM, overShort = laborDiff + matDiff;
  const cl = plan.crewLead || COMM_DEFAULT_PLAN.crewLead;
  const bonus = beat != null && beat >= num(cl.minBeatPts) && !j.callback ? Math.max(0, overShort * num(cl.sharePct) / 100) : 0;
  return { rbf, actual, quoted, beat, marginDiff: beat != null && beat >= num(cl.minBeatPts) ? beat : 0, laborDiff, matDiff, overShort, bonus, complete };
}
function commRate(plan, person, type, avg) {
  const t = ((plan.overrides || {})[person] || {})[type] || (plan.tiers || {})[type] || [];
  let rate = 0;
  t.slice().sort((a, b) => num(a.min) - num(b.min)).forEach(x => { if (avg >= num(x.min) - 1e-9) rate = num(x.rate); });
  return rate;
}
const groupName = ests => (ests || []).filter(Boolean).join(' & ') || '(no estimator)';
function commReport(jobs, plan) {
  const groups = new Map(), warn = [], payouts = {}, leads = {};
  jobs.forEach(j => {
    const c = commJobCalc(j, plan);
    if (!c.complete) { warn.push(`${j.customer || '(no name)'}: missing Revenue Before Fees or actual labor/material — not counted.`); return; }
    if (!j.project_type) warn.push(`${j.customer}: no project type — not counted.`);
    if (!(j.estimators || []).length) warn.push(`${j.customer}: no sales estimator — commission not assigned.`);
    if (!j.project_type) return;
    const key = groupName(j.estimators) + '|' + j.project_type;
    if (!groups.has(key)) groups.set(key, { people: (j.estimators || []).filter(Boolean), type: j.project_type, jobs: [], sumA: 0, sumQ: 0, nQ: 0, rbf: 0 });
    const g = groups.get(key); g.jobs.push(j); g.sumA += c.actual; if (c.quoted != null) { g.sumQ += c.quoted; g.nQ++; } g.rbf += c.rbf;
    // crew lead bonus
    if (c.bonus && j.crew_lead && !/^no crew lead$/i.test(j.crew_lead)) {
      const names = j.crew_lead.split(/\s*&\s*/).filter(Boolean);
      const each = plan.crewLead?.pairEachFull === false ? c.bonus / names.length : c.bonus;
      names.forEach(n => { leads[n] = leads[n] || { total: 0, jobs: 0 }; leads[n].total += each; leads[n].jobs++; });
    }
  });
  const rows = [...groups.values()].map(g => {
    g.avgActual = g.sumA / g.jobs.length; g.avgQuoted = g.nQ ? g.sumQ / g.nQ : null;
    const n = Math.max(1, g.people.length);
    g.shares = (g.people.length ? g.people : ['(no estimator)']).map(p => { const rate = commRate(plan, p, g.type, g.avgActual); return { person: p, rate, amount: g.rbf * rate / 100 / n }; });
    g.rate = g.shares[0].rate; g.commission = g.shares.reduce((a, s) => a + s.amount, 0);
    g.shares.forEach(s => { if (!g.people.length) return; const p = payouts[s.person] = payouts[s.person] || { total: 0, rbf: 0, jobs: 0, lines: [] }; p.total += s.amount; p.rbf += g.rbf / n; p.jobs += g.jobs.length; p.lines.push({ g, s }); });
    return g;
  }).sort((a, b) => groupName(a.people).localeCompare(groupName(b.people)) || a.type.localeCompare(b.type));
  return { rows, payouts, leads, warn };
}

// ─── LOCK ────────────────────────────────────────────────────────────────────
function commLock(wrong) {

async function commUnlock(pw, quiet) {
  C.pw = pw;

    C.plan = deepMerge(clone(COMM_DEFAULT_PLAN), plan || {});

}

  C.jobs = await rpc('koala_comm_list', { p_from: null, p_to: null }) || [];

}

const commTotTxt = it => `Actual labor = wages × ${1 + RULES.rates.payrollTaxPct / 100} (payroll tax) = <b>${money(it.labor)}</b> · ${fmtN(it.hours, 2)} hrs. Actual material (incl. trip/fuel) = <b>${money(it.material)}</b>.`;

  const hours = d.labor.reduce((a, l) => a + num(l.hrs) + num(l.ot), 0);
  const material = d.materials.reduce((a, m) => a + num(m.qty) * num(m.price), 0);

// Prefill the estimate side from a V1 (In-Home) or V2 estimate

      : await api('GET', `koala_v2_estimates?franchise_id=eq.${FRANCHISE_ID}&select=id,project_name,customer_name,estimator_name,estimate_date,status,revenue_before_fees,margin_percent,project_type&order=updated_at.desc&limit=200`);
    el.innerHTML = `<input id="cjPickQ" placeholder="Search…" style="width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:6px;margin-top:6px"><div class="deal-list" id="cjPickL"></div>`;
    const draw = () => { const q = $('cjPickQ').value.toLowerCase(); $('cjPickL').innerHTML = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q)).slice(0, 40).map(r => `<div class="deal-item" data-id="${r.id}"><span>${esc(r.project_name || r.customer_name || '(untitled)')} <span class="muted small">${esc(r.estimator_name || '')} · ${esc(r.estimate_date || '')}</span></span><span class="pill">${esc(r.status || '')}</span></div>`).join('') || '<div class="empty small">No matches</div>'; };
    $('cjPickQ').oninput = draw; draw();
    $('cjPickL').onclick = async ev => {
      const it = ev.target.closest('[data-id]'); if (!it) return; const r = rows.find(x => x.id === it.dataset.id), j = _cj;
      if (kind === 'v1') {
        const m = num(r.margin_percent);
        Object.assign(j, { customer: j.customer || r.customer_name, estimators: j.estimators.length ? j.estimators : [commCanonName(r.estimator_name)], quoted_margin: m, rbf: m < 100 ? r2(num(r.total_cost) / (1 - m / 100)) : '', source_id: 'v1:' + r.id });

function commCanonName(n) {

  return known.has(first) ? first : n;

    if (hi < 0) return;
    const H = rows[hi].map(c => String(c || '').toLowerCase()), col = re => H.findIndex(h => re.test(h));
    const ix = { d: col(/date|fin(i)?s/), cust: col(/customer/), desc: col(/job desc/), type: col(/project type/), q: col(/quoted/), cb: col(/call back/), lead: col(/crew lead$/), est: col(/estimator/), rbf: col(/revenue before fees/), el: col(/^est labor/), al: col(/^actual labor$/), em: col(/^est material/), am: col(/^actual material/), reason: col(/reason/), pv: col(/product variance/), brand: col(/brand/), eh: col(/hours estimated/), ah: col(/actual labor hours/) };
    const yr = (/(20\d\d)/.exec(fileName) || [])[1] || String(new Date().getFullYear());
    const mi = MONTHS.findIndex(m => sn.toLowerCase().includes(m)) >= 0 ? MONTHS.findIndex(m => sn.toLowerCase().includes(m)) : MONTHS.findIndex(m => fileName.toLowerCase().includes(m));
    let pm = mi >= 0 ? `${yr}-${String(mi + 1).padStart(2, '0')}` : null;
    const toDate = v => typeof v === 'number' ? new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10) : v instanceof Date ? v.toISOString().slice(0, 10) : (v && /^\d{4}-\d\d-\d\d/.test(v) ? String(v).slice(0, 10) : '');
    const n = v => typeof v === 'number' ? v : (v === null || v === '' || isNaN(parseFloat(v)) ? null : parseFloat(v));
    rows.slice(hi + 1).forEach((r, k) => {
      const rbf = n(r[ix.rbf]); if (!rbf) return;
      const fd = toDate(r[ix.d]); let q = n(r[ix.q]); if (q != null && q <= 1.5) q = r2(q * 100);
      out.push({ finished_date: fd, pay_month: pm || fd.slice(0, 7), customer: String(r[ix.cust] || '').trim(), job_description: String(r[ix.desc] || '').trim(), project_type: commNormType(r[ix.type]),
        quoted_margin: q, rbf, est_labor: n(r[ix.el]), actual_labor: n(r[ix.al]), est_material: n(r[ix.em]), actual_material: n(r[ix.am]), est_hours: n(r[ix.eh]), actual_hours: n(r[ix.ah]),
        callback: String(r[ix.cb] || '').trim().toLowerCase() === 'yes', crew_lead: String(r[ix.lead] || '').trim(), estimators: commSplitNames(r[ix.est]),
        reason: r[ix.reason] ? String(r[ix.reason]).trim() : '', product_variance: r[ix.pv] ? String(r[ix.pv]).trim() : '', brand_used: r[ix.brand] ? String(r[ix.brand]).trim() : '',
        source: 'import', source_id: `${pm || fd.slice(0, 7)}-r${hi + 2 + k}`, detail: { file: fileName, sheet: sn } });
    });
  });
  return out;
}
function commXlsxImport() {
  modal(`<div class="modal-hd"><h3>Import tracker workbook</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-bd"><p class="small" style="margin-bottom:8px">Pick one or more <b>Job Margin Performance Tracking</b> workbooks. Jobs are read from the month sheet (the Pivot, Note and Call Backs sheets are ignored). The pay month comes from the sheet / file name. Importing the same file again updates those rows instead of duplicating them.</p>
    <input type="file" id="xlsxIn" accept=".xlsx,.xls" multiple><div id="xlsxPrev" style="margin-top:10px"></div></div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="xlsxGo" disabled>Import</button></div>`, true);
  let parsed = [];
  $('xlsxIn').onchange = async ev => {
    const prev = $('xlsxPrev'); prev.innerHTML = '<div class="small muted">Reading…</div>';
    try {
      await commLoadXlsxLib(); parsed = [];
      for (const f of ev.target.files) { const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: false }); parsed.push(...commParseWorkbook(wb, f.name)); }
      const by = {}; parsed.forEach(j => { by[j.pay_month] = (by[j.pay_month] || 0) + 1; });
      prev.innerHTML = parsed.length ? `<div class="w info"><span class="ic">ℹ</span><span>Found <b>${parsed.length}</b> jobs: ${Object.entries(by).sort().map(([m, c]) => `${ymLabel(m)} ${c}`).join(' · ')}</span></div>` : '<div class="w warn"><span class="ic">⚠</span><span>No job rows found — is this a Job Margin Performance Tracking workbook?</span></div>';
      $('xlsxGo').disabled = !parsed.length;
    } catch (e) { prev.innerHTML = `<div class="w error"><span class="ic">⛔</span><span>${esc(e.message)}</span></div>`; }
  };
  $('xlsxGo').onclick = async () => {
    const b = $('xlsxGo'); b.disabled = true; b.textContent = 'Importing…';
    try { for (let i = 0; i < parsed.length; i += 200) await rpc('koala_comm_upsert_many', { p_jobs: parsed.slice(i, i + 200) });
      await commLoad(); const ms = [...new Set(parsed.map(j => j.pay_month))].sort(); C.month = ms[ms.length - 1] || C.month; closeModal(); renderCommissions(); toast(`Imported ${parsed.length} jobs`, 'ok'); }
    catch (e) { toast('Import failed: ' + e.message, 'error'); b.disabled = false; b.textContent = 'Import'; }
  };
}

// ─── EXPORT ──────────────────────────────────────────────────────────────────
function commExport() {
  const jobs = C.jobs.filter(j => j.pay_month === C.month), rep = commReport(jobs, C.plan);
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [[`Sales commissions — ${ymLabel(C.month)}`], [], ['Estimator', 'Commission']];
  Object.entries(rep.payouts).forEach(([p, v]) => lines.push([p, r2(v.total)]));
  lines.push([], ['Crew lead', 'Efficiency bonus']); Object.entries(rep.leads).forEach(([p, v]) => lines.push([p, r2(v.total)]));
  lines.push([], ['Estimator(s)', 'Project type', 'Jobs', 'Avg quoted %', 'Avg actual %', 'RBF', 'Rate %', 'Commission']);
  rep.rows.forEach(g => lines.push([groupName(g.people), g.type, g.jobs.length, g.avgQuoted == null ? '' : r2(g.avgQuoted), r2(g.avgActual), r2(g.rbf), g.shares.map(s => s.rate).join('/'), r2(g.commission)]));
  lines.push([], ['Date finished', 'Customer/Project', 'Job description', 'Project type', 'Quoted margin %', 'Actual margin %', 'Margin difference', 'Call back', 'Crew lead bonus', 'Crew lead', 'Sales estimator', 'Revenue before fees', 'Est labor', 'Actual labor', 'Difference in labor', 'Est material', 'Actual material', 'Difference in material', 'Total over/short', 'Reason for variance', 'Product variance', 'Product brand used', 'Labor hours estimated', 'Actual labor hours']);
  jobs.forEach(j => { const c = commJobCalc(j, C.plan); lines.push([j.finished_date, j.customer, j.job_description, j.project_type, c.quoted, c.actual == null ? '' : r2(c.actual), r2(c.marginDiff), j.callback ? 'Yes' : 'No', r2(c.bonus), j.crew_lead, groupName(j.estimators), j.rbf, j.est_labor, j.actual_labor, r2(c.laborDiff), j.est_material, j.actual_material, r2(c.matDiff), r2(c.overShort), j.reason, j.product_variance, j.brand_used, j.est_hours, j.actual_hours]); });
  const blob = new Blob([lines.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Commissions ${C.month}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ─── PLAN SETTINGS ───────────────────────────────────────────────────────────
function commPlanModal() {
  const p = C.plan, tierTxt = t => (t || []).map(x => `${x.min}:${x.rate}`).join(', ');
  modal(`<div class="modal-hd"><h3>Commission plan</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-bd">
      <p class="small muted" style="margin-bottom:10px">Tiers are written <b>avg actual margin % : commission %</b>, e.g. <code>20:1, 30:2, 40:3</code> = 1% from 20%, 2% from 30%, 3% from 40% (below the first tier = 0%). The average is the simple average of each job's actual margin for that estimator and project type in the pay month; the rate is paid on the group's total revenue before fees. These defaults were read from the 2026 trackers (they reproduce every March–August payout except Brian's separate plan).</p>
      <table class="tbl-edit">${COMM_TYPES.map(t => `<tr><td>${esc(t)}</td><td><input data-tier="${esc(t)}" value="${esc(tierTxt(p.tiers[t]))}" style="width:220px"></td></tr>`).join('')}</table>
      <h4 style="margin:14px 0 4px">Individual plans <span class="small muted">(one per line: Name | Project type | tiers)</span></h4>
      <textarea id="planOv" rows="3" style="width:100%">${esc(Object.entries(p.overrides || {}).flatMap(([n, o]) => Object.entries(o).map(([t, tiers]) => `${n} | ${t} | ${tierTxt(tiers)}`)).join('\n'))}</textarea>
      <h4 style="margin:14px 0 4px">Crew lead efficiency bonus</h4>
      <table class="tbl-edit"><tr><td>Actual must beat quoted by ≥ pts</td><td><input id="clBeat" type="number" value="${esc(p.crewLead.minBeatPts)}"></td></tr>
        <tr><td>Bonus = % of total over/short</td><td><input id="clShare" type="number" value="${esc(p.crewLead.sharePct)}"></td></tr>
        <tr><td>Paired crew leads (“Jorge &amp; Ricardo”)</td><td><select id="clPair"><option value="full" ${p.crewLead.pairEachFull !== false ? 'selected' : ''}>each get the full bonus (as in tracker)</option><option value="split" ${p.crewLead.pairEachFull === false ? 'selected' : ''}>split the bonus</option></select></td></tr></table>
      <h4 style="margin:14px 0 4px">Change password</h4>
      <div class="row"><input id="pwNew" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" style="flex:1;padding:6px 9px;border:1px solid var(--border);border-radius:6px"><button class="btn sm" onclick="commChangePw()">Change</button></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="commSavePlan()">Save plan</button></div>`);
}
function parseTiers(s) { return String(s || '').split(/[,;]+/).map(x => x.split(':').map(y => parseFloat(y))).filter(a => a.length === 2 && isFinite(a[0]) && isFinite(a[1])).map(([min, rate]) => ({ min, rate })).sort((a, b) => a.min - b.min); }
async function commSavePlan() {
  const p = clone(C.plan);
  document.querySelectorAll('[data-tier]').forEach(el => p.tiers[el.dataset.tier] = parseTiers(el.value));
  p.overrides = {};
  $('planOv').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a.length === 3 && a[0]).forEach(([n, t, tiers]) => { const tt = COMM_TYPES.find(x => x.toLowerCase() === t.toLowerCase()) || commNormType(t); (p.overrides[n] = p.overrides[n] || {})[tt] = parseTiers(tiers); });
  p.crewLead = { minBeatPts: num($('clBeat').value), sharePct: num($('clShare').value), pairEachFull: $('clPair').value === 'full' };
  try { C.plan = deepMerge(clone(COMM_DEFAULT_PLAN), await rpc('koala_comm_save_plan', { p_plan: p })); closeModal(); renderCommissions(); toast('Commission plan saved', 'ok'); } catch (e) { toast('Could not save: ' + e.message, 'error'); }
}
async function commChangePw() {
  const v = $('pwNew').value; if (v.length < 6) return toast('Use at least 6 characters', 'error');
  try { await rpc('koala_comm_change_password', { p_new: v }); C.pw = v; ssSet('koalaCommPw', v); $('pwNew').value = ''; toast('Password changed', 'ok'); } catch (e) { toast(e.message, 'error'); }
}
