<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koala Insulation — Saved Estimates</title>
<style>
:root {
  --navy: #043968;
  --navy-dark: #022a4e;
  --green: #95C93D;
  --green-bright: #97D700;
  --green-light: #f0f7e1;
  --green-dark: #6a9a1e;
  --sage: #7EB4A3;
  --surface: #fcfcfb;
  --surface-2: #f5f5f4;
  --surface-3: #ebebea;
  --text-primary: #1a1a1a;
  --text-secondary: #555;
  --text-muted: #888;
  --border: #ddd;
  --red: #c62828;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(4,57,104,.15);
}
@import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  font-family: 'Alegreya Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--surface-2); color: var(--text-primary); min-height: 100vh;
}
header {
  background: var(--navy); color: #fff; padding: 10px 24px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow-lg); position: sticky; top: 0; z-index: 100;
}
header .logo { height: 44px; flex-shrink: 0; }
header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; flex: 1; color: var(--green); }
header .subtitle { font-size: .8rem; opacity: .85; font-weight: 400; color: #fff; }
.header-btn {
  padding: 6px 14px; font-size: .82rem; font-weight: 600;
  border: 1px solid rgba(255,255,255,.3); border-radius: 8px;
  cursor: pointer; transition: background .2s; font-family: inherit;
  text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  background: rgba(255,255,255,.15); color: #fff; white-space: nowrap;
}
.header-btn:hover { background: rgba(255,255,255,.25); }
.header-btn-new { background: var(--green); color: var(--navy); border-color: var(--green); }
.header-btn-new:hover { background: var(--green-bright); }

.container { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }

/* Search & Filters */
.search-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  box-shadow: var(--shadow); margin-bottom: 16px;
}
.search-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.search-field { flex: 1; min-width: 200px; }
.search-field label {
  display: block; font-size: .75rem; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 4px;
  text-transform: uppercase; letter-spacing: .03em;
}
.search-field input, .search-field select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: .95rem; font-family: inherit;
}
.search-field input:focus, .search-field select:focus {
  outline: none; border-color: var(--navy);
  box-shadow: 0 0 0 2px rgba(4,57,104,.15);
}
.filter-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: flex-end; }
.filter-field { min-width: 140px; }
.filter-field label {
  display: block; font-size: .72rem; font-weight: 600;
  color: var(--text-muted); margin-bottom: 3px;
  text-transform: uppercase; letter-spacing: .03em;
}
.filter-field select, .filter-field input {
  width: 100%; padding: 6px 8px; border: 1px solid var(--border);
  border-radius: 5px; font-size: .88rem; font-family: inherit;
}
.btn-search {
  padding: 8px 20px; background: var(--navy); color: #fff;
  border: none; border-radius: 6px; font-size: .88rem;
  font-weight: 600; cursor: pointer; font-family: inherit;
  transition: background .15s; white-space: nowrap;
}
.btn-search:hover { background: var(--navy-dark); }
.btn-clear {
  padding: 8px 14px; background: var(--surface-2); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 6px; font-size: .85rem;
  font-weight: 500; cursor: pointer; font-family: inherit;
}
.btn-clear:hover { background: var(--surface-3); }

/* Results count */
.results-info {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; padding: 0 4px;
}
.results-count { font-size: .85rem; color: var(--text-muted); font-weight: 600; }
.sort-control { display: flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--text-muted); }
.sort-control select {
  padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px;
  font-size: .82rem; font-family: inherit;
}

/* Table */
.estimates-table {
  width: 100%; border-collapse: collapse; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.estimates-table th {
  text-align: left; font-size: .72rem; text-transform: uppercase;
  letter-spacing: .04em; color: var(--text-muted);
  padding: 10px 12px; border-bottom: 2px solid var(--surface-3);
  background: var(--surface-2); white-space: nowrap;
  cursor: pointer; user-select: none;
}
.estimates-table th:hover { color: var(--navy); }
.estimates-table th .sort-arrow { font-size: .65rem; margin-left: 3px; opacity: .5; }
.estimates-table th.sorted .sort-arrow { opacity: 1; color: var(--navy); }
.estimates-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--surface-3);
  font-size: .88rem; vertical-align: middle;
}
.estimates-table tr:hover td { background: var(--green-light); }
.estimates-table tr { cursor: pointer; transition: background .1s; }

.est-name { font-weight: 700; color: var(--navy); }
.est-address { font-size: .82rem; color: var(--text-secondary); margin-top: 2px; }
.est-price { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--navy); }
.est-cost { font-size: .82rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* Status badges */
.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: .72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .03em;
}
.status-draft { background: #e3f2fd; color: #1565c0; }
.status-sent { background: #fff3e0; color: #e65100; }
.status-accepted { background: #e8f5e9; color: #2e7d32; }
.status-declined { background: #fce4ec; color: #c62828; }
.status-completed { background: #e0e0e0; color: #424242; }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state h3 { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 6px; }
.empty-state p { font-size: .88rem; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: .95rem; }

/* Pagination */
.pagination {
  display: flex; justify-content: center; align-items: center;
  gap: 8px; margin-top: 16px; padding: 10px;
}
.page-btn {
  padding: 6px 12px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--surface);
  font-size: .85rem; cursor: pointer; font-family: inherit;
  transition: background .15s;
}
.page-btn:hover { background: var(--surface-3); }
.page-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.page-btn:disabled { opacity: .4; cursor: default; }
.page-info { font-size: .82rem; color: var(--text-muted); }

/* Actions */
.row-actions { display: flex; gap: 4px; }
.row-action {
  padding: 4px 8px; border: none; border-radius: 4px;
  font-size: .75rem; font-weight: 600; cursor: pointer;
  transition: background .15s; font-family: inherit;
}
.row-action-open { background: var(--green-light); color: var(--navy); }
.row-action-open:hover { background: #e0f0c0; }
.row-action-delete { background: #fce4ec; color: var(--red); }
.row-action-delete:hover { background: #f8bbd0; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--navy); color: #fff;
  padding: 12px 20px; border-radius: 8px;
  font-size: .88rem; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,.25);
  z-index: 9999; opacity: 0; transform: translateY(10px);
  transition: opacity .3s, transform .3s; max-width: 400px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { background: var(--red); }
.toast.success { background: #2e7d32; }

/* Confirm dialog */
.confirm-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5);
  z-index: 1000; display: none; align-items: center; justify-content: center;
}
.confirm-overlay.active { display: flex; }
.confirm-box {
  background: var(--surface); border-radius: var(--radius);
  padding: 24px; max-width: 400px; width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,.25); text-align: center;
}
.confirm-box h3 { font-size: 1rem; color: var(--navy); margin-bottom: 8px; }
.confirm-box p { font-size: .88rem; color: var(--text-secondary); margin-bottom: 16px; }
.confirm-actions { display: flex; gap: 10px; justify-content: center; }
.confirm-btn {
  padding: 8px 20px; border-radius: 6px; font-size: .88rem;
  font-weight: 600; cursor: pointer; border: 1px solid var(--border);
  font-family: inherit;
}
.confirm-btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.confirm-btn-cancel { background: var(--surface-2); color: var(--text-primary); }

@media (max-width: 768px) {
  .search-row { flex-direction: column; }
  .filter-row { flex-direction: column; }
  .estimates-table { font-size: .82rem; }
  .estimates-table th, .estimates-table td { padding: 8px; }
}
</style>
</head>
<body>

<header>
  <img class="logo" src="https://imagedelivery.net/uX8LTtWSHgeVJ6eG75QgxQ/koalainsulation.com/2024/06/Logo.png/w=200,h=140" alt="Koala Insulation" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
  <svg width="44" height="44" viewBox="0 0 44 44" fill="none" style="display:none;flex-shrink:0">
    <circle cx="22" cy="22" r="20" fill="#95C93D" fill-opacity=".2" stroke="#95C93D" stroke-width="1.5"/>
    <text x="22" y="28" text-anchor="middle" fill="#95C93D" font-size="20" font-weight="800" font-family="'Alegreya Sans',sans-serif">K</text>
  </svg>
  <h1>Saved Estimates <span class="subtitle">Koala Insulation of New Mexico</span></h1>
  <a class="header-btn header-btn-new" href="koala-estimator.html">&#10010; New Estimate</a>
  <a class="header-btn" href="koala-estimator.html">&#127968; Estimator</a>
</header>

<div class="container">

  <!-- Search & Filters -->
  <div class="search-bar">
    <div class="search-row">
      <div class="search-field" style="flex:2">
        <label>Search</label>
        <input type="text" id="searchQuery" placeholder="Customer name, address, or phone..." oninput="debouncedSearch()">
      </div>
      <div class="search-field" style="flex:1">
        <label>Estimator</label>
        <input type="text" id="filterEstimator" placeholder="Estimator name" oninput="debouncedSearch()">
      </div>
      <button class="btn-search" onclick="searchEstimates()">&#128269; Search</button>
      <button class="btn-clear" onclick="clearFilters()">Clear</button>
    </div>
    <div class="filter-row">
      <div class="filter-field">
        <label>Date From</label>
        <input type="date" id="filterDateFrom" onchange="searchEstimates()">
      </div>
      <div class="filter-field">
        <label>Date To</label>
        <input type="date" id="filterDateTo" onchange="searchEstimates()">
      </div>
      <div class="filter-field">
        <label>Min Price</label>
        <input type="number" id="filterMinPrice" placeholder="$0" step="100" onchange="searchEstimates()">
      </div>
      <div class="filter-field">
        <label>Max Price</label>
        <input type="number" id="filterMaxPrice" placeholder="No max" step="100" onchange="searchEstimates()">
      </div>
    </div>
  </div>

  <!-- Results info -->
  <div class="results-info">
    <span class="results-count" id="resultsCount">Loading...</span>
    <div class="sort-control">
      <span>Sort by:</span>
      <select id="sortField" onchange="searchEstimates()">
        <option value="created_at">Date Created</option>
        <option value="estimate_date">Estimate Date</option>
        <option value="customer_name">Customer Name</option>
        <option value="customer_price">Price</option>
        <option value="status">Status</option>
        <option value="estimator_name">Estimator</option>
      </select>
      <select id="sortDir" onchange="searchEstimates()">
        <option value="desc">Newest First</option>
        <option value="asc">Oldest First</option>
      </select>
    </div>
  </div>

  <!-- Results table -->
  <div id="resultsContainer">
    <div class="loading">Loading estimates...</div>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination" style="display:none"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Confirm dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>Delete Estimate?</h3>
    <p id="confirmMsg">This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-btn confirm-btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vcukhvjwsuaqxgqzotwb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjdWtodmp3c3VhcXhncXpvdHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxODM0MzcsImV4cCI6MjEwMTc1OTQzN30.Ae-OUd1ZF9kxficp2U17flloRZ43xkcrbP_QqufhVXE';

const PAGE_SIZE = 20;
let currentPage = 0;
let totalCount = 0;
let deleteTargetId = null;

const $ = id => document.getElementById(id);
const fmt = n => '$' + parseFloat(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function showToast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '') + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ─── SEARCH ────────────────────────────────────────────────────────────────

let debounceTimer;
function debouncedSearch() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { currentPage = 0; searchEstimates(); }, 350);
}

async function searchEstimates() {
  const query = $('searchQuery').value.trim();
  const estimator = $('filterEstimator').value.trim();
  const dateFrom = $('filterDateFrom').value;
  const dateTo = $('filterDateTo').value;
  const minPrice = $('filterMinPrice').value;
  const maxPrice = $('filterMaxPrice').value;
  const sortField = $('sortField').value;
  const sortDir = $('sortDir').value;

  // Build query params
  let params = [];
  params.push('select=id,customer_name,customer_address,customer_phone,estimator_name,estimate_date,status,total_cost,customer_price,created_at,notes');

  if (query) {
    // Search across name, address, phone using OR
    params.push(`or=(customer_name.ilike.*${encodeURIComponent(query)}*,customer_address.ilike.*${encodeURIComponent(query)}*,customer_phone.ilike.*${encodeURIComponent(query)}*)`);
  }
  if (estimator) {
    params.push(`estimator_name=ilike.*${encodeURIComponent(estimator)}*`);
  }
  if (dateFrom) {
    params.push(`estimate_date=gte.${dateFrom}`);
  }
  if (dateTo) {
    params.push(`estimate_date=lte.${dateTo}`);
  }
  if (minPrice) {
    params.push(`customer_price=gte.${minPrice}`);
  }
  if (maxPrice) {
    params.push(`customer_price=lte.${maxPrice}`);
  }

  params.push(`order=${sortField}.${sortDir}`);
  params.push(`offset=${currentPage * PAGE_SIZE}`);
  params.push(`limit=${PAGE_SIZE}`);

  const url = SUPABASE_URL + '/rest/v1/koala_estimates?' + params.join('&');

  try {
    // Get count first
    const countUrl = SUPABASE_URL + '/rest/v1/koala_estimates?' +
      params.filter(p => !p.startsWith('offset=') && !p.startsWith('limit=') && !p.startsWith('order=') && !p.startsWith('select=')).join('&') +
      '&select=id';

    const [dataRes, countRes] = await Promise.all([
      fetch(url, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'count=exact'
        }
      }),
      fetch(countUrl + '&limit=0', {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Prefer': 'count=exact'
        }
      })
    ]);

    // Parse count from content-range header
    const rangeHeader = countRes.headers.get('content-range');
    totalCount = rangeHeader ? parseInt(rangeHeader.split('/')[1]) || 0 : 0;

    const data = await dataRes.json();
    renderResults(data);
    renderPagination();
  } catch (err) {
    console.error('Search error:', err);
    $('resultsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">&#9888;&#65039;</div><h3>Search failed</h3><p>' + err.message + '</p></div>';
  }
}

function renderResults(data) {
  if (!data || data.length === 0) {
    $('resultsContainer').innerHTML = '<div class="empty-state"><div class="empty-icon">&#128203;</div><h3>No estimates found</h3><p>Try adjusting your search or filters, or create a new estimate.</p></div>';
    $('resultsCount').textContent = '0 estimates';
    return;
  }

  $('resultsCount').textContent = totalCount + ' estimate' + (totalCount !== 1 ? 's' : '') +
    (totalCount > PAGE_SIZE ? ` (showing ${currentPage * PAGE_SIZE + 1}–${Math.min((currentPage + 1) * PAGE_SIZE, totalCount)})` : '');

  let html = `<table class="estimates-table">
    <thead><tr>
      <th>Customer</th>
      <th>Estimator</th>
      <th>Date</th>
      <th>Status</th>
      <th style="text-align:right">Price</th>
      <th style="text-align:right">Cost</th>
      <th>Actions</th>
    </tr></thead><tbody>`;

  data.forEach(est => {
    const date = est.estimate_date ? new Date(est.estimate_date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    html += `<tr onclick="openEstimate('${est.id}')" title="Click to open">
      <td>
        <div class="est-name">${escHtml(est.customer_name || 'Unnamed')}</div>
        <div class="est-address">${escHtml(est.customer_address || '')}</div>
      </td>
      <td>${escHtml(est.estimator_name || '—')}</td>
      <td style="white-space:nowrap">${date}</td>
      <td><span class="status-badge status-${est.status || 'draft'}">${est.status || 'draft'}</span></td>
      <td style="text-align:right"><span class="est-price">${fmt(est.customer_price || 0)}</span></td>
      <td style="text-align:right"><span class="est-cost">${fmt(est.total_cost || 0)}</span></td>
      <td onclick="event.stopPropagation()">
        <div class="row-actions">
          <button class="row-action row-action-open" onclick="openEstimate('${est.id}')">Open</button>
          <button class="row-action row-action-delete" onclick="promptDelete('${est.id}','${escAttr(est.customer_name || 'Unnamed')}')">Delete</button>
        </div>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  $('resultsContainer').innerHTML = html;
}

function renderPagination() {
  const totalPages = Math.ceil(totalCount / PAGE_SIZE);
  if (totalPages <= 1) {
    $('pagination').style.display = 'none';
    return;
  }
  $('pagination').style.display = 'flex';

  let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>&#9664; Prev</button>`;
  for (let i = 0; i < totalPages && i < 10; i++) {
    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i + 1}</button>`;
  }
  if (totalPages > 10) html += '<span class="page-info">...</span>';
  html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}">Next &#9654;</button>`;
  $('pagination').innerHTML = html;
}

function goPage(p) {
  if (p < 0) return;
  currentPage = p;
  searchEstimates();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openEstimate(id) {
  window.location.href = 'koala-estimator.html?id=' + id;
}

// ─── DELETE ────────────────────────────────────────────────────────────────

function promptDelete(id, name) {
  deleteTargetId = id;
  $('confirmMsg').textContent = `Delete estimate for "${name}"? This cannot be undone.`;
  $('confirmOverlay').classList.add('active');
}

function closeConfirm() {
  $('confirmOverlay').classList.remove('active');
  deleteTargetId = null;
}

async function confirmDelete() {
  if (!deleteTargetId) return;
  const btn = $('confirmDeleteBtn');
  btn.disabled = true;
  btn.textContent = 'Deleting...';

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/koala_estimates?id=eq.' + deleteTargetId, {
      method: 'DELETE',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    if (!res.ok) throw new Error(await res.text());
    showToast('Estimate deleted', 'success');
    closeConfirm();
    searchEstimates();
  } catch (err) {
    showToast('Delete failed: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

$('confirmOverlay').addEventListener('click', e => {
  if (e.target === $('confirmOverlay')) closeConfirm();
});

// ─── CLEAR FILTERS ─────────────────────────────────────────────────────────

function clearFilters() {
  $('searchQuery').value = '';
  $('filterEstimator').value = '';
  $('filterDateFrom').value = '';
  $('filterDateTo').value = '';
  $('filterMinPrice').value = '';
  $('filterMaxPrice').value = '';
  currentPage = 0;
  searchEstimates();
}

// ─── HELPERS ───────────────────────────────────────────────────────────────

function escHtml(s) {
