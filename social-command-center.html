// ══════════════════════════════════════════════
// ADMIN USER MANAGEMENT
// ══════════════════════════════════════════════
let ADMIN_USERS = [];

function getSessionToken() {
  try { return localStorage.getItem(SESSION_KEY); } catch(e) { return null; }
}

async function adminLoadUsers() {
  const token = getSessionToken();
  if (!token) return;
  const { data, error } = await sb.rpc('admin_list_users', { p_token: token });
  if (error || (data && data.error)) { showToast(data?.error || 'Failed to load users', 'error'); return; }
  ADMIN_USERS = data.users || [];
}

function renderAdmin() {
  if (!AUTH_USER || AUTH_USER.role !== 'admin') {
    document.getElementById('main-view').innerHTML = '<div class="v-header"><h1>&#128274; Access Denied</h1><p class="v-sub">Admin privileges required.</p></div>';
    return;
  }
  // Show loading, then fetch
  document.getElementById('main-view').innerHTML = '<div class="v-header"><h1>&#128274; User Management</h1><p class="v-sub">Manage team access, roles, and login credentials</p></div><div class="v-body"><p style="color:var(--ink-3)">Loading users...</p></div>';
  adminLoadUsers().then(() => renderAdminTable());
}

function renderAdminTable() {
  const users = ADMIN_USERS;
  const activeCount = users.filter(u => u.is_active).length;
  const loginReady = users.filter(u => u.email && u.has_pin).length;
  const pendingSetup = users.filter(u => u.email && !u.has_pin).length;

  let html = `<div class="v-header" style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div><h1>&#128274; User Management</h1><p class="v-sub">Manage team access, roles, and login credentials</p></div>
    <button class="btn btn-primary" onclick="openAdminUserModal(null)">+ Add User</button>
  </div><div class="v-body">`;

  // Stats
  html += `<div class="stat-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
    <div class="stat-tile"><div class="stat-label">Total Users</div><div class="stat-value">${users.length}</div></div>
    <div class="stat-tile"><div class="stat-label">Active</div><div class="stat-value">${activeCount}</div></div>
    <div class="stat-tile"><div class="stat-label">Login Ready</div><div class="stat-value">${loginReady}</div><div class="stat-sub">Email + PIN set</div></div>
    <div class="stat-tile"><div class="stat-label">Pending Setup</div><div class="stat-value">${pendingSetup}</div><div class="stat-sub">Email set, awaiting PIN</div></div>
  </div>`;

  // Table
  html += `<div class="data-table-wrap"><div class="data-table-title">Team Members</div><div style="overflow-x:auto"><table class="data-table"><thead><tr>
    <th>Name</th><th>Email</th><th>Role</th><th>Login Status</th><th>Status</th><th style="text-align:right">Actions</th>
  </tr></thead><tbody>`;

  users.forEach(u => {
    const isMe = u.id === AUTH_USER.id;
    let loginStatus = '';
    if (!u.email) loginStatus = '<span class="tag" style="background:var(--surface-1);color:var(--ink-3);border-color:var(--surface-border)">No email</span>';
    else if (!u.has_pin) loginStatus = '<span class="tag" style="background:#fef3c7;color:#92400e;border-color:#fde68a">Pending PIN setup</span>';
    else if (u.is_online) loginStatus = '<span class="tag" style="background:#dcfce7;color:#166534;border-color:#bbf7d0">Active session</span>';
    else loginStatus = '<span class="tag" style="background:#f0fdf4;color:#16a34a;border-color:#bbf7d0">Ready</span>';

    const activeStatus = u.is_active
      ? '<span class="tag" style="background:#dcfce7;color:#166534;border-color:#bbf7d0">Active</span>'
      : '<span class="tag" style="background:#fef2f2;color:#dc2626;border-color:#fecaca">Disabled</span>';

    const roleBadge = u.role === 'admin'
      ? '<span class="tag tag-primary">Admin</span>'
      : u.role === 'creator'
        ? '<span class="tag" style="background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe">Creator</span>'
        : '<span class="tag" style="background:var(--surface-1);color:var(--ink-3);border-color:var(--surface-border)">Viewer</span>';

    html += `<tr>
      <td style="font-weight:600;color:var(--ink-1)">${escHtml(u.name)}${isMe?' <span style="font-size:11px;font-weight:400;color:var(--ink-3)">(you)</span>':''}</td>
      <td style="color:var(--ink-2);font-size:12px">${u.email ? escHtml(u.email) : '<span style="color:var(--ink-3);font-style:italic">—</span>'}</td>
      <td>${roleBadge}</td>
      <td>${loginStatus}</td>
      <td>${activeStatus}</td>
      <td style="text-align:right;white-space:nowrap">
        <button onclick="openAdminUserModal('${u.id}')" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-3);padding:4px" title="Edit">&#9998;</button>
        ${!isMe && u.has_pin ? `<button onclick="adminResetPin('${u.id}','${escAttr(u.name)}')" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-3);padding:4px" title="Reset PIN">&#128260;</button>` : ''}
        ${!isMe ? `<button onclick="adminToggleActive('${u.id}',${u.is_active ? 'false' : 'true'},'${escAttr(u.name)}')" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--ink-3);padding:4px" title="${u.is_active ? 'Disable' : 'Enable'}">${u.is_active ? '&#9940;' : '&#9989;'}</button>` : ''}
        ${!isMe ? `<button onclick="adminDeleteUser('${u.id}','${escAttr(u.name)}')" style="background:none;border:none;cursor:pointer;font-size:14px;color:#dc2626;padding:4px" title="Delete">&#128465;</button>` : ''}
      </td>
    </tr>`;
  });

  html += `</tbody></table></div></div>`;
  html += `<p style="font-size:11px;color:var(--ink-3);margin-top:12px">Users need an email address to log in. Once their email is set, they'll be prompted to create a PIN on first login.</p>`;
  html += `</div>`;
  document.getElementById('main-view').innerHTML = html;
}

function openAdminUserModal(userId) {
  const user = userId ? ADMIN_USERS.find(u => u.id === userId) : null;
  const title = user ? 'Edit User' : 'Add User';
  let html = `<div style="padding:24px;max-width:440px">
    <h2 style="font-family:Outfit;font-size:20px;font-weight:700;color:var(--ink-0);margin-bottom:16px">${title}</h2>
    <form id="admin-user-form" onsubmit="event.preventDefault();adminSaveUser('${userId||''}')">
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px">Name *</label>
        <input name="name" type="text" required value="${user ? escAttr(user.name) : ''}" style="width:100%;padding:8px 12px;border:1px solid var(--surface-border);border-radius:var(--r-sm);background:var(--surface-0,var(--bg));color:var(--ink-0);font-size:14px" placeholder="e.g. Yuleisy">
      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px">Email</label>
        <input name="email" type="email" value="${user && user.email ? escAttr(user.email) : ''}" style="width:100%;padding:8px 12px;border:1px solid var(--surface-border);border-radius:var(--r-sm);background:var(--surface-0,var(--bg));color:var(--ink-0);font-size:14px" placeholder="user@sonayagroup.com">
        <p style="font-size:11px;color:var(--ink-3);margin-top:3px">Required for login. Leave blank for crew members who won't log in.</p>
      </div>
      <div style="margin-bottom:18px">
        <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px">Role *</label>
        <select name="role" required style="width:100%;padding:8px 12px;border:1px solid var(--surface-border);border-radius:var(--r-sm);background:var(--surface-0,var(--bg));color:var(--ink-0);font-size:14px">
          <option value="creator" ${!user || user.role==='creator' ? 'selected' : ''}>Creator — can create and edit content</option>
          <option value="viewer" ${user && user.role==='viewer' ? 'selected' : ''}>Viewer — read-only access</option>
          <option value="admin" ${user && user.role==='admin' ? 'selected' : ''}>Admin — full access + user management</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">${user ? 'Save Changes' : 'Add User'}</button>
      </div>
    </form>
  </div>`;

  const panel = document.getElementById('modal-panel'); panel.classList.remove('wide');
  panel.innerHTML = html;
  document.getElementById('modal-overlay').hidden = false;
}

async function adminSaveUser(userId) {
  const form = document.getElementById('admin-user-form');
  const fd = new FormData(form);
  const name = fd.get('name')?.trim();
  const email = fd.get('email')?.trim() || '';
  const role = fd.get('role');
  const token = getSessionToken();

  if (!name) { showToast('Name is required', 'error'); return; }

  let result;
  if (userId) {
    const { data, error } = await sb.rpc('admin_update_user', { p_token: token, p_user_id: userId, p_name: name, p_email: email, p_role: role });
    result = { data, error };
  } else {
    const { data, error } = await sb.rpc('admin_add_user', { p_token: token, p_name: name, p_email: email, p_role: role });
    result = { data, error };
  }

  if (result.error || (result.data && result.data.error)) {
    showToast(result.data?.error || result.error?.message || 'Failed to save', 'error');
    return;
  }

  closeModal();
  showToast(userId ? 'User updated' : 'User added', 'success');
  logAudit(userId ? 'edit' : 'create', 'user', userId || result.data?.id || '', name, { role, email });
  await adminLoadUsers();
  renderAdminTable();
}

async function adminResetPin(userId, userName) {
  if (!confirm('Reset PIN for ' + userName + '? They will need to set up a new PIN on next login.')) return;
  const token = getSessionToken();
  const { data, error } = await sb.rpc('admin_reset_pin', { p_token: token, p_user_id: userId });
  if (error || (data && data.error)) { showToast(data?.error || 'Failed to reset PIN', 'error'); return; }
  showToast('PIN reset for ' + userName, 'success');
  logAudit('reset_pin', 'user', userId, userName);
  await adminLoadUsers();
  renderAdminTable();
}

async function adminToggleActive(userId, setActive, userName) {
  const action = setActive ? 'enable' : 'disable';
  if (!confirm((setActive ? 'Enable' : 'Disable') + ' access for ' + userName + '?')) return;
  const token = getSessionToken();
  const { data, error } = await sb.rpc('admin_update_user', { p_token: token, p_user_id: userId, p_is_active: setActive });
  if (error || (data && data.error)) { showToast(data?.error || 'Failed to update', 'error'); return; }
  showToast(userName + (setActive ? ' enabled' : ' disabled'), 'success');
  logAudit(action, 'user', userId, userName);
  await adminLoadUsers();
  renderAdminTable();
}

async function adminDeleteUser(userId, userName) {
  if (!confirm('Permanently delete ' + userName + '? This cannot be undone.')) return;
  const token = getSessionToken();
  const { data, error } = await sb.rpc('admin_delete_user', { p_token: token, p_user_id: userId });
  if (error || (data && data.error)) { showToast(data?.error || 'Failed to delete', 'error'); return; }
  showToast(userName + ' deleted', 'success');
  logAudit('delete', 'user', userId, userName);
  await adminLoadUsers();
  renderAdminTable();
}

// PHASE 3: DRAG & DROP CALENDAR RESCHEDULING
// ══════════════════════════════════════════════
/**
 * Wires HTML5 drag-and-drop on already-rendered calendar posts + day cells.
 * mode: 'month' | 'week'
 * Call this at the end of renderCalendarMonth() / renderCalendarWeek(),
 * after the DOM for that view has been written to #cal-body.
 */
function wireCalendarDragDrop(mode) {
  const itemSelector = mode === 'month' ? '.cal-post-row' : '.week-card';
  const zoneSelector = mode === 'month' ? '.cal-day:not(.outside)' : '.week-col';

  document.querySelectorAll(itemSelector).forEach(el => {
    el.setAttribute('draggable', 'true');
    el.addEventListener('dragstart', (e) => {
      e.stopPropagation();
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.postId);
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); });
  });

  document.querySelectorAll(zoneSelector).forEach(zone => {
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', () => { zone.classList.remove('drag-over'); });
    zone.addEventListener('drop', async (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const postId = e.dataTransfer.getData('text/plain');
      if (!postId) return;
      const post = S.posts.find(p => p.id === postId);
      if (!post) return;

      // Resolve target date depending on view.
      let newDate = null;
      if (mode === 'month') {
        newDate = zone.dataset.date || null;
      } else {
        // Week view columns don't carry data-date today — derive it
        // from the week anchor + column index.
        const cols = Array.from(document.querySelectorAll('.week-col'));
        const idx = cols.indexOf(zone);
        if (idx > -1) {
          const d = new Date(S.weekAnchor);
          d.setDate(d.getDate() + idx);
          newDate = toDateStr(d);
        }
      }
      if (!newDate) return;
      if (newDate === post.scheduled_date) return; // no-op, same day

      await rescheduleCalendarPost(postId, newDate);
    });
  });
}

async function rescheduleCalendarPost(postId, newDate) {
  const post = S.posts.find(p => p.id === postId);
  if (!post) return;
  const prevDate = post.scheduled_date;
  // Optimistic local update so the UI feels instant.
  post.scheduled_date = newDate;
  if (S.calView === 'month') renderCalendarMonth();
  else if (S.calView === 'week') renderCalendarWeek();
  else renderCalendarList();

  try {
    const { error } = await sb.from('sm_posts').update({ scheduled_date: newDate }).eq('id', postId);
    if (error) throw error;
    showToast(`"${post.title}" moved to ${fmtDate(newDate)}`, 'success');
  } catch (err) {
    // Roll back on failure.
    post.scheduled_date = prevDate;
    if (S.calView === 'month') renderCalendarMonth();
    else if (S.calView === 'week') renderCalendarWeek();
    else renderCalendarList();
    showToast('Could not reschedule: ' + err.message, 'error');
  }
}

/** "Quick-reply": applies a template AND immediately sends it. */
function quickReply(itemId, templateId) {
  const item = S.inbox.find(i => i.id === itemId);
  const tpl = S.inboxTemplates.find(t => t.id === templateId);
  if (!item || !tpl) return;
  item.reply = tpl.text;
  item.status = 'responded';
  showToast('Quick reply sent', 'success');
  renderInbox();
}

function sendInboxReply(itemId) {
  const item = S.inbox.find(i => i.id === itemId); if (!item) return;
  const text = document.getElementById('inbox-reply-text').value.trim();
  if (!text) { showToast('Write a reply first', 'error'); return; }
  item.reply = text;
  if (item.status === 'open') item.status = 'responded';
  showToast('Reply sent', 'success');
  renderInbox();
  // Supabase table to come later — this is where it would go:
  // await sb.from('sm_inbox_items').update({ reply: text, status: item.status }).eq('id', item.id);
}

  document.getElementById('modal-overlay').hidden = false;
  document.getElementById('report-generate-btn').onclick = generateReport;
}

function generateReport() {
  const from = document.getElementById('report-from').value;
  const to = document.getElementById('report-to').value;
  const brandId = document.getElementById('report-brand').value;
  const checked = Array.from(document.querySelectorAll('input[name="report-metric"]:checked')).map(c => c.value);

  let posts = S.posts.filter(p => p.scheduled_date && p.scheduled_date >= from && p.scheduled_date <= to);
  if (brandId !== 'all') posts = posts.filter(p => p.brand_id === brandId);

  const html = buildReportHtml({ from, to, brandId, checked, posts });
  const win = window.open('', '_blank', 'width=900,height=700');
  if (!win) { showToast('Please allow pop-ups to view the report', 'error'); return; }
  win.document.write(html);
  win.document.close();
  closeModal();
  showToast('Report generated', 'success');
}

function buildReportHtml({ from, to, brandId, checked, posts }) {
  const brand = brandId !== 'all' ? brandById(brandId) : null;
  const brandLabel = brand ? brand.name : 'All Brands';

  const withMetrics = posts.map(p => ({ post: p, m: metricsForPost(p.id) }));
  const totalEngagement = withMetrics.reduce((sum, { m }) => sum + (m ? (m.likes||0)+(m.comments||0)+(m.shares||0)+(m.saves||0) : 0), 0);
  const totalReach = withMetrics.reduce((sum, { m }) => sum + (m ? (m.reach||0) : 0), 0);
  const engagementRate = totalReach > 0 ? ((totalEngagement / totalReach) * 100).toFixed(2) + '%' : 'N/A';

  let sections = '';

  if (checked.includes('total_posts')) {
    sections += `<div class="rpt-stat-card"><div class="rpt-stat-label">Total Posts</div><div class="rpt-stat-value">${posts.length}</div></div>`;
  }
  if (checked.includes('engagement_rate')) {
    sections += `<div class="rpt-stat-card"><div class="rpt-stat-label">Engagement Rate</div><div class="rpt-stat-value">${engagementRate}</div></div>`;
  }

  let statsBlock = '';
  if (checked.includes('total_posts') || checked.includes('engagement_rate')) {
    statsBlock = `<div class="rpt-stats-row">${sections}</div>`;
  }

  let platformBlock = '';
  if (checked.includes('platform_breakdown')) {
    const counts = {};
    posts.forEach(p => {
      const pids = p.platform_ids || (p.platform_id ? [p.platform_id] : []);
      pids.forEach(id => { const pl = platById(id); if (pl) counts[pl.name] = (counts[pl.name]||0)+1; });
    });
    const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1])
      .map(([name,count]) => `<tr><td>${name}</td><td>${count}</td><td>${posts.length?((count/posts.length)*100).toFixed(0):0}%</td></tr>`).join('');
    platformBlock = `<h2>Platform Breakdown</h2><table class="rpt-table"><thead><tr><th>Platform</th><th>Posts</th><th>Share</th></tr></thead><tbody>${rows || '<tr><td colspan="3">No data</td></tr>'}</tbody></table>`;
  }

  let topPostsBlock = '';
  if (checked.includes('top_posts')) {
    const ranked = withMetrics
      .map(({ post, m }) => ({ post, score: m ? (m.likes||0)+(m.comments||0)+(m.shares||0)+(m.saves||0) : 0 }))
      .sort((a,b) => b.score - a.score).slice(0, 5);
    const rows = ranked.map(({ post, score }) => `<tr><td>${escHtml(post.title)}</td><td>${fmtDate(post.scheduled_date)}</td><td>${score}</td></tr>`).join('');
    topPostsBlock = `<h2>Top Posts</h2><table class="rpt-table"><thead><tr><th>Title</th><th>Date</th><th>Engagement</th></tr></thead><tbody>${rows || '<tr><td colspan="3">No data</td></tr>'}</tbody></table>`;
  }

  let pillarBlock = '';
  if (checked.includes('pillar_distribution')) {
    const counts = {};
    posts.forEach(p => { const pil = pillarById(p.content_pillar_id); const name = pil ? pil.name : 'Uncategorized'; counts[name] = (counts[name]||0)+1; });
    const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1])
      .map(([name,count]) => `<tr><td>${escHtml(name)}</td><td>${count}</td></tr>`).join('');
    pillarBlock = `<h2>Content Pillar Distribution</h2><table class="rpt-table"><thead><tr><th>Pillar</th><th>Posts</th></tr></thead><tbody>${rows || '<tr><td colspan="2">No data</td></tr>'}</tbody></table>`;
  }

  let frequencyBlock = '';
  if (checked.includes('posting_frequency')) {
    const days = Math.max(1, Math.round((new Date(to) - new Date(from)) / 86400000) + 1);
    const perWeek = (posts.length / (days / 7)).toFixed(1);
    frequencyBlock = `<h2>Posting Frequency</h2><table class="rpt-table"><tbody><tr><td>Date range</td><td>${days} days</td></tr><tr><td>Total posts</td><td>${posts.length}</td></tr><tr><td>Average per week</td><td>${perWeek}</td></tr></tbody></table>`;
  }

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Sonaya Group Social Report</title>
  <style>
    body{font-family:'DM Sans',Arial,sans-serif;margin:0;padding:0;color:#1a1512;background:#fff;}
    .rpt-header{background:linear-gradient(135deg,#1e3a5f 0%,#142a45 100%);color:#fff;padding:28px 36px;display:flex;align-items:center;justify-content:space-between}
    .rpt-brand{font-family:Georgia,serif;font-weight:800;font-size:20px;letter-spacing:0.04em}
    .rpt-brand small{display:block;font-size:11px;font-weight:600;color:#c5a55a;letter-spacing:0.12em;margin-top:2px}
    .rpt-title{text-align:right}
    .rpt-title h1{margin:0;font-size:20px;font-family:Georgia,serif}
    .rpt-title p{margin:2px 0 0;font-size:12px;color:#d7d2c8}
    .rpt-body{padding:28px 36px}
    .rpt-meta{font-size:13px;color:#5c5349;margin-bottom:20px}
    .rpt-stats-row{display:flex;gap:16px;margin-bottom:24px}
    .rpt-stat-card{flex:1;border:1px solid #e2ddd6;border-radius:10px;padding:16px;background:#faf9f7}
    .rpt-stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#9a9088}
    .rpt-stat-value{font-size:26px;font-weight:800;color:#1a1512;margin-top:4px}
    h2{font-size:15px;margin:24px 0 10px;color:#1e3a5f}
    table.rpt-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
    table.rpt-table th{text-align:left;padding:8px 10px;background:#eeebe6;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:#7c7268}
    table.rpt-table td{padding:8px 10px;border-bottom:1px solid #e2ddd6}
    .rpt-footer{padding:20px 36px;font-size:11px;color:#9a9088;border-top:1px solid #e2ddd6;margin-top:20px}
    @media print { .rpt-header{-webkit-print-color-adjust:exact;print-color-adjust:exact} body{margin:0} }
  </style></head>
  <body>
    <div class="rpt-header">
      <div class="rpt-brand">SONAYA GROUP<small>SOCIAL COMMAND CENTER</small></div>
      <div class="rpt-title"><h1>Performance Report</h1><p>${brandLabel} · ${fmtDate(from)} – ${fmtDate(to)}</p></div>
    </div>
    <div class="rpt-body">
      <div class="rpt-meta">Generated ${new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div>
      ${statsBlock}
      ${platformBlock}
      ${topPostsBlock}
      ${pillarBlock}
      ${frequencyBlock}
    </div>
    <div class="rpt-footer">Sonaya Group — Confidential internal report. Generated by Social Command Center.</div>
    <scr` + `ipt>window.onload = () => { /* interactive for review; Ctrl/Cmd+P to print */ };<\/scr` + `ipt>
  </body></html>`;
}

function bulkActionsRowCheckboxHtml(post) {
  return `<td class="bulk-checkbox-cell" onclick="event.stopPropagation()"><input type="checkbox" class="bulk-checkbox bulk-row-check" data-post-id="${post.id}"></td>`;
}

function wireBulkActions() {
  if (!S.bulkSelected) S.bulkSelected = new Set();
  // Remove stale selections for posts no longer in the current list.
  const visibleIds = new Set(Array.from(document.querySelectorAll('.bulk-row-check')).map(c => c.dataset.postId));
  Array.from(S.bulkSelected).forEach(id => { if (!visibleIds.has(id)) S.bulkSelected.delete(id); });

  const selectAll = document.getElementById('bulk-select-all');
  const rowChecks = document.querySelectorAll('.bulk-row-check');
  rowChecks.forEach(cb => {
    cb.checked = S.bulkSelected.has(cb.dataset.postId);
    cb.onchange = () => {
      if (cb.checked) S.bulkSelected.add(cb.dataset.postId);
      else S.bulkSelected.delete(cb.dataset.postId);
      updateBulkActionBar();
      if (selectAll) selectAll.checked = rowChecks.length > 0 && Array.from(rowChecks).every(c => c.checked);
    };
  });
  if (selectAll) {
    selectAll.checked = rowChecks.length > 0 && Array.from(rowChecks).every(c => S.bulkSelected.has(c.dataset.postId));
    selectAll.onchange = () => {
      rowChecks.forEach(cb => {
        cb.checked = selectAll.checked;
        if (selectAll.checked) S.bulkSelected.add(cb.dataset.postId);
        else S.bulkSelected.delete(cb.dataset.postId);
      });
      updateBulkActionBar();
    };
  }
  updateBulkActionBar();
}

function updateBulkActionBar() {
  const bar = document.getElementById('bulk-action-bar'); if (!bar) return;
  const count = S.bulkSelected ? S.bulkSelected.size : 0;
  if (count === 0) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = `
    <span class="bulk-action-count">${count} selected</span>
    <select class="form-select" id="bulk-status-select">
      <option value="">Change Status…</option>
      ${STATUS_ORDER.map(s => `<option value="${s}">${STATUS_META[s].label}</option>`).join('')}
    </select>
    <select class="form-select" id="bulk-crew-select">
      <option value="">Assign Crew…</option>
      ${S.members.filter(m => { if (!m.brand_id) return true; const b = brandById(m.brand_id); return S.brandFilter==='all' || (b && b.slug===S.brandFilter); }).map(m => `<option value="${m.id}">${escHtml(m.name)}</option>`).join('')}
    </select>
    <button class="btn btn-danger btn-sm" id="bulk-delete-btn">Delete</button>
    <button class="btn btn-ghost btn-sm" id="bulk-clear-btn">&#10005;</button>
  `;
  document.getElementById('bulk-status-select').onchange = (e) => { if (e.target.value) bulkChangeStatus(e.target.value); };
  document.getElementById('bulk-crew-select').onchange = (e) => { if (e.target.value) bulkAssignCrew(e.target.value); };
  document.getElementById('bulk-delete-btn').onclick = bulkDeletePosts;
  document.getElementById('bulk-clear-btn').onclick = () => { S.bulkSelected.clear(); renderCalendarList(); };
}

async function bulkChangeStatus(status) {
  const ids = Array.from(S.bulkSelected);
  if (ids.length === 0) return;
  try {
    const { error } = await sb.from('sm_posts').update({ status }).in('id', ids);
    if (error) throw error;
    await loadAll();
    S.bulkSelected.clear();
    render();
    showToast(`Updated status for ${ids.length} post(s)`, 'success');
  } catch (err) {
    showToast('Bulk update failed: ' + err.message, 'error');
  }
}

async function bulkAssignCrew(memberId) {
  const ids = Array.from(S.bulkSelected);
  if (ids.length === 0) return;
  try {
    // Add memberId to each selected post's crew_members array (dedup).
    const updates = ids.map(id => {
      const post = S.posts.find(p => p.id === id);
      const crew = Array.isArray(post && post.crew_members) ? post.crew_members.slice() : [];
      if (!crew.includes(memberId)) crew.push(memberId);
      return sb.from('sm_posts').update({ crew_members: crew }).eq('id', id);
    });
    await Promise.all(updates);
    await loadAll();
    S.bulkSelected.clear();
    render();
    showToast(`Crew assigned to ${ids.length} post(s)`, 'success');
  } catch (err) {
    showToast('Bulk crew assignment failed: ' + err.message, 'error');
  }
}

async function bulkDeletePosts() {
  const ids = Array.from(S.bulkSelected);
  if (ids.length === 0) return;
  if (!confirm(`Delete ${ids.length} post(s)? This cannot be undone.`)) return;
  try {
    await sb.from('sm_post_metrics').delete().in('post_id', ids);
    const { error } = await sb.from('sm_posts').delete().in('id', ids);
    if (error) throw error;
    await loadAll();
    S.bulkSelected.clear();
    render();
    showToast(`Deleted ${ids.length} post(s)`, 'info');
  } catch (err) {
    showToast('Bulk delete failed: ' + err.message, 'error');
  }
}

function runCaptionAssist() {
  const tone = document.getElementById('ca-tone').value;

  const platformIds = fd.getAll('platform_ids').filter(Boolean);
  const platform = platformIds.length ? platById(platformIds[0]) : null;

  const variations = generateCaptionVariations({
    brandName: brand ? brand.name : 'our brand',

/**
 * Brand-aware caption generator. Produces 3 variations that sound like
 * a real social media manager wrote them — no internal labels, no pillar
 * names, brand-specific voice. Swap the body for a Claude API call later;
 * keep the same signature/return shape (array of 3 strings).
 */
function generateCaptionVariations({ brandName, platformName, pillarName, title, tone, length }) {
  const pa = PILLAR_ANGLES[pillarName] || { angle: 'general', cta: 'engage', voice: 'conversational' };
  const bh = BRAND_HASHTAGS[brandName] || { always: [`#${brandName.replace(/[^A-Za-z0-9]/g,'')}`], rotate: [] };
  const isDT = brandName === 'Del Taco';
  // Clean title of video brief formatting
  const cleanTitle = title.replace(/^VIDEO BRIEF[\s\S]*?\n\n/i, '').replace(/^HOOK.*?:\s*/i, '').trim() || 'our latest';

  const variations = [];
  for (let v = 0; v < 3; v++) {
    // Shuffle hashtags per variation
    const shuffled = [...bh.rotate].sort(() => Math.random() - 0.5);
    const tags = [...bh.always, ...shuffled.slice(0, 3 + v)].join(' ');

    // Build hook from title + angle
    const hookLine = buildHook(cleanTitle, pa.angle, isDT, v);
    // Build body from pillar angle
    const bodyLine = buildBody(pa.angle, pa.voice, isDT, cleanTitle, v);
    // Build CTA
    const ctaLine = buildCTA(pa.cta, isDT, v);

    let text;
    if (length === 'short') {
      text = `${hookLine} ${ctaLine}`;
    } else if (length === 'long') {
      text = `${hookLine}\n\n${bodyLine}\n\n${ctaLine}`;
    } else {
      text = `${hookLine}\n\n${ctaLine}`;
      if (v === 0) text = `${hookLine}\n\n${bodyLine.split('. ').slice(0,2).join('. ')+'.'}\n\n${ctaLine}`;
    }

    // Apply tone BEFORE hashtags
    text = applyTone(text, tone);
    text = text.trim() + '\n\n' + tags;
    variations.push(text);
  }
  return variations;
}

function applyTone(text, tone) {
  if (tone === 'professional') {
    // Remove casual punctuation, keep it clean
    return text.replace(/!+/g, '.').replace(/\.\./g, '.').replace(/\s{2,}/g, ' ');
  }
  if (tone === 'playful') {
    // Add energy to the end of sentences
    return text.replace(/\.(\s|$)/g, (m, after) => {
      return Math.random() > 0.6 ? '! ' + after : m;
    });
  }
  if (tone === 'urgent') {
    // Add urgency markers
    const lines = text.split('\n');
    if (lines.length > 0) {
      lines[0] = lines[0].replace(/\.$/, '') + ' — and here\'s why it matters now.';
    }
    return lines.join('\n');
  }
  // casual = no modification
  return text;
}

(async () => {
  initTheme();

  // Check for existing PIN-based session
  const isAuthed = await checkAuth();
  if (!isAuthed) {
    // Not logged in — show login overlay
    document.getElementById('login-overlay').hidden = false;
    document.getElementById('app').style.display = 'none';
    return;
  }
  logAudit('login', 'session', '', AUTH_USER.display_name, { method: 'session_resume' });
  await bootApp();
})();

async function bootApp() {
  const loadingEl0 = document.querySelector('#main > .loading');
  if (loadingEl0) { loadingEl0.classList.add('skel-loading'); loadingEl0.style.display = 'block'; loadingEl0.style.padding = '0'; loadingEl0.innerHTML = buildSkeletonScreen(); }
  try {
    await loadAll();
    initInboxState();
    const loadingEl = document.querySelector('#main > .loading');
    if (loadingEl) loadingEl.remove();
    ensureMainView();
    render();
  } catch(e) {
    console.error('Failed to load data:', e);
    const loadingEl = document.querySelector('#main > .loading');
    if (loadingEl) loadingEl.innerHTML = '<span style="color:var(--st-rejected)">&#9888; Failed to load data. Please refresh.</span>';
  }
}
