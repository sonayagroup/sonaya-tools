<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAM Reconciliation — Sonaya Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16191d;--muted:#687280;--line:#e3e6ea;--soft:#f0f2f5;--navy:#1f3864;--navy2:#2e5496;--green:#1f8a4c;--red:#c0392b;--amber:#b7791f;--blue:#2563eb;--focus:#2563eb33}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121417;--card:#1b1e23;--ink:#eef0f3;--muted:#9aa3ae;--line:#2c3138;--soft:#23272d;--navy:#9db7ea;--navy2:#7aa0e6}}
:root[data-theme=dark]{--bg:#121417;--card:#1b1e23;--ink:#eef0f3;--muted:#9aa3ae;--line:#2c3138;--soft:#23272d;--navy:#9db7ea;--navy2:#7aa0e6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--navy2)}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme=dark] .btn.primary,:root:not([data-theme=light]) .btn.primary{color:#0e1420}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .btn.primary{color:#fff}}
.btn.danger{color:var(--red)}.btn.sm{padding:5px 10px;font-size:12.5px}.btn:disabled{opacity:.5;cursor:default}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;color:var(--navy);margin-right:auto}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
nav{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
nav button.on{color:var(--navy);border-color:var(--navy)}
nav .count{background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px}.card h3{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}.kpi .v{font-size:24px;font-weight:800;margin-top:4px}.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.total td{font-weight:700;border-top:2px solid var(--line)}.tbl tbody tr:hover{background:var(--soft)}
.scroll{overflow-x:auto}.muted{color:var(--muted)}.pos{color:var(--red)}.neg{color:var(--green)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--navy2)}.bar i.over{background:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--muted)}
.pill.review{background:#fff3cd;color:#8a6100}.pill.ok{background:#e3f4ea;color:#17703d}.pill.ex{background:#eee;color:#777}
.drop{border:2px dashed var(--navy2);border-radius:14px;padding:34px 16px;text-align:center;background:var(--card);cursor:pointer;transition:.15s}
.drop.over{background:#eef3ff;border-color:var(--blue)}.drop b{font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.rcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:120px 1fr;gap:14px;background:var(--card)}
.rcard .thumb{width:120px;height:150px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--soft);overflow:hidden;font-size:12px;color:var(--muted);text-align:center}
.rcard .thumb img,.rcard .thumb canvas{max-width:100%;max-height:100%}
@media (max-width:640px){.rcard{grid-template-columns:1fr}.rcard .thumb{width:100%;height:120px}}
.warn{border-left:3px solid var(--amber);background:#fffaf0;padding:10px 12px;border-radius:0 8px 8px 0;margin-bottom:12px;color:#5c4400}
:root[data-theme=dark] .warn{background:#2a2414;color:#f2d38a}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16191d;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px}
#gate h1{margin:0;font-size:20px;color:var(--navy)}.err{color:var(--red);font-size:13px;min-height:18px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 16px;overflow:auto}
.modal .box{background:var(--card);border-radius:14px;padding:18px;width:min(720px,100%)}
.hidden{display:none!important}
/* ---- statement (print) ---- */
.stmt{background:#fff;color:#111;padding:36px 40px;max-width:860px;margin:0 auto;border:1px solid var(--line);border-radius:6px;font-size:12.5px}
.stmt h1{font-size:22px;margin:0;color:#1f3864}.stmt .sub{color:#555;margin:2px 0 18px}
.stmt table{width:100%;border-collapse:collapse;margin:8px 0 16px}.stmt th{background:#1f3864;color:#fff;text-align:left;padding:6px 8px;font-size:11px}
.stmt td{padding:6px 8px;border-bottom:1px solid #e5e5e5}.stmt td.n,.stmt th.n{text-align:right}.stmt tr.total td{font-weight:700;background:#f3f5f9}
.stmt .due{border:2px solid #1f3864;border-radius:8px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin:10px 0 18px;font-size:16px;font-weight:700}
.stmt .meta td{border:0;padding:2px 8px}.stmt h2{font-size:14px;color:#1f3864;margin:20px 0 4px;border-bottom:1px solid #1f3864;padding-bottom:3px}
.stmt .fine{font-size:11px;color:#555}.pb{page-break-before:always}
@media print{body{background:#fff}header,nav,.noprint,#toast{display:none!important}main{padding:0;max-width:none}.stmt{border:0;padding:0;max-width:none}.card{border:0;padding:0}}
</style>
</head>
<body>
<div id="gate"><form id="loginForm">
  <h1>CAM Reconciliation</h1><div class="muted">Sign in with your Sonaya tools account.</div>
  <input id="lgEmail" type="email" placeholder="Email" autocomplete="email" required>
  <input id="lgPass" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="btn primary" type="submit">Sign in</button><div class="err" id="lgErr"></div>
</form></div>

<header class="noprint"><div class="hwrap">
  <div class="brand">CAM Reconciliation<small id="whoami"></small></div>
  <select id="selProperty" aria-label="Property"></select>
  <select id="selYear" aria-label="Year"></select>
  <button class="btn sm" id="btnSignOut">Sign out</button>
</div>
<nav id="tabs">
  <button data-tab="overview" class="on">Overview</button>
  <button data-tab="add">Add invoices</button>
  <button data-tab="review">Review <span class="count hidden" id="reviewCount"></span></button>
  <button data-tab="invoices">All invoices</button>
  <button data-tab="report">Tenant report</button>
  <button data-tab="settings">Property setup</button>
</nav></header>

<main>
  <section id="tab-overview"></section>
  <section id="tab-add" class="hidden">
    <div class="drop" id="drop"><b>Drop invoices here</b><div class="muted" style="margin-top:6px">PDF or photos — or click to choose files. Each file is saved, read, and sorted into a CAM category for you to confirm.</div>
      <input type="file" id="fileInput" multiple accept=".pdf,image/*" hidden></div>
    <div class="card" style="margin-top:16px"><h2>Or enter one by hand</h2><div id="manualForm"></div></div>
    <div id="uploadLog"></div>
  </section>
  <section id="tab-review" class="hidden"></section>
  <section id="tab-invoices" class="hidden"></section>
  <section id="tab-report" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="cam-engine.js"></script>
<script src="cam-app.js"></script>
</body>
</html>
